<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17140F"><title>洪盛集藏｜钱币收藏资料与交流平台</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='6' fill='%23B23A2A'/%3E%3Ctext x='24' y='32' text-anchor='middle' font-size='20' font-family='serif' font-weight='700' fill='%23F8F2E1'%3E洪%3C/text%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@700;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{
  /* ---- 洪盛集藏 视觉体系：墨黑 · 宣纸 · 朱砂印章 · 铜绿 · 古铜金 ---- */
  --red:#B23A2A;        /* 朱砂 —— 原“金红”主色位，现改为印泥朱砂 */
  --red2:#8E2C1F;        /* 深朱砂 —— hover/强调 */
  --gold:#B4924F;        /* 古铜金 —— 原“金色”位，现改为铜器古金 */
  --gold2:#C9B27C;        /* 浅古铜金 */
  --paper:#EDE3CC;        /* 宣纸底色 */
  --cream:#E4D6AE;        /* 宣纸卡片/面板底色 */
  --ink:#241F16;        /* 正文墨色 */
  --muted:#5B5138;        /* 次要文字 */
  --line:#D9C89C;        /* 分隔线 / 描边 */
  --white:#F8F2E1;        /* 卡片浅底 */
  --inkbg:#17140F;        /* 墨黑背景（首屏 / 页脚） */
  --inkbg2:#221D15;        /* 次墨黑 */
  --patina:#6E8266;        /* 铜绿点缀 */
  --shadow:0 14px 38px rgba(23,20,15,.12);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",Arial,sans-serif;
  line-height:1.75;-webkit-font-smoothing:antialiased;
}
.wrap{width:min(1180px,92vw);margin:auto}

/* 顶部通知条 */
.top{background:var(--inkbg);color:var(--gold2);text-align:center;padding:8px 14px;font-size:12px;letter-spacing:.5px}

/* 纸纹微噪点，贯穿全站 */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:999;opacity:.045;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* 首屏 */
.hero{
  position:relative;overflow:hidden;color:#fff;
  padding:clamp(46px,8vw,82px) 0 58px;
  background:
    radial-gradient(circle at 82% 18%,rgba(178,58,42,.22),transparent 32%),
    radial-gradient(circle at 12% 88%,rgba(110,130,102,.16),transparent 38%),
    linear-gradient(135deg,#0F0D09,var(--inkbg) 55%,#1F1810);
}
.hero:after{
  content:"";position:absolute;inset:auto -10% -85px;height:170px;
  background:rgba(255,255,255,.03);transform:rotate(-3deg);
  border-top:1px solid rgba(180,146,79,.2);
}
.eyebrow{
  display:inline-flex;align-items:center;gap:9px;
  border:1px solid rgba(180,146,79,.4);background:rgba(255,255,255,.045);
  color:var(--gold2);border-radius:999px;padding:6px 14px 6px 10px;
  font-size:11px;font-weight:800;letter-spacing:1.5px;
}
.eyebrow::before{
  content:"";width:14px;height:14px;border-radius:3px;background:var(--red);
  display:inline-block;transform:rotate(-8deg);box-shadow:0 1px 3px rgba(0,0,0,.4);
}
.brand,.title,.heroTitle,.categoryHead h3,.notice h2,.card h4{
  font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;
}
.brand{
  font-size:clamp(42px,7vw,72px);line-height:1.08;margin:20px 0 10px;
  color:var(--gold2);font-weight:900;letter-spacing:3px;
  text-shadow:0 3px 20px rgba(0,0,0,.35);
}
.heroTitle{font-size:clamp(21px,3vw,30px);margin:0 0 13px;letter-spacing:1px;font-weight:700;color:#fff}
.heroText{max-width:820px;color:#E7DDC0;font-size:14px;line-height:2;white-space:pre-line;opacity:.92}
.tags,.actions{display:flex;flex-wrap:wrap;gap:9px}
.tag{
  border:1px solid rgba(201,178,124,.35);background:rgba(255,255,255,.05);
  border-radius:999px;padding:5px 12px;color:var(--gold2);font-size:12px;
}
.heroBottom{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:26px}
.contact{color:var(--gold2);font-weight:900;letter-spacing:.5px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;border-radius:8px;
  padding:11px 18px;text-decoration:none;font-weight:800;font-size:13px;
  letter-spacing:.3px;transition:transform .2s,box-shadow .2s;
}
.btn:hover{transform:translateY(-2px)}
.gold{
  background:linear-gradient(135deg,#C2402E,var(--red2));color:#F8F2E1;
  box-shadow:0 10px 24px rgba(142,44,31,.35);
}
.gold:hover{box-shadow:0 14px 28px rgba(142,44,31,.45)}
.light{border:1px solid rgba(255,255,255,.28);color:#fff;background:rgba(255,255,255,.06)}

/* 导航 */
.nav{
  position:sticky;top:0;z-index:20;background:rgba(248,242,225,.94);
  backdrop-filter:blur(16px);border-bottom:1px solid var(--line);
  box-shadow:0 4px 18px rgba(23,20,15,.06);
}
.navInner{display:flex;overflow-x:auto;scrollbar-width:none;min-height:50px}
.navInner::-webkit-scrollbar{display:none}
.navBrand{
  display:flex;align-items:center;color:var(--red2);font-weight:900;
  padding:12px 18px 12px 0;white-space:nowrap;letter-spacing:.5px;
}
.navBrand::before{
  content:"";width:16px;height:16px;background:var(--red);border-radius:3px;
  margin-right:8px;display:inline-block;transform:rotate(-6deg);
}
.nav a{
  display:flex;align-items:center;padding:13px 15px;color:var(--muted);
  text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap;
  border-bottom:2px solid transparent;transition:color .2s,border-color .2s;
}
.nav a:hover{color:var(--red2);border-bottom-color:var(--gold)}

/* 版块 */
.section{padding:clamp(38px,5vw,62px) 0}
.section+.section{padding-top:10px}
.sectionHead{margin-bottom:22px}
.kicker{
  font-size:11px;letter-spacing:2.5px;color:var(--red2);font-weight:800;
  text-transform:uppercase;font-style:italic;
}
.title{color:var(--ink);font-size:clamp(28px,4vw,39px);line-height:1.25;margin:6px 0}
.sub{color:var(--muted);font-size:13px;margin:6px 0}
.rule{height:1px;background:linear-gradient(90deg,var(--gold),var(--line),transparent);margin:18px 0 2px}

.panel{
  background:linear-gradient(150deg,var(--white),var(--cream));
  border:1px solid var(--line);border-radius:10px;
  padding:clamp(20px,4vw,34px);box-shadow:0 10px 32px rgba(23,20,15,.06);
}
.categoryBlock{margin-top:28px}
.categoryHead{
  display:flex;justify-content:space-between;gap:10px;align-items:center;
  margin-bottom:12px;padding:0 2px 9px;border-bottom:1px solid var(--line);
}
.categoryHead h3{margin:0;color:var(--red2);font-size:21px;line-height:1.4;font-weight:700}
.count{font-size:11px;color:var(--muted);white-space:nowrap}

/* 资料卡片 */
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}
.card{
  background:var(--white);border:1px solid var(--line);border-radius:8px;
  overflow:hidden;box-shadow:var(--shadow);
  transition:transform .2s,box-shadow .2s,border-color .2s;
}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(23,20,15,.16);border-color:var(--gold)}
.card a{text-decoration:none;display:block;color:inherit}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--cream);display:block}
.body{padding:14px 15px 16px}
.meta{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.3px}
.card h4{margin:5px 0 6px;color:var(--ink);font-size:16px;line-height:1.5;font-weight:700}
.text{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:2.8em}
.price{font-size:13px;color:var(--red2);font-weight:900;margin:5px 0}
.more{display:inline-block;margin-top:10px;color:var(--red2);font-size:12px;font-weight:800}

/* 免费咨询提示区 */
.notice{
  border:1px solid var(--gold);background:linear-gradient(150deg,#FBF6E8,var(--cream));
  border-radius:10px;padding:clamp(22px,4vw,34px);box-shadow:var(--shadow);
  position:relative;
}
.notice::before{
  content:"";position:absolute;top:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,var(--red),var(--gold));border-radius:10px 10px 0 0;
}
.notice h2{color:var(--red2);font-size:clamp(24px,4vw,32px);margin:4px 0 10px;font-weight:700}
.notice p{color:var(--muted);font-size:13px}

/* 页脚 */
.footer{background:var(--inkbg);color:#B7AB92;padding:46px 14px 40px;text-align:center;font-size:12px}
.footerBrand{
  color:var(--gold2);font-size:21px;font-weight:900;font-family:"Noto Serif SC",serif;
  display:inline-flex;align-items:center;gap:9px;
}
.footerBrand::before{
  content:"";width:20px;height:20px;background:var(--red);border-radius:4px;
  display:inline-block;transform:rotate(-6deg);border:1px solid rgba(248,242,225,.5);
}
.line{height:1px;background:var(--inkbg2);max-width:620px;margin:18px auto}
.emptySection{padding:24px 0;color:var(--muted);font-size:13px;text-align:center}

@media(max-width:1050px){
  .cards{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media(max-width:760px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .navBrand{display:none}
  .hero{padding:40px 0 45px}
  .brand{font-size:43px;letter-spacing:1.5px}
  .heroText{font-size:13px}
  .panel{border-radius:8px}
}
@media(max-width:520px){
  .cards{grid-template-columns:1fr}
  .brand{font-size:35px}
  .heroTitle{font-size:20px}
  .heroBottom{align-items:stretch}
  .actions{width:100%}
  .actions .btn{flex:1}
  .card img{aspect-ratio:16/10}
  .section{padding:34px 0}
  .categoryHead h3{font-size:19px}
}
</style></head><body><div id="top" class="top"></div><header class="hero"><div class="wrap"><span class="eyebrow">HONGSHENG COLLECTION · FUJIAN</span><h1 id="brand" class="brand"></h1><h2 id="heroTitle" class="heroTitle"></h2><p id="heroText" class="heroText"></p><div id="tags" class="tags"></div><div class="heroBottom"><div id="contact" class="contact"></div><div class="actions"><a class="btn gold" href="#consult">免费鉴定</a><a class="btn light" href="#consult">免费估价</a><a class="btn light" id="call" href="#consult">立即咨询</a></div></div></div></header><nav class="nav"><div class="wrap navInner"><div class="navBrand">洪盛集藏</div><div id="nav"></div></div></nav><main id="main" class="wrap"></main><footer class="footer"><div class="footerBrand" id="footName">洪盛集藏</div>公益收藏资料平台 · 免费咨询 · 学习交流研究<div class="line"></div><span id="footPhone"></span>　｜　福建省泉州市后城旅游文化街179号<br><span style="color:#C9B27C">© 2026 洪盛集藏</span></footer><script>const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function pathFor(id){if(id.startsWith('market_'))return 'data/market/'+id.slice(7)+'.json';if(id.startsWith('fujian_'))return 'data/market/'+id+'.json';return 'data/content/'+id+'.json'}async function load(id){try{const r=await fetch(pathFor(id)+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return[];const a=await r.json();return Array.isArray(a)?a:[]}catch(e){return[]}}function card(x,id,price){const img=Array.isArray(x.images)&&x.images[0]?x.images[0]:'';return '<article class="card"><a href="detail.html?cat='+encodeURIComponent(id)+'&id='+encodeURIComponent(x.id)+'">'+(img?'<img src="'+E(img)+'" loading="lazy" alt="'+E(x.title||'钱币资料')+'">':'')+'<div class="body"><div class="meta">'+E(id.startsWith('fujian_')?'福建钱币':id)+'　'+E(x.date||'')+'</div><h4>'+E(x.title||'未命名资料')+'</h4>'+(price&&x.price?'<div class="price">参考价格：'+E(x.price)+'</div>':'')+'<div class="text">'+E(x.note||x.content||'')+'</div><span class="more">查看详情 →</span></div></a></article>'}async function sectionHtml(group){const items=(group.items||[]).filter(x=>x.enabled);const blocks=await Promise.all(items.map(async x=>{const a=(await load(x.id)).filter(r=>r.status!=='hidden').sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));if(!a.length)return '';return '<div class="categoryBlock"><div class="categoryHead"><h3>'+E(x.name)+'</h3><span class="count">'+a.length+' 条资料</span></div><div class="cards">'+a.slice(0,8).map(r=>card(r,x.id,x.id.startsWith('market_'))).join('')+'</div></div>'}));return blocks.filter(Boolean).join('')||'<div class="emptySection">暂无已发布资料，发布后会自动显示在对应栏目。</div>'}async function boot(){let c;try{const r=await fetch('data/site-config.json?t='+Date.now(),{cache:'no-store'});c=await r.json()}catch(e){document.getElementById('main').innerHTML='<div class="section"><div class="notice"><h2>网站配置读取失败</h2><p>请稍后刷新页面。</p></div></div>';return}document.title=(c.siteName||'洪盛集藏')+'｜钱币收藏资料与交流平台';document.getElementById('top').textContent=c.topNotice||'';document.getElementById('brand').textContent=c.siteName||'';document.getElementById('heroTitle').textContent=c.heroTitle||'';document.getElementById('heroText').textContent=c.heroText||'';document.getElementById('contact').textContent='☎ '+(c.phone||'')+'　｜　微信同号';document.getElementById('call').href='tel:'+(c.phone||'');document.getElementById('footName').textContent=c.siteName||'';document.getElementById('footPhone').textContent='电话 / 微信：'+(c.phone||'');document.getElementById('tags').innerHTML=Object.values(c.groups||{}).flatMap(g=>(g.items||[]).filter(x=>x.enabled)).slice(0,6).map(x=>'<span class="tag">'+E(x.name)+'</span>').join('');document.getElementById('nav').innerHTML=(c.nav||[]).filter(x=>x.enabled).map(x=>'<a href="#'+E(x.id)+'">'+E(x.name)+'</a>').join('');const main=document.getElementById('main');let html='';for(const [gid,g] of Object.entries(c.groups||{})){if(!g)continue;html+='<section id="'+E(gid)+'" class="section"><div class="'+(gid==='market'?'':'panel')+'"><div class="sectionHead"><div class="kicker">'+E(gid==='market'?'MARKET REFERENCE':gid==='fujian'?'FUJIAN NUMISMATICS':'COLLECTION & RESEARCH')+'</div><h2 class="title">'+E(g.title)+'</h2><p class="sub">'+E(g.subtitle||'')+'</p></div>'+(gid==='market'?'<div class="rule"></div>':'')+await sectionHtml(g)+'</div></section>'}if(c.consult&&c.consult.enabled)html+='<section id="consult" class="section"><div class="notice"><div class="kicker">FREE CONSULTATION</div><h2>'+E(c.consult.title||'免费咨询')+'</h2>'+String(c.consult.text||'').split('\n').map(x=>'<p>'+E(x)+'</p>').join('')+'<p><strong>电话 / 微信：'+E(c.phone||'')+'</strong></p><a class="btn gold" href="tel:'+E(c.phone||'')+'">☎ 立即咨询</a></div></section>';main.innerHTML=html}boot();</script></body></html>
