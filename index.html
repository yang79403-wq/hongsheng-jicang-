<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#741912"><title>洪盛集藏｜钱币收藏资料与交流平台</title><style>:root{--r:#741912;--g:#c49a4b;--bg:#f6f0e5;--p:#fffdf8;--ink:#2b2723;--muted:#756d64;--line:#e4d6bd}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",Arial,sans-serif;line-height:1.75}.wrap{width:min(1180px,92vw);margin:auto}.top{background:#211714;color:#d9c29a;text-align:center;padding:7px;font-size:12px}.hero{background:linear-gradient(120deg,#4b0e0a,#741912 52%,#3b0d09);color:#fff;padding:clamp(40px,7vw,72px) 0 48px}.eyebrow{display:inline-block;border:1px solid #e6c87b59;color:#efd58d;border-radius:999px;padding:6px 13px;font-size:12px;font-weight:800}.brand,.title,.heroTitle,.categoryHead h3,.notice h2{font-family:"Songti SC","STSong","Noto Serif SC",serif}.brand{font-size:clamp(42px,7vw,70px);line-height:1.1;margin:18px 0 10px;color:#f4d98e;font-weight:900}.heroTitle{font-size:clamp(20px,3vw,29px);margin:0 0 12px}.heroText{max-width:780px;color:#eadfd1;font-size:15px}.tags,.actions{display:flex;flex-wrap:wrap;gap:9px}.tag{border:1px solid #f0d69140;background:#ffffff0a;border-radius:999px;padding:5px 11px;color:#f3dfaa;font-size:12px}.heroBottom{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-top:22px}.contact{color:#f4d98e;font-weight:900}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:9px;padding:9px 15px;text-decoration:none;font-weight:800;font-size:13px}.gold{background:#d2ad5c;color:#35100c}.light{border:1px solid #ffffff33;color:#fff;background:#ffffff0a}.nav{position:sticky;top:0;z-index:20;background:#fffdf8f2;backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}.navInner{display:flex;overflow-x:auto;scrollbar-width:none}.navInner::-webkit-scrollbar{display:none}.navBrand{color:var(--r);font-weight:900;padding:12px 16px 12px 0;white-space:nowrap}.nav a{padding:12px 14px;color:#4f3a31;text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap}.section{padding:clamp(34px,5vw,58px) 0}.sectionHead{margin-bottom:18px}.kicker{font-size:11px;letter-spacing:2px;color:var(--g);font-weight:900;text-transform:uppercase}.title{color:var(--r);font-size:clamp(27px,4vw,38px);line-height:1.25;margin:3px 0}.sub{color:var(--muted);font-size:14px;margin:5px 0}.rule{height:1px;background:linear-gradient(90deg,var(--g),var(--line),transparent)}.panel{background:linear-gradient(135deg,#fffdf8,#f9f2e6);border:1px solid var(--line);border-radius:20px;padding:clamp(20px,4vw,32px)}.categoryBlock{margin-top:26px}.categoryHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid #eadfca}.categoryHead h3{margin:0;color:#4a211a;font-size:21px}.count{font-size:12px;color:var(--muted)}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}.card{background:var(--p);border:1px solid var(--line);border-radius:15px;overflow:hidden;box-shadow:0 7px 20px #3e22130f}.card a{text-decoration:none;display:block}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee}.body{padding:14px 15px 16px}.meta{font-size:11px;color:#8a7c70}.card h4{margin:3px 0 6px;color:#541a13;font-size:17px}.text{font-size:13px;color:#6f655c;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}.price{font-size:13px;color:var(--r);font-weight:900;margin:5px 0}.more{display:inline-block;margin-top:10px;color:var(--r);font-size:12px;font-weight:900}.notice{border:1px solid #e2cf9e;background:#fffaf0;border-radius:18px;padding:clamp(20px,4vw,30px)}.notice h2{color:var(--r);font-size:clamp(24px,4vw,32px)}.footer{background:#1c1411;color:#bfb0a0;padding:38px 14px;text-align:center;font-size:12px}.footerBrand{color:#e4c576;font-size:20px;font-weight:900}.line{height:1px;background:#4b3930;max-width:620px;margin:15px auto}.emptySection{padding:22px 0;color:#8c8075;font-size:13px}@media(max-width:1050px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.navBrand{display:none}.hero{padding:38px 0 42px}.brand{font-size:42px}}@media(max-width:520px){.cards{grid-template-columns:1fr}.brand{font-size:35px}.card img{aspect-ratio:16/10}}</style></head><body><div id="top" class="top"></div><header class="hero"><div class="wrap"><span class="eyebrow">🏮 HONGSHENG COLLECTION · FUJIAN</span><h1 id="brand" class="brand"></h1><h2 id="heroTitle" class="heroTitle"></h2><p id="heroText" class="heroText"></p><div id="tags" class="tags"></div><div class="heroBottom"><div id="contact" class="contact"></div><div class="actions"><a class="btn gold" href="#consult">免费鉴定</a><a class="btn light" href="#consult">免费估价</a><a class="btn light" id="call" href="#consult">立即咨询</a></div></div></div></header><nav class="nav"><div class="wrap navInner"><div class="navBrand">洪盛集藏</div><div id="nav"></div></div></nav><main id="main" class="wrap"></main><footer class="footer"><div class="footerBrand" id="footName">洪盛集藏</div>公益收藏资料平台 · 免费咨询 · 学习交流研究<div class="line"></div><span id="footPhone"></span>　｜　福建省泉州市后城旅游文化街179号<br><span style="color:#e4c576">© 2026 洪盛集藏</span></footer><script>const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const slug=s=>String(s).replace(/[^a-zA-Z0-9_-]/g,'_');const P={};function pathFor(id){if(id.startsWith('market_'))return 'data/market/'+id.slice(7)+'.json';if(id.startsWith('fujian_'))return 'data/market/'+id+'.json';return 'data/content/'+id+'.json'}async function load(id){try{const r=await fetch(pathFor(id)+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return[];const a=await r.json();return Array.isArray(a)?a:[]}catch(e){return[]}}function card(x,id,price){const img=Array.isArray(x.images)&&x.images[0]?x.images[0]:'';return '<article class="card"><a href="detail.html?cat='+encodeURIComponent(id)+'&id='+encodeURIComponent(x.id)+'">'+(img?'<img src="'+E(img)+'" loading="lazy" alt="'+E(x.title||'钱币资料')+'">':'')+'<div class="body"><div class="meta">'+E(id.startsWith('fujian_')?'福建钱币':id)+'　'+E(x.date||'')+'</div><h4>'+E(x.title||'未命名资料')+'</h4>'+(price&&x.price?'<div class="price">参考价格：'+E(x.price)+'</div>':'')+'<div class="text">'+E(x.note||x.content||'')+'</div><span class="more">查看详情 →</span></div></a></article>'}async function sectionHtml(group){const items=(group.items||[]).filter(x=>x.enabled);const blocks=await Promise.all(items.map(async x=>{const a=(await load(x.id)).filter(r=>r.status!=='hidden').sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));if(!a.length)return '';return '<div class="categoryBlock"><div class="categoryHead"><h3>'+E(x.name)+'</h3><span class="count">'+a.length+' 条资料</span></div><div class="cards">'+a.slice(0,8).map(r=>card(r,x.id,x.id.startsWith('market_'))).join('')+'</div></div>'}));return blocks.filter(Boolean).join('')||'<div class="emptySection">暂无已发布资料，发布后会自动显示在对应栏目。</div>'}async function boot(){let c;try{const r=await fetch('data/site-config.json?t='+Date.now(),{cache:'no-store'});c=await r.json()}catch(e){document.getElementById('main').innerHTML='<div class="section"><div class="notice"><h2>网站配置读取失败</h2><p>请稍后刷新页面。</p></div></div>';return}document.title=(c.siteName||'洪盛集藏')+'｜钱币收藏资料与交流平台';document.getElementById('top').textContent=c.topNotice||'';document.getElementById('brand').textContent=c.siteName||'';document.getElementById('heroTitle').textContent=c.heroTitle||'';document.getElementById('heroText').textContent=c.heroText||'';document.getElementById('contact').textContent='☎ '+(c.phone||'')+'　｜　微信同号';document.getElementById('call').href='tel:'+(c.phone||'');document.getElementById('footName').textContent=c.siteName||'';document.getElementById('footPhone').textContent='电话 / 微信：'+(c.phone||'');document.getElementById('tags').innerHTML=Object.values(c.groups||{}).flatMap(g=>(g.items||[]).filter(x=>x.enabled)).slice(0,6).map(x=>'<span class="tag">'+E(x.name)+'</span>').join('');document.getElementById('nav').innerHTML=(c.nav||[]).filter(x=>x.enabled).map(x=>'<a href="#'+E(x.id)+'">'+E(x.name)+'</a>').join('');const main=document.getElementById('main');let html='';for(const [gid,g] of Object.entries(c.groups||{})){if(!g)return;html+='<section id="'+E(gid)+'" class="section"><div class="'+(gid==='market'?'':'panel')+'"><div class="sectionHead"><div class="kicker">'+E(gid==='market'?'MARKET REFERENCE':gid==='fujian'?'FUJIAN NUMISMATICS':'COLLECTION & RESEARCH')+'</div><h2 class="title">'+E(g.title)+'</h2><p class="sub">'+E(g.subtitle||'')+'</p></div>'+(gid==='market'?'<div class="rule"></div>':'')+await sectionHtml(g)+'</div></section>'}if(c.consult&&c.consult.enabled)html+='<section id="consult" class="section"><div class="notice"><div class="kicker">FREE CONSULTATION</div><h2>'+E(c.consult.title||'免费咨询')+'</h2>'+String(c.consult.text||'').split('\n').map(x=>'<p>'+E(x)+'</p>').join('')+'<p><strong>电话 / 微信：'+E(c.phone||'')+'</strong></p><a class="btn gold" href="tel:'+E(c.phone||'')+'">☎ 立即咨询</a></div></section>';main.innerHTML=html}boot();</script></body></html>
