NG COLLECTION</div><h2 class="sectionTitle">网站版块</h2><p class="sub">原有资料统一归入对应版块，不在首页重复展开。点击版块即可查看完整内容。</p><div class="rule"></div><div class="groups">';for(const [gid,g] of groups){let items=(g.items||[]).filter(x=>x.enabled);html+='<a class="groupCard" href="section.html?group='+encodeURIComponent(gid)+'"><div class="groupIcon">'+(gid==='market'?'💰':gid==='fujian'?'🏮':'📚')+'</div><h2>'+E(g.title)+'</h2><p>'+E(g.subtitle||'')+'</p><div class="chips">'+items.map(x=>'<span class="chip">'+E(x.name)+'</span>').join('')+'</div><p><b>进入版块查看全部资料 →</b></p></a>}html+='</div></section>';if(c.consult&&c.consult.enabled)html+='<section id="consult" class="section"><div class="notice"><div class="kicker">FREE CONSULTATION</div><h2>'+E(c.consult.title||'免费鉴定 · 免费估价 · 立即咨询')+'</h2>'+String(c.consult.text||'').split('\n').map(x=>'<p>'+E(x)+'</p>').join('')+'<p><strong>电话 / 微信：'+E(c.phone||'')+'</strong></p><a class="btn" href="tel:'+E(c.phone||'')+'">☎ 立即咨询</a></div><div class="important"><div><b>交流学习</b><span>仅供学习交流参考</span></div><div><b>非盈利性</b><span>公益平台 · 非盈利机构</span></div><div><b>理性收藏</b><span>理性收藏，量力而行</span></div><div><b>风险提示</b><span>投资有风险，入市需谨慎</span></div></div></section>';document.getElementById('main').innerHTML=html}boot();</script></body></html>
