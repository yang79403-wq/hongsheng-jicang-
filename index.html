<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#6d1712"><title>洪盛集藏｜钱币收藏资料与交流平台</title><style>:root{--red:#6d1712;--red2:#8a241b;--gold:#b99550;--gold2:#d7bb7a;--paper:#fbf8f1;--cream:#f2eadc;--ink:#292522;--muted:#756c62;--line:#dfd2bc;--white:#fffdf9;--shadow:0 14px 38px rgba(48,28,18,.08)}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",Arial,sans-serif;line-height:1.75}.wrap{width:min(1180px,92vw);margin:auto}.top{background:#211512;color:#d8c49c;text-align:center;padding:8px 14px;font-size:12px;letter-spacing:.2px}.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 82% 18%,rgba(216,185,112,.16),transparent 30%),linear-gradient(135deg,#3d0906,#6d1712 52%,#430b08);color:#fff;padding:clamp(46px,8vw,82px) 0 58px}.hero:after{content:"";position:absolute;inset:auto -10% -85px;height:170px;background:rgba(255,255,255,.035);transform:rotate(-3deg);border-top:1px solid rgba(221,190,119,.18)}.eyebrow{display:inline-flex;border:1px solid rgba(229,200,123,.38);background:rgba(255,255,255,.045);color:#f0d993;border-radius:999px;padding:6px 13px;font-size:11px;font-weight:800;letter-spacing:1px}.brand,.title,.heroTitle,.categoryHead h3,.notice h2{font-family:"Songti SC","STSong","Noto Serif SC","SimSun",serif}.brand{font-size:clamp(42px,7vw,72px);line-height:1.05;margin:20px 0 10px;color:#f4d98e;font-weight:900;letter-spacing:2px;text-shadow:0 3px 18px rgba(0,0,0,.2)}.heroTitle{font-size:clamp(21px,3vw,30px);margin:0 0 13px;letter-spacing:1px}.heroText{max-width:820px;color:#eadfd2;font-size:14px;line-height:2;white-space:pre-line}.tags,.actions{display:flex;flex-wrap:wrap;gap:9px}.tag{border:1px solid rgba(240,214,145,.27);background:rgba(255,255,255,.055);border-radius:999px;padding:5px 11px;color:#f3dfaa;font-size:12px}.heroBottom{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:24px}.contact{color:#f4d98e;font-weight:900}.btn{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;padding:10px 16px;text-decoration:none;font-weight:800;font-size:13px;transition:.2s}.btn:hover{transform:translateY(-1px)}.gold{background:linear-gradient(135deg,#d8b96f,#b99145);color:#35100c;box-shadow:0 8px 20px rgba(0,0,0,.14)}.light{border:1px solid rgba(255,255,255,.25);color:#fff;background:rgba(255,255,255,.06)}.nav{position:sticky;top:0;z-index:20;background:rgba(255,253,249,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);box-shadow:0 4px 18px rgba(45,26,16,.04)}.navInner{display:flex;overflow-x:auto;scrollbar-width:none;min-height:48px}.navInner::-webkit-scrollbar{display:none}.navBrand{display:flex;align-items:center;color:var(--red);font-weight:900;padding:12px 18px 12px 0;white-space:nowrap}.nav a{display:flex;align-items:center;padding:12px 15px;color:#513d34;text-decoration:none;font-size:13px;font-weight:800;white-space:nowrap;border-bottom:2px solid transparent}.nav a:hover{color:var(--red);border-bottom-color:var(--gold)}.section{padding:clamp(38px,5vw,62px) 0}.section+.section{padding-top:10px}.sectionHead{margin-bottom:22px}.kicker{font-size:10px;letter-spacing:2.5px;color:var(--gold);font-weight:900;text-transform:uppercase}.title{color:var(--red);font-size:clamp(28px,4vw,39px);line-height:1.25;margin:4px 0}.sub{color:var(--muted);font-size:13px;margin:6px 0}.rule{height:1px;background:linear-gradient(90deg,var(--gold),var(--line),transparent);margin:18px 0 2px}.panel{background:linear-gradient(145deg,#fffdf9,#f8f0e3);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,34px);box-shadow:0 10px 35px rgba(52,31,19,.045)}.categoryBlock{margin-top:28px}.categoryHead{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px;padding:0 2px 9px;border-bottom:1px solid #eadfca}.categoryHead h3{margin:0;color:#4b211a;font-size:21px;line-height:1.4}.count{font-size:11px;color:#8b7d70;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:17px}.card{background:var(--white);border:1px solid #e3d7c4;border-radius:15px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s,border-color .2s}.card:hover{transform:translateY(-3px);box-shadow:0 18px 42px rgba(48,28,18,.12);border-color:#d0b783}.card a{text-decoration:none;display:block;color:inherit}.card img{width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee8dc;display:block}.body{padding:14px 15px 16px}.meta{font-size:10px;color:#8a7c70;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card h4{margin:4px 0 6px;color:#541a13;font-size:16px;line-height:1.45}.text{font-size:12.5px;color:#6f655c;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;min-height:2.8em}.price{font-size:13px;color:var(--red);font-weight:900;margin:5px 0}.more{display:inline-block;margin-top:10px;color:var(--red);font-size:12px;font-weight:900}.notice{border:1px solid #dfc98f;background:linear-gradient(145deg,#fffaf0,#f7ecd8);border-radius:20px;padding:clamp(22px,4vw,34px);box-shadow:var(--shadow)}.notice h2{color:var(--red);font-size:clamp(24px,4vw,32px);margin:4px 0 10px}.notice p{color:#655a50;font-size:13px}.footer{background:#1c1411;color:#bfb0a0;padding:42px 14px;text-align:center;font-size:12px}.footerBrand{color:#e4c576;font-size:21px;font-weight:900}.line{height:1px;background:#4b3930;max-width:620px;margin:16px auto}.emptySection{padding:24px 0;color:#8c8075;font-size:13px}@media(max-width:1050px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:760px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.navBrand{display:none}.hero{padding:40px 0 45px}.brand{font-size:43px;letter-spacing:1px}.heroText{font-size:13px}.panel{border-radius:18px}}@media(max-width:520px){.cards{grid-template-columns:1fr}.brand{font-size:35px}.heroTitle{font-size:20px}.heroBottom{align-items:stretch}.actions{width:100%}.actions .btn{flex:1}.card img{aspect-ratio:16/10}.section{padding:34px 0}.categoryHead h3{font-size:19px}}</style></head><body><div id="top" class="top"></div><header class="hero"><div class="wrap"><span class="eyebrow">🏮 HONGSHENG COLLECTION · FUJIAN</span><h1 id="brand" class="brand"></h1><h2 id="heroTitle" class="heroTitle"></h2><p id="heroText" class="heroText"></p><div id="tags" class="tags"></div><div class="heroBottom"><div id="contact" class="contact"></div><div class="actions"><a class="btn gold" href="#consult">免费鉴定</a><a class="btn light" href="#consult">免费估价</a><a class="btn light" id="call" href="#consult">立即咨询</a></div></div></div></header><nav class="nav"><div class="wrap navInner"><div class="navBrand">洪盛集藏</div><div id="nav"></div></div></nav><main id="main" class="wrap"></main><footer class="footer"><div class="footerBrand" id="footName">洪盛集藏</div>公益收藏资料平台 · 免费咨询 · 学习交流研究<div class="line"></div><span id="footPhone"></span>　｜　福建省泉州市后城旅游文化街179号<br><span style="color:#e4c576">© 2026 洪盛集藏</span></footer><script>const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function pathFor(id){if(id.startsWith('market_'))return 'data/market/'+id.slice(7)+'.json';if(id.startsWith('fujian_'))return 'data/market/'+id+'.json';return 'data/content/'+id+'.json'}async function load(id){try{const r=await fetch(pathFor(id)+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return[];const a=await r.json();return Array.isArray(a)?a:[]}catch(e){return[]}}function card(x,id,price){const img=Array.isArray(x.images)&&x.images[0]?x.images[0]:'';return '<article class="card"><a href="detail.html?cat='+encodeURIComponent(id)+'&id='+encodeURIComponent(x.id)+'">'+(img?'<img src="'+E(img)+'" loading="lazy" alt="'+E(x.title||'钱币资料')+'">':'')+'<div class="body"><div class="meta">'+E(id.startsWith('fujian_')?'福建钱币':id)+'　'+E(x.date||'')+'</div><h4>'+E(x.title||'未命名资料')+'</h4>'+(price&&x.price?'<div class="price">参考价格：'+E(x.price)+'</div>':'')+'<div class="text">'+E(x.note||x.content||'')+'</div><span class="more">查看详情 →</span></div></a></article>'}async function sectionHtml(group){const items=(group.items||[]).filter(x=>x.enabled);const blocks=await Promise.all(items.map(async x=>{const a=(await load(x.id)).filter(r=>r.status!=='hidden').sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));if(!a.length)return '';return '<div class="categoryBlock"><div class="categoryHead"><h3>'+E(x.name)+'</h3><span class="count">'+a.length+' 条资料</span></div><div class="cards">'+a.slice(0,8).map(r=>card(r,x.id,x.id.startsWith('market_'))).join('')+'</div></div>'}));return blocks.filter(Boolean).join('')||'<div class="emptySection">暂无已发布资料，发布后会自动显示在对应栏目。</div>'}async function boot(){let c;try{const r=await fetch('data/site-config.json?t='+Date.now(),{cache:'no-store'});c=await r.json()}catch(e){document.getElementById('main').innerHTML='<div class="section"><div class="notice"><h2>网站配置读取失败</h2><p>请稍后刷新页面。</p></div></div>';return}document.title=(c.siteName||'洪盛集藏')+'｜钱币收藏资料与交流平台';document.getElementById('top').textContent=c.topNotice||'';document.getElementById('brand').textContent=c.siteName||'';document.getElementById('heroTitle').textContent=c.heroTitle||'';document.getElementById('heroText').textContent=c.heroText||'';document.getElementById('contact').textContent='☎ '+(c.phone||'')+'　｜　微信同号';document.getElementById('call').href='tel:'+(c.phone||'');document.getElementById('footName').textContent=c.siteName||'';document.getElementById('footPhone').textContent='电话 / 微信：'+(c.phone||'');document.getElementById('tags').innerHTML=Object.values(c.groups||{}).flatMap(g=>(g.items||[]).filter(x=>x.enabled)).slice(0,6).map(x=>'<span class="tag">'+E(x.name)+'</span>').join('');document.getElementById('nav').innerHTML=(c.nav||[]).filter(x=>x.enabled).map(x=>'<a href="#'+E(x.id)+'">'+E(x.name)+'</a>').join('');const main=document.getElementById('main');let html='';for(const [gid,g] of Object.entries(c.groups||{})){if(!g)continue;html+='<section id="'+E(gid)+'" class="section"><div class="'+(gid==='market'?'':'panel')+'"><div class="sectionHead"><div class="kicker">'+E(gid==='market'?'MARKET REFERENCE':gid==='fujian'?'FUJIAN NUMISMATICS':'COLLECTION & RESEARCH')+'</div><h2 class="title">'+E(g.title)+'</h2><p class="sub">'+E(g.subtitle||'')+'</p></div>'+(gid==='market'?'<div class="rule"></div>':'')+await sectionHtml(g)+'</div></section>'}if(c.consult&&c.consult.enabled)html+='<section id="consult" class="section"><div class="notice"><div class="kicker">FREE CONSULTATION</div><h2>'+E(c.consult.title||'免费咨询')+'</h2>'+String(c.consult.text||'').split('\n').map(x=>'<p>'+E(x)+'</p>').join('')+'<p><strong>电话 / 微信：'+E(c.phone||'')+'</strong></p><a class="btn gold" href="tel:'+E(c.phone||'')+'">☎ 立即咨询</a></div></section>';main.innerHTML=html}boot();</script></body></html>
