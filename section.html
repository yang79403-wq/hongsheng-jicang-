<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛收藏资讯网｜版块</title><style>:root{--p:#7a2a20;--a:#b99355;--tf:"Songti SC",STSong,"Noto Serif SC",serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#4c0806,#73150e 48%,#430806);color:#fff4dc;font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1180px,92vw);margin:auto}.top{text-align:center;color:#f0d58a;padding:12px;border-bottom:1px solid #d6b35c55;font-size:12px}.head{text-align:center;padding:25px 0}.brand{font:900 clamp(34px,6vw,58px) var(--tf);color:#fff8e8;letter-spacing:4px}.sub{color:#f0d58a}.back{display:inline-block;color:#ffe7a5;text-decoration:none;margin-top:12px;border:1px solid #d6b35c55;padding:5px 12px}.panel{border-top:1px solid #d6b35c88;padding:28px 0}.k{color:#d6b35c;letter-spacing:4px;font-size:10px}.title{font:900 clamp(28px,5vw,42px) var(--tf);margin:4px 0;color:#fff5df}.desc{color:#e5cdb0;font-size:13px}.rule{height:1px;background:#d6b35c88;margin:20px 0}.item{margin:25px 0;padding:20px;background:linear-gradient(145deg,#7c1811,#4c0807);border:1px solid #d6b35c66}.item h2{font:900 24px var(--tf);color:#fff1ca;margin:0}.count{color:#f0d58a;font-size:11px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.card{background:#fff8e9;color:#3e2720;border:1px solid #d6b35c;overflow:hidden}.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.ph{aspect-ratio:4/3;display:grid;place-items:center;background:linear-gradient(145deg,#7a1812,#b99550);font-size:42px}.body{padding:11px}.meta{font-size:10px;color:#8a6f5b}.body h3{font:900 16px var(--tf);color:#5b170f;margin:4px 0}.text{font-size:12px;color:#6f5b4d}.more{display:inline-block;margin-top:7px;color:#7c1811;font-size:12px;font-weight:900}.empty{padding:18px;border:1px dashed #d6b35c66;color:#e5cdb0;font-size:13px}.service{background:linear-gradient(145deg,#fff1d2,#e7d1a8);color:#4b291d;padding:18px;border:1px solid #d6b35c}.service h3{margin:0;color:#6a160e;font:900 20px var(--tf)}footer{text-align:center;color:#bca58d;font-size:11px;padding:30px 0}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.cards{grid-template-columns:1fr}}</style></head><body><div class="top">洪盛收藏资讯网 · 收藏交流 · 鉴赏参考 · 市场行情 · 钱币文化研究</div><header class="head"><div class="wrap"><div class="brand" id="brand">洪盛收藏资讯网</div><div class="sub">钱币收藏资料与交流平台</div><a class="back" href="./">← 返回首页</a></div></header><main class="wrap panel"><div id="content">正在读取版块……</div></main><footer>本站为纯公益性钱币收藏资料与交流平台，内容仅供学习、研究和交流参考。© 2026</footer><script>const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const U=s=>encodeURIComponent(s);const path=id=>id.startsWith('market_')||id.startsWith('fujian_')?'data/market/'+id+'.json':'data/content/'+id+'.json';async function get(path){try{let r=await fetch(path+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return[];let x=await r.json();return Array.isArray(x)?x:[]}catch{return[]}}function card(x,id){let im=Array.isArray(x.images)&&x.images[0]?x.images[0]:'';return '<article class="card"><a href="detail.html?cat='+U(id)+'&id='+U(x.id)+'" style="color:inherit;text-decoration:none">'+(im?'<img src="'+E(im)+'" alt="'+E(x.title)+'">':'<div class="ph">🪙</div>')+'<div class="body"><div class="meta">'+E(x.date||'资料')+'</div><h3>'+E(x.title||'未命名资料')+'</h3><div class="text">'+E(x.note||x.content||'')+'</div><span class="more">查看详情 →</span></div></a></article>'}async function boot(){let q=new URLSearchParams(location.search),gid=q.get('group')||'content',raw;try{raw=await(await fetch('data/site-config.json?t='+Date.now(),{cache:'no-store'})).json()}catch{content.innerHTML='<div class="empty">网站配置读取失败，请刷新。</div>';return}let c=typeof raw.content==='string'?JSON.parse(raw.content):raw;brand.textContent=c.siteName||'洪盛收藏资讯网';let g=c.groups?.[gid];if(!g){let s=(c.serviceSections||[]).find(x=>x.id===gid);if(s){document.title=s.title+'｜洪盛收藏资讯网';content.innerHTML='<div class="k">HONGSHENG COLLECTION</div><h1 class="title">'+E(s.title)+'</h1><p class="desc">'+E(s.subtitle||'')+'</p><div class="rule"></div><div class="service"><h3>📚 公益学习内容</h3><ul>'+((s.items||[]).map(x=>'<li>'+E(x)+'</li>').join(''))+'</ul></div>';return}content.innerHTML='<div class="empty">版块不存在。</div>';return}document.title=(g.title||'版块')+'｜洪盛收藏资讯网';let html='<div class="k">HONGSHENG COLLECTION</div><h1 class="title">'+E(g.title)+'</h1><p class="desc">'+E(g.subtitle||'')+'</p><div class="rule"></div>';for(const it of (g.items||[]).filter(x=>x.enabled!==false)){let a=(await get(path(it.id))).filter(x=>x.status!=="hidden");html+='<section class="item"><div style="display:flex;justify-content:space-between;gap:10px"><h2>'+E(it.name)+'</h2><span class="count">'+a.length+' 条资料</span></div><div class="cards">'+(a.length?a.map(x=>card(x,it.id)).join(''):'<div class="empty">暂无资料，发布后会自动显示在这里。</div>')+'</div></section>'}content.innerHTML=html}boot();</script></body></html>
