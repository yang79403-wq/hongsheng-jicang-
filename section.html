<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b0b07"><title>洪盛收藏资讯网｜版块</title><style>:root{--r:#5b0b07;--r2:#7b1810;--g:#c9a45c;--paper:#fffdf8;--ink:#3b2a24;--muted:#806e60;--line:#ead8b7}*{box-sizing:border-box}body{margin:0;background:#f6efe4;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:#3d0604;color:#efd38b;text-align:center;padding:9px;font-size:12px}.hero{background:linear-gradient(135deg,#67100a,#3e0504);color:#fff;padding:34px 0}.wrap{width:min(1180px,92vw);margin:auto}.brand{text-align:center;font:900 clamp(35px,6vw,60px) "Songti SC",STSong,serif;color:#f5d88b;letter-spacing:4px}.back{display:block;width:max-content;margin:15px auto 0;border:1px solid #d6b35c77;border-radius:999px;padding:7px 14px;color:#ffe7a5;font-size:13px}.main{padding:28px 0}.eyebrow{text-align:center;color:#a17a35;font-size:10px;letter-spacing:4px}.title{text-align:center;color:#65150f;font:900 clamp(28px,5vw,44px) "Songti SC",STSong,serif;margin:5px 0}.desc{text-align:center;max-width:780px;margin:0 auto;color:var(--muted);font-size:13px;line-height:1.8}.rule{height:1px;background:var(--line);margin:24px 0}.item{margin:20px 0;background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:18px;box-shadow:0 7px 22px #4d130d0a}.itemHead{display:flex;justify-content:space-between;align-items:center;gap:10px}.item h2{margin:0;color:#68160f;font:900 22px "Songti SC",STSong,serif}.count{color:#9b7331;font-size:11px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:15px}.card{background:#fff;border:1px solid #eadcc7;border-radius:11px;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-2px)}.card img,.ph{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.ph{display:grid;place-items:center;background:linear-gradient(135deg,#7a1811,#c6a05a);font-size:40px}.body{padding:11px}.meta{font-size:10px;color:#967d6c}.body h3{font:900 16px "Songti SC",STSong,serif;color:#64150f;margin:4px 0;line-height:1.45}.text{font-size:12px;color:#766459;line-height:1.7;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.more{display:inline-block;margin-top:7px;color:#986a25;font-size:12px;font-weight:800}.empty{padding:18px;text-align:center;border:1px dashed #d8c3a0;border-radius:10px;color:#897769;font-size:13px}.service{background:#fff8e9;border:1px solid var(--line);border-radius:14px;padding:18px;color:#655146}.service h3{margin:0;color:#68160f;font:900 20px "Songti SC",STSong,serif}.service li{line-height:1.9;font-size:13px}footer{text-align:center;background:#3d0805;color:#bfae95;font-size:11px;line-height:2;padding:28px 10px;margin-top:30px}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.cards{grid-template-columns:1fr}.item{padding:14px}.itemHead{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="top">🏮 洪盛收藏资讯网 · 收藏交流 · 鉴赏参考 · 市场行情 · 钱币文化研究</div><header class="hero"><div class="wrap"><div class="brand" id="brand">洪盛收藏资讯网</div><a class="back" href="./">← 返回首页</a></div></header><main class="wrap main"><div id="content"><div class="empty">正在读取版块资料……</div></div></main><footer>纯公益钱币收藏资料与交流平台　|　学习 · 研究 · 交流<br>资料仅供收藏爱好者参考，不构成正式鉴定结论、交易报价或投资建议。</footer><script>const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const U=s=>encodeURIComponent(s);function path(id){return id.startsWith('market_')?'data/market/'+id+'.json':'data/content/'+id+'.json'}async function read(p){try{let r=await fetch(p+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return[];let x=await r.json();return Array.isArray(x)?x:[]}catch{return[]}}function card(x,id){let im=Array.isArray(x.images)&&x.images[0]?x.images[0]:'';return '<article class="card"><a href="detail.html?cat='+U(id)+'&id='+U(x.id)+'">'+(im?'<img loading="lazy" src="'+E(im)+'" alt="'+E(x.title||'钱币资料')+'">':'<div class="ph">🪙</div>')+'<div class="body"><div class="meta">'+E(x.date||'收藏资料')+'</div><h3>'+E(x.title||'未命名资料')+'</h3><div class="text">'+E(x.note||x.content||'')+'</div><span class="more">查看详情 →</span></div></a></article>'}async function boot(){let gid=new URLSearchParams(location.search).get('group')||'content';let raw;try{raw=await(await fetch('data/site-config.json?t='+Date.now(),{cache:'no-store'})).json()}catch{content.innerHTML='<div class="empty">网站配置暂时无法读取，请稍后刷新。</div>';return}let c=typeof raw.content==='string'?JSON.parse(raw.content):raw;brand.textContent=c.siteName||'洪盛收藏资讯网';let g=c.groups?.[gid];if(!g){let s=(c.serviceSections||[]).find(x=>x.id===gid);if(s){document.title=s.title+'｜洪盛收藏资讯网';content.innerHTML='<div class="eyebrow">HONGSHENG COLLECTION</div><h1 class="title">'+E(s.title)+'</h1><p class="desc">'+E(s.subtitle||'')+'</p><div class="rule"></div><div class="service"><h3>📚 公益学习内容</h3><ul>'+(s.items||[]).map(x=>'<li>'+E(x)+'</li>').join('')+'</ul></div>';return}content.innerHTML='<div class="empty">未找到该版块。</div>';return}document.title=(g.title||'版块')+'｜洪盛收藏资讯网';let html='<div class="eyebrow">COLLECTION SECTION</div><h1 class="title">'+E(g.title||'收藏资料')+'</h1><p class="desc">'+E(g.subtitle||'')+'</p><div class="rule"></div>';for(const it of(g.items||[]).filter(x=>x.enabled!==false)){let arr=(await read(path(it.id))).filter(x=>x.status!=="hidden");html+='<section class="item"><div class="itemHead"><h2>'+E(it.name)+'</h2><span class="count">'+arr.length+' 条资料</span></div><div class="cards">'+(arr.length?arr.map(x=>card(x,it.id)).join(''):'<div class="empty">暂无资料，后续发布内容会自动显示。</div>')+'</div></section>'}content.innerHTML=html}boot();</script></body></html>
