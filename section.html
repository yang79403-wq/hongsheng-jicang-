<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5b0d09"><title>洪盛集藏资讯网｜版块</title><style>:root{--red:#5b0d09;--red2:#7c1811;--gold:#d6b35c;--gold2:#f0d58a;--cream:#fff4dc;--muted:#e5cdb0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#4c0806,#73150e 45%,#430806);color:var(--cream);font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}.page{width:min(1180px,92vw);margin:auto}.top{text-align:center;color:var(--gold2);font-size:12px;letter-spacing:2px;padding:12px 0;border-bottom:1px solid #d6b35c55}.head{text-align:center;padding:24px 0 20px}.seal{display:inline-grid;place-items:center;width:48px;height:48px;border:2px solid var(--gold);transform:rotate(45deg);margin:6px 0 15px}.seal b{transform:rotate(-45deg);font-family:serif;color:var(--gold2);font-size:22px}.brand{font-family:"Noto Serif SC","Songti SC","STSong","SimSun",serif;font-size:clamp(34px,6vw,58px);font-weight:900;letter-spacing:4px;color:#fff8e8;text-shadow:0 3px #360704;margin:0}.brandSub{color:var(--gold2);letter-spacing:4px;font-size:13px}.back{display:inline-block;color:#ffe7a5;text-decoration:none;margin-top:12px;font-size:12px;border:1px solid #d6b35c55;padding:5px 12px}.panel{border-top:1px solid #d6b35c88;padding:28px 0 10px}.kicker{font-size:10px;color:var(--gold);letter-spacing:4px;font-weight:900}.title{font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(28px,5vw,42px);margin:4px 0;color:#fff5df}.sub{color:var(--muted);font-size:13px;margin:6px 0 20px}.rule{height:1px;background:linear-gradient(90deg,var(--gold),#d6b35c55,transparent);margin:12px 0 25px}.item{margin:25px 0 34px;padding:20px;background:linear-gradient(145deg,#7c1811,#4c0807);border:1px solid #d6b35c66;position:relative}.item:before{content:"";position:absolute;inset:7px;border:1px solid #d6b35c22;pointer-events:none}.itemHead{position:relative;display:flex;justify-content:space-between;gap:15px;align-items:flex-start}.item h2{font-family:"Noto Serif SC","Songti SC",serif;color:#fff1ca;margin:0;font-size:24px}.itemDesc{color:#e5cdb0;font-size:12px;margin-top:5px;white-space:pre-line}.count{color:var(--gold2);font-size:11px;white-space:nowrap}.cards{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}.card{background:#fff8e9;color:#3e2720;border:1px solid #d6b35c;overflow:hidden;transition:.2s}.card:hover{transform:translateY(-3px);box-shadow:0 12px 25px #21000055}.card a{text-decoration:none;color:inherit}.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#6b120d}.placeholder{aspect-ratio:4/3;display:grid;place-items:center;background:linear-gradient(145deg,#7a1812,#b99550);font-size:42px}.body{padding:11px 12px 13px}.meta{font-size:10px;color:#8a6f5b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card h3{font-family:"Noto Serif SC",serif;color:#5b170f;margin:4px 0;font-size:16px}.text{font-size:12px;color:#6f5b4d;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{color:#9c160e;font-weight:900;font-size:13px;margin-top:3px}.more{display:inline-block;margin-top:8px;color:#7c1811;font-size:12px;font-weight:900}.empty{position:relative;padding:18px;border:1px dashed #d6b35c66;color:#e5cdb0;font-size:13px}.footer{text-align:center;color:#bca58d;font-size:11px;padding:30px 0 18px;border-top:1px solid #d6b35c33;margin-top:20px}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}.item{padding:17px}.item h2{font-size:21px}}@media(max-width:430px){.cards{grid-template-columns:1fr}.itemHead{display:block}.count{display:block;margin-top:5px}.brand{font-size:37px;letter-spacing:2px}.brandSub{letter-spacing:2px}}</style></head><body><div class="page"><div class="top">洪盛集藏资讯网 · 收藏交流 · 鉴赏参考 · 市场行情 · 钱币文化研究</div><header class="head"><div class="seal"><b>藏</b></div><h1 id="brand" class="brand">洪盛集藏资讯网</h1><div class="brandSub">钱币收藏资料与交流平台</div><a class="back" href="./">← 返回首页</a></header><main class="panel"><div id="content">正在读取版块……</div></main><footer class="footer">本站为钱币收藏交流平台，资料仅供学习交流参考。投资有风险，入市需谨慎。 © 2026 洪盛集藏资讯网</footer></div><script>const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const esc=s=>encodeURIComponent(s);function pathFor(id){if(id.startsWith('market_'))return'data/market/'+id.slice(7)+'.json';if(id.startsWith('fujian_'))return'data/market/'+id+'.json';return'data/content/'+id+'.json'}const desc={market_yinyuan_jizhibi:'老银元与机制币行情参考。关注年份、版式、铸造特征、品相、包浆及市场成交信息。',market_tongqian:'铜钱行情参考，结合品种、版别、品相与市场信息整理。',market_tongyuan:'铜元行情参考，关注版式、铸造特征、品相及市场成交。',market_zhibi:'纸币行情与版别、冠号、品相、历史信息整理。',yinyuan_jizhibi:'老银元收藏交流与机制币版别研究统一归入本版块。',tongqian:'铜钱古币版别研究、文字、版别、铸造与历史背景。',tongyuan:'铜元收藏与版别交流，关注版式、铸造特征、品相与图片。',zhibi:'纸币价值分析，关注版别、冠号、品相与历史。',appreciation:'品相评估、评级知识、包浆、原味状态与保存状态等鉴赏参考。',knowledge:'真伪知识、基础辨识思路、常见特征与收藏学习资料。',history:'钱币历史、铸造工艺、钱币发展与历史故事。',culture:'钱币文化、收藏文化与地方钱币文化。',experience:'收藏方向、预算配置、品种选择、长期规划与藏品保管。',fujian_tongqian:'福建地区铜钱资料与地方钱币研究。',fujian_tongyuan:'福建地区铜币资料与地方钱币研究。',fujian_yinyuan:'福建地区银元资料与收藏交流。',fujian_zhibi:'福建地区纸币资料与历史信息整理。'};const label=id=>id.startsWith('fujian_')?'福建钱币':id.startsWith('market_')?'最新价格行情':id;async function load(id){try{let r=await fetch(pathFor(id)+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return[];let a=await r.json();return Array.isArray(a)?a:[]}catch{return[]}}function card(x,id,isPrice){let img=Array.isArray(x.images)&&x.images[0]?x.images[0]:'';return'<article class="card"><a href="detail.html?cat='+esc(id)+'&id='+esc(x.id)+'">'+(img?'<img src="'+E(img)+'" loading="lazy" alt="'+E(x.title||'钱币资料')+'">':'<div class="placeholder">🪙</div>')+'<div class="body"><div class="meta">'+E(label(id))+'　'+E(x.date||'')+'</div><h3>'+E(x.title||'未命名资料')+'</h3>'+(isPrice&&x.price?'<div class="price">参考价格：'+E(x.price)+'</div>':'')+'<div class="text">'+E(x.note||x.content||'')+'</div><span class="more">查看详情 →</span></div></a></article>'}async function boot(){let q=new URLSearchParams(location.search),gid=q.get('group')||'content',c;try{c=await(await fetch('data/site-config.json?t='+Date.now(),{cache:'no-store'})).json()}catch{return}let g=c.groups&&c.groups[gid];if(!g){document.getElementById('content').innerHTML='<h2>版块不存在</h2>';return}document.title=(g.title||'版块')+'｜洪盛集藏资讯网';document.getElementById('brand').textContent=c.siteName||'洪盛集藏资讯网';let html='<div class="kicker">HONGSHENG COLLECTION</div><h2 class="title">'+E(g.title)+'</h2><p class="sub">'+E(g.subtitle||'')+'</p><div class="rule"></div>';for(const item of (g.items||[]).filter(x=>x.enabled)){let a=(await load(item.id)).filter(x=>x.status!=='hidden').sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')));html+='<section class="item"><div class="itemHead"><div><h2>'+E(item.name)+'</h2><div class="itemDesc">'+E(desc[item.id]||'本版块资料统一归类于此，点击资料查看完整内容。')+'</div></div><div class="count">'+a.length+' 条资料</div></div>';html+=a.length?'<div class="cards">'+a.map(x=>card(x,item.id,gid==='market')).join('')+'</div>':'<div class="empty">暂无已发布资料。后续从上传中心发布后，会自动归类到这里。</div>';html+='</section>'}document.getElementById('content').innerHTML=html}boot();</script></body></html>
