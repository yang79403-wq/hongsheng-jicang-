<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#6d1712"><title>洪盛集藏｜版块</title><style>:root{--r:#6d1712;--g:#b99550;--paper:#fbf8f1;--ink:#2b2521;--muted:#756b61;--line:#dfd0b8;--white:#fffdf9;--shadow:0 10px 28px rgba(58,30,18,.08)}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.7}.wrap{width:min(1120px,92vw);margin:auto}.top{background:#241512;color:#d8c39a;padding:7px;text-align:center;font-size:12px}.head{background:linear-gradient(135deg,#3d0906,#701811 53%,#430a07);color:#fff;padding:28px 0}.head h1{margin:0;color:#f3d88f;font-family:"Noto Serif SC","Songti SC",serif;font-size:clamp(28px,5vw,42px)}.back{display:inline-block;color:#ffe7a5;text-decoration:none;margin-top:6px;font-size:12px}.section{padding:30px 0}.panel{background:linear-gradient(145deg,#fffdf9,#f7eddf);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow)}.kicker{font-size:10px;color:var(--g);letter-spacing:2px;font-weight:900}.sub{color:var(--muted);font-size:13px;margin:6px 0 18px}.item{margin-top:24px;padding-top:22px;border-top:1px solid #eadfca}.itemHead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.item h2{font-family:"Noto Serif SC","Songti SC",serif;color:#541a13;margin:0;font-size:23px}.itemDesc{color:#6f655d;font-size:13px;margin:7px 0 14px;white-space:pre-line}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:var(--white);border:1px solid #e2d6c4;border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}.card a{text-decoration:none;color:inherit}.card img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee7dc}.body{padding:11px 13px 14px}.meta{font-size:10px;color:#8a7c70;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card h3{font-family:"Noto Serif SC",serif;color:#541a13;margin:4px 0;font-size:16px}.text{font-size:12px;color:#6f655d;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price{color:var(--r);font-weight:900;font-size:13px;margin-top:3px}.more{display:inline-block;margin-top:8px;color:var(--r);font-size:12px;font-weight:900}.empty{padding:18px;background:#fffdf9;border:1px dashed var(--line);border-radius:12px;color:var(--muted);font-size:13px}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}}@media(max-width:650px){.cards{grid-template-columns:repeat(2,1fr)}.panel{padding:17px}.item h2{font-size:20px}}@media(max-width:430px){.cards{grid-template-columns:1fr}}</style></head><body><div class="top">洪盛集藏 · 收藏交流 · 鉴赏参考 · 市场行情 · 钱币文化研究</div><header class="head"><div class="wrap"><h1 id="title">洪盛集藏</h1><a class="back" href="./">← 返回首页</a></div></header><main class="wrap"><section class="section"><div class="panel"><div id="content">正在读取版块……</div></div></section></main><script>
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const esc=s=>encodeURIComponent(s);function pathFor(id){if(id.startsWith('market_'))return'data/market/'+id.slice(7)+'.json';if(id.startsWith('fujian_'))return'data/market/'+id+'.json';return'data/content/'+id+'.json'}
const desc={market_yinyuan_jizhibi:'老银元与机制币行情参考。关注年份、版式、铸造特征、品相、包浆及市场成交信息。',market_tongqian:'铜钱行情参考，结合品种、版别、品相与市场信息整理。',market_tongyuan:'铜元行情参考，关注版式、铸造特征、品相及市场成交。',market_zhibi:'老纸币价值分析，关注第一至第四套人民币、地方纸币、版别、冠号、品相、历史与市场信息。',yinyuan_jizhibi:'老银元收藏交流与机制币版别研究统一归入本版块。研究年份、版式、铸造特征、边齿、品相、包浆及图片对比，不再单独设置重复栏目。',tongqian:'铜钱古币版别研究：清钱、古泉、花钱等，关注文字、版别、铸造、历史背景与图片特征。',tongyuan:'铜元收藏与版别交流，关注版式、铸造特征、品相与图片对比。',zhibi:'老纸币价值分析：第一套至第四套人民币、地方纸币等，关注版别、冠号、品相、历史与市场信息。',appreciation:'鉴赏与评级知识统一在这里查看：品相评估、磨损、包浆、原味状态、保存状态，以及 PCGS、NGC、PMG、华夏评级等评级流程与送评交流。网站仅提供知识与交流参考，不替代评级机构作正式评级结论。',knowledge:'真伪知识分享与收藏基础学习：基础辨识思路、常见特征、收藏经验与学习资料。',history:'钱币历史研究：历史背景、铸造工艺、钱币发展与历史故事。',culture:'钱币文化研究：钱币文化、收藏文化、地方钱币文化与历史背景。',experience:'收藏体系与藏品保管经验：收藏方向、预算配置、品种选择、长期规划，以及保存、防潮、防氧化与日常保护。',fujian_tongqian:'福建地区铜钱资料与地方钱币研究。',fujian_tongyuan:'福建地区铜币资料与地方钱币研究。',fujian_yinyuan:'福建地区银元资料与收藏交流。',fujian_zhibi:'福建地区纸币资料、版别与历史信息整理。'};
const label=id=>id.startsWith('fujian_')?'福建钱币':id.startsWith('market_')?'最新价格行情':id;async function load(id){try{let r=await fetch(pathFor(id)+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return[];let a=await r.json();return Array.isArray(a)?a:[]}catch{return[]}}
function card(x,id,isPrice){let img=Array.isArray(x.images)&&x.images[0]?x.images[0]:'';return'<article class="card"><a href="detail.html?cat='+esc(id)+'&id='+esc(x.id)+'">'+(img?'<img src="'+E(img)+'" loading="lazy" alt="'+E(x.title||'钱币资料')+'">':'<div style="aspect-ratio:4/3;background:linear-gradient(145deg,#7a1812,#b99550);display:grid;place-items:center;color:#fff1c9;font-size:42px">🪙</div>')+'<div class="body"><div class="meta">'+E(label(id))+'　'+E(x.date||'')+'</div><h3>'+E(x.title||'未命名资料')+'</h3>'+(isPrice&&x.price?'<div class="price">参考价格：'+E(x.price)+'</div>':'')+'<div class="text">'+E(x.note||x.content||'')+'</div><span class="more">查看详情 →</span></div></a></article>'}
async function boot(){let q=new URLSearchParams(location.search),gid=q.get('group')||'content',c;try{c=await(await fetch('data/site-config.json?t='+Date.now(),{cache:'no-store'})).json()}catch{return}let g=c.groups&&c.groups[gid];if(!g){document.getElementById('content').innerHTML='<h2>版块不存在</h2>';return}document.title=(g.title||'版块')+'｜洪盛集藏';document.getElementById('title').textContent=g.title||'洪盛集藏';let html='<div class="kicker">HONGSHENG COLLECTION</div><h2 style="font-family:serif;color:#6d1712;font-size:32px;margin:4px 0">'+E(g.title)+'</h2><p class="sub">'+E(g.subtitle||'')+'</p>';for(const item of (g.items||[]).filter(x=>x.enabled)){let a=(await load(item.id)).filter(x=>x.status!=='hidden').sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')));html+='<div class="item"><div class="itemHead"><div><h2>'+E(item.name)+'</h2><div class="itemDesc">'+E(desc[item.id]||'本版块资料统一归类于此，点击资料查看完整内容。')+'</div></div><div class="meta">'+a.length+' 条资料</div></div>';html+=a.length?'<div class="cards">'+a.map(x=>card(x,item.id,gid==='market')).join('')+'</div>':'<div class="empty">暂无已发布资料。后续从上传中心发布后，会自动归类到这里。</div>';html+='</div>'}document.getElementById('content').innerHTML=html}boot();
</script></body></html>
