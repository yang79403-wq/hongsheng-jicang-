spacing:2px}}</style></head><body><div class="page"><div class="top">洪盛收藏资讯网 · 收藏交流 · 鉴赏参考 · 市场行情 · 钱币文化研究</div><header class="head"><div class="seal"><b>藏</b></div><h1 id="brand" class="brand">洪盛收藏资讯网</h1><div class="brandSub">钱币收藏资料与交流平台</div><a class="back" href="./">← 返回首页</a></header><main class="panel"><div id="content">正在读取版块……</div></main><footer class="footer">本站为纯公益性钱币收藏资料与交流平台，内容仅供学习、研究和交流参考。© 2026 洪盛收藏资讯网</footer></div><script>const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const esc=s=>encodeURIComponent(s);const desc={market_yinyuan_jizhibi:'老银元与机制币行情参考：年份、版式、铸造特征、品相、包浆及公开成交资料。',market_tongqian:'铜钱行情资料：品种、版别、品相与公开市场信息整理。',market_tongyuan:'铜元行情资料：版式、铸造特征、品相与历史成交资料。',market_zhibi:'纸币行情资料：版别、冠号、品相、历史与公开市场信息。',yinyuan_jizhibi:'袁大头、船洋、龙洋等老银元，以及机制币年份、版式、铸造特征与图片研究。',tongqian:'清钱、古泉、花钱等文字、版别、铸造、历史背景与图片特征研究。',tongyuan:'铜元版式、铸造特征、边齿、包浆、品相与图片对比交流。',zhibi:'第一至第四套人民币及地方纸币，研究版别、冠号、品相与历史背景。',appreciation:'磨损、包浆、原味状态、保存状态、评级知识与图片对比鉴赏参考。',knowledge:'基础辨识思路、常见特征、收藏经验与新手学习资料。',history:'钱币历史、铸造工艺、钱币发展与历史故事研究。',culture:'钱币文化、收藏文化、地方钱币文化与相关历史资料。',experience:'收藏方向、预算配置、品种选择、长期规划与藏品保管经验。',fujian_tongqian:'福建地区铜钱资料、地方钱币与历史研究。',fujian_tongyuan:'福建地区铜币资料、版别与历史信息整理。',fujian_yinyuan:'福建地区银元资料、历史、版别与收藏交流。',fujian_zhibi:'福建地区纸币资料、历史与收藏文化研究。'};const pathFor=id=>id.startsWith('market_')||id.startsWith('fujian_')?'data/market/'+(id.startsWith('market_')?id.slice(7):id)+'.json':'data/content/'+id+'.json';async function load(id){try{const r=await fetch(pathFor(id)+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)return[];const a=await r.json();return Array.isArray(a)?a:[]}catch{return[]}}function articleCard(x,id,isPrice){const img=Array.isArray(x.images)&&x.images[0]?x.images[0]:'';return '<article class="card"><a href="detail.html?cat='+esc(id)+'&id='+esc(x.id)+'">'+(img?'<img src="'+E(img)+'" loading="lazy" alt="'+E(x.title||'钱币资料')+'">':'<div class="placeholder">🪙</div>')+'<div class="body"><div class="meta">'+E(x.date||'资料')+'</div><h3>'+E(x.title||'未命名资料')+'</h3>'+(isPrice&&x.price?'<div class="price">参考价格：'+E(x.price)+'</div>':'')+'<div class="text">'+E(x.note||x.content||'')+'</div><span class="more">查看详情 →</span></div></a></article>'}function serviceHtml(s){return '<div class="serviceCard"><h3>'+E(s.title)+'</h3><p>'+E(s.subtitle||'')+'</p><ul>'+(s.items||[]).map(x=>'<li>'+E(x)+'</li>').join('')+'</ul></div>'}async function boot(){const q=new URLSearchParams(location.search),gid=q.get('group')||'content';let c;try{c=await(await fetch('data/site-config.json?t='+Date.now(),{cache:'no-store'})).json()}catch{document.getElementById('content').innerHTML='<div class="empty">网站配置暂时无法读取。</div>';return}document.getElementById('brand').textContent=c.siteName||'洪盛收藏资讯网';let html='';if(gid==='services'||gid==='advisor'||gid==='consult'){const s=(c.serviceSections||[]).find(x=>x.id===gid);if(s){document.title=s.title+'｜洪盛收藏资讯网';html='<div class="kicker">HONGSHENG COLLECTION</div><h2 class="title">'+E(s.title)+'</h2><p class="sub">'+E(s.subtitle||'')+'</p><div class="rule"></div><div class="serviceCard"><h3>📚 公益学习内容</h3><ul>'+s.items.map(x=>'<li>'+E(x)+'</li>').join('')+'</ul></div>'}else{html='<div class="empty">该版块暂未配置内容。</div>'}}else{const g=c.groups&&c.groups[gid];if(!g){document.getElementById('content').innerHTML='<div class="empty">版块不存在。</div>';return}document.title=(g.title||'版块')+'｜洪盛收藏资讯网';html='<div class="kicker">HONGSHENG COLLECTION</div><h2 class="title">'+E(g.title)+'</h2><p class="sub">'+E(g.subtitle||'')+'</p><div class="rule"></div>';for(const item of (g.items||[]).filter(x=>x.enabled)){const a=(await load(item.id)).filter(x=>x.status!=='hidden').sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')));html+='<section class="item"><div class="itemHead"><div><h2>'+E(item.name)+'</h2><div class="itemDesc">'+E(desc[item.id]||'本版块资料统一归类于此，发布后将自动显示在这里。')+'</div></div><div class="count">'+a.length+' 条资料</div></div>';html+=a.length?'<div class="cards">'+a.map(x=>articleCard(x,item.id,gid==='market')).join('')+'</div>':'<div class="empty">该分类目前还没有发布资料。你可以从上传中心发布图文资料，发布后会自动归类并显示在本版块。</div>';html+='</section>'}}document.getElementById('content').innerHTML=html}boot();</script></body></html>
