<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>洪盛收藏资讯网｜全站管理工具</title><style>body{margin:0;background:#f4eee6;color:#302721;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1100px;margin:auto;padding:18px}.head{background:linear-gradient(135deg,#360705,#74170f);color:#f6d985;padding:22px}.card{background:#fffdf9;border:1px solid #dfcdae;border-radius:14px;padding:18px;margin:14px 0}label{display:block;font-weight:800;margin:9px 0 5px}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d9c9b7;border-radius:8px;font:inherit}textarea{min-height:100px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:800;margin:5px;cursor:pointer}.red{background:#68100a;color:#fff}.gold{background:#d6b35b;color:#32130d}.gray{background:#756a63;color:#fff}.danger{background:#a62a20;color:#fff}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px;border:1px solid #eadfce;border-radius:9px;margin:7px 0;background:#fffaf3}.row img{width:90px;height:70px;object-fit:cover;border-radius:6px}.status{padding:11px;background:#f7efe5;border-radius:9px;margin-top:10px}.hint{font-size:12px;color:#756a61}.preview{max-width:320px;border:1px solid #d6b35b;padding:10px;border-radius:10px;background:#fff;text-align:center}.preview img{max-width:100%;max-height:260px}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab{white-space:nowrap;border:1px solid #dfcdae;background:#fff9f0;padding:10px 14px;border-radius:9px;font-weight:800}.tab.on{background:#68100a;color:#fff}.panel{display:none}.panel.on{display:block}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.row{align-items:flex-start;flex-wrap:wrap}}</style></head><body><header class="head"><div class="wrap"><b style="font-size:26px">洪盛收藏资讯网 · 全站管理工具</b><div>一键读取 → 编辑 → 保存 GitHub → 网站同步</div></div></header><main class="wrap"><section class="card"><h2>🔐 连接网站</h2><div class="grid"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="需要 Contents 读写权限"></div></div><button class="btn red" id="load">一键读取整个网站</button><button class="btn gray" id="saveSettings">保存连接设置</button><a class="btn gold" href="../">打开网站</a><div class="status" id="status">尚未读取。</div></section><nav class="tabs"><button class="tab on" data-p="home">🏠 首页</button><button class="tab" data-p="groups">🗂️ 版块</button><button class="tab" data-p="content">📚 内容</button><button class="tab" data-p="style">🎨 视觉</button><button class="tab" data-p="images">🖼️ 首页图片</button><button class="tab" data-p="qr">📱 客服二维码</button></nav><section id="home" class="panel on"><div class="card"><h2>首页文字</h2><div class="grid"><div><label>网站名称</label><input id="siteName"></div><div><label>首页标题</label><input id="heroTitle"></div><div class="wide"><label>首页介绍</label><textarea id="heroText"></textarea></div><div class="wide"><label>顶部公告</label><textarea id="topNotice"></textarea></div></div><button class="btn gold" id="saveHome">保存首页</button></div><div class="card"><h2>首页公益咨询</h2><div class="grid"><div><label>标题</label><input id="consultTitle"></div><div><label>二维码下方文字</label><input id="qrLabel"></div><div class="wide"><label>咨询说明</label><textarea id="consultText"></textarea></div></div><button class="btn gold" id="saveConsult">保存咨询区域</button></div></section><section id="groups" class="panel"><div class="card"><h2>🗂️ 全部版块</h2><div id="groupList"></div></div><div class="card"><h2>➕ 新增版块</h2><div class="grid"><div><label>ID</label><input id="newId"></div><div><label>标题</label><input id="newTitle"></div><div class="wide"><label>说明</label><textarea id="newSub"></textarea></div></div><button class="btn red" id="addGroup">新增版块</button></div></section><section id="content" class="panel"><div class="card"><h2>📚 结构化内容</h2><label>收藏范围，一行一条</label><textarea id="scope"></textarea><label>日常交流内容，一行一条</label><textarea id="daily"></textarea><label>服务范围，一行一条</label><textarea id="range"></textarea><label>安全说明，一行一条</label><textarea id="security"></textarea><button class="btn gold" id="saveContent">保存内容</button></div></section><section id="style" class="panel"><div class="card"><h2>🎨 全站视觉</h2><div class="grid"><div><label>标题字体</label><input id="titleFont"></div><div><label>正文字体</label><input id="bodyFont"></div><div><label>主色</label><input id="primary" type="color"></div><div><label>金色</label><input id="accent" type="color"></div><div><label>标题颜色</label><input id="titleColor" type="color"></div><div><label>正文颜色</label><input id="bodyColor" type="color"></div></div><button class="btn gold" id="saveStyle">保存视觉</button></div></section><section id="images" class="panel"><div class="card"><h2>🖼️ 首页图片管理</h2><p class="hint">图片会真正显示在网站首页。可以上传、修改标题、修改说明、隐藏、删除。</p><input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><div id="imageList"></div></div></section><section id="qr" class="panel"><div class="card"><h2>📱 客服二维码</h2><p class="hint">当前仓库没有找到真实客服二维码图片。先用联系客服电话二维码保证首页可显示。若要使用真实微信客服二维码，可直接上传。</p><label>二维码说明</label><input id="qrText"><label>二维码内容</label><input id="qrData" placeholder="例如 tel:13799875350 或客服链接"><button class="btn gold" id="saveQr">保存二维码设置</button><div class="preview"><div id="qrPreview"></div><b>扫一扫联系客服</b></div><hr><input id="qrFile" type="file" accept="image/jpeg,image/png,image/webp"><button class="btn red" id="uploadQr">上传真实客服二维码</button></div></section></main><script>const $=id=>document.getElementById(id);let cfg=null,sha=null;const key='hsjc_admin';const enc=new TextEncoder();const b64=s=>{let a=enc.encode(s),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)};const dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));try{let x=JSON.parse(localStorage.getItem(key)||'{}');['owner','repo','branch','token'].forEach(k=>{if(x[k])$(k).value=x[k]})}catch{}function saveSettings(){localStorage.setItem(key,JSON.stringify({owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()}))}function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}async function api(path,opt={}){let t=$('token').value.trim();if(!t)throw Error('请填写 GitHub Token');let r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}}),txt=await r.text(),d={};try{d=JSON.parse(txt)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}async function get(path){return api(base()+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value.trim()||'main'))}async function put(path,text,blobSha,msg){let r=await api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,content:b64(text),branch:$('branch').value.trim()||'main',sha:blobSha})});return r.content?.sha}async function save(msg){sha=await put('data/site-config.json',JSON.stringify(cfg,null,2),sha,'洪盛收藏资讯网：'+msg);$('status').textContent='✅ '+msg+'，已发布到 GitHub'}function lines(id){return $(id).value.split('\n').map(x=>x.trim()).filter(Boolean)}function sync(){let q=cfg.consult||{},t=cfg.theme||{};$('siteName').value=cfg.siteName||'';$('heroTitle').value=cfg.heroTitle||'';$('heroText').value=cfg.heroText||'';$('topNotice').value=cfg.topNotice||'';$('consultTitle').value=q.title||'';$('consultText').value=q.text||'';$('qrLabel').value=q.qrLabel||'';$('scope').value=(cfg.collectionScope||[]).join('\n');$('daily').value=(cfg.dailyContent||[]).join('\n');$('range').value=(cfg.serviceRange||[]).join('\n');$('security').value=(cfg.security||[]).join('\n');$('titleFont').value=t.titleFont||'';$('bodyFont').value=t.bodyFont||'';$('primary').value=t.primary||'#7a2a20';$('accent').value=t.accent||'#b99355';$('titleColor').value=t.titleColor||'#741912';$('bodyColor').value=t.bodyColor||'#2b2723';$('qrText').value=q.qrLabel||'📱 扫一扫联系客服';$('qrData').value=q.qrData||'tel:'+(cfg.phone||'13799875350');renderGroups();renderImages();previewQR()}function renderGroups(){let a=Object.entries(cfg.groups||{});$('groupList').innerHTML=a.map(([id,g])=>'<div class="row"><span><b>'+E(g.title||id)+'</b><br><small>'+E(g.subtitle||'')+'</small></span><span><button class="btn gold" onclick="editGroup(\''+id+'\')">修改</button><button class="btn danger" onclick="disableGroup(\''+id+'\')">停用</button></span></div>').join('')||'<div class="status">暂无版块</div>'}window.editGroup=async id=>{let g=cfg.groups[id],t=prompt('版块标题',g.title||id);if(t===null)return;let s=prompt('版块说明',g.subtitle||'');if(s===null)return;g.title=t.trim()||g.title;g.subtitle=s;(cfg.nav||[]).filter(x=>x.id===id).forEach(x=>x.name=g.title);await save('修改版块')};window.disableGroup=async id=>{if(!confirm('停用该版块？资料不会删除。'))return;cfg.groups[id].enabled=false;(cfg.nav||[]).filter(x=>x.id===id).forEach(x=>x.enabled=false);await save('停用版块')};$('addGroup').onclick=async()=>{let id=$('newId').value.trim(),t=$('newTitle').value.trim();if(!/^[A-Za-z0-9_]+$/.test(id)||!t)return alert('请填写正确 ID 和标题');if(cfg.groups?.[id])return alert('ID 已存在');cfg.groups=cfg.groups||{};cfg.groups[id]={title:t,subtitle:$('newSub').value.trim(),enabled:true,items:[]};cfg.nav=cfg.nav||[];cfg.nav.push({id,name:t,enabled:true});await save('新增版块')};$('saveHome').onclick=async()=>{cfg.siteName=$('siteName').value.trim();cfg.heroTitle=$('heroTitle').value.trim();cfg.heroText=$('heroText').value;cfg.topNotice=$('topNotice').value;await save('修改首页文字')};$('saveConsult').onclick=async()=>{cfg.consult=cfg.consult||{};cfg.consult.title=$('consultTitle').value.trim();cfg.consult.text=$('consultText').value;cfg.consult.qrLabel=$('qrLabel').value.trim();cfg.consult.qrData=$('qrData').value.trim()||'tel:'+(cfg.phone||'13799875350');await save('修改公益咨询与二维码')};$('saveContent').onclick=async()=>{cfg.collectionScope=lines('scope');cfg.dailyContent=lines('daily');cfg.serviceRange=lines('range');cfg.security=lines('security');await save('修改结构化内容')};$('saveStyle').onclick=async()=>{cfg.theme=cfg.theme||{};Object.assign(cfg.theme,{titleFont:$('titleFont').value,bodyFont:$('bodyFont').value,primary:$('primary').value,accent:$('accent').value,titleColor:$('titleColor').value,bodyColor:$('bodyColor').value});await save('修改全站视觉')};function renderImages(){let a=cfg.homepageImages||[];$('imageList').innerHTML=a.length?a.map((x,i)=>'<div class="row"><img src="'+E(x.url)+'"><span style="flex:1"><input id="it'+i+'" value="'+E(x.title||'')+'"><textarea id="id'+i+'" placeholder="图片说明">'+E(x.description||'')+'</textarea></span><span><button class="btn gold" onclick="editImage('+i+')">保存文字</button><button class="btn gray" onclick="toggleImage('+i+')">'+(x.enabled===false?'显示':'隐藏')+'</button><button class="btn danger" onclick="removeImage('+i+')">删除</button></span></div>').join(''):'<div class="status">目前没有首页图片。选择图片后即可上传。</div>'}window.editImage=async i=>{cfg.homepageImages[i].title=$('it'+i).value;cfg.homepageImages[i].description=$('id'+i).value;await save('修改首页图片内容');renderImages()};window.toggleImage=async i=>{cfg.homepageImages[i].enabled=cfg.homepageImages[i].enabled===false;await save('修改首页图片显示状态');renderImages()};window.removeImage=async i=>{if(!confirm('从首页移除这张图片？'))return;cfg.homepageImages.splice(i,1);await save('删除首页图片记录');renderImages()};$('files').onchange=async e=>{if(e.target.files.length)await uploadImages(e.target.files)};async function uploadImages(files){for(const f of files){if(f.size>5*1024*1024){alert(f.name+' 超过 5MB');continue}let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});let raw=data.split(',')[1],path='static/home/'+Date.now()+'-'+f.name.replace(/[^\w.\-\u4e00-\u9fff]/g,'_');await api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛收藏资讯网：上传首页图片',content:raw,branch:$('branch').value.trim()||'main'})});cfg.homepageImages=cfg.homepageImages||[];cfg.homepageImages.push({url:path,title:f.name.replace(/\.[^.]+$/,''),description:'',enabled:true,order:cfg.homepageImages.length})}await save('上传首页图片');renderImages()}function previewQR(){let d=encodeURIComponent($('qrData').value||'tel:13799875350');$('qrPreview').innerHTML='<img style="width:220px;height:220px" src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data='+d+'&t='+Date.now()+'" alt="联系客服二维码">'}$('qrData').oninput=previewQR;$('saveQr').onclick=async()=>{cfg.consult=cfg.consult||{};cfg.consult.qrLabel=$('qrText').value.trim()||'📱 扫一扫联系客服';cfg.consult.qrData=$('qrData').value.trim()||'tel:'+(cfg.phone||'13799875350');await save('保存客服二维码设置')};$('uploadQr').onclick=async()=>{let f=$('qrFile').files[0];if(!f)return alert('请先选择客服二维码图片');let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)});let raw=data.split(',')[1],path='static/qr-service.png',old=await get(path);await api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛收藏资讯网：更新客服二维码',content:raw,branch:$('branch').value.trim()||'main',sha:old.sha})});cfg.consult=cfg.consult||{};cfg.consult.qr=path;await save('上传真实客服二维码');alert('真实客服二维码已发布')};$('load').onclick=async()=>{try{saveSettings();let f=await get('data/site-config.json');sha=f.sha;let raw=JSON.parse(dec(f.content));cfg=typeof raw.content==='string'?JSON.parse(raw.content):raw;sync();$('status').textContent='✅ 已读取整个网站：'+Object.keys(cfg.groups||{}).length+' 个版块、'+(cfg.homepageImages||[]).length+' 张首页图片'}catch(e){$('status').textContent='❌ '+e.message}};$('saveSettings').onclick=saveSettings;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.p).classList.add('on')});</script></body></html>
