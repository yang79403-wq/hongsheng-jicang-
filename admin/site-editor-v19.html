<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛收藏资讯网｜全站网站编辑发布系统 V19</title><style>body{margin:0;background:#f5eee5;color:#302721;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1400px,96vw);margin:auto}.head{background:linear-gradient(135deg,#350604,#75170f);color:#f6d985;padding:18px}.bar,.tabs,.actions{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.card{background:#fffdf9;border:1px solid #dfcdae;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.wide{grid-column:1/-1}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8c8b5;border-radius:8px;background:#fff;font:inherit}textarea{min-height:110px}.btn{border:0;border-radius:8px;padding:9px 12px;font-weight:800;cursor:pointer}.red{background:#68100a;color:#fff}.gold{background:#d6b35b;color:#32130d}.green{background:#2f6b3b;color:#fff}.blue{background:#315b82;color:#fff}.gray{background:#756a63;color:#fff}.danger{background:#a62a20;color:#fff}.tab{border:1px solid #dfcdae;background:#fff9f0;border-radius:999px;padding:9px 13px;font-weight:800}.tab.on{background:#68100a;color:#fff}.panel{display:none}.panel.on{display:block}.status{padding:10px;border-radius:8px;background:#f8efe4;margin-top:8px}.ok{background:#e8f5e9;color:#245d2b}.warn{background:#fff5dd;border:1px solid #dfc18a}.row{padding:10px;border:1px solid #eadfce;background:#fffaf3;border-radius:9px;margin:7px 0}.muted{font-size:12px;color:#766b63}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.pic{border:1px solid #dfcdae;border-radius:8px;padding:7px;background:#fff}.pic img{width:100%;height:130px;object-fit:contain;background:#eee6db}.preview{background:#fff;border:1px solid #ddd1c0;border-radius:9px;padding:16px;line-height:1.85}.preview img{max-width:100%;display:block;margin:14px auto}.list{max-height:620px;overflow:auto}.small{font-size:12px}@media(max-width:760px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛收藏资讯网 · 全站网站编辑发布系统 V19</h1><div>统一管理：首页｜版块｜文章｜图片｜页面文件｜发布｜删除｜转移｜备份</div></div></header><main class="wrap"><section class="card"><div class="grid"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="只在当前页面使用"></div></div><div class="actions"><button class="btn red" onclick="loadSite()">🔄 一键读取整个网站</button><button class="btn gold" onclick="loadSite()">♻️ 刷新真实数据</button><a class="btn blue" href="../" target="_blank">🌐 打开网站</a></div><div id="status" class="status">请先读取网站</div></section><div class="tabs"><button class="tab on" onclick="tab('home',this)">🏠 首页</button><button class="tab" onclick="tab('content',this)">📰 全部内容</button><button class="tab" onclick="tab('groups',this)">🗂️ 版块</button><button class="tab" onclick="tab('media',this)">🖼️ 图片</button><button class="tab" onclick="tab('files',this)">📄 页面/文件</button><button class="tab" onclick="tab('data',this)">🧰 数据</button></div><section id="home" class="panel on"><div class="card"><h2>🏠 首页与网站信息</h2><div class="grid"><div><label>网站名称</label><input id="siteName"></div><div><label>联系电话</label><input id="phone"></div><div><label>首页标题</label><input id="heroTitle"></div><div><label>顶部公告</label><input id="notice"></div><div class="wide"><label>首页介绍</label><textarea id="heroText"></textarea></div><div><label>SEO 标题</label><input id="seoTitle"></div><div><label>SEO 描述</label><textarea id="seoDesc"></textarea></div><div><label>关键词</label><input id="seoKeywords"></div><div><label>主色</label><input id="primary"></div></div><button class="btn gold" onclick="saveConfig()">💾 保存首页配置并发布</button><div class="status">二维码、首页图片等实际资源建议通过“图片中心”上传，再把路径写入对应配置或页面。</div></div></section><section id="content" class="panel"><div class="card"><h2>📰 全站内容中心</h2><div class="grid"><div><label>搜索全站内容</label><input id="q" oninput="renderAll()" placeholder="标题、正文、ID、版块"></div><div><label>状态</label><select id="filter" onchange="renderAll()"><option value="all">全部</option><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">隐藏</option></select></div></div><div id="allList" class="list"></div></div><div class="card"><h2 id="editorTitle">✍️ 新建内容</h2><div class="grid"><div><label>ID</label><input id="cid" placeholder="新建可留空"></div><div><label>标题</label><input id="ctitle"></div><div><label>日期</label><input id="cdate" type="date"></div><div><label>分类</label><input id="ckind"></div><div><label>所属版块</label><select id="cgroup" onchange="mapEditorLib()"></select></div><div><label>内容库</label><select id="clib"></select></div><div><label>状态</label><select id="cstatus"><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">隐藏</option></select></div><div><label>标签</label><input id="ctags"></div><div class="wide"><label>摘要</label><textarea id="cnote"></textarea></div><div class="wide"><label>正文</label><textarea id="cbody" style="min-height:380px" placeholder="把光标放在需要插入照片的位置"></textarea></div></div><div class="actions"><button class="btn green" onclick="createContent()">➕ 新建并发布</button><button class="btn gold" onclick="updateContent()">💾 保存修改并更新</button><button class="btn blue" onclick="moveContent()">↔️ 转移到其他版块</button><button class="btn red" onclick="republish()">🚀 重新发布</button><button class="btn gray" onclick="unpublish()">⏸️ 下架</button><button class="btn danger" onclick="deleteContent()">🗑️ 删除</button><button class="btn gray" onclick="newContent()">🆕 新建空白</button></div><div id="editStatus" class="status">当前为新建模式</div></div><div class="card"><h2>👁️ 发布前预览</h2><div id="preview" class="preview">暂无</div></div></section><section id="groups" class="panel"><div class="card"><h2>🗂️ 全站版块管理</h2><div id="groupsList"></div></div><div class="card"><h2>➕ 新增版块</h2><div class="grid"><input id="gid" placeholder="版块ID，例如 fujian"><input id="gtitle" placeholder="版块名称"><textarea id="gsub" placeholder="版块说明"></textarea><select id="gtype"><option value="content">data/content</option><option value="market">data/market</option></select></div><button class="btn red" onclick="createGroup()">创建版块并建立内容库</button></div></section><section id="media" class="panel"><div class="card"><h2>🖼️ 图片中心</h2><div class="warn">支持 JPG、PNG、WEBP、GIF。单张建议不超过8MB。上传后选择图片，再把正文光标放到具体位置，点击“插入当前光标”。</div><input id="photos" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><button class="btn gold" onclick="uploadImages()">⬆️ 上传图片到网站</button><div id="gallery" class="gallery"></div><div class="actions"><button class="btn gold" onclick="insertImage('before')">正文开头</button><button class="btn red" onclick="insertImage('cursor')">当前光标位置</button><button class="btn gold" onclick="insertImage('after')">正文末尾</button></div></div></section><section id="files" class="panel"><div class="card"><h2>📄 页面/文件编辑</h2><div class="grid"><input id="fpath" placeholder="例如 pages/about.html"><select id="ftype"><option>html</option><option>css</option><option>js</option><option>json</option><option>md</option><option>txt</option></select></div><div class="actions"><button class="btn blue" onclick="readFile()">📂 读取</button><button class="btn gold" onclick="saveFile()">💾 保存/更新</button><button class="btn red" onclick="createFile()">➕ 创建</button><button class="btn danger" onclick="removeFile()">🗑️ 删除</button></div><textarea id="feditor" style="min-height:550px;font-family:monospace"></textarea><div id="fileStatus" class="status"></div></div></section><section id="data" class="panel"><div class="card"><h2>🧰 JSON 数据中心</h2><select id="jfile"></select><textarea id="jeditor" style="min-height:550px;font-family:monospace"></textarea><div class="actions"><button class="btn blue" onclick="readJson()">读取</button><button class="btn gold" onclick="saveJson()">保存 JSON</button><button class="btn gray" onclick="formatJson()">格式化</button></div></div></section></main><script>const $=id=>document.getElementById(id);let cfg={},groups={},libs=[],all=[],editing=null,selectedImage='',fileSha='',jsonMap={};const enc=new TextEncoder();const b64=s=>{let a=enc.encode(s),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0))),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}async function api(p,o={}){let t=$('token').value.trim();if(!t)throw Error('请填写 GitHub Token');let r=await fetch('https://api.github.com'+p,{...o,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json',...(o.headers||{})}}),d=await r.json();if(!r.ok)throw Error((d.message||'GitHub请求失败')+'（'+r.status+'）');return d}async function get(p){return api(base()+'/contents/'+p+'?ref='+encodeURIComponent($('branch').value||'main'))}async function put(p,text,sha,msg){let o={message:'洪盛收藏资讯网：'+msg,content:b64(text),branch:$('branch').value||'main'};if(sha)o.sha=sha;return api(base()+'/contents/'+p,{method:'PUT',body:JSON.stringify(o)})}function tab(id,b){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));$(id).classList.add('on');b.classList.add('on')}async function loadSite(){try{$('status').textContent='正在读取真实网站数据…';let f=await get('data/site-config.json');cfg=JSON.parse(dec(f.content));for(let i=0;i<5&&cfg&&typeof cfg.content==='string';i++){try{cfg=JSON.parse(cfg.content)}catch{break}}groups=cfg.groups||{};fillGroups();let c=await api(base()+'/contents/data/content?ref='+$('branch').value),m=[];try{m=await api(base()+'/contents/data/market?ref='+$('branch').value)}catch{};libs=[];(Array.isArray(c)?c:[]).filter(x=>x.type==='file'&&x.name.endsWith('.json')).forEach(x=>libs.push({path:'data/content/'+x.name,name:x.name,type:'content'}));(Array.isArray(m)?m:[]).filter(x=>x.type==='file'&&x.name.endsWith('.json')).forEach(x=>libs.push({path:'data/market/'+x.name,name:x.name,type:'market'}));all=[];for(const l of libs){try{let x=await get(l.path),a=JSON.parse(dec(x.content));if(Array.isArray(a))a.forEach((v,i)=>all.push({...v,__path:l.path,__sha:x.sha,__index:i,__type:l.type}))}catch{}}renderAll();fillJson();homeFields();$('status').className='status ok';$('status').textContent='✅ 全站读取完成：'+Object.keys(groups).length+' 个版块，'+libs.length+' 个内容库，'+all.length+' 篇内容'}catch(e){$('status').textContent='❌ '+e.message}}function fillGroups(){let h=Object.entries(groups).map(([id,g])=>'<option value="'+esc(id)+'">'+esc(g.title||id)+'</option>').join('');$('cgroup').innerHTML=h;$('groupsList').innerHTML=Object.entries(groups).map(([id,g])=>'<div class="row"><b>'+esc(g.title||id)+'</b><div class="muted">ID：'+esc(id)+' · '+esc(g.sub||g.description||'')+'</div><div class="actions"><button class="btn gold" onclick="editGroup(\''+esc(id)+'\')">✏️ 修改</button><button class="btn blue" onclick="moveGroup(\''+esc(id)+'\')">↕️ 调整顺序</button><button class="btn danger" onclick="deleteGroup(\''+esc(id)+'\')">🗑️ 删除版块</button></div></div>').join('')||'<div class="warn">未读取到版块。</div>';mapEditorLib()}function mapped(gid){let g=groups[gid]||{},it=(g.items||[])[0];if(it){let z=libs.find(x=>x.name===it.id+'.json');if(z)return z.path}let z=libs.find(x=>x.name===gid+'.json');return z?.path||''}function mapEditorLib(){let p=mapped($('cgroup').value);$('clib').innerHTML=libs.map(x=>'<option value="'+esc(x.path)+'" '+(x.path===p?'selected':'')+'>'+esc(x.path)+'</option>').join('')}function renderAll(){let q=($('q').value||'').toLowerCase(),st=$('filter').value,a=all.filter(x=>(st==='all'||(x.status||'draft')===st)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('allList').innerHTML=a.map((x)=>'<div class="row"><b>'+esc(x.title||x.id)+'</b><div class="muted">版块：'+esc(groups[x.groupId]?.title||x.groupName||x.groupId||'未指定')+' · '+esc(x.status||'draft')+' · '+esc(x.__path)+'</div><div class="actions"><button class="btn gold" onclick="editContent(\''+esc(x.id)+'\',\''+esc(x.__path)+'\')">✏️ 编辑</button><button class="btn blue" onclick="quickMove(\''+esc(x.id)+'\',\''+esc(x.__path)+'\')">↔️ 转移</button><button class="btn green" onclick="quickPublish(\''+esc(x.id)+'\',\''+esc(x.__path)+'\')">🚀 发布</button><button class="btn danger" onclick="quickDelete(\''+esc(x.id)+'\',\''+esc(x.__path)+'\')">🗑️ 删除</button></div></div>').join('')||'<div class="warn">没有匹配内容。</div>'}function findRec(id,p){return all.find(x=>x.id===id&&x.__path===p)}function editContent(id,p){let x=findRec(id,p);if(!x)return;editing={id,p,sha:x.__sha};$('cid').value=x.id||'';$('ctitle').value=x.title||'';$('cdate').value=x.date||'';$('ckind').value=x.kind||'';$('cstatus').value=x.status||'published';$('ctags').value=Array.isArray(x.tags)?x.tags.join(','):x.tags||'';$('cnote').value=x.note||'';$('cbody').value=x.content||'';$('cgroup').value=x.groupId||Object.keys(groups)[0]||'';mapEditorLib();$('editStatus').textContent='✏️ 正在编辑：'+(x.title||x.id)+' · '+p;tab('content',document.querySelectorAll('.tab')[1]);preview()}function newContent(){editing=null;['cid','ctitle','cdate','ckind','ctags','cnote','cbody'].forEach(i=>$(i).value='');$('cstatus').value='published';$('cgroup').value=Object.keys(groups)[0]||'';mapEditorLib();$('editStatus').textContent='➕ 新建模式';preview()}function obj(){let gid=$('cgroup').value,g=groups[gid]||{};return {id:$('cid').value.trim()||'article_'+Date.now(),title:$('ctitle').value.trim(),date:$('cdate').value||new Date().toISOString().slice(0,10),kind:$('ckind').value,note:$('cnote').value,content:$('cbody').value,status:$('cstatus').value,groupId:gid,groupName:g.title||gid,tags:$('ctags').value.split(',').map(x=>x.trim()).filter(Boolean)}}async function createContent(){let o=obj();if(!o.title)return alert('请输入标题');let p=$('clib').value;if(!p)return alert('请选择版块/内容库');let f=await get(p),a=JSON.parse(dec(f.content));if(!Array.isArray(a))a=[];if(a.some(x=>x.id===o.id))o.id=o.id+'_'+Date.now();a.push(o);await put(p,JSON.stringify(a,null,2),f.sha,'新建并发布内容');await loadSite();editContent(o.id,p);alert('✅ 已发布到：'+o.groupName)}async function updateContent(){if(!editing)return createContent();let o=obj();o.id=editing.id;if($('clib').value!==editing.p)return moveContent();let f=await get(editing.p),a=JSON.parse(dec(f.content));let i=a.findIndex(x=>x.id===editing.id);if(i<0)return alert('原内容已不存在，请重新读取网站');a[i]=o;await put(editing.p,JSON.stringify(a,null,2),f.sha,'编辑并更新内容');await loadSite();editContent(o.id,editing.p)}async function moveContent(){if(!editing)return alert('请先选择已发布内容');let o=obj(),src=editing.p,dst=$('clib').value;if(src===dst)return updateContent();let sf=await get(src),sa=JSON.parse(dec(sf.content)),i=sa.findIndex(x=>x.id===editing.id);if(i<0)return alert('原内容不存在');let df=await get(dst),da=JSON.parse(dec(df.content));if(da.some(x=>x.id===editing.id))return alert('目标内容库已有相同ID');sa.splice(i,1);o.id=editing.id;da.push(o);await put(dst,JSON.stringify(da,null,2),df.sha,'转移内容至目标版块');await put(src,JSON.stringify(sa,null,2),sf.sha,'从原版块移出内容');await loadSite();alert('✅ 内容已转移到：'+o.groupName)}async function quickMove(id,p){editContent(id,p);alert('请在编辑区选择新的所属版块和内容库，然后点击“转移到其他版块”。')}async function quickPublish(id,p){let x=findRec(id,p);if(!x)return;let f=await get(p),a=JSON.parse(dec(f.content)),i=a.findIndex(v=>v.id===id);a[i].status='published';await put(p,JSON.stringify(a,null,2),f.sha,'重新发布内容');await loadSite()}async function quickDelete(id,p){if(!confirm('确定永久删除？'))return;let f=await get(p),a=JSON.parse(dec(f.content));a=a.filter(v=>v.id!==id);await put(p,JSON.stringify(a,null,2),f.sha,'删除内容');await loadSite()}async function republish(){if(!editing)return alert('请选择内容');$('cstatus').value='published';await updateContent()}async function unpublish(){if(!editing)return alert('请选择内容');$('cstatus').value='draft';await updateContent()}async function deleteContent(){if(!editing)return alert('请选择内容');await quickDelete(editing.id,editing.p);editing=null;newContent()}async function uploadImages(){let fs=[...$('photos').files];if(!fs.length)return alert('请选择图片');let out=[];for(let f of fs){if(f.size>8*1024*1024)return alert('单张图片不能超过8MB');let a=new Uint8Array(await f.arrayBuffer()),s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));let d=new Date(),p='static/uploads/'+d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/img_'+Date.now()+'_'+Math.random().toString(36).slice(2,8)+f.name.substring(f.name.lastIndexOf('.'));await api(base()+'/contents/'+p,{method:'PUT',body:JSON.stringify({message:'上传网站图片',content:btoa(s),branch:$('branch').value||'main'})});out.push('https://yang79403-wq.github.io/'+p)}$('gallery').innerHTML=out.map(u=>'<div class="pic"><img src="'+u+'"><button class="btn gold" onclick="selectImage('+JSON.stringify(u)+')">选择此图</button><div class="small">'+esc(u)+'</div></div>').join('');$('status').textContent='✅ 图片已上传，请选择图片并插入正文'}function selectImage(u){selectedImage=u;$('status').textContent='🖼️ 已选择图片：请把光标放入正文'}function insertImage(pos){if(!selectedImage)return alert('请先上传并选择图片');let t=$('cbody'),s=t.selectionStart||0,e=t.selectionEnd||0,m='\n\n【图片:'+selectedImage.split('/').pop()+'】\n'+selectedImage+'\n【/图片】\n\n';if(pos==='before')t.value=m+t.value;else if(pos==='after')t.value+=m;else t.value=t.value.slice(0,s)+m+t.value.slice(e);preview()}function preview(){let c=esc($('cbody').value||'').replace(/【图片:[^\]]+】\n([^\n]+)\n【\/图片】/g,(m,u)=>'<img src="'+esc(u)+'">').replace(/\n/g,'<br>');$('preview').innerHTML='<h2>'+esc($('ctitle').value||'文章标题')+'</h2>'+c}$('cbody').addEventListener('input',preview);$('ctitle').addEventListener('input',preview);function homeFields(){let h=cfg.home||cfg.hero||{};$('siteName').value=cfg.siteName||cfg.name||'';$('phone').value=cfg.phone||cfg.contactPhone||'';$('heroTitle').value=h.title||cfg.heroTitle||'';$('heroText').value=h.text||cfg.heroText||'';$('notice').value=cfg.notice||cfg.topNotice||'';$('seoTitle').value=cfg.seo?.title||cfg.seoTitle||'';$('seoDesc').value=cfg.seo?.description||cfg.seoDesc||'';$('seoKeywords').value=cfg.seo?.keywords||cfg.seoKeywords||'';$('primary').value=cfg.theme?.primary||''}async function saveConfig(){let f=await get('data/site-config.json');let x=JSON.parse(dec(f.content));x.siteName=$('siteName').value;x.phone=$('phone').value;x.notice=$('notice').value;x.hero=x.hero||{};x.hero.title=$('heroTitle').value;x.hero.text=$('heroText').value;x.seo=x.seo||{};x.seo.title=$('seoTitle').value;x.seo.description=$('seoDesc').value;x.seo.keywords=$('seoKeywords').value;await put('data/site-config.json',JSON.stringify(x,null,2),f.sha,'更新首页与SEO');await loadSite();alert('✅ 首页配置已更新')}async function createGroup(){let id=$('gid').value.trim(),title=$('gtitle').value.trim();if(!id||!title)return alert('填写版块ID和名称');if(groups[id])return alert('版块ID已存在');let f=await get('data/site-config.json'),x=JSON.parse(dec(f.content));x.groups=x.groups||{};x.groups[id]={title,sub:$('gsub').value,items:[]};await put('data/site-config.json',JSON.stringify(x,null,2),f.sha,'新增网站版块');let p='data/'+$('gtype').value+'/'+id+'.json';try{await get(p);alert('版块已存在内容库')}catch{await put(p,'[]',null,'创建版块内容库')}await loadSite();tab('groups',document.querySelectorAll('.tab')[2])}async function editGroup(id){let g=groups[id]||{},title=prompt('修改版块名称：',g.title||id);if(title===null)return;let sub=prompt('修改版块说明：',g.sub||g.description||'');let f=await get('data/site-config.json'),x=JSON.parse(dec(f.content));x.groups[id]=x.groups[id]||{};x.groups[id].title=title;x.groups[id].sub=sub;await put('data/site-config.json',JSON.stringify(x,null,2),f.sha,'修改版块');await loadSite()}async function deleteGroup(id){if(!confirm('删除版块导航？不会自动删除文章。'))return;let f=await get('data/site-config.json'),x=JSON.parse(dec(f.content));delete x.groups[id];await put('data/site-config.json',JSON.stringify(x,null,2),f.sha,'删除版块导航');await loadSite()}async function moveGroup(id){alert('版块顺序由 site-config.json 的 groups 顺序决定。可在数据中心调整 groups 顺序后保存。')}async function readFile(){let p=$('fpath').value.trim();if(!p)return;let f=await get(p);fileSha=f.sha;$('feditor').value=dec(f.content);$('fileStatus').textContent='已读取：'+p}async function saveFile(){let p=$('fpath').value.trim();if(!p||!fileSha)return alert('先读取文件');await put(p,$('feditor').value,fileSha,'更新网站文件');$('fileStatus').textContent='✅ 已保存：'+p}async function createFile(){let p=$('fpath').value.trim();if(!p)return alert('填写路径');try{await get(p);return alert('文件已存在，请使用保存/更新')}catch{}await put(p,$('feditor').value,'','创建网站文件');$('fileStatus').textContent='✅ 已创建：'+p}async function removeFile(){let p=$('fpath').value.trim();if(!p||!fileSha)return alert('先读取文件');if(!confirm('确定删除文件？'))return;await api(base()+'/contents/'+p,{method:'DELETE',body:JSON.stringify({message:'删除网站文件',sha:fileSha,branch:$('branch').value||'main'})});$('feditor').value='';fileSha='';$('fileStatus').textContent='✅ 已删除：'+p}async function fillJson(){let fs=[...libs.map(x=>x.path),'data/site-config.json'];$('jfile').innerHTML=fs.map(x=>'<option>'+esc(x)+'</option>').join('');await readJson()}async function readJson(){let p=$('jfile').value;if(!p)return;let f=await get(p);jsonMap[p]=f.sha;$('jeditor').value=dec(f.content)}async function saveJson(){let p=$('jfile').value;if(!p)return;let f=await get(p);let text=$('jeditor').value;try{JSON.parse(text)}catch{return alert('JSON格式错误')}await put(p,text,f.sha,'保存JSON数据');await loadSite()}function formatJson(){try{$('jeditor').value=JSON.stringify(JSON.parse($('jeditor').value),null,2)}catch{alert('JSON格式错误')}}</script></body></html>
