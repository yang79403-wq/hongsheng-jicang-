<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜全站 CMS V9</title><style>:root{--r:#741912;--g:#b99355;--bg:#f7efe3;--paper:#fffaf3;--ink:#302821;--line:#ddc9aa;--ok:#237044;--blue:#315f86;--danger:#9d2b20}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:linear-gradient(135deg,#610d08,#8d2418);color:#f7d995;padding:20px}.wrap{max-width:1400px;width:95%;margin:auto}.nav{display:flex;gap:8px;flex-wrap:wrap;padding:14px 0}.nav button{width:auto}.panel{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border:1px solid #dfd0bc;border-radius:10px;padding:12px}input,select,textarea,button{width:100%;padding:10px;border:1px solid #cdbb9f;border-radius:8px;font:inherit}button{background:var(--r);color:#fff;font-weight:800;cursor:pointer}.gold{background:#9b7941}.green{background:var(--ok)}.blue{background:var(--blue)}.danger{background:var(--danger)}.light{background:#e9dcc7;color:var(--ink)}textarea{min-height:160px}.status{margin-top:10px;padding:10px;background:#f0e4d2;border-radius:8px;white-space:pre-wrap}.hide{display:none}.muted{font-size:12px;color:#756b61}.stat{background:#fff;border:1px solid var(--line);padding:16px;border-radius:12px}.stat b{font-size:30px;display:block}.thumb{max-width:180px;max-height:140px;object-fit:contain;border:1px solid #ddd;margin:5px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1}.log{background:#24130f;color:#f4dfb2;padding:10px;white-space:pre-wrap;max-height:240px;overflow:auto;font:12px monospace}.editor{border:2px solid var(--g);padding:14px;border-radius:10px;background:#fffdf9}@media(max-width:800px){.grid,.cards{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><h1>🏮 洪盛集藏 · 全站 CMS V9</h1><div>首页 · 版块 · 文章 · 图片 · 本地资料 · 发布 · 修改 · 转移 · 删除 · 回收站 · GitHub同步</div></div></header><main class="wrap"><div class="nav"><button onclick="show('dash')">📊 总览</button><button onclick="show('local')">📁 本地资料</button><button onclick="show('articles')">📝 全站文章</button><button onclick="show('new')">➕ 发布新内容</button><button onclick="show('sections')">🏮 版块管理</button><button onclick="show('home')">🏠 首页管理</button><button onclick="show('images')">🖼️ 图片库</button><button onclick="show('trash')">🗑️ 回收站</button><button onclick="show('settings')">⚙️ 设置</button></div><section id="dash" class="panel"><h2>📊 网站内容总览</h2><div class="grid"><div class="stat">文章<b id="nArticles">0</b></div><div class="stat">版块<b id="nSections">0</b></div><div class="stat">图片<b id="nImages">0</b></div></div><button class="gold" onclick="refreshAll()">🔄 刷新全站数据</button><div id="dashMsg" class="status">正在准备。</div></section><section id="local" class="panel hide"><h2>📁 本地资料库</h2><input id="files" type="file" multiple accept=".txt,.md,.csv,.json,.html,.htm,.xml,image/*" onchange="readLocal(this.files)"><p class="muted">电脑选择多个文件即可。图片可作为正文图片，文字文件可生成文章。</p><div id="localList" class="cards"></div><button class="gold" onclick="publishLocal()">🚀 将选中文本/图片发布到网站</button></section><section id="articles" class="panel hide"><h2>📝 全站文章管理</h2><div class="grid"><select id="sec" onchange="loadArticles()"></select><input id="search" placeholder="搜索标题/正文" oninput="renderArticles()"><button class="blue" onclick="loadArticles()">🔄 读取当前版块</button></div><div id="articleList" class="cards"></div><div id="articleMsg" class="status">点击读取。</div></section><section id="new" class="panel hide"><h2>➕ 发布新内容</h2><div class="grid"><select id="newSec"></select><select id="newKind"><option>收藏知识</option><option>鉴赏参考</option><option>历史研究</option><option>版别研究</option><option>市场行情资料</option><option>福建钱币资料</option><option>评级知识</option><option>藏品展示</option></select><input id="newTitle" placeholder="标题"></div><textarea id="newSummary" placeholder="摘要"></textarea><textarea id="newBody" placeholder="正文"></textarea><input id="newImgs" type="file" multiple accept="image/*"><button class="green" onclick="createArticle()">🚀 发布新内容</button><div id="newMsg" class="status"></div></section><section id="sections" class="panel hide"><h2>🏮 版块管理</h2><div id="sectionList" class="cards"></div><div class="row"><input id="addId" placeholder="新版块ID"><input id="addName" placeholder="新版块名称"><button class="green" onclick="addSection()">➕ 新增版块</button></div><div id="sectionMsg" class="status"></div></section><section id="home" class="panel hide"><h2>🏠 首页管理</h2><div class="grid"><input id="siteName" placeholder="网站名称"><input id="heroTitle" placeholder="首页标题"><input id="phone" placeholder="电话"></div><textarea id="heroText" placeholder="首页介绍"></textarea><textarea id="notice" placeholder="顶部公告"></textarea><textarea id="configJson" placeholder="完整 site-config.json"></textarea><div class="row"><button class="blue" onclick="loadHome()">读取首页</button><button class="green" onclick="saveHome()">💾 保存首页</button></div><div id="homeMsg" class="status"></div></section><section id="images" class="panel hide"><h2>🖼️ 网站图片库</h2><input id="upload" type="file" multiple accept="image/*" onchange="uploadImages(this.files)"><div id="imageList" class="cards"></div><div id="imageMsg" class="status"></div></section><section id="trash" class="panel hide"><h2>🗑️ 回收站</h2><div id="trashList" class="cards"></div><div class="row"><button class="blue" onclick="loadTrash()">刷新</button><button class="danger" onclick="emptyTrash()">彻底清空</button></div><div id="trashMsg" class="status"></div></section><section id="settings" class="panel hide"><h2>⚙️ GitHub连接</h2><div class="grid"><input id="repo" value="yang79403-wq/yang79403-wq.github.io"><input id="branch" value="main"><input id="token" type="password" placeholder="github_pat_..."></div><div class="muted">Token仅保存在当前浏览器 sessionStorage，不写入网站文件。</div><div class="row"><button onclick="testToken()">🔐 检查Token</button><button class="light" onclick="sessionStorage.removeItem('hs_token')">清除Token</button></div><div id="tokenMsg" class="status"></div><div id="log" class="log"></div></section></main><script>
const API='https://api.github.com';let secs=[],files=[],arts=[],shaMap={};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));function token(){return $('token').value||sessionStorage.getItem('hs_token')||''}function enc(s){return btoa(unescape(encodeURIComponent(s)))}function dec(s){return decodeURIComponent(escape(atob(s.replace(/\n/g,''))))}function log(s){$('log').textContent+=new Date().toLocaleTimeString()+' '+s+'\n'}async function api(path,opt={}){let h={Accept:'application/vnd.github+json'};if(token())h.Authorization='Bearer '+token();let r=await fetch(API+path,{...opt,headers:{...h,...(opt.headers||{})},cache:'no-store'});let j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.message||('HTTP '+r.status));return j}async function readFile(path){return api('/repos/'+$('repo').value+'/contents/'+path+'?ref='+$('branch').value)}async function writeFile(path,text,sha,msg){let body={message:msg,content:enc(text),branch:$('branch').value};if(sha)body.sha=sha;return api('/repos/'+$('repo').value+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}async function list(path){return api('/repos/'+$('repo').value+'/contents/'+path+'?ref='+$('branch').value)}function show(id){document.querySelectorAll('main>section').forEach(x=>x.classList.add('hide'));$(id).classList.remove('hide');if(id==='articles')loadArticles();if(id==='sections')renderSections();if(id==='home')loadHome();if(id==='images')loadImages();if(id==='trash')loadTrash()}
async function discover(){let d=await list('data/content');return d.filter(x=>x.type==='file'&&x.name.endsWith('.json')).map(x=>x.name.slice(0,-5))}async function loadSecs(){let names=await discover();let cfg;try{cfg=JSON.parse(dec((await readFile('data/site-config.json')).content))}catch(e){cfg={}}let map={};(cfg.nav||[]).forEach(x=>map[x.id]=x.name);(cfg.groups?Object.values(cfg.groups):[]).forEach(g=>(g.items||[]).forEach(x=>map[x.id]=x.name));secs=[...new Set(names)].map(id=>({id,name:map[id]||id}));if(!secs.some(x=>x.id==='fujian'))secs.push({id:'fujian',name:'福建钱币资料'});fillSelects();return secs}function fillSelects(){['sec','newSec'].forEach(id=>$(id).innerHTML=secs.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join(''))}async function loadArticles(){try{if(!secs.length)await loadSecs();let id=$('sec').value||secs[0]?.id;if(!id)return;let f=await readFile('data/content/'+id+'.json');shaMap[id]=f.sha;arts=JSON.parse(dec(f.content));if(!Array.isArray(arts))arts=[];renderArticles();$('articleMsg').textContent=`已读取 ${arts.length} 条内容。`;}catch(e){$('articleMsg').textContent='读取失败：'+e.message}}function renderArticles(){let q=($('search').value||'').toLowerCase();let a=arts.filter(x=>(x.title+' '+x.content+' '+x.note).toLowerCase().includes(q));$('articleList').innerHTML=a.map((x,i)=>`<div class="card"><div><b>${esc(x.title||'无标题')}</b></div><div class="muted">ID：${esc(x.id||'')}　${esc(x.date||'')}</div>${(x.images||[]).map(p=>`<img class="thumb" src="${esc(p)}">`).join('')}<div class="row"><button onclick="editArticle('${esc(x.id)}')">✏️ 编辑</button><button class="gold" onclick="moveArticle('${esc(x.id)}')">🔄 转移版块</button><button class="danger" onclick="deleteArticle('${esc(x.id)}')">🗑️ 删除</button></div><div id="ed-${esc(x.id)}"></div></div>`).join('')||'<div class="card">没有找到内容。</div>'}function editArticle(id){let x=arts.find(a=>a.id===id);if(!x)return;let box=$('ed-'+id);box.innerHTML=`<div class="editor"><label>标题</label><input id="t-${id}" value="${esc(x.title)}"><label>摘要</label><textarea id="n-${id}">${esc(x.note||x.summary||'')}</textarea><label>正文</label><textarea id="c-${id}">${esc(x.content||'')}</textarea><input id="i-${id}" type="file" multiple accept="image/*"><div class="row"><button class="green" onclick="saveArticle('${esc(id)}')">💾 保存修改</button><button class="blue" onclick="insertImages('${esc(id)}')">🖼️ 上传并插入正文</button></div></div>`}async function saveArticle(id){try{let sec=$('sec').value,x=arts.find(a=>a.id===id);x.title=$('t-'+id).value;x.note=$('n-'+id).value;x.content=$('c-'+id).value;x.date=new Date().toISOString().slice(0,10);await writeFile('data/content/'+sec+'.json',JSON.stringify(arts,null,2),shaMap[sec],'CMS：修改文章');$('articleMsg').textContent='已保存修改并发布。';await loadArticles()}catch(e){$('articleMsg').textContent='保存失败：'+e.message}}async function insertImages(id){try{let inp=$('i-'+id);if(!inp.files.length)return alert('请选择图片');let x=arts.find(a=>a.id===id),sec=$('sec').value;for(let f of inp.files){let b=await f.arrayBuffer(),u=new Uint8Array(b),bin='';for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode(...u.subarray(i,i+8192));let name=Date.now()+'-'+f.name.replace(/[^\w.\-\u4e00-\u9fff]/g,'_');let path='static/uploads/'+name;await writeFile(path,btoa(bin),null,'CMS：上传文章图片');x.images=x.images||[];x.images.push('/'+path);$('c-'+id).value+='\n\n![图片](/'+path+')\n';}await writeFile('data/content/'+sec+'.json',JSON.stringify(arts,null,2),shaMap[sec],'CMS：插入图片');alert('图片已上传并插入正文。');await loadArticles()}catch(e){alert('图片操作失败：'+e.message)}}async function moveArticle(id){let from=$('sec').value,x=arts.find(a=>a.id===id);let to=prompt('输入目标版块ID：\n'+secs.map(s=>s.id+' = '+s.name).join('\n'),from);if(!to||to===from)return;try{let dst=await readFile('data/content/'+to+'.json').catch(()=>({content:enc('[]'),sha:null}));let arr=JSON.parse(dst.content?dec(dst.content):'[]');arr.push(x);arts=arts.filter(a=>a.id!==id);await writeFile('data/content/'+from+'.json',JSON.stringify(arts,null,2),shaMap[from],'CMS：转移文章');await writeFile('data/content/'+to+'.json',JSON.stringify(arr,null,2),dst.sha,'CMS：接收转移文章');alert('已转移到 '+to);await loadArticles()}catch(e){alert('转移失败：'+e.message)}}async function deleteArticle(id){if(!confirm('删除后进入回收站，确定？'))return;try{let sec=$('sec').value,x=arts.find(a=>a.id===id);arts=arts.filter(a=>a.id!==id);await writeFile('data/content/'+sec+'.json',JSON.stringify(arts,null,2),shaMap[sec],'CMS：删除文章');let tr;try{tr=await readFile('data/trash.json')}catch(e){tr={content:enc('[]'),sha:null}}let td=tr.content?JSON.parse(dec(tr.content)):[];td.push({...x,deletedFrom:sec,deletedAt:new Date().toISOString()});await writeFile('data/trash.json',JSON.stringify(td,null,2),tr.sha,'CMS：文章进入回收站');alert('已删除并进入回收站');await loadArticles()}catch(e){alert('删除失败：'+e.message)}}
async function createArticle(){try{let sec=$('newSec').value,title=$('newTitle').value.trim();if(!title)return alert('请输入标题');let f=await readFile('data/content/'+sec+'.json').catch(()=>({content:enc('[]'),sha:null}));let arr=JSON.parse(f.content?dec(f.content):'[]');let x={id:'hs-'+Date.now(),title,date:new Date().toISOString().slice(0,10),kind:$('newKind').value,note:$('newSummary').value,content:$('newBody').value,images:[],status:'published'};for(let file of $('newImgs').files){let b=await file.arrayBuffer(),u=new Uint8Array(b),bin='';for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode(...u.subarray(i,i+8192));let name=Date.now()+'-'+file.name.replace(/[^\w.\-\u4e00-\u9fff]/g,'_');await writeFile('static/uploads/'+name,btoa(bin),null,'CMS：发布内容图片');x.images.push('/static/uploads/'+name)}arr.push(x);await writeFile('data/content/'+sec+'.json',JSON.stringify(arr,null,2),f.sha,'CMS：发布新内容');$('newMsg').textContent='发布成功。';$('newTitle').value='';$('newBody').value='';}catch(e){$('newMsg').textContent='发布失败：'+e.message}}
async function readLocal(list){files=[];for(let f of list){let o={file:f,sel:true,text:null};if(f.type.startsWith('image/'))o.kind='image';else o.text=await f.text();files.push(o)}$('localList').innerHTML=files.map((x,i)=>`<div class="card"><label><input type="checkbox" id="lf-${i}" checked> ${esc(x.file.name)}</label>${x.kind==='image'?'<img class="thumb" src="'+URL.createObjectURL(x.file)+'">':'<pre style="max-height:180px;overflow:auto">'+esc((x.text||'').slice(0,1000))+'</pre>'}</div>`).join('')}async function publishLocal(){let sec=$('newSec').value||'fujian',f=await readFile('data/content/'+sec+'.json').catch(()=>({content:enc('[]'),sha:null})),arr=JSON.parse(f.content?dec(f.content):'[]');for(let i=0;i<files.length;i++){if(!$('lf-'+i)?.checked)continue;let o=files[i];if(o.kind==='image'){let b=await o.file.arrayBuffer(),u=new Uint8Array(b),bin='';for(let j=0;j<u.length;j+=8192)bin+=String.fromCharCode(...u.subarray(j,j+8192));let name=Date.now()+'-'+o.file.name.replace(/[^\w.\-\u4e00-\u9fff]/g,'_');await writeFile('static/uploads/'+name,btoa(bin),null,'CMS：本地图片发布');arr.push({id:'img-'+Date.now()+i,title:o.file.name,kind:'藏品展示',content:'本地图片资料，供收藏交流与鉴赏参考。',images:['/static/uploads/'+name],status:'published'})}else{let title=o.file.name.replace(/\.[^.]+$/,'');arr.push({id:'local-'+Date.now()+i,title,date:new Date().toISOString().slice(0,10),kind:'本地资料',note:'来自本地资料库',content:o.text,images:[],status:'published'})}}await writeFile('data/content/'+sec+'.json',JSON.stringify(arr,null,2),f.sha,'CMS：本地资料发布');alert('本地资料发布完成');await refreshAll()}async function loadHome(){try{let f=await readFile('data/site-config.json');shaMap.home=f.sha;let c=JSON.parse(dec(f.content));$('siteName').value=c.siteName||'';$('heroTitle').value=c.heroTitle||'';$('phone').value=c.phone||'';$('heroText').value=c.heroText||'';$('notice').value=c.topNotice||'';$('configJson').value=JSON.stringify(c,null,2);$('homeMsg').textContent='已读取当前首页配置。'}catch(e){$('homeMsg').textContent='读取失败：'+e.message}}async function saveHome(){try{let c=JSON.parse($('configJson').value);c.siteName=$('siteName').value;c.heroTitle=$('heroTitle').value;c.phone=$('phone').value;c.heroText=$('heroText').value;c.topNotice=$('notice').value;await writeFile('data/site-config.json',JSON.stringify(c,null,2),shaMap.home,'CMS：首页内容修改');$('homeMsg').textContent='首页配置已保存。'}catch(e){$('homeMsg').textContent='保存失败：'+e.message}}async function renderSections(){if(!secs.length)await loadSecs();$('sectionList').innerHTML=secs.map(s=>`<div class="card"><b>${esc(s.name)}</b><div class="muted">ID：${esc(s.id)}</div><input id="sn-${s.id}" value="${esc(s.name)}"><button class="gold" onclick="renameSection('${esc(s.id)}')">保存名称</button></div>`).join('')}async function renameSection(id){try{let f=await readFile('data/site-config.json'),c=JSON.parse(dec(f.content)),name=$('sn-'+id).value;let found=false;(c.nav||[]).forEach(x=>{if(x.id===id){x.name=name;found=true}});Object.values(c.groups||{}).forEach(g=>(g.items||[]).forEach(x=>{if(x.id===id){x.name=name;found=true}}));if(!found)c.groups=c.groups||{};await writeFile('data/site-config.json',JSON.stringify(c,null,2),f.sha,'CMS：修改版块名称');await loadSecs();await renderSections();alert('版块名称已保存')}catch(e){alert('保存失败：'+e.message)}}async function addSection(){let id=$('addId').value.trim(),name=$('addName').value.trim();if(!id||!name)return alert('请填写ID和名称');try{await writeFile('data/content/'+id+'.json','[]',null,'CMS：创建新版块');let f=await readFile('data/site-config.json'),c=JSON.parse(dec(f.content));c.nav=c.nav||[];c.nav.push({id,name,enabled:true});await writeFile('data/site-config.json',JSON.stringify(c,null,2),f.sha,'CMS：新增版块');await loadSecs();await renderSections();alert('版块创建成功')}catch(e){alert('创建失败：'+e.message)}}async function loadImages(){try{let d=await list('static/uploads');let arr=d.filter(x=>x.type==='file'&&/\.(png|jpe?g|webp|gif|svg)$/i.test(x.name));$('nImages').textContent=arr.length;$('imageList').innerHTML=arr.map(x=>`<div class="card"><b>${esc(x.name)}</b><img class="thumb" src="https://raw.githubusercontent.com/${$('repo').value}/${$('branch').value}/${x.path}"><div class="row"><button onclick="navigator.clipboard.writeText('/'+x.path)">复制路径</button><button class="danger" onclick="delImage('${esc(x.path)}','${x.sha}')">删除</button></div></div>`).join('');$('imageMsg').textContent='已读取网站图片。'}catch(e){$('imageMsg').textContent='图片读取失败：'+e.message}}async function uploadImages(fs){for(let f of fs){let b=await f.arrayBuffer(),u=new Uint8Array(b),bin='';for(let i=0;i<u.length;i+=8192)bin+=String.fromCharCode(...u.subarray(i,i+8192));let name=Date.now()+'-'+f.name.replace(/[^\w.\-\u4e00-\u9fff]/g,'_');await writeFile('static/uploads/'+name,btoa(bin),null,'CMS：上传网站图片')}await loadImages()}async function delImage(path,sha){if(!confirm('删除图片？'))return;try{await api('/repos/'+$('repo').value+'/contents/'+path,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'CMS：删除图片',sha,branch:$('branch').value})});await loadImages()}catch(e){alert('删除失败：'+e.message)}}async function loadTrash(){try{let f=await readFile('data/trash.json');let a=JSON.parse(dec(f.content));$('trashList').innerHTML=a.map((x,i)=>`<div class="card"><b>${esc(x.title)}</b><div class="muted">原版块：${esc(x.deletedFrom||'')}</div><button class="green" onclick="restore(${i})">恢复</button></div>`).join('')||'<div>回收站为空。</div>';window.trash=a;window.trashSha=f.sha;$('trashMsg').textContent='已读取回收站。'}catch(e){$('trashList').innerHTML='<div>回收站为空。</div>'}}async function restore(i){try{let x=window.trash[i],sec=x.deletedFrom;delete x.deletedFrom;delete x.deletedAt;let f=await readFile('data/content/'+sec+'.json').catch(()=>({content:enc('[]'),sha:null})),a=JSON.parse(f.content?dec(f.content):'[]');a.push(x);await writeFile('data/content/'+sec+'.json',JSON.stringify(a,null,2),f.sha,'CMS：恢复文章');window.trash.splice(i,1);await writeFile('data/trash.json',JSON.stringify(window.trash,null,2),window.trashSha,'CMS：回收站恢复');await loadTrash();alert('恢复成功')}catch(e){alert('恢复失败：'+e.message)}}async function emptyTrash(){if(!confirm('彻底清空回收站？'))return;try{let f=await readFile('data/trash.json');await writeFile('data/trash.json','[]',f.sha,'CMS：清空回收站');await loadTrash()}catch(e){alert(e.message)}}async function testToken(){try{let r=await api('/user');sessionStorage.setItem('hs_token',token());$('tokenMsg').textContent='Token连接成功：'+r.login}catch(e){$('tokenMsg').textContent='连接失败：'+e.message}}async function refreshAll(){try{await loadSecs();let total=0;for(let s of secs){try{let f=await readFile('data/content/'+s.id+'.json');let a=JSON.parse(dec(f.content));if(Array.isArray(a))total+=a.length}catch(e){}}$('nSections').textContent=secs.length;$('nArticles').textContent=total;$('dashMsg').textContent='已从 GitHub 当前数据重新读取：'+total+' 条文章，'+secs.length+' 个版块。';await loadImages()}catch(e){$('dashMsg').textContent='刷新失败：'+e.message}}window.addEventListener('load',refreshAll);</script></body></html>
