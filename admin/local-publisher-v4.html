<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜本地资料自动发布中心 V4</title><style>body{margin:0;background:#f5eee3;color:#302821;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:#650f09;color:#f6d68f;padding:22px}.wrap{width:min(1180px,94vw);margin:auto}.panel{background:#fffaf3;border:1px solid #ddc8a8;border-radius:14px;padding:20px;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-weight:800;font-size:13px;margin:6px 0}input,select,button{width:100%;box-sizing:border-box;padding:10px;border:1px solid #cdbb9f;border-radius:8px;font:inherit}button{background:#70170f;color:#fff3d0;border:0;font-weight:800;cursor:pointer}.gold{background:#9b7941}.green{background:#267044}.status,.log{padding:12px;border-radius:8px;margin-top:12px;white-space:pre-wrap}.status{background:#f1e5d2}.log{background:#24130f;color:#f4dfb2;font:12px monospace;max-height:260px;overflow:auto}.drop{border:2px dashed #b99355;padding:25px;text-align:center;border-radius:10px;background:#fffdf9}.files,.queue{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}.file,.item{background:#fff;border:1px solid #dfd0bc;border-radius:10px;padding:12px}.file img{width:100%;max-height:200px;object-fit:contain;margin-top:8px}.muted{font-size:12px;color:#786d63}.ok{color:#16723b;font-weight:800}.bad{color:#a12718;font-weight:800}@media(max-width:760px){.grid,.files,.queue{grid-template-columns:1fr}}</style></head><body>
<header class="top"><div class="wrap"><h1>🏮 洪盛集藏 · 本地资料自动发布中心 V4</h1><div>本地资料 → 读取 → 自动分类 → 审核 → 图片上传 → GitHub → 网站同步</div></div></header>
<main class="wrap">
<section class="panel"><h2>① 网站读取（无需 Token）</h2><div class="grid"><div class="field"><label>仓库</label><input id="repo" value="yang79403-wq/yang79403-wq.github.io"></div><div class="field"><label>分支</label><input id="branch" value="main"></div><div><label>&nbsp;</label><button class="gold" onclick="readSite()">📚 读取真实网站版块</button></div></div><div id="siteStatus" class="status">尚未读取</div></section>
<section class="panel"><h2>② GitHub 发布连接</h2><div class="field"><label>GitHub Token</label><input id="token" type="password" placeholder="github_pat_..." autocomplete="off"><div class="muted">Token 只保存在当前浏览器会话，不写入网站。读取网站不需要 Token，只有发布/上传需要。</div></div><button style="margin-top:10px" onclick="testToken()">🔐 检查发布权限</button><div id="tokenStatus" class="status">尚未连接</div></section>
<section class="panel"><h2>③ 获取本地资料</h2><div class="drop"><button onclick="pickFolder()">📁 选择整个资料文件夹</button><p>或</p><input id="files" type="file" multiple accept=".txt,.md,.csv,.json,.html,.htm,.xml,.jpg,.jpeg,.png,.webp,.gif,.svg,.pdf,.doc,.docx" onchange="choose(this.files)"><p class="muted">图片可以正常预览。PDF/Word 当前先进入待处理，不会伪造正文。</p></div><div id="fileList" class="files"></div></section>
<section class="panel"><h2>④ 自动整理</h2><div class="grid"><div><label>发布版块</label><select id="category"></select></div><div><label>资料类型</label><select id="kind"><option>收藏知识</option><option>鉴赏参考</option><option>历史研究</option><option>版别研究</option><option>市场行情资料</option><option>福建钱币资料</option><option>评级知识</option><option>藏品展示</option></select></div><div><label>重复规则</label><select id="dup"><option value="yes">相同标题跳过</option><option value="no">允许重复</option></select></div></div><p><label><input id="auto" type="checkbox" checked> 根据文件名/正文自动分类</label></p><button onclick="build()">🧠 生成发布队列</button><div id="queue" class="queue"></div></section>
<section class="panel"><h2>⑤ 审核并发布</h2><button class="green" onclick="publish()">🚀 发布已勾选资料</button><div id="publishStatus" class="status">等待发布</div><div id="log" class="log"></div></section>
</main>
<script>
const $=id=>document.getElementById(id), RAW='https://raw.githubusercontent.com/', API='https://api.github.com/';let files=[],queue=[],cfg=null,existing={};
const FALLBACK=[['market_yinyuan_jizhibi','行情资料参考 / 银元 铜元 机制币'],['market_tongqian','行情资料参考 / 古钱 花钱 行情价参考'],['market_zhibi','行情资料参考 / 纸币行情报价'],['yinyuan_jizhibi','收藏交流 / 银元 铜元 机制币'],['tongqian','收藏交流 / 铜钱鉴赏'],['zhibi','收藏交流 / 纸币鉴赏'],['appreciation','收藏交流 / 鉴赏参考'],['knowledge','收藏交流 / 收藏知识'],['history','收藏交流 / 钱币历史'],['culture','收藏交流 / 收藏文化'],['experience','收藏交流 / 收藏经验'],['fujian','福建钱币 / 福建钱币收藏资料'],['services','评级知识 / 评级知识交流'],['advisor','收藏知识 / 收藏知识交流'],['consult','免费交流咨询']];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function log(s){$('log').textContent+=new Date().toLocaleTimeString()+' '+s+'\n';$('log').scrollTop=$('log').scrollHeight}function setCats(a){$('category').innerHTML=a.map(x=>'<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>').join('')}
async function readSite(){try{$('siteStatus').textContent='正在读取公开网站配置，不需要 Token…';let u=RAW+repo.value.trim()+'/main/data/site-config.json?t='+Date.now();let r=await fetch(u,{cache:'no-store'});if(!r.ok)throw Error('网站配置读取失败 HTTP '+r.status);let raw=await r.json();cfg=typeof raw.content==='string'?JSON.parse(raw.content):raw;let a=[];(cfg.nav||[]).filter(n=>n.enabled!==false).forEach(n=>{let g=cfg.groups?.[n.id];(g?.items||[]).filter(x=>x.enabled!==false).forEach(x=>a.push([x.id,n.name+' / '+x.name]))});setCats(a.length?a:FALLBACK);$('siteStatus').innerHTML='<span class="ok">✓ 真实网站配置读取成功</span>\n版块：'+(a.length||FALLBACK.length)+' 个\n读取方式：GitHub Pages 公开数据，不依赖 Token';log('公开网站配置读取成功')}catch(e){setCats(FALLBACK);$('siteStatus').innerHTML='<span class="bad">✕ '+esc(e.message)+'</span>\n已启用内置中文版块兜底。';log('网站读取失败：'+e.message)}}
function auth(){return $('token').value.trim()||sessionStorage.getItem('hs_github_token')||''}function hdr(){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+auth(),'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}}async function api(path,opt={}){let r;try{r=await fetch(API+path,{...opt,headers:{...hdr(),...(opt.headers||{})}})}catch(e){throw Error('无法连接 GitHub API：'+e.message)}let j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)throw Error('Token 无效或已过期（401）');if(r.status===403)throw Error('Token 权限不足（403），需要 Contents: Read and write');if(r.status===404)throw Error('仓库或文件不存在（404）');throw Error(j.message||('HTTP '+r.status))}return j}
async function testToken(){try{let j=await api('/user');sessionStorage.setItem('hs_github_token',auth());$('tokenStatus').innerHTML='<span class="ok">✓ GitHub 连接成功</span>\n用户：'+esc(j.login)+'\n发布权限检测通过后即可上传资料。';log('Token 验证成功：'+j.login)}catch(e){$('tokenStatus').innerHTML='<span class="bad">✕ '+esc(e.message)+'</span>\n请检查 Token、仓库权限和网络。';log('Token 检查失败：'+e.message)}}
async function pickFolder(){if(!showDirectoryPicker){alert('浏览器不支持文件夹读取，请使用“选择多个文件”。');return}try{let h=await showDirectoryPicker();files=[];await walk(h,'');renderFiles();log('文件夹读取：'+files.length+' 个文件')}catch(e){if(e.name!=='AbortError')log('文件夹读取失败：'+e.message)}}async function walk(d,p){for await(const [n,h] of d.entries()){if(n.startsWith('.'))continue;if(h.kind==='file')files.push({file:await h.getFile(),path:p+n});else if(h.kind==='directory'&&!['node_modules','.git'].includes(n))await walk(h,p+n+'/')}}function choose(list){files=Array.from(list).map(f=>({file:f,path:f.webkitRelativePath||f.name}));renderFiles();log('选择文件：'+files.length+' 个')}function renderFiles(){$('fileList').innerHTML=files.map(x=>{let f=x.file,img=f.type.startsWith('image/')?'<img src="'+URL.createObjectURL(f)+'">':'';return '<div class="file"><b>'+esc(x.path)+'</b><div class="muted">'+esc(f.type||'未知')+' · '+Math.ceil(f.size/1024)+' KB</div>'+img+'</div>'}).join('')||'<div class="muted">尚未选择资料</div>'}
async function text(f){if(f.type.startsWith('image/'))return '';if(/\.(txt|md|csv|json|html?|xml)$/i.test(f.name))return await f.text();return ''}function title(n){return n.replace(/\.(txt|md|csv|json|html?|xml|pdf|docx?)$/i,'').replace(/[_-]+/g,' ').trim()||'未命名资料'}function guess(t,n){let s=(n+' '+t).toLowerCase();if(/福建|泉州|厦门|漳州|福州|闽/.test(s))return 'fujian';if(/银元|袁大头|船洋|龙洋|铜元|机制币/.test(s))return 'yinyuan_jizhibi';if(/古钱|铜钱|五铢|清钱|花钱|古泉/.test(s))return 'tongqian';if(/纸币|人民币|冠号|钞票/.test(s))return 'zhibi';if(/评级|pcgs|ngc|pmg|华夏/.test(s))return 'services';if(/版别|版式|边齿/.test(s))return 'knowledge';if(/历史|年代|铸造|钱局/.test(s))return 'history';if(/行情|成交|价格|报价/.test(s))return 'market_yinyuan_jizhibi';return $('category').value||'knowledge'}
async function build(){if(!files.length){alert('请先选择本地资料');return}queue=[];for(const x of files){let f=x.file,t=await text(f);if(f.type.startsWith('image/'))continue;queue.push({source:x,title:title(f.name),category:$('auto').checked?guess(t,f.name):$('category').value,kind:$('kind').value,content:t,note:t.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,220),selected:true,unsupported:/\.(pdf|doc|docx)$/i.test(f.name)&&!t})}renderQueue();log('生成 '+queue.length+' 条候选')}function renderQueue(){$('queue').innerHTML=queue.map((q,i)=>'<div class="item"><label><input type="checkbox" checked onchange="queue['+i+'].selected=this.checked"> <b>'+esc(q.title)+'</b></label><div>版块：<select onchange="queue['+i+'].category=this.value">'+FALLBACK.map(x=>'<option value="'+x[0]+'" '+(x[0]===q.category?'selected':'')+'>'+esc(x[1])+'</option>').join('')+'</select></div><div class="muted">'+(q.unsupported?'PDF/Word 待处理，不会发布正文':'正文 '+q.content.length+' 字')+'</div></div>').join('')||'<div class="muted">暂无候选</div>'}
function b64ab(buf){let bytes=new Uint8Array(buf),s='';for(let i=0;i<bytes.length;i+=0x8000)s+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(s)}async function getFile(path){return api('/repos/'+repo.value.trim()+'/contents/'+path+'?ref='+encodeURIComponent(branch.value.trim()))}async function put(path,data,message,sha){let body={message,content:btoa(unescape(encodeURIComponent(data))),branch:branch.value.trim()};if(sha)body.sha=sha;return api('/repos/'+repo.value.trim()+'/contents/'+path,{method:'PUT',body:JSON.stringify(body)})}async function putBinary(path,buf,message,sha){let body={message,content:b64ab(buf),branch:branch.value.trim()};if(sha)body.sha=sha;return api('/repos/'+repo.value.trim()+'/contents/'+path,{method:'PUT',body:JSON.stringify(body)})}
async function publish(){let chosen=queue.filter(q=>q.selected&&!q.unsupported);if(!chosen.length){alert('没有可发布资料');return}if(!auth()){alert('发布需要 GitHub Token，请先检查发布权限');return}try{let total=chosen.length,done=0;for(const q of chosen){let path='data/content/'+q.category+'.json',cur;try{cur=await getFile(path)}catch(e){cur=null}let arr=[];let sha=cur?.sha;if(cur?.content){try{arr=JSON.parse(decodeURIComponent(escape(atob(cur.content.replace(/\n/g,'')))))}catch(e){arr=[]}}if(!Array.isArray(arr))arr=[];if($('dup').value==='yes'&&arr.some(a=>a.title===q.title)){log('跳过重复：'+q.title);continue}let id=Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7),date=new Date().toISOString().slice(0,10);arr.push({id,title:q.title,date,kind:q.kind,note:q.note,content:q.content});await put(path,JSON.stringify(arr,null,2),`发布资料：${q.title}`,sha);let imgs=files.filter(x=>x.file.type.startsWith('image/'));if(imgs.length){for(const im of imgs){let ip='static/uploads/'+im.file.name.replace(/[^\w\u4e00-\u9fff. -]/g,'_');let old;try{old=await getFile(ip)}catch(e){}await putBinary(ip,await im.file.arrayBuffer(),`上传图片：${im.file.name}`,old?.sha)}}done++;log('已发布：'+q.title);$('publishStatus').textContent='已完成 '+done+'/'+total}$('publishStatus').innerHTML='<span class="ok">✓ 发布完成</span>\n已处理：'+done+' 条';}catch(e){$('publishStatus').innerHTML='<span class="bad">✕ 发布失败：'+esc(e.message)+'</span>';log('发布失败：'+e.message)}}
readSite();
</script></body></html>
