<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛收藏资讯网｜全站内容管理 V10</title><style>body{margin:0;background:#f5eee5;color:#332722;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{background:linear-gradient(135deg,#350604,#75170f);color:#f6d985;padding:20px}.wrap{width:min(1200px,94vw);margin:auto}.card{background:#fffdf9;border:1px solid #dfcdae;border-radius:12px;padding:15px;margin:13px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{font-weight:800;display:block;margin:5px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8c8b5;border-radius:8px;font:inherit}textarea{min-height:110px}.btn{border:0;border-radius:8px;padding:9px 13px;margin:4px;font-weight:800;cursor:pointer}.red{background:#68100a;color:#fff}.gold{background:#d6b35b;color:#32130d}.green{background:#2f6b3b;color:#fff}.gray{background:#756a63;color:#fff}.danger{background:#a62a20;color:#fff}.blue{background:#315b82;color:#fff}.status{padding:11px;background:#f8efe4;border-radius:8px}.ok{background:#e8f5e9;color:#245d2b}.tip{background:#fff5dd;border:1px solid #dfc18a;padding:10px;border-radius:8px}.row{border:1px solid #eadfce;background:#fffaf3;border-radius:9px;padding:10px;margin:8px 0}.toolbar{display:flex;flex-wrap:wrap;gap:4px}.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.pic{border:1px solid #dfcdae;border-radius:8px;padding:7px}.pic img{width:100%;height:120px;object-fit:contain;background:#eee6db}.preview{background:#fff;border:1px solid #ddd1c0;border-radius:9px;padding:18px;line-height:1.8}.preview img{max-width:100%;display:block;margin:15px auto}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.gallery{grid-template-columns:1fr 1fr}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛收藏资讯网 · 全站内容管理 V10</h1><div>真实读取版块 → 自动绑定内容库 → 编辑 / 转移 / 图片 / 发布 / 删除</div></div></header><main class="wrap"><section class="card"><h2>🔐 GitHub连接</h2><div class="grid"><div><label>用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>Token</label><input id="token" type="password"></div></div><button class="btn red" onclick="loadAll()">🔄 一键读取整个网站</button><div id="status" class="status">尚未读取</div></section><section class="card"><h2>🗂️ ① 选择具体网站版块</h2><div class="grid"><div><label>网站版块</label><select id="group" onchange="groupChanged()"></select></div><div><label>自动绑定内容库</label><select id="lib" onchange="loadLib()"></select></div></div><div id="groupInfo" class="tip">读取后这里显示版块真实 ID、标题和内容库。</div></section><section class="card"><h2>📝 ② 编辑 / 发布具体内容</h2><div class="grid"><div><label>文章ID</label><input id="id"></div><div><label>标题</label><input id="title"></div><div><label>日期</label><input id="date" type="date"></div><div><label>分类</label><input id="kind"></div><div><label>状态</label><select id="state"><option value="draft">草稿</option><option value="published">已发布</option></select></div><div class="wide"><label>摘要</label><textarea id="note"></textarea></div><div class="wide"><label>正文</label><textarea id="body" style="min-height:300px" placeholder="把光标放到需要图片的位置，再点击下方图片插入按钮"></textarea></div></div><div class="toolbar"><button class="btn green" onclick="saveEdit()">💾 保存修改</button><button class="btn red" onclick="createNew()">➕ 新增并发布</button><button class="btn blue" onclick="moveArticle()">↔️ 转移到当前版块</button><button class="btn gold" onclick="publishArticle()">🚀 发布</button><button class="btn gray" onclick="unpublishArticle()">⏸️ 下架</button><button class="btn danger" onclick="deleteArticle()">🗑️ 删除</button><button class="btn gray" onclick="clearForm()">🆕 清空</button></div></section><section class="card"><h2>🖼️ ③ 图片上传并插入具体内容</h2><input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple><button class="btn gold" onclick="uploadImages()">⬆️ 上传图片</button><div id="pics" class="gallery"></div><div class="tip">上传后选择图片，把正文光标放在具体位置，然后点击「插入当前光标」。图片位置会保存进正文。</div><div class="toolbar"><button class="btn gold" onclick="insertPic('before')">正文开头</button><button class="btn red" onclick="insertPic('cursor')">当前光标位置</button><button class="btn gold" onclick="insertPic('after')">正文末尾</button></div></section><section class="card"><h2>👁️ ④ 实时预览</h2><div id="preview" class="preview">暂无内容</div></section><section class="card"><h2>📚 ⑤ 当前版块内容</h2><div id="list"></div></section></main><script>const $=id=>document.getElementById(id);let config={},groups={},libs=[],items=[],fileSha='',selected=null;const enc=new TextEncoder(),b64=s=>{let a=enc.encode(s),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}async function api(path,opt={}){let t=$('token').value.trim();if(!t)throw Error('请填写 GitHub Token');let r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28'}}),d=await r.json();if(!r.ok)throw Error((d.message||'GitHub请求失败')+'（'+r.status+'）');return d}async function get(path){return api(base()+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value||'main'))}function unwrap(x){for(let i=0;i<8&&x&&typeof x.content==='string';i++){try{x=JSON.parse(x.content)}catch{break}}return x}async function loadAll(){try{let f=await get('data/site-config.json');config=unwrap(JSON.parse(dec(f.content)));groups=config.groups||{};let d=await api(base()+'/contents/data/content?ref='+encodeURIComponent($('branch').value||'main'));libs=d.filter(x=>x.type==='file'&&x.name.endsWith('.json'));$('group').innerHTML=Object.entries(groups).filter(([id,g])=>g.enabled!==false).map(([id,g])=>'<option value="'+esc(id)+'">'+esc(g.title||id)+'</option>').join('');$('lib').innerHTML=libs.map(x=>'<option value="'+esc(x.name)+'">'+esc(x.name)+'</option>').join('');groupChanged();$('status').className='status ok';$('status').textContent='✅ 已真实读取 '+Object.keys(groups).length+' 个版块、'+libs.length+' 个内容库'}catch(e){$('status').textContent='❌ '+e.message}}function mappedLib(gid){let g=groups[gid]||{};let first=(g.items||[])[0];if(first&&libs.some(x=>x.name===first.id+'.json'))return first.id+'.json';if(libs.some(x=>x.name===gid+'.json'))return gid+'.json';return ''}async function groupChanged(){let gid=$('group').value,g=groups[gid]||{},map=mappedLib(gid);if(map)$('lib').value=map;$('groupInfo').innerHTML='<b>版块ID：</b>'+esc(gid)+'<br><b>版块标题：</b>'+esc(g.title||'')+'<br><b>专属内容库：</b>'+esc($('lib').value||'未绑定');await loadLib()}async function loadLib(){let name=$('lib').value;if(!name)return;let f=await get('data/content/'+name);fileSha=f.sha;try{items=JSON.parse(dec(f.content))}catch{items=[]}renderList();clearForm();}function currentGroup(){return $('group').value}function renderList(){let gid=currentGroup();let arr=items.filter(x=>!x.groupId||x.groupId===gid);$('list').innerHTML=arr.map(x=>{let i=items.indexOf(x);return '<div class="row"><b>'+esc(x.title||x.id)+'</b><div style="font-size:12px;color:#766">'+esc(x.date||'')+' · '+esc(x.status||'draft')+' · 版块：'+esc(x.groupName||gid)+'</div><div class="toolbar"><button class="btn gold" onclick="edit('+i+')">✏️ 编辑</button><button class="btn blue" onclick="pickMove('+i+')">↔️ 转移</button><button class="btn green" onclick="pub('+i+')">🚀 发布</button><button class="btn gray" onclick="draft('+i+')">⏸️ 下架</button><button class="btn danger" onclick="del('+i+')">🗑️ 删除</button></div></div>'}).join('')||'<div class="tip">当前版块暂无内容。可以点击「新增并发布」。</div>'}function edit(i){let x=items[i];$('id').value=x.id||'';$('title').value=x.title||'';$('date').value=x.date||'';$('kind').value=x.kind||'';$('state').value=x.status||'draft';$('note').value=x.note||'';$('body').value=x.content||'';updatePreview();scrollTo({top:0,behavior:'smooth'})}function clearForm(){['id','title','date','kind','note','body'].forEach(x=>$(x).value='');$('state').value='draft';updatePreview()}async function write(msg){let o={message:'洪盛收藏资讯网：'+msg,content:b64(JSON.stringify(items,null,2)),branch:$('branch').value||'main'};if(fileSha)o.sha=fileSha;let r=await api(base()+'/contents/data/content/'+$('lib').value,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});fileSha=r.content?.sha||fileSha;$('status').className='status ok';$('status').textContent='✅ '+msg+' 已保存并同步网站';renderList()}function makeObj(){let gid=currentGroup(),g=groups[gid]||{},id=$('id').value.trim()||'article_'+Date.now();return {id,title:$('title').value,date:$('date').value||new Date().toISOString().slice(0,10),kind:$('kind').value,note:$('note').value,content:$('body').value,status:$('state').value,groupId:gid,groupName:g.title||gid,contentFile:$('lib').value}}async function saveEdit(){let id=$('id').value.trim(),i=items.findIndex(x=>x.id===id);if(i<0)return alert('请先从当前版块选择一篇内容');items[i]={...items[i],...makeObj(),id};await write('重新编辑内容')}async function createNew(){let o=makeObj();if(items.some(x=>x.id===o.id))o.id+='_'+Date.now();o.status='published';items.push(o);$('id').value=o.id;await write('新增并发布到：'+o.groupName)}let moving=-1;function pickMove(i){moving=i;edit(i);alert('已选择该内容。现在切换“网站版块”，再点击“↔️ 转移到当前版块”。')}async function moveArticle(){let id=$('id').value.trim(),i=items.findIndex(x=>x.id===id);if(i<0&&moving<0)return alert('请先选择内容');i=i>=0?i:moving;let gid=currentGroup(),g=groups[gid]||{};items[i].groupId=gid;items[i].groupName=g.title||gid;await write('内容转移到：'+(g.title||gid));moving=-1}async function publishArticle(){let id=$('id').value.trim(),i=items.findIndex(x=>x.id===id);if(i<0)return alert('请先选择内容');items[i].status='published';await write('发布内容')}async function unpublishArticle(){let id=$('id').value.trim(),i=items.findIndex(x=>x.id===id);if(i<0)return alert('请先选择内容');items[i].status='draft';await write('内容下架')}async function pub(i){items[i].status='published';edit(i);await write('发布内容')}async function draft(i){items[i].status='draft';edit(i);await write('内容下架')}async function del(i){if(!confirm('确定删除这篇内容？'))return;items.splice(i,1);clearForm();await write('删除内容')}async function uploadImages(){let fs=[...$('files').files];if(!fs.length)return alert('请选择图片');let out=[];for(let f of fs){if(f.size>5*1024*1024)return alert('单张图片不能超过5MB');let now=new Date(),p='static/uploads/'+now.getFullYear()+'/'+String(now.getMonth()+1).padStart(2,'0')+'/img_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+f.name.substring(f.name.lastIndexOf('.'));let a=new Uint8Array(await f.arrayBuffer()),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));await api(base()+'/contents/'+p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛收藏资讯网：上传文章图片',content:btoa(o),branch:$('branch').value||'main'})});out.push({id:p.split('/').pop().split('.')[0],url:'https://yang79403-wq.github.io/'+p,name:f.name})}$('pics').innerHTML=out.map(x=>'<div class="pic"><img src="'+x.url+'"><div style="font-size:11px">'+esc(x.name)+'</div><button class="btn gold" onclick="selectPic('+JSON.stringify(x.id)+','+JSON.stringify(x.url)+')">选择</button></div>').join('');$('status').textContent='🖼️ 图片上传成功，请选择一张图片'}function selectPic(id,url){selected={id,url};$('status').textContent='🖼️ 已选择图片：'+id+'，把光标放到正文位置后点击“当前光标位置”'}function insertPic(pos){if(!selected)return alert('请先选择图片');let ta=$('body'),s=ta.selectionStart||0,e=ta.selectionEnd||0,m='\n\n【图片:'+selected.id+']\n'+selected.url+'\n【/图片】\n\n';if(pos==='before')ta.value=m+ta.value;else if(pos==='after')ta.value+=m;else ta.value=ta.value.slice(0,s)+m+ta.value.slice(e);updatePreview()}function updatePreview(){let c=esc($('body').value||'').replace(/【图片:([^\]]+)\]\n([^\n]+)\n【\/图片】/g,(m,id,url)=>'<img src="'+esc(url)+'" alt="'+esc(id)+'">').replace(/\n/g,'<br>');$('preview').innerHTML='<div style="font-size:12px;color:#777">版块：'+esc(groups[currentGroup()]?.title||'')+'</div><h2>'+esc($('title').value||'文章标题')+'</h2>'+c}$('body').addEventListener('input',updatePreview);$('title').addEventListener('input',updatePreview)</script></body></html>
