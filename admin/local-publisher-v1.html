<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏｜本地资料自动发布中心</title><style>*{box-sizing:border-box}body{margin:0;background:#f5eee3;color:#322820;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:#650f09;color:#f6d68f;padding:18px}.top b{font:900 25px "Songti SC",STSong,serif}.wrap{max-width:1180px;width:94%;margin:auto}.panel{background:#fffaf3;border:1px solid #ddc8a8;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 4px 16px #4d1b0b10}h2{color:#71170f;font-family:"Songti SC",STSong,serif;margin-top:0}.row{display:flex;gap:10px;flex-wrap:wrap}.field{flex:1;min-width:220px}label{display:block;font-weight:800;font-size:13px;margin:8px 0}input,select,textarea,button{font:inherit;border-radius:8px;border:1px solid #cdbb9f;padding:10px;width:100%}textarea{min-height:150px;resize:vertical}button{cursor:pointer;background:#70170f;color:#fff3d0;border:0;font-weight:800}.btn2{background:#9b7941}.muted{color:#786d63;font-size:12px}.status{padding:10px;border-radius:8px;background:#f1e5d2;margin-top:10px;white-space:pre-wrap}.drop{border:2px dashed #b99355;padding:25px;text-align:center;border-radius:10px;background:#fffdf9}.files{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.file{padding:12px;border:1px solid #dfd0bc;border-radius:8px;background:#fff}.file small{display:block;color:#776b61}.file img{width:100%;max-height:180px;object-fit:contain;margin-top:8px}.check{display:flex;align-items:center;gap:8px}.check input{width:auto}.progress{height:10px;background:#e3d8c8;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:#8a2a18}.log{font:12px ui-monospace,monospace;background:#24130f;color:#f4dfb2;padding:12px;border-radius:8px;max-height:260px;overflow:auto;white-space:pre-wrap}@media(max-width:700px){.files{grid-template-columns:1fr}.field{min-width:100%}}</style></head><body><header class="top"><div class="wrap"><b>🏮 洪盛集藏 · 本地资料自动发布中心</b><div>本地电脑资料库 → 智能整理 → 选择版块 → 图片上传 → GitHub → 网站同步</div></div></header><main class="wrap"><section class="panel"><h2>① 连接正式网站</h2><div class="row"><div class="field"><label>GitHub Token（仅保存在当前浏览器会话）</label><input id="token" type="password" placeholder="github_pat_..." autocomplete="off"></div><div class="field"><label>仓库</label><input id="repo" value="yang79403-wq/yang79403-wq.github.io"></div><div class="field"><label>分支</label><input id="branch" value="main"></div></div><div class="row"><button onclick="loadConfig()">读取网站版块</button><button class="btn2" onclick="clearToken()">清除本次Token</button></div><div id="cfgStatus" class="status">尚未连接</div></section><section class="panel"><h2>② 从本地电脑获取资料</h2><div class="drop"><p><b>电脑：</b>选择整个资料文件夹（支持浏览器 File System Access 的设备）</p><button onclick="pickFolder()">📁 选择本地资料文件夹</button><p><b>电脑 / 手机：</b>也可以一次选择多个文件</p><input id="files" type="file" multiple accept=".txt,.md,.csv,.json,.html,.htm,.jpg,.jpeg,.png,.webp,.gif,.svg" onchange="handleFiles(this.files)"><p class="muted">支持 TXT / MD / CSV / JSON / HTML 以及 JPG、PNG、WEBP、GIF、SVG。PDF、DOCX先保留为待处理，不会伪造提取结果。</p></div><div id="fileList" class="files"></div></section><section class="panel"><h2>③ 智能整理与发布规则</h2><div class="row"><div class="field"><label>发布版块</label><select id="category"><option value="">请先读取网站版块</option></select></div><div class="field"><label>资料类型</label><select id="kind"><option>收藏知识</option><option>鉴赏参考</option><option>历史研究</option><option>版别研究</option><option>市场行情资料</option><option>福建钱币资料</option><option>评级知识</option><option>藏品展示</option></select></div></div><label class="check"><input id="autoCategory" type="checkbox" checked> 根据文件名和内容自动判断版块；判断不确定时使用上面的默认版块</label><label class="check"><input id="publishImages" type="checkbox" checked> 图片自动上传到网站 /static/uploads/ 并插入资料</label><label class="check"><input id="skipDup" type="checkbox" checked> 相同标题自动跳过，避免重复发布</label><button onclick="buildQueue()">🧠 扫描并生成发布队列</button><div id="queue"></div></section><section class="panel"><h2>④ 发布到网站</h2><div class="progress"><div id="bar" class="bar"></div></div><div class="row" style="margin-top:12px"><button onclick="publishAll()">🚀 一键发布全部</button><button class="btn2" onclick="publishSelected()">发布已选资料</button></div><div id="publishStatus" class="status">等待发布</div><div id="log" class="log"></div></section></main><script>const $=id=>document.getElementById(id);let localFiles=[],queue=[],cfg=null;const API='https://api.github.com';function auth(){return $('token').value.trim()||sessionStorage.getItem('hs_github_token')||''}function headers(){let t=auth();return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}}function log(s){$('log').textContent+=new Date().toLocaleTimeString()+' '+s+'\n';$('log').scrollTop=$('log').scrollHeight}function clearToken(){sessionStorage.removeItem('hs_github_token');$('token').value='';$('cfgStatus').textContent='已清除本次Token'}async function api(path,opt={}){let r=await fetch(API+path,{...opt,headers:{...headers(),...(opt.headers||{})}});let j=await r.json().catch(()=>({}));if(!r.ok)throw new Error((j.message||r.status)+' '+path);return j}async function loadConfig(){try{let t=$('token').value.trim();if(t)sessionStorage.setItem('hs_github_token',t);let repo=$('repo').value.trim();let j=await api('/repos/'+repo+'/contents/data/site-config.json?ref='+encodeURIComponent($('branch').value.trim()));let raw=JSON.parse(atob(j.content.replace(/\n/g,'')));cfg=typeof raw.content==='string'?JSON.parse(raw.content):raw;let opts=[];(cfg.nav||[]).filter(x=>x.enabled!==false).forEach(n=>{let g=cfg.groups?.[n.id];(g?.items||[]).filter(x=>x.enabled!==false).forEach(x=>opts.push({id:x.id,name:n.name+' / '+x.name,type:n.id}));});$('category').innerHTML=opts.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');$('cfgStatus').textContent='连接成功：读取到 '+opts.length+' 个可发布资料子版块';log('网站配置读取成功');}catch(e){$('cfgStatus').textContent='连接失败：'+e.message;log('错误：'+e.message)}}async function pickFolder(){if(!window.showDirectoryPicker){alert('当前浏览器不支持文件夹读取，请使用“选择多个文件”。Mac/Windows新版Chrome/Edge支持文件夹读取。');return}try{let h=await showDirectoryPicker();localFiles=[];await walk(h,'');renderFiles();}catch(e){log('文件夹读取取消或失败：'+e.message)}}async function walk(dir,prefix){for await(const [name,h] of dir.entries()){if(name.startsWith('.'))continue;if(h.kind==='file'){let f=await h.getFile();localFiles.push({file:f,path:prefix+name})}else if(h.kind==='directory'&&!['node_modules','.git'].includes(name))await walk(h,prefix+name+'/')}}function handleFiles(list){localFiles=Array.from(list).map(f=>({file:f,path:f.webkitRelativePath||f.name}));renderFiles()}function renderFiles(){let out=localFiles.map((x,i)=>{let f=x.file;let img=f.type.startsWith('image/')?'<img src="'+URL.createObjectURL(f)+'">':'';return '<div class="file"><b>'+esc(x.path)+'</b><small>'+f.type+' · '+Math.round(f.size/1024)+' KB</small>'+img+'</div>'}).join('');$('fileList').innerHTML=out||'<div class="muted">尚未选择资料</div>'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function textOf(f){if(f.type.startsWith('image/'))return '';if(/\.(txt|md|csv|json|html?|xml)$/i.test(f.name))return await f.text();return ''}function cleanTitle(name){return name.replace(/\.(txt|md|csv|json|html?|xml)$/i,'').replace(/[_-]+/g,' ').trim()||'未命名资料'}function guess(text,name){let s=(name+' '+text).toLowerCase();if(/福建|泉州|厦门|漳州|福州|闽|福建钱币/.test(s))return 'fujian';if(/银元|袁大头|船洋|龙洋|铜元|机制币/.test(s))return 'yinyuan_jizhibi';if(/古钱|铜钱|五铢|清钱|花钱|古泉/.test(s))return 'tongqian';if(/纸币|人民币|冠号|钞票/.test(s))return 'zhibi';if(/评级|pcgs|ngc|pmg|华夏/.test(s))return 'knowledge';if(/历史|年代|铸造|钱局/.test(s))return 'history';if(/版别|版式|边齿/.test(s))return 'knowledge';if(/行情|成交|价格|报价/.test(s))return 'market_yinyuan_jizhibi';return $('category').value||'knowledge'}function summary(text){let s=text.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim();return s.slice(0,180)}async function buildQueue(){if(!cfg){alert('请先读取网站版块');return}if(!localFiles.length){alert('请先选择本地资料');return}queue=[];for(const x of localFiles){let f=x.file;if(f.type.startsWith('image/'))continue;let text=await textOf(f);if(!text&&/\.(pdf|docx?)$/i.test(f.name)){queue.push({source:x,title:cleanTitle(f.name),unsupported:true,category:$('category').value,selected:true});continue}let title=cleanTitle(f.name);let cat=$('autoCategory').checked?guess(text,f.name):$('category').value;queue.push({source:x,title,category:cat,kind:$('kind').value,note:summary(text),content:text,selected:true,unsupported:false})}renderQueue();log('已生成 '+queue.length+' 条发布候选资料')}function renderQueue(){let catName=id=>{let n=[...($('category').options||[])].find(o=>o.value===id);return n?n.text:id};$('queue').innerHTML=queue.map((q,i)=>'<div class="file"><label class="check"><input type="checkbox" '+(q.selected?'checked':'')+' onchange="queue['+i+'].selected=this.checked"> <b>'+esc(q.title)+'</b></label><small>版块：'+esc(catName(q.category))+'　类型：'+esc(q.kind||'待处理')+(q.unsupported?'　⚠ 暂不提取该格式':'')+'</small><textarea onchange="queue['+i+'].content=this.value">'+esc(q.content||q.note||'')+'</textarea></div>').join('')}function b64(buf){let bytes=new Uint8Array(buf),bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin)}async function getFile(path){try{return await api('/repos/'+$('repo').value+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value))}catch(e){if(String(e.message).startsWith('404'))return null;throw e}}async function putFile(path,content,message){let old=await getFile(path);let body={message,content:btoa(unescape(encodeURIComponent(content))),branch:$('branch').value};if(old?.sha)body.sha=old.sha;return api('/repos/'+$('repo').value+'/contents/'+path,{method:'PUT',body:JSON.stringify(body)})}async function uploadImage(f){let safe=f.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-');let path='static/uploads/'+Date.now()+'-'+safe;let data=b64(await f.arrayBuffer());let body={message:'本地资料图片：'+f.name,content:data,branch:$('branch').value};await api('/repos/'+$('repo').value+'/contents/'+path,{method:'PUT',body:JSON.stringify(body)});return '/'+path}async function publishOne(q){if(q.unsupported)throw new Error('暂不支持直接提取 '+q.source.file.name+'，请转换为TXT/MD后再发布');let path='data/content/'+q.category+'.json';if(q.category.startsWith('market_')||q.category.startsWith('fujian_'))path='data/market/'+q.category+'.json';let old=await getFile(path),arr=[];if(old)try{let txt=decodeURIComponent(escape(atob(old.content.replace(/\n/g,''))));let raw=JSON.parse(txt);arr=Array.isArray(raw)?raw:(typeof raw.content==='string'?JSON.parse(raw.content):[])}catch{}if($('skipDup').checked&&arr.some(a=>a.title===q.title)){log('跳过重复：'+q.title);return 'skip'}let imageUrls=[];if($('publishImages').checked){for(const x of localFiles){if(x.file.type.startsWith('image/')&&new RegExp(q.title.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'i').test(x.file.name))imageUrls.push(await uploadImage(x.file))}}arr.unshift({id:q.category+'-'+Date.now(),title:q.title,date:new Date().toISOString().slice(0,10),kind:q.kind||'本地资料',note:q.note||summary(q.content||''),content:q.content||'',images:imageUrls,status:'published',source:'本地资料库'});await putFile(path,JSON.stringify(arr,null,2),'本地资料自动发布：'+q.title);return 'ok'}async function publishSelected(){await doPublish(queue.filter(q=>q.selected))}async function publishAll(){await doPublish(queue)}async function doPublish(list){if(!auth()){alert('请先输入GitHub Token');return}if(!list.length){alert('没有可发布资料');return}let done=0;$('bar').style.width='0%';for(const q of list){try{let r=await publishOne(q);log((r==='skip'?'跳过：':'发布成功：')+q.title)}catch(e){log('发布失败：'+q.title+'｜'+e.message)}done++;$('bar').style.width=Math.round(done/list.length*100)+'%'}$('publishStatus').textContent='本轮处理完成：'+done+' 条。GitHub Pages随后自动同步网站。';}loadConfig();</script></body></html>
