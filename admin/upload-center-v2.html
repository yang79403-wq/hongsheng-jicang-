<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏资讯网｜网站发布工具</title><style>:root{--r:#68100a;--g:#d4b05a;--bg:#f5eee5;--ink:#30251f;--line:#dfcfbb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1100px,94vw);margin:auto}.head{background:linear-gradient(135deg,#360604,#74170f);color:#fff;padding:22px 0}.head h1{margin:0;color:#f2d487;font:900 28px Georgia,"Noto Serif SC",serif}.card{background:#fffdf9;border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{font-weight:800;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font:inherit}textarea{min-height:170px}.wide{grid-column:1/-1}.btn{border:0;border-radius:8px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--r);color:#fff}.gold{background:var(--g);color:#30140d}.gray{background:#766b62;color:#fff}.danger{background:#a5281e;color:#fff}.cats{display:flex;flex-wrap:wrap;gap:8px}.cat{border:1px solid var(--line);background:#fff8ef;border-radius:8px;padding:9px 12px;cursor:pointer}.cat.on{background:var(--r);color:#fff}.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.status{padding:10px;margin-top:10px;background:#f7efe6;border-radius:8px;font-size:13px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.item{border:1px solid var(--line);border-radius:10px;padding:12px;background:#fff}.item img{width:100%;height:170px;object-fit:cover;border-radius:7px}.item h3{margin:7px 0;color:var(--r)}.meta{font-size:11px;color:#756b62}.hide{display:none!important}@media(max-width:700px){.grid,.list{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛集藏资讯网 · 网站发布工具</h1><div>内容发布 · 修改 · 添加图片 · 上下架 · 删除 · 自动归类</div></div></header><main class="wrap"><section class="card"><h2>🔐 GitHub 连接</h2><div class="grid"><div><label>用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><div class="tools"><button class="btn primary" id="saveCfg">保存连接</button><button class="btn gray" id="test">测试连接</button></div><div id="conn" class="status">Token 仅保存在本机浏览器。</div></section><section class="card"><h2 id="formTitle">📤 发布新内容</h2><div id="cats">正在读取版块……</div><div class="status">当前版块：<b id="chosen">-</b></div><div class="grid" style="margin-top:12px"><div><label>日期</label><input id="date" type="date"></div><div><label>内容类型</label><select id="kind"><option>文章 / 资料</option><option>鉴赏</option><option>行情资料</option><option>历史研究</option><option>公告 / 说明</option></select></div><div class="wide"><label>标题</label><input id="title"></div><div class="wide"><label>摘要</label><input id="note"></div><div class="wide"><label>正文</label><textarea id="content"></textarea></div><div class="wide"><label>图片</label><input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><small>最多6张，单张不超过5MB</small></div></div><div class="tools"><button class="btn gold" id="save">🚀 发布</button><button class="btn gray hide" id="cancel">取消修改</button></div><div id="action" class="status">等待操作</div></section><section class="card"><h2>📚 已发布内容</h2><div class="grid"><div><label>搜索</label><input id="search" placeholder="搜索标题、摘要、正文"></div><div><label>筛选版块</label><select id="filter"><option value="all">全部</option></select></div></div><div class="tools"><button class="btn primary" id="refresh">🔄 刷新内容</button></div><div id="list" class="list" style="margin-top:12px"></div></section></main><script>'use strict';const $=id=>document.getElementById(id),KEY='hsjc_publish_stable';let cfg={},labels={},selected='',editing=null,records=[];const today=new Date().toISOString().slice(0,10);$('date').value=today;try{cfg=JSON.parse(localStorage.getItem(KEY)||'{}');for(const k of ['owner','repo','branch','token'])if(cfg[k])$(k).value=cfg[k]}catch{}const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function saveCfg(){cfg={owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()};localStorage.setItem(KEY,JSON.stringify(cfg))}function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}async function api(path,opt={}){if(!$('token').value.trim())throw Error('请先填写 Token');const r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+$('token').value.trim(),'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+' '+r.status);return d}function b64(s){const u=new TextEncoder().encode(s);let z='';for(let i=0;i<u.length;i+=32768)z+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(z)}function dec(s){const b=atob(s.replace(/\s/g,''));return new TextDecoder().decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}async function getFile(path){try{return await api(base()+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value.trim()||'main'))}catch(e){if(String(e.message).includes('404')||String(e.message).includes('Not Found'))return null;throw e}}async function writeFile(path,text,msg,sha){const body={message:msg,content:b64(text),branch:$('branch').value.trim()||'main'};if(sha)body.sha=sha;return api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}async function deletePath(path,sha,msg){return api(base()+'/contents/'+path,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,sha,branch:$('branch').value.trim()||'main'})})}function dataPath(id){return id.startsWith('market_')?'data/market/'+id.slice(7)+'.json':id.startsWith('fujian_')?'data/market/'+id+'.json':'data/content/'+id+'.json'}async function readData(id){const path=dataPath(id),f=await getFile(path);let data=[];if(f){try{data=JSON.parse(dec(f.content));if(!Array.isArray(data))data=[]}catch{data=[]}}return{path,sha:f?.sha,data}}async function loadConfig(){const f=await getFile('data/site-config.json');if(!f)throw Error('找不到网站配置');const c=JSON.parse(dec(f.content));labels={};let h='';for(const g of Object.values(c.groups||{})){h+='<div style="width:100%;font-weight:900;color:#741912;margin-top:9px">'+esc(g.title)+'</div>';for(const x of(g.items||[]).filter(x=>x.enabled)){labels[x.id]=x.name;h+='<button class="cat" data-id="'+esc(x.id)+'">'+esc(x.name)+'</button>'}}$('cats').innerHTML=h;$('filter').innerHTML='<option value="all">全部</option>'+Object.entries(labels).map(([id,n])=>'<option value="'+esc(id)+'">'+esc(n)+'</option>').join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>choose(b.dataset.id));choose(Object.keys(labels)[0])}function choose(id){selected=id;$('chosen').textContent=labels[id]||id;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('on',b.dataset.id===id))}function reset(){editing=null;$('formTitle').textContent='📤 发布新内容';$('save').textContent='🚀 发布';$('cancel').classList.add('hide');$('title').value='';$('note').value='';$('content').value='';$('files').value='';$('date').value=today;$('kind').value='文章 / 资料'}async function publish(){try{saveCfg();if(!selected)throw Error('请选择版块');const title=$('title').value.trim(),content=$('content').value.trim();if(!title||!content)throw Error('标题和正文不能为空');const target=await readData(selected),id=editing?editing.id:'hs-'+Date.now();const files=[...$('files').files];if(files.length>6)throw Error('最多6张图片');const images=editing&&Array.isArray(editing.images)?[...editing.images]:[];for(let i=0;i<files.length;i++){if(files[i].size>5*1024*1024)throw Error('图片超过5MB：'+files[i].name);const safe=files[i].name.replace(/[^a-zA-Z0-9._-]/g,'_');const p='static/uploads/'+id+'-'+Date.now()+'-'+i+'-'+safe;const buf=await files[i].arrayBuffer();const bytes=new Uint8Array(buf);let bin='';for(let j=0;j<bytes.length;j+=32768)bin+=String.fromCharCode(...bytes.subarray(j,j+32768));await api(base()+'/contents/'+p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛集藏：上传图片',content:btoa(bin),branch:$('branch').value.trim()||'main'})});images.push('/'+p)}const rec={id,title,date:$('date').value||today,kind:$('kind').value,note:$('note').value.trim(),content,images,status:editing?.status||'published'};if(editing){const i=target.data.findIndex(x=>x.id===editing.id);if(i<0)throw Error('资料不存在，请刷新');target.data[i]=rec}else target.data.unshift(rec);await writeFile(target.path,JSON.stringify(target.data,null,2),'洪盛集藏：'+(editing?'修改':'发布')+' '+title,target.sha);$('action').textContent='✅ 操作成功';reset();await refresh()}catch(e){$('action').textContent='❌ '+e.message}}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const a=records.filter(x=>(f==='all'||x.cat===f)&&(!q||JSON.stringify(x.record).toLowerCase().includes(q)));$('list').innerHTML=a.map(x=>{const r=x.record,img=r.images&&r.images[0];return '<article class="item">'+(img?'<img src="'+esc(img)+'">':'')+'<div class="meta">'+esc(labels[x.cat]||x.cat)+' · '+esc(r.date||'')+' · '+esc(r.status||'published')+'</div><h3>'+esc(r.title)+'</h3><div>'+esc(r.note||'')+'</div><p>'+esc(r.content||'').slice(0,180)+'</p><div class="tools"><button class="btn primary" onclick="editItem('+JSON.stringify(x.cat)+','+JSON.stringify(r.id)+')">✏️ 修改</button><button class="btn gold" onclick="toggleItem('+JSON.stringify(x.cat)+','+JSON.stringify(r.id)+')">👁 '+(r.status==='hidden'?'上架':'下架')+'</button><button class="btn danger" onclick="removeItem('+JSON.stringify(x.cat)+','+JSON.stringify(r.id)+')">🗑 删除</button></div></article>'}).join('')||'<div class="empty wide">暂无资料</div>'}async function refresh(){try{records=[];for(const id of Object.keys(labels)){const d=await readData(id);d.data.forEach(record=>records.push({cat:id,record}))}render()}catch(e){$('action').textContent='❌ '+e.message}}window.editItem=async(cat,id)=>{try{const d=await readData(cat),r=d.data.find(x=>x.id===id);if(!r)throw Error('找不到资料');selected=cat;editing=r;$('chosen').textContent=labels[cat];$('formTitle').textContent='✏️ 修改资料';$('save').textContent='💾 保存修改';$('cancel').classList.remove('hide');$('title').value=r.title||'';$('note').value=r.note||'';$('content').value=r.content||'';$('date').value=r.date||today;$('kind').value=r.kind||'文章 / 资料';$('files').value='';window.scrollTo({top:0,behavior:'smooth'})}catch(e){$('action').textContent='❌ '+e.message}};window.toggleItem=async(cat,id)=>{try{const d=await readData(cat),r=d.data.find(x=>x.id===id);if(!r)throw Error('资料不存在');r.status=r.status==='hidden'?'published':'hidden';await writeFile(d.path,JSON.stringify(d.data,null,2),'洪盛集藏：'+(r.status==='hidden'?'下架':'上架')+' '+r.title,d.sha);await refresh();$('action').textContent='✅ 已'+(r.status==='hidden'?'下架':'上架')}catch(e){$('action').textContent='❌ '+e.message}};window.removeItem=async(cat,id)=>{if(!confirm('确定删除这条网站内容吗？'))return;try{const d=await readData(cat),i=d.data.findIndex(x=>x.id===id);if(i<0)throw Error('资料不存在');const r=d.data[i];d.data.splice(i,1);await writeFile(d.path,JSON.stringify(d.data,null,2),'洪盛集藏：删除 '+r.title,d.sha);await refresh();$('action').textContent='✅ 已删除'}catch(e){$('action').textContent='❌ '+e.message}};$('saveCfg').onclick=()=>{saveCfg();$('conn').textContent='✅ 已保存'};$('test').onclick=async()=>{try{saveCfg();const u=await api('/user');$('conn').textContent='✅ GitHub连接成功：'+u.login}catch(e){$('conn').textContent='❌ '+e.message}};$('save').onclick=publish;$('cancel').onclick=reset;$('refresh').onclick=async()=>{try{await loadConfig();await refresh();$('action').textContent='✅ 已重新读取网站内容'}catch(e){$('action').textContent='❌ '+e.message}};$('search').oninput=render;$('filter').onchange=render;(async()=>{try{await loadConfig();await refresh()}catch(e){$('action').textContent='❌ '+e.message}})();</script></body></html>
