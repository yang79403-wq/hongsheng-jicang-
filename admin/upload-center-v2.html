<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏资讯网｜网站发布工具</title><style>body{margin:0;background:#f6efe6;color:#30251f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{background:#4b0805;color:#fff;padding:22px}.wrap{max-width:1100px;width:94%;margin:auto}.head h1{margin:0;color:#f5d887;font-family:serif}.card{background:#fffdf9;border:1px solid #dfd1c2;border-radius:12px;padding:16px;margin:14px 0}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{font-weight:700;display:block;margin-bottom:4px}input,select,textarea{width:100%;padding:10px;border:1px solid #d8c9b9;border-radius:8px;box-sizing:border-box;font:inherit}textarea{min-height:150px}.btn{border:0;border-radius:8px;padding:10px 14px;margin:6px 5px 0 0;font-weight:700;cursor:pointer}.red{background:#741912;color:#fff}.gold{background:#c29a4b;color:#29120c}.gray{background:#71665e;color:#fff}.danger{background:#a1281d;color:#fff}.cats{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.cat{border:1px solid #d8c9b9;background:#fff8ef;border-radius:8px;padding:9px;cursor:pointer}.cat.on{background:#741912;color:#fff}.status{background:#f5eee6;padding:10px;border-radius:8px;margin-top:9px}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{border:1px solid #ddd0c2;padding:12px;border-radius:10px}.item img{width:100%;height:170px;object-fit:cover;border-radius:7px}.muted{color:#756b62;font-size:12px}.hide{display:none}@media(max-width:700px){.form,.items{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛集藏资讯网 · 网站发布工具</h1><div>新增发布｜修改｜图片｜上下架｜删除｜自动归类</div></div></header><main class="wrap"><section class="card"><h2>🔐 连接设置</h2><div class="form"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><button class="btn red" id="saveCfg">保存设置并读取网站</button><button class="btn gray" id="test">测试连接</button><div id="conn" class="status">Token 仅保存在本机浏览器。</div></section><section class="card"><h2 id="ft">📤 新增资料</h2><div id="cats">请先连接 GitHub</div><div class="status">当前版块：<b id="chosen">未选择</b></div><div class="form"><div><label>日期</label><input id="date" type="date"></div><div><label>内容类型</label><select id="kind"><option>文章 / 资料</option><option>鉴赏</option><option>行情价格</option><option>历史研究</option><option>公告 / 说明</option></select></div><div class="wide"><label>标题</label><input id="title"></div><div class="wide"><label>摘要</label><input id="note"></div><div class="wide"><label>正文</label><textarea id="content"></textarea></div><div class="wide"><label>图片</label><input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><div class="muted">最多6张，单张≤5MB</div></div></div><button class="btn gold" id="publish">🚀 发布</button><button class="btn gray hide" id="cancel">取消修改</button><button class="btn danger hide" id="delCurrent">删除当前资料</button><div id="action" class="status">等待操作</div></section><section class="card"><h2>📚 已发布内容</h2><input id="search" placeholder="搜索标题、摘要、正文"><button class="btn red" id="refresh">🔄 读取/刷新全部内容</button><div id="list" class="status">请先保存连接设置。</div><div id="items" class="items"></div></section></main><script>const $=id=>document.getElementById(id),TODAY=new Date().toISOString().slice(0,10);$('date').value=TODAY;let labels={},selected='',all=[],editing=null;try{let c=JSON.parse(localStorage.getItem('hsjc_tool')||'{}');['owner','repo','branch','token'].forEach(k=>{if(c[k])$(k).value=c[k]})}catch{}const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const b64=t=>{let a=new TextEncoder().encode(t),s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}async function api(path,opt={}){let token=$('token').value.trim();if(!token)throw Error('请填写 GitHub Token');let r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});let t=await r.text(),d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error((d.message||'GitHub请求失败')+'（'+r.status+'）');return d}async function gf(path){try{return await api(base()+'/contents/'+path+'?ref='+($('branch').value.trim()||'main'))}catch(e){if(String(e.message).includes('Not Found'))return null;throw e}}async function put(path,text,msg,sha){let x={message:msg,content:b64(text),branch:$('branch').value.trim()||'main'};if(sha)x.sha=sha;return api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)})}async function del(path){let f=await gf(path);if(!f)return;return api(base()+'/contents/'+path,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛集藏：删除资料文件',sha:f.sha,branch:$('branch').value.trim()||'main'})})}function dataPath(id){return id.startsWith('market_')?'data/market/'+id.slice(7)+'.json':id.startsWith('fujian_')?'data/market/'+id+'.json':'data/content/'+id+'.json'}async function data(id){let p=dataPath(id),f=await gf(p),a=[];if(f){try{a=JSON.parse(dec(f.content));if(!Array.isArray(a))a=[]}catch{a=[]}}return{p,f,a}}async function loadConfig(){let f=await gf('data/site-config.json');if(!f)throw Error('读取不到 data/site-config.json');let c=JSON.parse(dec(f.content));labels={};let h='';for(let g of Object.values(c.groups||{})){h+='<b>'+esc(g.title)+'</b><div class="cats">';for(let x of(g.items||[]).filter(x=>x.enabled)){labels[x.id]=x.name;h+='<button class="cat" data-id="'+esc(x.id)+'">'+esc(x.name)+'</button>'}h+='</div>'}$('cats').innerHTML=h;document.querySelectorAll('.cat').forEach(x=>x.onclick=()=>choose(x.dataset.id));let first=Object.keys(labels)[0];if(first)choose(first)}function choose(id){selected=id;$('chosen').textContent=labels[id]||id;document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x.dataset.id===id))}async function loadAll(){all=[];for(let id of Object.keys(labels)){let d=await data(id);d.a.forEach((r,i)=>all.push({id,idx:i,r}))}render();$('list').textContent='✅ 已读取 '+all.length+' 条资料'}function render(){let q=$('search').value.trim().toLowerCase(),a=all.filter(x=>!q||JSON.stringify(x.r).toLowerCase().includes(q));$('items').innerHTML=a.map((x,i)=>'<article class="item"><b>'+esc(labels[x.id])+'｜'+esc(x.r.title)+'</b>'+(x.r.images&&x.r.images[0]?'<img src="'+esc(x.r.images[0])+'">':'')+'<p>'+esc(x.r.note||x.r.content||'')+'</p><div class="muted">'+esc(x.r.date||'')+' · '+(x.r.status==='hidden'?'已下架':'已上架')+'</div><button class="btn gold" onclick="edit('+i+')">✏️ 修改</button><button class="btn gray" onclick="toggle('+i+')">👁 上下架</button><button class="btn danger" onclick="remove('+i+')">🗑 删除</button></article>').join('')||'<div class="status">暂无资料</div>'}function reset(){editing=null;$('ft').textContent='📤 新增资料';$('publish').textContent='🚀 发布';$('cancel').classList.add('hide');$('delCurrent').classList.add('hide');$('title').value='';$('note').value='';$('content').value='';$('images').value='';$('date').value=TODAY}async function save(){try{if(!selected)throw Error('请选择版块');let title=$('title').value.trim(),content=$('content').value.trim();if(!title||!content)throw Error('标题和正文不能为空');let d=await data(selected),id=editing?editing.r.id:'hs-'+Date.now(),imgs=editing&&Array.isArray(editing.r.images)?[...editing.r.images]:[];for(let f of $('images').files){if(f.size>5242880)throw Error('图片超过5MB');let name='static/uploads/'+id+'-'+Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');await api(base()+'/contents/'+name,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛集藏：上传图片',content:b64(await f.arrayBuffer()),branch:$('branch').value.trim()||'main'})});imgs.push('/'+name)}let r={id,title,content,note:$('note').value.trim(),kind:$('kind').value,date:$('date').value||TODAY,images:imgs,status:editing?editing.r.status:'published'};if(editing){let old=await data(editing.id);old.a.splice(editing.idx,1);if(editing.id===selected)d.a=old.a;else await put(old.p,JSON.stringify(old.a,null,2),'洪盛集藏：移动/修改资料',old.f?.sha);d.a.unshift(r)}else d.a.unshift(r);await put(d.p,JSON.stringify(d.a,null,2),editing?'洪盛集藏：修改资料':'洪盛集藏：发布资料',d.f?.sha);$('action').textContent='✅ 保存成功：'+labels[selected];reset();await loadAll()}catch(e){$('action').textContent='❌ '+e.message}}window.edit=async i=>{let x=all.filter(x=>!$('search').value.trim()||JSON.stringify(x.r).toLowerCase().includes($('search').value.trim().toLowerCase()))[i];editing=x;choose(x.id);$('title').value=x.r.title||'';$('note').value=x.r.note||'';$('content').value=x.r.content||'';$('date').value=x.r.date||TODAY;$('kind').value=x.r.kind||'文章 / 资料';$('images').value='';$('ft').textContent='✏️ 修改资料';$('publish').textContent='💾 保存修改';$('cancel').classList.remove('hide');$('delCurrent').classList.remove('hide');scrollTo({top:0,behavior:'smooth'})};window.toggle=async i=>{try{let x=all.filter(x=>!$('search').value.trim()||JSON.stringify(x.r).toLowerCase().includes($('search').value.trim().toLowerCase()))[i],d=await data(x.id);d.a[x.idx].status=d.a[x.idx].status==='hidden'?'published':'hidden';await put(d.p,JSON.stringify(d.a,null,2),'洪盛集藏：上下架',d.f?.sha);await loadAll()}catch(e){alert(e.message)}};window.remove=async i=>{if(!confirm('确定删除这条资料？'))return;try{let x=all.filter(x=>!$('search').value.trim()||JSON.stringify(x.r).toLowerCase().includes($('search').value.trim().toLowerCase()))[i],d=await data(x.id),r=d.a[x.idx];d.a.splice(x.idx,1);await put(d.p,JSON.stringify(d.a,null,2),'洪盛集藏：删除资料',d.f?.sha);for(let p of(r.images||[])){if(p.startsWith('/static/uploads/'))await del(p.slice(1))}await loadAll()}catch(e){alert(e.message)}};$('saveCfg').onclick=async()=>{localStorage.setItem('hsjc_tool',JSON.stringify({owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()}));try{await api('/user');$('conn').textContent='✅ GitHub连接成功';await loadConfig();await loadAll()}catch(e){$('conn').textContent='❌ '+e.message}};$('test').onclick=async()=>{try{await api('/user');$('conn').textContent='✅ GitHub连接成功'}catch(e){$('conn').textContent='❌ '+e.message}};$('publish').onclick=save;$('cancel').onclick=reset;$('delCurrent').onclick=()=>{if(editing){let i=all.indexOf(editing);if(i>=0)window.remove(i);reset()}};$('refresh').onclick=async()=>{try{await loadConfig();await loadAll()}catch(e){$('list').textContent='❌ '+e.message}};$('search').oninput=render;</script></body></html>
