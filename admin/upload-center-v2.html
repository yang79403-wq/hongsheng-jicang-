<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>洪盛集藏上传中心</title>
<style>
:root{--red:#741912;--gold:#b88a3b;--bg:#f7f1e8;--card:#fffdf8;--line:#e3d8cc;--text:#2d241e;--muted:#756b62}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif;line-height:1.6}.head{background:linear-gradient(135deg,#741912,#30100c);color:#fff;padding:24px 0}.wrap{width:min(1120px,94vw);margin:auto}.head h1{margin:0;color:#f4d47b;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:18px;margin:15px 0;box-shadow:0 5px 18px rgba(0,0,0,.05)}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--text)}textarea{min-height:170px;resize:vertical}.btn{border:0;border-radius:9px;padding:10px 15px;color:#fff;font-weight:800;cursor:pointer}.red{background:var(--red)}.gold{background:var(--gold);color:#30130f}.gray{background:#6d625a}.light{background:#eee5db;color:#4b4038}.danger{background:#9b241b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cat{border:1px solid var(--line);background:#faf7f2;border-radius:9px;padding:10px;text-align:left;cursor:pointer;font:inherit;color:var(--text)}.cat.on{background:var(--red);color:#fff}.status{padding:10px;background:#f5eee5;border-radius:9px;margin-top:10px}.hint{font-size:13px;color:var(--muted)}.hide{display:none!important}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff}.item img{width:100%;height:190px;object-fit:cover;border-radius:8px;margin-top:8px}.actions,.texttools,.imgtools{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.thumb{position:relative}.thumb img{width:100%;height:120px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}.thumb button{position:absolute;right:4px;top:4px;padding:4px 7px;border:0;border-radius:6px;background:#9b241b;color:#fff;font-weight:800;cursor:pointer}.empty{padding:18px;text-align:center;color:var(--muted);background:#faf7f2;border-radius:9px}@media(max-width:700px){.form,.grid,.items{grid-template-columns:1fr}.wrap{width:92vw}.item img{height:220px}.thumbs{grid-template-columns:repeat(2,1fr)}}
</style></head>
<body>
<header class="head"><div class="wrap"><h1>洪盛集藏上传中心</h1><div>全站资料管理：新增 · 文字编辑 · 图片上传 · 图片删除 · 修改 · 上下架 · 删除 · 自动归类</div></div></header>
<main class="wrap">
<section class="card"><h2>⚙️ 连接设置</h2><div class="form"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" autocomplete="off" placeholder="Contents 读写权限"></div></div><button class="btn red" id="saveCfg">保存设置</button><div id="cfgStatus" class="status">Token 仅保存在本机浏览器。</div></section>
<section class="card"><h2 id="formTitle">📤 新增资料</h2><p class="hint">可新增、修改、清空或补充文字；图片可逐张删除、重新上传；删除资料会同步删除资料记录及已关联图片。</p><div id="groups"></div><div class="status">当前版块：<b id="selectedName">读取中…</b></div>
<div class="form" style="margin-top:12px"><div class="wide"><label>发布版块</label><select id="category"></select></div><div><label>日期</label><input id="date" type="date"></div><div><label>内容类型</label><select id="kind"><option>文章 / 资料</option><option>鉴赏</option><option>行情价格</option><option>历史研究</option><option>公告 / 说明</option></select></div><div class="wide"><label>标题</label><input id="title"></div><div id="priceBox" class="wide hide"><label>参考价格（仅行情版块）</label><input id="price"></div><div class="wide"><label>摘要（可选）</label><input id="note"><div class="texttools"><button type="button" class="btn light" id="clearNote">清空摘要</button><button type="button" class="btn gold" id="addNote">新增摘要文字</button></div></div><div class="wide"><label>正文</label><textarea id="content" placeholder="在这里新增或修改文字内容"></textarea><div class="texttools"><button type="button" class="btn light" id="clearContent">清空正文</button><button type="button" class="btn gold" id="addParagraph">新增文字段落</button></div></div><div class="wide"><label>图片</label><input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><div class="hint">最多 6 张，单张不超过 5MB。编辑旧资料时，可以继续添加新图片。</div><div id="existingImages" class="thumbs"></div></div></div>
<div class="actions"><button class="btn gold" id="publish">📤 发布到网站</button><button class="btn gray hide" id="cancel">取消修改</button><button class="btn danger hide" id="deleteCurrent">🗑 删除当前资料</button></div><div id="pubStatus" class="status">等待操作</div></section>
<section class="card"><h2>📋 全部资料</h2><div class="form"><input id="search" placeholder="搜索标题、正文、价格"><select id="filter"><option value="all">全部版块</option></select><input id="filterDate" type="date"></div><button class="btn red" id="refresh" style="margin-top:9px">🔄 刷新资料</button><div id="loadStatus" class="status">尚未读取</div><div id="items" class="items" style="margin-top:10px"></div></section>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);const TODAY=new Date().toISOString().slice(0,10);$('date').value=TODAY;let LABEL={},PRICE=new Set(),all=[],editing=null,editingImages=[];const cfgKey='hsjc_cfg';let cfg=JSON.parse(localStorage.getItem(cfgKey)||'{}');for(const k of ['owner','repo','branch','token'])if(cfg[k])$(k).value=cfg[k];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function need(){if(!$('token').value.trim())throw Error('请先填写 GitHub Token');}function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim());}
async function api(path,opt={}){need();const r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json','Authorization':'Bearer '+$('token').value.trim(),'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d;}
function bytesToB64(buf){let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s);}function textToB64(text){return bytesToB64(new TextEncoder().encode(text));}function b64ToUtf8(s){const bin=atob(s.replace(/\s/g,''));const a=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder('utf-8').decode(a);}
async function getFile(path){try{return await api(base()+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value.trim()||'main'));}catch(e){if(String(e.message).includes('Not Found'))return null;throw e;}}
async function putText(path,text,msg,sha){const body={message:msg,content:textToB64(text),branch:$('branch').value.trim()||'main'};if(sha)body.sha=sha;return api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});}
async function putImage(path,file){return api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛集藏：上传图片',content:bytesToB64(await file.arrayBuffer()),branch:$('branch').value.trim()||'main'})});}
async function removeRepoFile(path,msg){const f=await getFile(path);if(!f)return;return api(base()+'/contents/'+path,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,sha:f.sha,branch:$('branch').value.trim()||'main'})});}
async function loadConfig(){const f=await getFile('data/site-config.json');if(!f)throw Error('找不到 data/site-config.json');return JSON.parse(b64ToUtf8(f.content));}
function pathFor(id){if(id.startsWith('market_'))return 'data/market/'+id.slice(7)+'.json';if(id.startsWith('fujian_'))return 'data/market/'+id+'.json';return 'data/content/'+id+'.json';}
async function readData(cat){const path=pathFor(cat),f=await getFile(path);let arr=[];if(f){try{const parsed=JSON.parse(b64ToUtf8(f.content));arr=Array.isArray(parsed)?parsed:[];}catch{arr=[];}}return{path,sha:f&&f.sha,arr};}async function saveData(d,msg){return putText(d.path,JSON.stringify(d.arr,null,2),msg,d.sha);}
function setupGroups(c){LABEL={};PRICE=new Set();let html='',cats='';for(const g of Object.values(c.groups||{})){html+='<h3>'+esc(g.title)+'</h3><div class="grid">';for(const x of(g.items||[]).filter(x=>x.enabled)){LABEL[x.id]=x.name;if(x.id.startsWith('market_'))PRICE.add(x.id);html+='<button class="cat" data-cat="'+esc(x.id)+'">'+esc(x.name)+'</button>';cats+='<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>';}html+='</div>';}$('groups').innerHTML=html;$('category').innerHTML=cats;$('filter').innerHTML='<option value="all">全部版块</option>'+cats;document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>selectCat(b.dataset.cat));$('category').onchange=e=>selectCat(e.target.value);const first=Object.keys(LABEL)[0];if(first)selectCat(first);}
function selectCat(k){$('category').value=k;$('selectedName').textContent=LABEL[k]||k;$('priceBox').classList.toggle('hide',!PRICE.has(k));document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('on',b.dataset.cat===k));}
async function uploadImages(id,files){const out=[...editingImages];for(let i=0;i<files.length;i++){const f=files[i];if(f.size>5*1024*1024)throw Error('图片 '+f.name+' 超过 5MB');const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-70);const name=id+'-'+Date.now()+'-'+i+'-'+safe;await putImage('static/uploads/'+name,f);out.push('/static/uploads/'+name);}return out;}
function showExisting(){const box=$('existingImages');box.innerHTML=editingImages.length?editingImages.map((src,i)=>'<div class="thumb"><img src="'+esc(src)+'" alt="图片"><button type="button" onclick="removeEditingImage('+i+')">删除</button></div>').join(''):'<div class="empty">当前没有已上传图片</div>';}
window.removeEditingImage=async i=>{if(!editing)return;if(!confirm('确定删除这张图片？删除后会同步删除网站文件。'))return;try{$('pubStatus').textContent='⏳ 正在删除图片……';const src=editingImages[i];const path=src.replace(/^\//,'');await removeRepoFile(path,'洪盛集藏：删除图片');editingImages.splice(i,1);showExisting();$('pubStatus').textContent='✅ 图片已删除，请点击“保存修改”更新资料';}catch(e){$('pubStatus').textContent='❌ 图片删除失败：'+e.message;}};
async function loadAll(){try{all=[];for(const cat of Object.keys(LABEL)){const d=await readData(cat);d.arr.forEach((r,i)=>all.push({cat,i,r}));}render();$('loadStatus').textContent='✅ 已读取 '+all.length+' 条资料';}catch(e){$('loadStatus').textContent='❌ 读取失败：'+e.message;}}
function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value,fd=$('filterDate').value;const a=all.filter(x=>(f==='all'||x.cat===f)&&(!fd||x.r.date===fd)&&(!q||[x.r.title,x.r.content,x.r.note,x.r.price].join(' ').toLowerCase().includes(q)));$('items').innerHTML=a.map(x=>{const idx=all.indexOf(x),r=x.r,img=Array.isArray(r.images)&&r.images[0]?r.images[0]:'';return '<article class="item"><b>'+esc(LABEL[x.cat])+' · '+esc(r.title)+'</b>'+(img?'<img src="'+esc(img)+'" alt="资料图片">':'<div class="status">暂无图片</div>')+(r.price?'<p><b>参考价格：</b>'+esc(r.price)+'</p>':'')+'<p>'+esc(r.content||r.note||'')+'</p><small>'+esc(r.date||'')+' · '+(r.status==='hidden'?'已下架':'已上架')+'</small><div class="actions"><button class="btn gold" onclick="editItem('+idx+')">✏️ 修改文字/图片</button><button class="btn gray" onclick="toggleItem('+idx+')">👁 '+(r.status==='hidden'?'上架':'下架')+'</button><button class="btn danger" onclick="deleteItem('+idx+')">🗑 删除资料+图片</button></div></article>';}).join('')||'<div class="empty">暂无资料</div>';}
window.editItem=i=>{const x=all[i];editing=x;editingImages=Array.isArray(x.r.images)?[...x.r.images]:[];selectCat(x.cat);$('date').value=x.r.date||TODAY;$('kind').value=x.r.kind||'文章 / 资料';$('title').value=x.r.title||'';$('price').value=x.r.price||'';$('note').value=x.r.note||'';$('content').value=x.r.content||'';$('images').value='';showExisting();$('formTitle').textContent='✏️ 修改资料';$('publish').textContent='💾 保存修改';$('cancel').classList.remove('hide');$('deleteCurrent').classList.remove('hide');scrollTo({top:0,behavior:'smooth'});};
function resetForm(){$('formTitle').textContent='📤 新增资料';$('publish').textContent='📤 发布到网站';$('cancel').classList.add('hide');$('deleteCurrent').classList.add('hide');$('title').value='';$('price').value='';$('note').value='';$('content').value='';$('images').value='';$('date').value=TODAY;editing=null;editingImages=[];showExisting();}
$('cancel').onclick=resetForm;$('clearNote').onclick=()=>{$('note').value='';};$('clearContent').onclick=()=>{if(confirm('确定清空正文文字？保存修改后才会同步到网站。'))$('content').value='';};$('addNote').onclick=()=>{$('note').value+=($('note').value?'\n':'')+'新增文字';$('note').focus();};$('addParagraph').onclick=()=>{$('content').value+=($('content').value?'\n\n':'')+'新增文字段落';$('content').focus();};
$('saveCfg').onclick=()=>{cfg={owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()};localStorage.setItem(cfgKey,JSON.stringify(cfg));$('cfgStatus').textContent='✅ 设置已保存';init();};
$('publish').onclick=async()=>{try{need();const cat=$('category').value,title=$('title').value.trim();if(!title)throw Error('请填写标题');const files=Array.from($('images').files||[]);if(files.length+editingImages.length>6)throw Error('每条资料最多保留 6 张图片');const id=editing?editing.r.id:Date.now().toString(36);$('pubStatus').textContent=files.length?'⏳ 正在上传图片……':'⏳ 正在保存文字……';const images=await uploadImages(id,files);const d=await readData(cat);const r={id,title,content:$('content').value.trim(),note:$('note').value.trim(),price:PRICE.has(cat)?$('price').value.trim():'',kind:$('kind').value,date:$('date').value||TODAY,images,status:editing?editing.r.status:'published'};if(editing&&editing.cat===cat)d.arr[editing.i]=r;else{if(editing){const old=await readData(editing.cat);old.arr.splice(editing.i,1);await saveData(old,'洪盛集藏：移动资料版块');}d.arr.unshift(r);}await saveData(d,editing?'洪盛集藏：修改资料':'洪盛集藏：发布资料');$('pubStatus').textContent='✅ '+(editing?'修改':'发布')+'成功：'+LABEL[cat];resetForm();await loadAll();}catch(e){$('pubStatus').textContent='❌ 操作失败：'+e.message;}};
async function removeAllImages(images){for(const src of images||[]){try{await removeRepoFile(src.replace(/^\//,''),'洪盛集藏：删除资料图片');}catch(e){console.warn('图片删除失败',src,e);}}}
window.deleteItem=async i=>{const x=all[i];if(!confirm('确定删除这条资料？\n资料文字、记录以及已关联图片都会删除。'))return;try{$('loadStatus').textContent='⏳ 正在删除资料和图片……';const d=await readData(x.cat);const r=d.arr[x.i];d.arr.splice(x.i,1);await saveData(d,'洪盛集藏：删除资料');await removeAllImages(r.images);await loadAll();$('pubStatus').textContent='✅ 资料及关联图片已删除';}catch(e){$('loadStatus').textContent='❌ 删除失败：'+e.message;}};
$('deleteCurrent').onclick=async()=>{if(!editing)return;const i=all.indexOf(editing);if(i>=0)await deleteItem(i);resetForm();};window.toggleItem=async i=>{try{const x=all[i],d=await readData(x.cat);d.arr[x.i].status=d.arr[x.i].status==='hidden'?'published':'hidden';await saveData(d,'洪盛集藏：上下架');await loadAll();}catch(e){alert('操作失败：'+e.message);}};
['search','filter','filterDate'].forEach(id=>$(id).addEventListener('input',render));$('refresh').onclick=loadAll;
async function init(){try{const c=await loadConfig();setupGroups(c);await loadAll();}catch(e){$('loadStatus').textContent='❌ 初始化失败：'+e.message;}}init();
</script></body></html>
