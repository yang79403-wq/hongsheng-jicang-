<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>洪盛集藏资讯网｜网站发布工具</title><style>:root{--r:#741912;--r2:#3a0704;--g:#b88a3b;--bg:#f6efe6;--card:#fffdf9;--line:#dfd1c2;--ink:#30251f;--muted:#746a61;--danger:#a1281d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}.head{background:linear-gradient(135deg,var(--r2),var(--r));color:#fff;padding:22px 0}.wrap{width:min(1120px,94vw);margin:auto}.head h1{margin:0;color:#f5d887;font:900 28px "Noto Serif SC","Songti SC",serif}.head p{margin:5px 0 0;color:#ead9c2;font-size:13px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;margin:14px 0;box-shadow:0 5px 18px #0000000a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.form{display:grid;grid-template-columns:1fr 1fr;gap:11px}.wide{grid-column:1/-1}label{display:block;font-weight:800;margin:0 0 5px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:inherit}textarea{min-height:160px;resize:vertical}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.primary{background:var(--r);color:#fff}.gold{background:var(--g);color:#30130d}.gray{background:#71665e;color:#fff}.danger{background:var(--danger);color:#fff}.light{background:#eee5dc;color:#4b4038}.status{margin-top:9px;padding:10px 12px;border-radius:9px;background:#f5eee6;font-size:13px}.hint{font-size:12px;color:var(--muted)}.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.cat{border:1px solid var(--line);background:#faf7f2;border-radius:9px;padding:10px;text-align:left;cursor:pointer;color:var(--ink);font:inherit}.cat.on{background:var(--r);color:#fff;border-color:var(--r)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}.item{border:1px solid var(--line);border-radius:11px;background:#fff;padding:13px}.item h3{margin:0;color:var(--r);font-size:17px}.item img{width:100%;height:180px;object-fit:cover;border-radius:8px;margin:8px 0}.meta{font-size:11px;color:var(--muted)}.text{font-size:13px;white-space:pre-wrap;max-height:110px;overflow:hidden}.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.thumb{position:relative}.thumb img{width:100%;height:100px;object-fit:cover;border:1px solid var(--line);border-radius:7px}.thumb button{position:absolute;right:3px;top:3px;border:0;background:var(--danger);color:#fff;border-radius:5px;padding:3px 6px;font-size:11px}.hide{display:none!important}.ok{color:#14723a}.bad{color:#a1281d}.empty{padding:18px;text-align:center;color:var(--muted);background:#faf7f2;border-radius:9px}@media(max-width:700px){.grid,.form,.items{grid-template-columns:1fr}.wide{grid-column:auto}.thumbs{grid-template-columns:repeat(2,1fr)}.head h1{font-size:23px}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛集藏资讯网 · 网站发布工具</h1><p>新增发布｜修改文字｜图片管理｜上架/下架｜删除资料｜自动归类</p></div></header><main class="wrap"><section class="card"><h2>🔐 GitHub 连接</h2><div class="form"><div><label>用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" autocomplete="off" placeholder="Contents 读写权限"></div></div><div class="toolbar"><button class="btn primary" id="saveCfg">保存设置</button><button class="btn gray" id="test">测试连接</button></div><div id="conn" class="status">Token 只保存在本机浏览器。</div></section><section class="card"><h2 id="editorTitle">📤 新增资料</h2><div id="cats"></div><div class="status">当前版块：<b id="chosen">读取中…</b></div><div class="form" style="margin-top:12px"><div><label>日期</label><input id="date" type="date"></div><div><label>内容类型</label><select id="kind"><option>文章 / 资料</option><option>鉴赏</option><option>行情价格</option><option>历史研究</option><option>公告 / 说明</option></select></div><div class="wide"><label>标题</label><input id="title" placeholder="请输入资料标题"></div><div class="wide hide" id="priceRow"><label>参考价格（仅行情资料）</label><input id="price" placeholder="仅作学习交流参考，不代表交易报价"></div><div class="wide"><label>摘要</label><input id="note" placeholder="版块列表显示的简短说明"></div><div class="wide"><label>正文</label><textarea id="content" placeholder="输入完整资料内容"></textarea></div><div class="wide"><label>图片</label><input id="files" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><div class="hint">新增最多6张；单张≤5MB。修改时保留原图，并可继续添加图片。</div><div id="thumbs" class="thumbs"></div></div></div><div class="toolbar"><button class="btn gold" id="save">🚀 发布资料</button><button class="btn gray hide" id="cancel">取消修改</button><button class="btn danger hide" id="deleteCurrent">🗑 删除当前资料</button></div><div id="actionStatus" class="status">等待操作</div></section><section class="card"><h2>📚 已发布资料</h2><div class="form"><div><label>搜索</label><input id="search" placeholder="标题、正文、摘要、价格"></div><div><label>版块筛选</label><select id="filter"><option value="all">全部版块</option></select></div></div><div class="toolbar"><button class="btn primary" id="refresh">🔄 重新读取</button></div><div id="listStatus" class="status">请先连接 GitHub。</div><div id="items" class="items"></div></section></main><script>'use strict';const $=id=>document.getElementById(id),CFG='hsjc_publish_cfg_v4';let labels={},priceCats=new Set(),records=[],editing=null,editImages=[];const today=new Date().toISOString().slice(0,10);$('date').value=today;try{const c=JSON.parse(localStorage.getItem(CFG)||'{}');for(const k of ['owner','repo','branch','token'])if(c[k])$(k).value=c[k]}catch{}const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}function saveCfg(){localStorage.setItem(CFG,JSON.stringify({owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()}))}async function api(path,opt={}){if(!$('token').value.trim())throw Error('请先填写 GitHub Token');const r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+$('token').value.trim(),'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}const enc=s=>{const a=new TextEncoder().encode(s);let z='';for(let i=0;i<a.length;i+=32768)z+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(z)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));async function file(path){try{return await api(base()+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value.trim()||'main'))}catch(e){if(String(e.message).includes('Not Found'))return null;throw e}}async function put(path,text,msg,sha){const b={message:msg,content:enc(text),branch:$('branch').value.trim()||'main'};if(sha)b.sha=sha;return api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})}async function putImg(path,f){return api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛集藏：上传图片',content:enc(await f.arrayBuffer()),branch:$('branch').value.trim()||'main'})})}async function del(path,msg){const f=await file(path);if(!f)return;return api(base()+'/contents/'+path,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,sha:f.sha,branch:$('branch').value.trim()||'main'})})}function dataPath(id){return id.startsWith('market_')?'data/market/'+id.slice(7)+'.json':id.startsWith('fujian_')?'data/market/'+id+'.json':'data/content/'+id+'.json'}async function read(id){const path=dataPath(id),f=await file(path);let data=[];if(f){try{data=JSON.parse(dec(f.content));if(!Array.isArray(data))data=[]}catch{data=[]}}return{path,sha:f?.sha||null,data}}async function config(){const f=await file('data/site-config.json');if(!f)throw Error('找不到 data/site-config.json');const c=JSON.parse(dec(f.content));labels={};priceCats=new Set();let h='';for(const g of Object.values(c.groups||{})){h+='<div style="margin:12px 0 5px;font-weight:900;color:#741912">'+esc(g.title)+'</div><div class="grid">';for(const x of(g.items||[]).filter(x=>x.enabled)){labels[x.id]=x.name;if(x.id.startsWith('market_'))priceCats.add(x.id);h+='<button class="cat" data-id="'+esc(x.id)+'">'+esc(x.name)+'</button>'}h+='</div>'}$('cats').innerHTML=h;$('filter').innerHTML='<option value="all">全部版块</option>'+Object.entries(labels).map(([id,n])=>'<option value="'+esc(id)+'">'+esc(n)+'</option>').join('');document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>choose(b.dataset.id));choose(Object.keys(labels)[0])}let selected='';function choose(id){selected=id;$('chosen').textContent=labels[id]||id;$('priceRow').classList.toggle('hide',!priceCats.has(id));document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('on',b.dataset.id===id))}function reset(){editing=null;editImages=[];$('editorTitle').textContent='📤 新增资料';$('save').textContent='🚀 发布资料';$('cancel').classList.add('hide');$('deleteCurrent').classList.add('hide');$('title').value='';$('note').value='';$('content').value='';$('price').value='';$('files').value='';$('date').value=today;$('kind').value='文章 / 资料';thumbs()}function thumbs(){const fs=[...$('files').files];$('thumbs').innerHTML=editImages.map((s,i)=>'<div class="thumb"><img src="'+esc(s)+'"><button type="button" onclick="removeImg('+i+')">删除</button></div>').join('')+fs.map(f=>'<div class="thumb"><img src="'+URL.createObjectURL(f)+'"></div>').join('')}window.removeImg=async i=>{if(!editing)return;const s=editImages[i];if(!confirm('确定删除这张已发布图片？'))return;try{if(s.startsWith('/static/uploads/'))await del(s.slice(1),'洪盛集藏：删除图片');editImages.splice(i,1);thumbs();$('actionStatus').textContent='✅ 图片已删除'}catch(e){$('actionStatus').textContent='❌ '+e.message}};$('files').onchange=thumbs;async function upload(id){const fs=[...$('files').files];if(editImages.length+fs.length>6)throw Error('每条资料最多6张图片');const out=[...editImages];for(let i=0;i<fs.length;i++){if(fs[i].size>5*1024*1024)throw Error('图片超过5MB：'+fs[i].name);const safe=fs[i].name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-60);const p='static/uploads/'+id+'-'+Date.now()+'-'+i+'-'+safe;await putImg(p,fs[i]);out.push('/'+p)}return out}async function saveRecord(){try{saveCfg();if(!selected)throw Error('请选择版块');const title=$('title').value.trim(),content=$('content').value.trim();if(!title)throw Error('标题不能为空');if(!content)throw Error('正文不能为空');$('actionStatus').textContent='⏳ 正在保存……';const target=await read(selected);const id=editing?editing.id:'hs-'+Date.now();const imgs=await upload(id);const rec={id,title,date:$('date').value||today,kind:$('kind').value,note:$('note').value.trim(),content,images:imgs,status:editing?editing.status:'published'};if(priceCats.has(selected)&&$('price').value.trim())rec.price=$('price').value.trim();if(editing){const idx=target.data.findIndex(r=>r.id===editing.id);if(idx<0)throw Error('原资料不存在，请重新刷新');target.data[idx]=rec}else target.data.unshift(rec);await put(target.path,JSON.stringify(target.data,null,2),editing?'洪盛集藏：修改资料 '+title:'洪盛集藏：发布资料 '+title,target.sha);$('actionStatus').innerHTML='<span class="ok">✅ '+(editing?'修改':'发布')+'成功</span>';reset();await load()}catch(e){$('actionStatus').innerHTML='<span class="bad">❌ '+esc(e.message)+'</span>'}}async function load(){try{records=[];for(const id of Object.keys(labels)){const d=await read(id);d.data.forEach(r=>records.push({cat:id,record:r}))}render();$('listStatus').textContent='✅ 已读取 '+records.length+' 条资料'}catch(e){$('listStatus').innerHTML='<span class="bad">❌ '+esc(e.message)+'</span>'}}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;const arr=records.filter(x=>(f==='all'||x.cat===f)&&(!q||[x.record.title,x.record.note,x.record.content,x.record.price].join(' ').toLowerCase().includes(q)));$('items').innerHTML=arr.map(x=>{const i=records.indexOf(x),r=x.record,img=r.images?.[0];return '<article class="item">'+(img?'<img src="'+esc(img)+'">':'')+'<h3>'+esc(r.title)+'</h3><div class="meta">'+esc(labels[x.cat])+' · '+esc(r.date||'')+' · '+(r.status==='hidden'?'已下架':'已上架')+'</div>'+(r.price?'<p><b>参考价格：</b>'+esc(r.price)+'</p>':'')+'<p class="text">'+esc(r.note||r.content||'')+'</p><div class="toolbar"><button class="btn gold" onclick="edit('+i+')">✏️ 修改</button><button class="btn gray" onclick="toggle('+i+')">👁 '+(r.status==='hidden'?'上架':'下架')+'</button><button class="btn danger" onclick="remove('+i+')">🗑 删除</button></div></article>'}).join('')||'<div class="empty">暂无资料</div>'}window.edit=i=>{const x=records[i];editing=x.record;selected=x.cat;choose(selected);$('editorTitle').textContent='✏️ 修改资料';$('save').textContent='💾 保存修改';$('cancel').classList.remove('hide');$('deleteCurrent').classList.remove('hide');$('date').value=editing.date||today;$('kind').value=editing.kind||'文章 / 资料';$('title').value=editing.title||'';$('note').value=editing.note||'';$('content').value=editing.content||'';$('price').value=editing.price||'';$('files').value='';editImages=[...(editing.images||[])];thumbs();scrollTo({top:0,behavior:'smooth'});$('actionStatus').textContent='正在编辑：'+editing.title};$('cancel').onclick=reset;window.toggle=async i=>{try{const x=records[i],d=await read(x.cat),n=d.data.find(r=>r.id===x.record.id);if(!n)throw Error('资料不存在');n.status=n.status==='hidden'?'published':'hidden';await put(d.path,JSON.stringify(d.data,null,2),'洪盛集藏：'+(n.status==='hidden'?'下架':'上架')+' '+n.title,d.sha);await load()}catch(e){alert('操作失败：'+e.message)}};window.remove=async i=>{const x=records[i];if(!confirm('确定删除“'+x.record.title+'”？'))return;try{$('listStatus').textContent='⏳ 正在删除……';const d=await read(x.cat),idx=d.data.findIndex(r=>r.id===x.record.id);if(idx<0)throw Error('资料不存在');const r=d.data[idx];d.data.splice(idx,1);await put(d.path,JSON.stringify(d.data,null,2),'洪盛集藏：删除资料 '+r.title,d.sha);for(const s of(r.images||[]))if(typeof s==='string'&&s.startsWith('/static/uploads/'))try{await del(s.slice(1),'洪盛集藏：删除关联图片')}catch{}if(editing&&editing.id===r.id)reset();await load();$('listStatus').textContent='✅ 删除成功'}catch(e){$('listStatus').innerHTML='<span class="bad">❌ 删除失败：'+esc(e.message)+'</span>'}};$('deleteCurrent').onclick=async()=>{if(!editing)return;const i=records.findIndex(x=>x.record.id===editing.id);if(i>=0)await remove(i);reset()};$('saveCfg').onclick=()=>{saveCfg();$('conn').textContent='✅ 设置已保存'};$('test').onclick=async()=>{try{saveCfg();const u=await api('/user');$('conn').innerHTML='<span class="ok">✅ GitHub 连接成功：'+esc(u.login)+'</span>'}catch(e){$('conn').innerHTML='<span class="bad">❌ '+esc(e.message)+'</span>'}};$('save').onclick=saveRecord;$('refresh').onclick=async()=>{try{await config();await load()}catch(e){$('listStatus').innerHTML='<span class="bad">❌ '+esc(e.message)+'</span>'}};$('search').oninput=render;$('filter').onchange=render;(async()=>{try{await config();await load()}catch(e){$('listStatus').innerHTML='<span class="bad">❌ '+esc(e.message)+'</span>'}})();</script></body></html>
