<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏 · 新版网站同步中心</title><style>body{margin:0;background:#f7f1e8;color:#2b2521;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1100px,94vw);margin:auto}.head{background:linear-gradient(135deg,#3d0906,#701811,#430a07);color:#fff;padding:28px 0}.head h1{margin:0;color:#f3d88f;font-family:"Noto Serif SC","Songti SC",serif}.card{background:#fffdf9;border:1px solid #dfd0b8;border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 10px 30px #3a1f1208}.status{padding:11px;border-radius:10px;background:#f4ead9;margin-top:10px}.btn{border:0;border-radius:9px;padding:10px 15px;font-weight:800;cursor:pointer}.red{background:#6d1712;color:#fff}.gold{background:#b99550;color:#35100c}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.item{border:1px solid #dfd0b8;border-radius:12px;padding:12px}.ok{color:#27633f;font-weight:800}.warn{color:#9a5c16;font-weight:800}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{width:92vw}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛集藏 · 新版网站同步中心</h1><p>网站前台、上传中心、AI 设计、人工设计统一检查。</p></div></header><main class="wrap"><section class="card"><h2>🔗 当前新版网站</h2><div class="grid"><a class="item" href="../" target="_blank">🌐 打开网站前台</a><a class="item" href="upload-center-v2.html" target="_blank">📤 打开上传中心</a><a class="item" href="site-editor-ai-v2.html" target="_blank">🤖 打开 AI 设计师</a></div></section><section class="card"><h2>🧩 当前统一规则</h2><div class="status">🥈 银元 · 机制币：前台、行情、上传分类统一<br>🪙 铜钱 / 铜元 / 💴 纸币 / 🏛 福建钱币：保持原版<br>💰 只有行情资料显示价格<br>🖼 图片、文字、详情页沿用原资料系统<br>📱 手机 / 💻 电脑自动适配</div></section><section class="card"><h2>🛡️ 发布前检查</h2><p>新版网站的设计调整只允许修改视觉参数，不应删除资料、图片或既有栏目，除非人工明确操作。</p><button class="btn red" onclick="location.reload()">🔄 重新检查</button><div id="s" class="status">正在检查……</div></section></main><script>const tests=[['网站前台','
