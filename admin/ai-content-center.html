<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏 AI 内容中心</title><style>body{margin:0;background:#f6f0e7;color:#302822;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{background:linear-gradient(135deg,#4b0805,#7d2015);color:#f6d98d;padding:20px}.wrap{max-width:1180px;width:94%;margin:auto}.card{background:#fffdf9;border:1px solid #dfcdb4;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.metric{background:#fbf4e8;padding:14px;border-radius:10px}.metric b{font-size:26px}.btn{border:0;border-radius:8px;padding:10px 14px;margin:4px;font-weight:800;cursor:pointer}.red{background:#71150d;color:#fff}.gold{background:#c7a35a;color:#30160e}.green{background:#327044;color:#fff}.gray{background:#766d65;color:#fff}.row{padding:12px;border:1px solid #e6d9c8;border-radius:9px;margin:8px 0;background:#fffaf3}.muted{color:#756b63;font-size:13px}.tip{background:#fff5dc;border:1px solid #e0c78d;padding:11px;border-radius:9px}textarea,input,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8c8b6;border-radius:8px;font:inherit}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="head"><div class="wrap"><h1>🏮 洪盛集藏 AI 内容中心</h1><div>本地资料库 → AI整理 → 人工审核 → 网站发布</div></div></header><main class="wrap"><section class="card"><h2>📊 内容流水线</h2><div class="grid"><div class="metric"><div>待处理资料</div><b id="n0">0</b></div><div class="metric"><div>草稿</div><b id="n1">0</b></div><div class="metric"><div>已发布</div><b id="n2">0</b></div></div></section><section class="card"><h2>📥 本地资料导入</h2><div class="tip">把电脑资料按“洪盛资料库/福建钱币、银元、铜元、古钱、纸币、评级资料、行情资料……”分类保存。此网页工具不能直接读取你电脑硬盘，需先使用本地发布程序扫描。</div><p><button class="btn gold" onclick="downloadConfig()">⬇️ 下载本地资料库配置</button><button class="btn gray" onclick="showHelp()">📖 查看本地运行说明</button></p><pre id="help" style="white-space:pre-wrap"></pre></section><section class="card"><h2>🤖 AI整理规则</h2><div class="grid"><div><label>目标版块</label><select id="section"><option>福建铜钱 银元 铜币 纸币</option><option>收藏交流 · 鉴赏参考</option><option>行情资料参考</option><option>评级知识</option><option>收藏知识</option></select></div><div><label>处理状态</label><select id="status"><option value="draft">草稿，推荐</option><option value="published">直接发布</option></select></div><div><label>资料标题</label><input id="title" placeholder="例如：福建官局造光绪元宝"></div></div><label>资料内容</label><textarea id="text" rows="8" placeholder="粘贴需要AI整理的本地资料"></textarea><button class="btn red" onclick="makeDraft()">🤖 整理成网站草稿</button><div id="result"></div></section><section class="card"><h2>🚀 发布规则</h2><div class="tip">默认安全模式：AI只整理资料，不自动编造事实；新内容先进入草稿。确认无误后再由正式网站编辑工具发布。图片、原始资料和客服二维码属于独立资源，不允许自动发布程序覆盖。</div></section><section class="card"><h2>🔗 正式网站管理</h2><a class="btn red" href="dashboard.html">进入全站网站编辑发布系统</a></section></main><script>function showHelp(){document.querySelector('#help').textContent='本地电脑：\n1. 建立“洪盛资料库”文件夹。\n2. 按银元、铜元、古钱、纸币、福建钱币、评级资料、行情资料分类。\n3. 设置 HONGSHENG_LIBRARY 指向该目录。\n4. 运行 tools/hongsheng_local_publisher.py。\n5. 默认生成草稿清单，不会直接公开。\n6. 审核后再使用网站后台发布。'}function makeDraft(){let t=document.querySelector('#title').value.trim(),x=document.querySelector('#text').value.trim(),s=document.querySelector('#section').value;if(!t||!x)return alert('请填写标题和资料');document.querySelector('#result').innerHTML='<div class="row"><b>'+esc(t)+'</b><div class="muted">目标版块：'+esc(s)+' · 草稿</div><p>'+esc(x.slice(0,240))+'…</p><span class="btn green">已生成草稿预览</span></div>'}function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function downloadConfig(){let a=document.createElement('a');a.href='../data/ai-pipeline.json';a.download='hongsheng-ai-pipeline.json';a.click()}</script></body></html>
