<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>洪盛收藏资讯网｜全网站内容管理</title><style>:root{--r:#68100a;--g:#d6b35b;--bg:#f5eee5;--card:#fffdf9;--line:#dfcdae;--ink:#332722;--muted:#766a61}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{background:linear-gradient(135deg,#350604,#75170f);color:#fff;padding:22px}.wrap{width:min(1180px,94vw);margin:auto}.brand{color:#f6d985;font:900 27px/1.2 "Songti SC",serif}.sub{font-size:12px;color:#ead9bf;margin-top:5px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:800;margin:6px 0}input,textarea,select{width:100%;padding:10px;border:1px solid #d8c8b5;border-radius:8px;font:inherit}textarea{min-height:100px}.btn{border:0;border-radius:8px;padding:9px 13px;margin:4px;font-weight:800;cursor:pointer}.red{background:var(--r);color:#fff}.gold{background:var(--g);color:#32130d}.gray{background:#756a63;color:#fff}.danger{background:#a62a20;color:#fff}.status{padding:10px;border-radius:8px;background:#f8efe4;margin-top:10px;font-size:13px}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab{white-space:nowrap;padding:9px 13px;border:1px solid var(--line);background:#fff9f0;border-radius:8px;font-weight:800;cursor:pointer}.tab.on{background:var(--r);color:#fff}.panel{display:none}.panel.on{display:block}.list{display:grid;gap:8px}.row{border:1px solid #eadfce;background:#fffaf3;border-radius:9px;padding:10px}.rowtop{display:flex;justify-content:space-between;gap:8px;align-items:center}.row small{color:var(--muted)}.pill{font-size:11px;padding:3px 7px;border-radius:999px;background:#ead9bc}.muted{color:var(--muted);font-size:12px}.dangerText{color:#9b241d}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.rowtop{align-items:flex-start;flex-direction:column}}
</style></head><body><header class="head"><div class="wrap"><div class="brand">洪盛收藏资讯网 · 全网站内容管理</div><div class="sub">一键读取全部内容 → 增加 / 修改 / 删除 → 保存 GitHub → 网站同步</div></div></header><main class="wrap"><section class="card"><h2>🔐 连接网站</h2><div class="grid"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><button class="btn red" id="load">🔄 一键读取整个网站</button><a class="btn gold" href="../">🌐 打开网站</a><div id="status" class="status">尚未读取网站。</div></section><nav class="tabs"><button class="tab on" data-p="home">🏠 首页</button><button class="tab" data-p="groups">🗂️ 全部版块</button><button class="tab" data-p="services">⭐ 服务内容</button><button class="tab" data-p="lists">📚 全部列表</button><button class="tab" data-p="style">🎨 字体颜色</button><button class="tab" data-p="images">🖼️ 首页图片</button><button class="tab" data-p="qr">📱 二维码</button></nav><section id="home" class="panel on"><div class="card"><h2>🏠 首页全部文字</h2><div class="grid"><div><label>网站名称</label><input id="siteName"></div><div><label>首页标题</label><input id="heroTitle"></div><div class="wide"><label>首页介绍</label><textarea id="heroText"></textarea></div><div class="wide"><label>顶部公告</label><textarea id="topNotice"></textarea></div></div><button class="btn gold" onclick="saveHome()">保存首页</button></div><div class="card"><h2>📜 公益声明</h2><div class="grid"><div><label>声明标题</label><input id="pwTitle"></div><div class="wide"><label>声明内容</label><textarea id="pwText"></textarea></div></div><button class="btn gold" onclick="savePW()">保存公益声明</button></div></section><section id="groups" class="panel"><div class="card"><h2>🗂️ 一级版块与子版块</h2><div id="groupsList"></div></div><div class="card"><h2>➕ 新增一级版块</h2><div class="grid"><div><label>ID</label><input id="gid"></div><div><label>标题</label><input id="gtitle"></div><div class="wide"><label>说明</label><textarea id="gsub"></textarea></div></div><button class="btn red" onclick="addGroup()">新增版块</button></div></section><section id="services" class="panel"><div class="card"><h2>⭐ 服务内容全部管理</h2><div id="serviceList"></div><button class="btn red" onclick="addService()">➕ 新增服务版块</button></div></section><section id="lists" class="panel"><div class="card"><h2>📚 全部列表内容</h2><p class="muted">所有条目都可以新增、修改、删除。修改后立即保存到统一网站配置。</p><div id="listEditors"></div></div></section><section id="style" class="panel"><div class="card"><h2>🎨 全站字体与颜色</h2><div class="grid"><div><label>标题字体</label><input id="titleFont"></div><div><label>正文字体</label><input id="bodyFont"></div><div><label>主色</label><input id="primary" type="color"></div><div><label>金色</label><input id="accent" type="color"></div><div><label>标题颜色</label><input id="titleColor" type="color"></div><div><label>正文颜色</label><input id="bodyColor" type="color"></div></div><button class="btn gold" onclick="saveStyle()">保存视觉</button></div></section><section id="images" class="panel"><div class="card"><h2>🖼️ 首页图片</h2><div class="muted">图片内容、标题、说明、显示状态、顺序、位置、尺寸都可管理。</div><div id="imagesList"></div></div></section><section id="qr" class="panel"><div class="card"><h2>📱 客服二维码</h2><div class="grid"><div><label>二维码说明</label><input id="qrLabel"></div><div><label>二维码内容</label><input id="qrData"></div><div><label>二维码图片路径</label><input id="qrPath"></div></div><button class="btn gold" onclick="saveQR()">保存二维码</button></div></section></main><script>const $=id=>document.getElementById(id),KEY='hsjc_all_editor';let cfg=null,sha=null;const enc=new TextEncoder(),b64=s=>{let a=enc.encode(s),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));try{let x=JSON.parse(localStorage.getItem(KEY)||'{}');for(let k of ['owner','repo','branch','token'])if(x[k])$(k).value=x[k]}catch{}function saveLocal(){localStorage.setItem(KEY,JSON.stringify({owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()}))}function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}async function api(path,opt={}){let t=$('token').value.trim();if(!t)throw Error('请填写 GitHub Token');let r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}}),txt=await r.text(),d={};try{d=JSON.parse(txt)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}async function readFile(){return api(base()+'/contents/data/site-config.json?ref='+encodeURIComponent($('branch').value.trim()||'main'))}async function writeConfig(msg){let wrapper={content:JSON.stringify(cfg,null,2)};let r=await api(base()+'/contents/data/site-config.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛收藏资讯网：'+msg,content:b64(JSON.stringify(wrapper,null,2)),branch:$('branch').value.trim()||'main',sha})});sha=r.content?.sha||sha;$('status').textContent='✅ '+msg+'，GitHub 已保存，网站等待 Pages 同步'}async function loadSite(){try{saveLocal();let f=await readFile();sha=f.sha;let raw=JSON.parse(dec(f.content));cfg=typeof raw.content==='string'?JSON.parse(raw.content):raw;renderAll();$('status').textContent='✅ 已完整读取网站：'+Object.keys(cfg.groups||{}).length+' 个版块、'+(cfg.serviceSections||[]).length+' 个服务区。'}catch(e){$('status').textContent='❌ 读取失败：'+e.message}}function renderAll(){let t=cfg.theme||{},pw=cfg.publicWelfareNotice||{};$('siteName').value=cfg.siteName||'';$('heroTitle').value=cfg.heroTitle||'';$('heroText').value=cfg.heroText||'';$('topNotice').value=cfg.topNotice||'';$('pwTitle').value=pw.title||'';$('pwText').value=pw.text||'';$('titleFont').value=t.titleFont||'';$('bodyFont').value=t.bodyFont||'';$('primary').value=t.primary||'#68100a';$('accent').value=t.accent||'#d6b35b';$('titleColor').value=t.titleColor||'#741912';$('bodyColor').value=t.bodyColor||'#332722';let q=cfg.consult||{};$('qrLabel').value=q.qrLabel||'';$('qrData').value=q.qrData||'';$('qrPath').value=q.qr||'';renderGroups();renderServices();renderLists();renderImages()}function renderGroups(){let html='';for(let [gid,g] of Object.entries(cfg.groups||{})){html+='<div class="row"><div class="rowtop"><b>🗂️ '+E(g.title||gid)+'</b><span class="pill">'+E(gid)+'</span></div><small>'+E(g.subtitle||'')+'</small><div><button class="btn gold" onclick="editGroup(\''+gid+'\')">修改版块</button><button class="btn danger" onclick="delGroup(\''+gid+'\')">删除版块</button><button class="btn red" onclick="addItem(\''+gid+'\')">➕ 新增内容</button></div><div class="list">'+(g.items||[]).map((it,i)=>'<div class="row"><div class="rowtop"><span><b>'+E(it.name)+'</b><br><small>'+E(it.id)+'</small></span><span><button class="btn gold" onclick="editItem(\''+gid+'\','+i+')">修改</button><button class="btn danger" onclick="delItem(\''+gid+'\','+i+')">删除</button></span></div></div>').join('')+'</div></div>'}$('groupsList').innerHTML=html||'<div class="status">暂无版块</div>'}function renderServices(){let a=cfg.serviceSections||[];$('serviceList').innerHTML=a.map((s,i)=>'<div class="row"><div class="rowtop"><b>⭐ '+E(s.title||s.id||'服务版块')+'</b><span><button class="btn gold" onclick="editService('+i+')">修改</button><button class="btn danger" onclick="delService('+i+')">删除</button></span></div><small>'+E(s.subtitle||'')+'</small><div class="list">'+(s.items||[]).map((x,j)=>'<div class="row"><div class="rowtop"><span>'+E(x)+'</span><span><button class="btn gold" onclick="editServiceItem('+i+','+j+')">修改</button><button class="btn danger" onclick="delServiceItem('+i+','+j+')">删除</button></span></div></div>').join('')+'</div><button class="btn red" onclick="addServiceItem('+i+')">➕ 新增服务内容</button></div>').join('')}function renderLists(){let defs=[['collectionScope','🪙 收藏范围'],['dailyContent','📅 日常交流内容'],['serviceRange','📍 服务范围'],['security','🛡️ 安全说明']];$('listEditors').innerHTML=defs.map(([key,title])=>'<div class="row"><div class="rowtop"><b>'+title+'</b><span class="pill">'+(cfg[key]||[]).length+' 条</span></div><div class="list">'+(cfg[key]||[]).map((x,i)=>'<div class="row"><div class="rowtop"><span>'+E(x)+'</span><span><button class="btn gold" onclick="editList(\''+key+'\','+i+')">修改</button><button class="btn danger" onclick="delList(\''+key+'\','+i+')">删除</button></span></div></div>').join('')+'</div><button class="btn red" onclick="addList(\''+key+'\')">➕ 新增</button></div>').join('')}function renderImages(){let a=cfg.homepageImages||[];$('imagesList').innerHTML=a.length?a.map((x,i)=>'<div class="row"><div class="rowtop"><b>'+E(x.title||'首页图片')+'</b><span class="pill">'+(x.enabled===false?'隐藏':'显示')+' · 顺序 '+(x.order??i)+'</span></div><small>'+E(x.url||'')+'</small><div><button class="btn gold" onclick="editImage('+i+')">修改</button><button class="btn danger" onclick="delImage('+i+')">删除</button><button class="btn gray" onclick="toggleImage('+i+')">'+(x.enabled===false?'显示':'隐藏')+'</button></div></div>').join(''):'<div class="status">暂无首页图片</div>'}async function saveHome(){cfg.siteName=$('siteName').value;cfg.heroTitle=$('heroTitle').value;cfg.heroText=$('heroText').value;cfg.topNotice=$('topNotice').value;await writeConfig('修改首页内容')}async function savePW(){cfg.publicWelfareNotice={title:$('pwTitle').value,text:$('pwText').value};await writeConfig('修改公益声明')}async function saveStyle(){cfg.theme=cfg.theme||{};Object.assign(cfg.theme,{titleFont:$('titleFont').value,bodyFont:$('bodyFont').value,primary:$('primary').value,accent:$('accent').value,titleColor:$('titleColor').value,bodyColor:$('bodyColor').value});await writeConfig('修改字体颜色')}async function saveQR(){cfg.consult=cfg.consult||{};cfg.consult.qrLabel=$('qrLabel').value;cfg.consult.qrData=$('qrData').value;cfg.consult.qr=$('qrPath').value;await writeConfig('修改客服二维码')}window.editGroup=async id=>{let g=cfg.groups[id],t=prompt('版块标题：',g.title||id);if(t===null)return;let s=prompt('版块说明：',g.subtitle||'');if(s===null)return;g.title=t;g.subtitle=s;cfg.nav=(cfg.nav||[]).map(n=>n.id===id?({...n,name:t}):n);await writeConfig('修改版块 '+id);renderAll()};window.delGroup=async id=>{if(!confirm('确定删除版块？该操作会从网站配置移除版块，但不会删除图片或 GitHub 其他文件。'))return;delete cfg.groups[id];cfg.nav=(cfg.nav||[]).filter(n=>n.id!==id);await writeConfig('删除版块 '+id);renderAll()};window.addGroup=async()=>{let id=$('gid').value.trim(),t=$('gtitle').value.trim();if(!/^[A-Za-z0-9_]+$/.test(id)||!t)return alert('ID 只能使用英文、数字、下划线');if(cfg.groups?.[id])return alert('ID 已存在');cfg.groups=cfg.groups||{};cfg.groups[id]={title:t,subtitle:$('gsub').value,enabled:true,items:[]};cfg.nav=cfg.nav||[];cfg.nav.push({id,name:t,enabled:true});await writeConfig('新增版块 '+id);renderAll()};window.editItem=async(g,i)=>{let x=cfg.groups[g].items[i],n=prompt('内容标题：',x.name);if(n===null)return;let id=prompt('内容 ID：',x.id);if(id===null)return;x.name=n;x.id=id;await writeConfig('修改版块内容');renderAll()};window.delItem=async(g,i)=>{if(!confirm('确定删除此版块内容？'))return;cfg.groups[g].items.splice(i,1);await writeConfig('删除版块内容');renderAll()};window.addItem=async g=>{let n=prompt('新内容名称：');if(!n)return;let id=prompt('内容 ID（英文/数字/下划线）：',Date.now().toString());if(!id)return;cfg.groups[g].items=cfg.groups[g].items||[];cfg.groups[g].items.push({id,name:n,enabled:true});await writeConfig('新增版块内容');renderAll()};window.editService=async i=>{let s=cfg.serviceSections[i],t=prompt('服务版块标题：',s.title||'');if(t===null)return;let sub=prompt('服务版块说明：',s.subtitle||'');if(sub===null)return;s.title=t;s.subtitle=sub;await writeConfig('修改服务版块');renderAll()};window.delService=async i=>{if(!confirm('删除整个服务版块？'))return;cfg.serviceSections.splice(i,1);await writeConfig('删除服务版块');renderAll()};window.addService=async()=>{let t=prompt('新服务版块标题：');if(!t)return;let sub=prompt('说明：','');cfg.serviceSections=cfg.serviceSections||[];cfg.serviceSections.push({id:'service_'+Date.now(),title:t,subtitle:sub,items:[]});await writeConfig('新增服务版块');renderAll()};window.editServiceItem=async(i,j)=>{let s=cfg.serviceSections[i];let x=prompt('服务内容：',s.items[j]);if(x===null)return;s.items[j]=x;await writeConfig('修改服务内容');renderAll()};window.delServiceItem=async(i,j)=>{if(!confirm('删除该服务内容？'))return;cfg.serviceSections[i].items.splice(j,1);await writeConfig('删除服务内容');renderAll()};window.addServiceItem=async i=>{let x=prompt('新增服务内容：');if(!x)return;cfg.serviceSections[i].items.push(x);await writeConfig('新增服务内容');renderAll()};window.editList=async(k,i)=>{let x=prompt('修改内容：',cfg[k][i]);if(x===null)return;cfg[k][i]=x;await writeConfig('修改 '+k);renderAll()};window.delList=async(k,i)=>{if(!confirm('删除该条内容？'))return;cfg[k].splice(i,1);await writeConfig('删除 '+k);renderAll()};window.addList=async k=>{let x=prompt('新增内容：');if(!x)return;cfg[k]=cfg[k]||[];cfg[k].push(x);await writeConfig('新增 '+k);renderAll()};window.editImage=async i=>{let x=cfg.homepageImages[i],t=prompt('图片标题：',x.title||'');if(t===null)return;let d=prompt('图片说明：',x.description||'');if(d===null)return;let o=prompt('显示顺序：',x.order??i);if(o===null)return;let p=prompt('显示位置 hero / notice / collection / services / contact：',x.position||'collection');if(p===null)return;x.title=t;x.description=d;x.order=Number(o)||0;x.position=p;await writeConfig('修改首页图片');renderAll()};window.delImage=async i=>{if(!confirm('从首页删除这张图片？原文件不会删除。'))return;cfg.homepageImages.splice(i,1);await writeConfig('删除首页图片');renderAll()};window.toggleImage=async i=>{let x=cfg.homepageImages[i];x.enabled=x.enabled===false;await writeConfig((x.enabled?'显示':'隐藏')+'首页图片');renderAll()};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(b.dataset.p).classList.add('on')});$('load').onclick=loadSite;</script></body></html>
