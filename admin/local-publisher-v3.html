<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>洪盛集藏｜本地资料自动发布中心 V3</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5eee3;color:#302821;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:#650f09;color:#f6d68f;padding:20px}.wrap{width:min(1180px,94vw);margin:auto}.top h1{margin:0;font:900 28px "Songti SC","STSong",serif}.top p{margin:8px 0 0}.panel{background:#fffaf3;border:1px solid #ddc8a8;border-radius:14px;padding:20px;margin:18px 0;box-shadow:0 4px 16px #4d1b0b10}h2{margin-top:0;color:#71170f;font-family:"Songti SC","STSong",serif}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field label{display:block;font-weight:800;font-size:13px;margin:7px 0}input,select,textarea,button{font:inherit;border:1px solid #cdbb9f;border-radius:8px;padding:10px}input,select,textarea{width:100%;background:#fff}textarea{min-height:130px;resize:vertical}button{background:#70170f;color:#fff3d0;border:0;font-weight:800;cursor:pointer}.secondary{background:#9b7941}.danger{background:#7b3328}.status{padding:12px;border-radius:8px;background:#f1e5d2;white-space:pre-wrap;margin-top:12px}.drop{border:2px dashed #b99355;padding:25px;text-align:center;border-radius:10px;background:#fffdf9}.files{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}.file{padding:12px;border:1px solid #dfd0bc;border-radius:8px;background:#fff}.file img{width:100%;max-height:190px;object-fit:contain;margin-top:8px}.muted{color:#786d63;font-size:12px}.check{display:flex;align-items:center;gap:8px;margin:10px 0}.check input{width:auto}.queue-item{border:1px solid #ddcfbb;border-radius:10px;padding:14px;margin:10px 0;background:#fff}.queue-item .head{display:flex;justify-content:space-between;gap:8px;align-items:center}.tag{display:inline-block;background:#eee0ca;border-radius:99px;padding:4px 9px;font-size:12px;margin:3px}.log{font:12px ui-monospace,SFMono-Regular,Menlo,monospace;background:#24130f;color:#f4dfb2;padding:12px;border-radius:8px;max-height:280px;overflow:auto;white-space:pre-wrap}.barbox{height:10px;background:#e3d8c8;border-radius:9px;overflow:hidden}.bar{height:100%;width:0;background:#8a2a18;transition:.2s}.ok{color:#16723b;font-weight:800}.bad{color:#a12718;font-weight:800}.image-slot{border:1px dashed #b99355;padding:10px;margin-top:8px;border-radius:8px}.image-slot img{max-width:180px;max-height:120px;object-fit:contain;display:block}.smallbtn{width:auto;padding:7px 10px}@media(max-width:760px){.grid,.files{grid-template-columns:1fr}.top h1{font-size:24px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1>🏮 洪盛集藏 · 本地资料自动发布中心 V3</h1><p>本地电脑资料库 → 扫描 → 自动分类 → 审核 → 图片上传 → GitHub → 网站同步</p></div></header>
<main class="wrap">
<section class="panel"><h2>① GitHub 连接</h2><div class="grid"><div class="field"><label>GitHub Token</label><input id="token" type="password" placeholder="github_pat_..." autocomplete="off"><div class="muted">Token 仅保存在当前浏览器会话，不写入网站文件。</div></div><div class="field"><label>仓库</label><input id="repo" value="yang79403-wq/yang79403-wq.github.io"></div><div class="field"><label>分支</label><input id="branch" value="main"></div></div><div style="margin-top:12px" class="grid"><button onclick="testToken()">🔐 检查 Token</button><button class="secondary" onclick="loadConfig()">📚 读取网站版块</button><button class="danger" onclick="clearToken()">清除 Token</button></div><div id="status" class="status">尚未连接</div></section>
<section class="panel"><h2>② 获取本地资料</h2><div class="drop"><p><b>电脑：</b>选择整个资料文件夹</p><button onclick="pickFolder()">📁 选择资料文件夹</button><p><b>电脑 / 手机：</b>也可以一次选择多个文件</p><input id="fileInput" type="file" multiple accept=".txt,.md,.csv,.json,.html,.htm,.xml,.jpg,.jpeg,.png,.webp,.gif,.svg,.pdf,.doc,.docx" onchange="handleFiles(this.files)"><p class="muted">支持 TXT、MD、CSV、JSON、HTML、XML、图片。PDF/DOC/DOCX 暂进入待处理，不会伪造提取结果。</p></div><div id="fileList" class="files"></div></section>
<section class="panel"><h2>③ 整理与发布规则</h2><div class="grid"><div class="field"><label>默认发布版块</label><select id="category"></select></div><div class="field"><label>资料类型</label><select id="kind"><option>收藏知识</option><option>鉴赏参考</option><option>历史研究</option><option>版别研究</option><option>市场行情资料</option><option>福建钱币资料</option><option>评级知识</option><option>藏品展示</option></select></div><div class="field"><label>重复内容</label><select id="dup"><option value="yes">相同标题跳过</option><option value="no">允许重复</option></select></div></div><label class="check"><input id="auto" type="checkbox" checked> 根据文件名和正文自动判断版块</label><label class="check"><input id="images" type="checkbox" checked> 同批图片自动上传到 static/uploads，并插入文章</label><button onclick="buildQueue()">🧠 扫描并生成发布队列</button><div id="queue"></div></section>
<section class="panel"><h2>④ 审核与发布</h2><div class="barbox"><div id="bar" class="bar"></div></div><div class="grid" style="margin-top:12px"><button onclick="publish()">🚀 发布已勾选资料</button><button class="secondary" onclick="clearQueue()">清空队列</button><button class="danger" onclick="clearFiles()">清空本地文件</button></div><div id="publishStatus" class="status">等待发布</div><div id="log" class="log"></div></section>
</main>
<script>
const $=id=>document.getElementById(id),API='https://api.github.com';let localFiles=[],queue=[],cfg=null;
const FALLBACK=[['market_yinyuan_jizhibi','行情资料参考 / 银元 铜元 机制币'],['market_tongqian','行情资料参考 / 古钱 花钱 行情价参考'],['market_zhibi','行情资料参考 / 纸币行情报价'],['yinyuan_jizhibi','收藏交流 / 银元 铜元 机制币'],['tongqian','收藏交流 / 铜钱鉴赏'],['zhibi','收藏交流 / 纸币鉴赏'],['appreciation','收藏交流 / 鉴赏参考'],['knowledge','收藏交流 / 收藏知识'],['history','收藏交流 / 钱币历史'],['culture','收藏交流 / 收藏文化'],['experience','收藏交流 / 收藏经验'],['fujian','福建钱币 / 福建钱币收藏资料'],['services','评级知识 / 评级知识交流'],['advisor','收藏知识 / 收藏知识交流'],['consult','免费交流咨询']];
function init(){category.innerHTML=FALLBACK.map(x=>'<option value="'+x[0]+'">'+x[1]+'</option>').join('')}
function auth(){return token.value.trim()||sessionStorage.getItem('hs_github_token')||''}
function headers(){return {'Accept':'application/vnd.github+json','Authorization':'Bearer '+auth(),'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function log(s){$('log').textContent+=new Date().toLocaleTimeString()+' '+s+'\n';$('log').scrollTop=$('log').scrollHeight}
function clearToken(){sessionStorage.removeItem('hs_github_token');token.value='';status.textContent='已清除本次 Token'}
async function api(path,opt={}){let r;try{r=await fetch(API+path,{...opt,headers:{...headers(),...(opt.headers||{})}})}catch(e){throw new Error('网络请求失败：'+e.message)}let j=await r.json().catch(()=>({}));if(!r.ok){if(r.status===401)throw new Error('GitHub Token 无效或已过期（401）。');if(r.status===403)throw new Error('GitHub 权限不足（403），需要 Contents: Read and write。');if(r.status===404)throw new Error('仓库或文件不存在（404）。');throw new Error((j.message||r.status)+'：'+path)}return j}
async function testToken(){try{if(!token.value.trim()&&sessionStorage.getItem('hs_github_token'))token.value=sessionStorage.getItem('hs_github_token');let j=await api('/user');sessionStorage.setItem('hs_github_token',token.value.trim());status.innerHTML='<span class="ok">✓ Token 有效</span>\nGitHub 用户：'+esc(j.login)+'\n可以继续读取版块和发布资料。';log('Token 验证成功：'+j.login)}catch(e){status.innerHTML='<span class="bad">✕ '+esc(e.message)+'</span>';log('Token 检查失败：'+e.message)}}
async function loadConfig(){try{if(!auth())throw new Error('请先输入 GitHub Token');let j=await api('/repos/'+repo.value.trim()+'/contents/data/site-config.json?ref='+encodeURIComponent(branch.value.trim()));let raw=JSON.parse(atob(j.content.replace(/\n/g,'')));cfg=typeof raw.content==='string'?JSON.parse(raw.content):raw;let opts=[];(cfg.nav||[]).filter(n=>n.enabled!==false).forEach(n=>{let g=cfg.groups?.[n.id];(g?.items||[]).filter(x=>x.enabled!==false).forEach(x=>opts.push({id:x.id,name:n.name+' / '+x.name}))});if(opts.length)category.innerHTML=opts.map(x=>'<option value="'+esc(x.id)+'">'+esc(x.name)+'</option>').join('');status.textContent='✓ 网站配置读取成功：'+(opts.length||FALLBACK.length)+' 个可选版块';log('网站配置读取成功；中文显示采用 UTF-8 与内置版块兜底')}catch(e){status.innerHTML='<span class="bad">✕ '+esc(e.message)+'</span>';log('配置读取失败：'+e.message)}}
async function pickFolder(){if(!window.showDirectoryPicker){alert('当前浏览器不支持文件夹读取，请改用“选择多个文件”。');return}try{let h=await window.showDirectoryPicker();localFiles=[];await walk(h,'');renderFiles();log('已读取 '+localFiles.length+' 个本地文件')}catch(e){if(e.name!=='AbortError')log('文件夹读取失败：'+e.message)}}
async function walk(dir,prefix){for await(const [name,h] of dir.entries()){if(name.startsWith('.'))continue;if(h.kind==='file')localFiles.push({file:await h.getFile(),path:prefix+name});else if(h.kind==='directory'&&!['node_modules','.git'].includes(name))await walk(h,prefix+name+'/')}}
function handleFiles(list){localFiles=Array.from(list).map(f=>({file:f,path:f.webkitRelativePath||f.name}));renderFiles();log('已选择 '+localFiles.length+' 个文件')}
function renderFiles(){fileList.innerHTML=localFiles.map(x=>{let f=x.file,img=f.type.startsWith('image/')?'<img src="'+URL.createObjectURL(f)+'">':'';return '<div class="file"><b>'+esc(x.path)+'</b><div class="muted">'+esc(f.type||'未知类型')+' · '+Math.round(f.size/1024)+' KB</div>'+img+'</div>'}).join('')||'<div class="muted">尚未选择资料</div>'}
function textOf(f){if(f.type.startsWith('image/'))return Promise.resolve('');if(/\.(txt|md|csv|json|html?|xml)$/i.test(f.name))return f.text();return Promise.resolve('')}
function cleanTitle(n){return n.replace(/\.(txt|md|csv|json|html?|xml|pdf|docx?)$/i,'').replace(/[_-]+/g,' ').trim()||'未命名资料'}
function guess(text,name){let s=(name+' '+text).toLowerCase();if(/福建|泉州|厦门|漳州|福州|闽|福建钱币/.test(s))return 'fujian';if(/银元|袁大头|船洋|龙洋|铜元|机制币/.test(s))return 'yinyuan_jizhibi';if(/古钱|铜钱|五铢|清钱|花钱|古泉/.test(s))return 'tongqian';if(/纸币|人民币|冠号|钞票/.test(s))return 'zhibi';if(/评级|pcgs|ngc|pmg|华夏/.test(s))return 'knowledge';if(/历史|年代|铸造|钱局/.test(s))return 'history';if(/版别|版式|边齿/.test(s))return 'knowledge';if(/行情|成交|价格|报价/.test(s))return 'market_yinyuan_jizhibi';return category.value||'knowledge'}
function summary(t){return t.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ').trim().slice(0,220)}
async function buildQueue(){if(!localFiles.length){alert('请先选择本地资料');return}queue=[];for(const x of localFiles){let f=x.file;if(f.type.startsWith('image/'))continue;let text=await textOf(f);queue.push({source:x,title:cleanTitle(f.name),category:$('auto').checked?guess(text,f.name):category.value,kind:$('kind').value,content:text,note:summary(text),unsupported:/\.(pdf|doc|docx)$/i.test(f.name)&&!text,selected:true})}renderQueue();log('已生成 '+queue.length+' 条候选资料')}
function renderQueue(){queue.innerHTML='';$('queue').innerHTML=queue.length?queue.map((q,i)=>'<div class="queue-item"><div class="head"><label class="check"><input type="checkbox" '+(q.selected?'checked':'')+' onchange="queue['+i+'].selected=this.checked"><b>'+esc(q.title)+'</b></label><span class="tag">'+esc(label(q.category))+'</span></div><div class="muted">来源：'+esc(q.source.path)+'　类型：'+esc(q.kind)+(q.unsupported?'　⚠ PDF/DOC/DOCX 待转换':'')+'</div><textarea onchange="queue['+i+'].content=this.value">'+esc(q.content||q.note)+'</textarea></div>').join(''):'<p class="muted">暂无候选资料</p>'}
function label(id){return (FALLBACK.find(x=>x[0]===id)||[])[1]||id}
function clearQueue(){queue=[];renderQueue();publishStatus.textContent='发布队列已清空'}
function clearFiles(){localFiles=[];renderFiles();clearQueue();log('已清空本地资料')}function b64(buf){let u=new Uint8Array(buf),s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode(...u.subarray(i,i+32768));return btoa(s)}
async function getFile(path){try{return await api('/repos/'+repo.value.trim()+'/contents/'+path+'?ref='+encodeURIComponent(branch.value.trim()))}catch(e){if(e.message.startsWith('仓库或文件不存在'))return null;throw e}}
async function putText(path,text,msg){let old=await getFile(path),body={message:msg,content:b64(new TextEncoder().encode(text)),branch:branch.value.trim()};if(old?.sha)body.sha=old.sha;return api('/repos/'+repo.value.trim()+'/contents/'+path,{method:'PUT',body:JSON.stringify(body)})}
async function uploadImage(f){let safe=f.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-'),path='static/uploads/'+Date.now()+'-'+safe;await api('/repos/'+repo.value.trim()+'/contents/'+path,{method:'PUT',body:JSON.stringify({message:'本地资料图片：'+f.name,content:b64(await f.arrayBuffer()),branch:branch.value.trim()})});return '/'+path}
async function publish(){let list=queue.filter(q=>q.selected);if(!list.length){alert('没有勾选可发布资料');return}if(!auth()){alert('请先检查 Token');return}let done=0;for(const q of list){try{if(q.unsupported)throw new Error('该文件格式暂未提取，请先转换为 TXT/MD');let images=[];if(images.checked){for(const x of localFiles){if(x.file.type.startsWith('image/')&&x.path!==q.source.path)images.push(await uploadImage(x.file))}}let path='data/content/'+q.category+'.json',old=await getFile(path),arr=[];if(old){let raw=JSON.parse(atob(old.content.replace(/\n/g,'')));arr=Array.isArray(raw)?raw:[]}if(dup.value==='yes'&&arr.some(a=>a.title===q.title)){log('跳过重复：'+q.title);done++;continue}arr.unshift({id:q.category+'-'+Date.now(),title:q.title,date:new Date().toISOString().slice(0,10),kind:q.kind,content:q.content,note:q.note,images,status:'published',source:'本地资料库'});await putText(path,JSON.stringify(arr,null,2),'本地资料自动发布：'+q.title);log('✓ 已发布：'+q.title);done++;bar.style.width=Math.round(done/list.length*100)+'%';publishStatus.textContent='已完成 '+done+' / '+list.length}catch(e){log('✕ 发布失败：'+q.title+'：'+e.message)}}publishStatus.textContent='发布完成：'+done+' / '+list.length}
init();
</script>
</body></html>
