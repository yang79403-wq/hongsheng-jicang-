<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>洪盛集藏｜全站管理 V14</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5eee5;color:#332722;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:linear-gradient(135deg,#430705,#861b12);color:#f7d98d;padding:18px}.wrap{width:min(1280px,94vw);margin:auto}.card{background:#fffdf9;border:1px solid #dfcdae;border-radius:14px;padding:14px;margin:12px 0;box-shadow:0 3px 14px #6b4a2210}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{display:block;font-weight:800;margin:5px 0}input,textarea,select{width:100%;padding:9px;border:1px solid #d8c8b5;border-radius:8px;font:inherit;background:#fff}textarea{min-height:90px}.btn{border:0;border-radius:8px;padding:9px 12px;margin:3px;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.red{background:#68100a;color:#fff}.gold{background:#d6b35b;color:#32130d}.green{background:#2f6b3b;color:#fff}.blue{background:#315b82;color:#fff}.gray{background:#756a63;color:#fff}.danger{background:#a62a20;color:#fff}.status{padding:10px;background:#f8efe4;border-radius:8px;white-space:pre-wrap;line-height:1.6}.ok{background:#e8f5e9;color:#245d2b}.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tab{padding:8px 12px;border:1px solid #d6c3a9;border-radius:999px;background:#fff;white-space:nowrap;font-weight:800;cursor:pointer}.tab.on{background:#68100a;color:#fff}.row{border:1px solid #eadfce;background:#fffaf3;border-radius:9px;padding:10px;margin:7px 0}.muted{font-size:12px;color:#766}.tag{display:inline-block;padding:2px 7px;border-radius:20px;background:#eadbc3;font-size:11px}.pub{background:#e5f3e8;color:#276035}.draft{background:#eee9e3;color:#6d6259}.raw{white-space:pre-wrap;background:#24110e;color:#f5dfad;padding:12px;border-radius:8px;max-height:520px;overflow:auto;font:12px/1.5 monospace}.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.pic{border:1px solid #decfb9;padding:7px;border-radius:8px;background:#fff}.pic img{width:100%;height:110px;object-fit:contain;background:#eee}.hint{font-size:12px;color:#766}.busy{opacity:.6;pointer-events:none}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><h1>🏮 洪盛集藏 · 全站管理 V14</h1><div>内容管理｜首页配置｜版块管理｜图片管理｜真实读取｜网站同步</div></div></header>
<main class="wrap">
<section class="card">
<h2>🔐 连接网站数据</h2>
<div class="grid">
<div><label>用户名</label><input id="owner" value="yang79403-wq"></div>
<div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div>
<div><label>分支</label><input id="branch" value="main"></div>
<div><label>访问令牌</label><input id="token" type="password" placeholder="需要网站内容读写权限"></div>
</div>
<div><button class="btn red" onclick="loadAll()">🔄 读取全站</button><button class="btn blue" onclick="testConnection()">🔌 测试连接</button><button class="btn gray" onclick="clearToken()">清除令牌</button><a class="btn gold" href="../" target="_blank">🌐 打开网站</a></div>
<div id="status" class="status">尚未连接。请输入访问令牌后点击“读取全站”。</div>
</section>
<nav class="tabs">
<button class="tab on" onclick="showTab('articles',this)">📰 内容管理</button>
<button class="tab" onclick="showTab('config',this)">🏠 首页与版块</button>
<button class="tab" onclick="showTab('images',this)">🖼️ 图片管理</button>
<button class="tab" onclick="showTab('raw',this)">🔎 数据检查</button>
</nav>
<section id="articles">
<section class="card"><h2>📰 网站内容</h2>
<div class="grid"><div><label>内容库</label><select id="lib" onchange="loadLib()"></select></div><div><label>筛选</label><select id="filter" onchange="renderList()"><option value="all">全部</option><option value="published">已发布</option><option value="draft">草稿 / 下架 / 隐藏</option></select></div></div>
<div class="hint">系统会读取 data/content 和 data/market 下的 JSON 内容库。修改后直接同步到网站。</div><div id="list"></div></section>
<section class="card"><h2>✍️ 内容编辑</h2>
<div class="grid">
<div><label>内容编号</label><input id="id"></div><div><label>标题</label><input id="title"></div>
<div><label>日期</label><input id="date" type="date"></div><div><label>分类</label><input id="kind"></div>
<div><label>状态</label><select id="state"><option value="published">已发布</option><option value="draft">草稿 / 下架</option><option value="hidden">隐藏</option></select></div>
<div><label>所属版块</label><select id="group"></select></div>
<div class="wide"><label>摘要</label><textarea id="note"></textarea></div>
<div class="wide"><label>正文</label><textarea id="body" style="min-height:320px"></textarea></div>
<div class="wide"><label>图片路径（一行一张）</label><textarea id="imgs"></textarea></div>
<div><label>转移到内容库</label><select id="targetLib"></select></div>
</div>
<button class="btn green" onclick="saveArticle('published')">💾 保存并发布</button><button class="btn gold" onclick="saveArticle('draft')">📝 保存草稿</button><button class="btn blue" onclick="moveArticle()">↔️ 转移内容</button><button class="btn danger" onclick="deleteArticle()">🗑️ 删除内容</button><button class="btn gray" onclick="newArticle()">➕ 新建内容</button>
</section></section>
<section id="config" style="display:none">
<section class="card"><h2>🏠 首页文字</h2><div class="grid"><div><label>网站名称</label><input id="siteName"></div><div><label>首页标题</label><input id="heroTitle"></div><div class="wide"><label>首页介绍</label><textarea id="heroText"></textarea></div><div class="wide"><label>顶部公告</label><textarea id="topNotice"></textarea></div></div><button class="btn gold" onclick="saveConfigFields()">💾 保存首页</button></section>
<section class="card"><h2>📜 公益性声明</h2><input id="pwTitle"><textarea id="pwText"></textarea><button class="btn gold" onclick="saveConfigFields()">💾 保存声明</button></section>
<section class="card"><h2>🗂️ 版块标题</h2><div id="groups"></div><button class="btn gold" onclick="saveConfigFields()">💾 保存版块</button></section>
<section class="card"><h2>🧰 完整网站配置</h2><textarea id="configJson" style="min-height:520px;font-family:monospace"></textarea><button class="btn red" onclick="saveConfigJson()">保存完整配置</button></section>
</section>
<section id="images" style="display:none">
<section class="card"><h2>🖼️ 上传图片</h2><input id="files" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><button class="btn gold" onclick="uploadImages()">⬆️ 上传图片</button><div class="hint">图片保存到 static/uploads/，上传后可复制路径到内容编辑器。</div><div id="imageStatus" class="status">尚未读取图片库</div></section>
<section class="card"><div id="gallery" class="pics"></div></section>
</section>
<section id="raw" style="display:none"><section class="card"><pre id="rawbox" class="raw">尚未读取</pre></section></section>
</main>
<script>
const $=id=>document.getElementById(id);
let cfg={},cfgSha='',libs=[],items=[],source='',fileSha='',sel=-1,all=[];
const API='https://api.github.com', enc=new TextEncoder();
function b64(s){const a=enc.encode(s);let o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)}
function dec(s){return new TextDecoder().decode(Uint8Array.from(atob(String(s).replace(/\s/g,'')),c=>c.charCodeAt(0)))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function branch(){return $('branch').value.trim()||'main'}
function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}
function token(){return $('token').value.trim()||sessionStorage.getItem('hs_admin_token')||''}
function headers(extra={}){return {Accept:'application/vnd.github+json','Authorization':'Bearer '+token(),'X-GitHub-Api-Version':'2022-11-28',...extra}}
async function api(path,opt={}){if(!token())throw Error('请先填写访问令牌');let r=await fetch(API+path,{...opt,headers:headers(opt.headers||{})});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error((d.message||'GitHub请求失败')+'（'+r.status+'）');return d}
async function getPath(path){return api(base()+'/contents/'+path.split('/').map(encodeURIComponent).join('/')+'?ref='+encodeURIComponent(branch()))}
async function putText(path,text,sha,msg){let z={message:'洪盛集藏：'+msg,content:b64(text),branch:branch()};if(sha)z.sha=sha;let r=await api(base()+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(z)});return r.content?.sha||''}
async function putB64(path,data,sha,msg){let z={message:'洪盛集藏：'+msg,content:data,branch:branch()};if(sha)z.sha=sha;let r=await api(base()+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(z)});return r.content?.sha||''}
async function deletePath(path,sha,msg){return api(base()+'/contents/'+path.split('/').map(encodeURIComponent).join('/'),{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛集藏：'+msg,sha,branch:branch()})})}
function setStatus(s,ok=false){$('status').className='status '+(ok?'ok':'');$('status').textContent=s}
function showTab(id,b){['articles','config','images','raw'].forEach(x=>$(x).style.display='none');$(id).style.display='block';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(id==='images'&&token())loadImages()}
function clearToken(){sessionStorage.removeItem('hs_admin_token');$('token').value='';setStatus('已清除本机访问令牌。')}
async function testConnection(){try{setStatus('⏳ 正在测试连接……');let u=await api('/user');let r=await api(base());sessionStorage.setItem('hs_admin_token',token());setStatus('✅ 连接成功\n用户：'+u.login+'\n仓库：'+r.full_name+'\n分支：'+branch(),true)}catch(e){setStatus('❌ '+e.message)}}
function fillGroups(){let groups=cfg.groups&&typeof cfg.groups==='object'?cfg.groups:{};$('group').innerHTML=Object.entries(groups).map(([id,g])=>'<option value="'+esc(id)+'">'+esc(g?.title||id)+'</option>').join('');$('groups').innerHTML=Object.entries(groups).map(([id,g])=>'<div class="grid" style="margin:6px 0"><div><label>'+esc(id)+'</label><input data-group-id="'+esc(id)+'" value="'+esc(g?.title||'')+'"></div><div><label>版块描述</label><input data-group-desc="'+esc(id)+'" value="'+esc(g?.description||'')+'"></div></div>').join('')||'<div class="hint">当前没有版块配置。</div>'}
async function loadAll(){try{setStatus('⏳ 正在读取全站，请稍候……');let f=await getPath('data/site-config.json');cfg=JSON.parse(dec(f.content));cfgSha=f.sha;if(cfg&&typeof cfg.content==='string'){try{cfg=JSON.parse(cfg.content)}catch{}}fillGroups();$('siteName').value=cfg.siteName||'';$('heroTitle').value=cfg.heroTitle||'';$('heroText').value=cfg.heroText||'';$('topNotice').value=cfg.topNotice||'';$('pwTitle').value=cfg.publicWelfareNotice?.title||'';$('pwText').value=cfg.publicWelfareNotice?.text||'';$('configJson').value=JSON.stringify(cfg,null,2);let paths=[];for(const root of ['data/content','data/market']){try{let a=await getPath(root);if(Array.isArray(a))paths.push(...a.filter(x=>x.type==='file'&&x.name.toLowerCase().endsWith('.json')).map(x=>({name:x.name,path:x.path})))}catch(e){}}libs=paths; $('lib').innerHTML=libs.map((x,i)=>'<option value="'+i+'">'+esc(x.path)+'</option>').join('');$('targetLib').innerHTML=libs.map((x,i)=>'<option value="'+i+'">'+esc(x.path)+'</option>').join('');await loadAllRecords();if(libs.length)await loadLib();else{items=[];renderList()}setStatus('✅ 全站读取完成\n内容库：'+libs.length+' 个\n内容数量：'+all.length+' 条\n现在可以编辑、发布、下架、删除、转移和修改首页。',true);$('rawbox').textContent=JSON.stringify({分支:branch(),内容库:libs,内容数量:all.length,记录:all.map(x=>({id:x.id,title:x.title,status:x.status,path:x.__path}))},null,2)}catch(e){setStatus('❌ 读取失败\n'+e.message+'\n\n如果提示 401/403，请检查访问令牌权限；如果提示 404，请检查用户名、仓库和分支。')}}
async function loadAllRecords(){all=[];for(const l of libs){try{let f=await getPath(l.path),a=JSON.parse(dec(f.content));if(Array.isArray(a))a.forEach((x,i)=>all.push({...x,__path:l.path,__index:i}))}catch(e){}}}
async function loadLib(){let l=libs[Number($('lib').value)];if(!l)return;try{let f=await getPath(l.path),a=JSON.parse(dec(f.content));items=Array.isArray(a)?a:[];source=l.path;fileSha=f.sha;sel=-1;renderList();clearEditor(false)}catch(e){setStatus('❌ 内容库读取失败：'+e.message)}}
function renderList(){let q=$('filter').value,arr=items.filter(x=>q==='all'||(q==='published'?(x.status||'published')==='published':(x.status||'published')!=='published'));$('list').innerHTML=arr.map(x=>{let i=items.indexOf(x),pub=(x.status||'published')==='published';return '<div class="row"><b>'+esc(x.title||x.id||'未命名')+'</b> <span class="tag '+(pub?'pub':'draft')+'">'+(pub?'已发布':'草稿/下架')+'</span><div class="muted">'+esc(x.date||'')+' · '+esc(x.groupName||x.groupId||'未指定')+'</div><button class="btn gold" onclick="edit('+i+')">✏️ 编辑</button><button class="btn green" onclick="quick('+i+',\'published\')">🚀 发布</button><button class="btn gray" onclick="quick('+i+',\'draft\')">⏸️ 下架</button><button class="btn danger" onclick="del('+i+')">🗑️ 删除</button></div>'}).join('')||'<div class="status">当前内容库暂无内容。</div>'}
function edit(i){sel=i;let x=items[i];$('id').value=x.id||'';$('title').value=x.title||'';$('date').value=x.date||'';$('kind').value=x.kind||'';$('state').value=x.status||'published';if(x.groupId)$('group').value=x.groupId;$('note').value=x.note||'';$('body').value=x.content||'';$('imgs').value=(x.images||[]).join('\n');window.scrollTo({top:0,behavior:'smooth'})}
function clearEditor(reset=true){if(reset)sel=-1;['id','title','date','kind','note','body','imgs'].forEach(x=>$(x).value='');$('state').value='published'}
function newArticle(){clearEditor(true);$('date').value=new Date().toISOString().slice(0,10);setStatus('已清空编辑器，可以新建内容。')}
function makeArticle(){let g=cfg.groups?.[$('group').value]||{};return{id:$('id').value.trim()||'article_'+Date.now(),title:$('title').value.trim(),date:$('date').value||new Date().toISOString().slice(0,10),kind:$('kind').value,note:$('note').value,content:$('body').value,status:$('state').value,groupId:$('group').value,groupName:g.title||$('group').value,images:$('imgs').value.split(/\n+/).map(x=>x.trim()).filter(Boolean)}}
async function saveArticle(status){try{let x=makeArticle();x.status=status;if(!x.title)return alert('请填写标题');if(!source)return alert('请先读取网站');if(sel<0){items.push(x);sel=items.length-1}else items[sel]={...items[sel],...x};fileSha=await putText(source,JSON.stringify(items,null,2),fileSha,'内容编辑');await loadAllRecords();renderList();edit(sel);setStatus('✅ 内容已同步到网站：'+x.title,true)}catch(e){setStatus('❌ 保存失败：'+e.message)}}
async function quick(i,status){try{items[i].status=status;fileSha=await putText(source,JSON.stringify(items,null,2),fileSha,status==='published'?'发布内容':'下架内容');await loadAllRecords();renderList();setStatus('✅ 操作成功：'+(status==='published'?'已发布':'已下架'),true)}catch(e){setStatus('❌ 操作失败：'+e.message)}}
async function del(i){if(!confirm('确定删除这条内容吗？删除会直接同步网站。'))return;try{items.splice(i,1);fileSha=await putText(source,JSON.stringify(items,null,2),fileSha,'删除内容');sel=-1;clearEditor(false);await loadAllRecords();renderList();setStatus('✅ 内容已删除',true)}catch(e){setStatus('❌ 删除失败：'+e.message)}}
async function deleteArticle(){if(sel<0)return alert('请先选择内容');await del(sel)}
async function moveArticle(){try{if(sel<0)return alert('请先选择内容');let target=libs[Number($('targetLib').value)];if(!target||target.path===source)return alert('请选择不同的内容库');let x=makeArticle();let tf=await getPath(target.path),ta=JSON.parse(dec(tf.content));if(!Array.isArray(ta))ta=[];ta.push(x);await putText(target.path,JSON.stringify(ta,null,2),tf.sha,'转移内容到'+target.path);items.splice(sel,1);fileSha=await putText(source,JSON.stringify(items,null,2),fileSha,'移出转移内容');await loadAllRecords();await loadLib();setStatus('✅ 内容已转移到：'+target.path,true)}catch(e){setStatus('❌ 转移失败：'+e.message)}}
function applyConfigFields(){let groups=cfg.groups&&typeof cfg.groups==='object'?cfg.groups:{};document.querySelectorAll('[data-group-id]').forEach(i=>{let id=i.getAttribute('data-group-id');groups[id]=groups[id]||{};groups[id].title=i.value.trim()||id});document.querySelectorAll('[data-group-desc]').forEach(i=>{let id=i.getAttribute('data-group-desc');groups[id]=groups[id]||{};groups[id].description=i.value.trim()});cfg.groups=groups;cfg.siteName=$('siteName').value;cfg.heroTitle=$('heroTitle').value;cfg.heroText=$('heroText').value;cfg.topNotice=$('topNotice').value;cfg.publicWelfareNotice=cfg.publicWelfareNotice||{};cfg.publicWelfareNotice.title=$('pwTitle').value;cfg.publicWelfareNotice.text=$('pwText').value}
async function saveConfigFields(){try{applyConfigFields();cfgSha=await putText('data/site-config.json',JSON.stringify(cfg,null,2),cfgSha,'保存首页与版块配置');$('configJson').value=JSON.stringify(cfg,null,2);fillGroups();setStatus('✅ 首页、公益声明和版块配置已同步网站',true)}catch(e){setStatus('❌ 配置保存失败：'+e.message)}}
async function saveConfigJson(){try{let x=JSON.parse($('configJson').value);cfg=x;cfgSha=await putText('data/site-config.json',JSON.stringify(cfg,null,2),cfgSha,'保存完整网站配置');fillGroups();setStatus('✅ 完整网站配置已同步',true)}catch(e){setStatus('❌ 配置格式或保存失败：'+e.message)}}
async function loadImages(){try{let a=await getPath('static/uploads');if(!Array.isArray(a))throw Error('图片目录不是文件夹');let imgs=a.filter(x=>x.type==='file'&&/\.(png|jpe?g|webp|gif)$/i.test(x.name));$('gallery').innerHTML=imgs.map(x=>'<div class="pic"><img src="https://raw.githubusercontent.com/'+encodeURIComponent($('owner').value)+'/'+encodeURIComponent($('repo').value)+'/refs/heads/'+encodeURIComponent(branch())+'/'+x.path+'"><div class="muted">'+esc(x.path)+'</div><button class="btn gray" onclick="copyPath(\''+x.path.replace(/'/g,"\\'")+'\')">复制路径</button></div>').join('')||'<div class="status">暂无图片。</div>';$('imageStatus').textContent='✅ 已读取 '+imgs.length+' 张图片'}catch(e){$('imageStatus').textContent='❌ 图片读取失败：'+e.message}}
async function copyPath(p){try{await navigator.clipboard.writeText('/'+p);alert('已复制：/'+p)}catch{alert('/'+p)}}
function fileB64(file){return new Promise((resolve,reject)=>{let r=new FileReader();r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}
async function uploadImages(){let fs=[...$('files').files];if(!fs.length)return alert('请选择图片');try{$('imageStatus').textContent='⏳ 正在上传 '+fs.length+' 张图片……';for(const f of fs){let safe=f.name.replace(/[^\w\-.\u4e00-\u9fa5]/g,'_');let path='static/uploads/'+safe;let sha='';try{let old=await getPath(path);sha=old.sha}catch(e){}let data=await fileB64(f);await putB64(path,data,sha,'上传图片 '+safe)}$('imageStatus').textContent='✅ 图片上传完成';await loadImages()}catch(e){$('imageStatus').textContent='❌ 图片上传失败：'+e.message}}
$('token').value=sessionStorage.getItem('hs_admin_token')||'';
</script>
</body></html>
