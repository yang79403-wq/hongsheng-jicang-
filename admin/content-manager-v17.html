<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛收藏资讯网｜全站内容编辑 V17</title><style>body{margin:0;background:#f5eee5;color:#302721;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1200px,95vw);margin:auto}.head{background:linear-gradient(135deg,#350604,#75170f);color:#f6d985;padding:18px}.card{background:#fffdf9;border:1px solid #dfcdae;border-radius:12px;padding:14px;margin:12px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{font-weight:800;display:block;margin:5px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8c8b5;border-radius:8px;font:inherit}textarea{min-height:100px}.btn{border:0;border-radius:8px;padding:9px 13px;margin:4px;font-weight:800;cursor:pointer}.r{background:#68100a;color:#fff}.g{background:#d6b35b;color:#32130d}.ok{background:#2f6b3b;color:#fff}.b{background:#315b82;color:#fff}.gray{background:#756a63;color:#fff}.danger{background:#a62a20;color:#fff}.status{padding:10px;background:#f8efe4;border-radius:8px}.success{background:#e8f5e9;color:#245d2b}.tip{background:#fff5dd;border:1px solid #dfc18a;padding:10px;border-radius:8px}.row{border:1px solid #eadfce;background:#fffaf3;border-radius:9px;padding:10px;margin:8px 0}.toolbar{display:flex;flex-wrap:wrap;gap:4px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.pic{border:1px solid #dfcdae;border-radius:8px;padding:7px;background:#fff}.pic img{width:100%;height:130px;object-fit:contain;background:#eee6db}.muted{font-size:12px;color:#766b63}.preview{background:#fff;border:1px solid #ddd1c0;border-radius:9px;padding:18px;line-height:1.85}.preview img{max-width:100%;height:auto;display:block;margin:15px auto}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛收藏资讯网 · 全站内容编辑 V17</h1><div>已发布内容：编辑｜换版块｜上传图片｜指定正文位置插图｜发布更新｜删除</div></div></header><main class="wrap"><section class="card"><h2>🔐 连接网站</h2><div class="grid"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>Token</label><input id="token" type="password" placeholder="GitHub Contents 读写权限"></div></div><button class="btn r" onclick="loadAll()">🔄 读取全网站已发布内容</button><div id="status" class="status">尚未读取</div></section><section class="card"><h2>🔎 已发布内容</h2><div class="grid"><div><label>搜索</label><input id="search" oninput="render()" placeholder="标题、ID、版块、正文"></div><div><label>版块筛选</label><select id="filterGroup" onchange="render()"><option value="">全部版块</option></select></div></div><div id="list"></div></section><section class="card"><h2>✏️ 编辑当前内容</h2><div class="grid"><div><label>文章 ID</label><input id="aid" readonly></div><div><label>标题</label><input id="title"></div><div><label>日期</label><input id="date" type="date"></div><div><label>分类</label><input id="kind"></div><div><label>所属版块，支持更换</label><select id="group"></select></div><div><label>状态</label><select id="state"><option value="published">已发布</option><option value="draft">草稿/下架</option><option value="hidden">隐藏</option></select></div><div class="wide"><label>摘要</label><textarea id="note"></textarea></div><div class="wide"><label>正文</label><textarea id="body" style="min-height:360px" placeholder="把光标放在需要出现图片的位置，再点击下方“插入当前光标位置”"></textarea></div></div><div class="toolbar"><button class="btn ok" onclick="saveUpdate()">💾 保存修改并更新网站</button><button class="btn b" onclick="changeGroup()">↔️ 更换所属版块</button><button class="btn r" onclick="publish()">🚀 发布/重新发布</button><button class="btn gray" onclick="unpublish()">⏸️ 下架</button><button class="btn danger" onclick="removeArticle()">🗑️ 删除</button></div><div id="editStatus" class="status">请从上面的已发布内容列表选择文章。</div></section><section class="card"><h2>🖼️ 给当前内容添加照片</h2><div class="tip">先选择文章 → 上传照片 → 选择一张照片 → 把正文光标放到具体位置 → 点击“插入当前光标位置”。保存后图片和正文一起更新。</div><input id="photos" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><button class="btn g" onclick="uploadPhotos()">⬆️ 上传照片</button><div id="gallery" class="gallery"></div><div class="toolbar"><button class="btn g" onclick="insertPhoto('before')">插入正文开头</button><button class="btn r" onclick="insertPhoto('cursor')">插入当前光标位置</button><button class="btn g" onclick="insertPhoto('after')">插入正文末尾</button></div></section><section class="card"><h2>👁️ 保存前预览</h2><div id="preview" class="preview">暂无内容</div></section></main><script>const $=id=>document.getElementById(id);let groups={},libs=[],records=[],loadedFiles={},current=null,selected=null;const enc=new TextEncoder(),b64=s=>{let a=enc.encode(s),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0))),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}async function api(p,o={}){let t=$('token').value.trim();if(!t)throw Error('请填写 GitHub Token');let r=await fetch('https://api.github.com'+p,{...o,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28'}}),d=await r.json();if(!r.ok)throw Error((d.message||'GitHub请求失败')+'（'+r.status+'）');return d}async function get(path){return api(base()+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value||'main'))}function unwrap(x){for(let i=0;i<8&&x&&typeof x.content==='string';i++){try{x=JSON.parse(x.content)}catch{break}}return x}async function loadAll(){try{let f=await get('data/site-config.json');let raw=dec(f.content);let sc=unwrap(JSON.parse(raw));groups=sc.groups||{};let d=await api(base()+'/contents/data/content?ref='+($('branch').value||'main'));libs=d.filter(x=>x.type==='file'&&x.name.endsWith('.json'));let md=await api(base()+'/contents/data/market?ref='+($('branch').value||'main')).catch(()=>[]);if(Array.isArray(md))libs=libs.concat(md.filter(x=>x.type==='file'&&x.name.endsWith('.json')).map(x=>({...x,market:true})));$('group').innerHTML=Object.entries(groups).map(([id,g])=>'<option value="'+esc(id)+'">'+esc(g.title||id)+'</option>').join('');$('filterGroup').innerHTML='<option value="">全部版块</option>'+Object.entries(groups).map(([id,g])=>'<option value="'+esc(id)+'">'+esc(g.title||id)+'</option>').join('');records=[];for(let f of libs){let p=(f.market?'data/market/':'data/content/')+f.name;try{let x=await get(p),arr=JSON.parse(dec(x.content));if(Array.isArray(arr))for(let a of arr)records.push({...a,__file:p,__sha:x.sha,__market:!!f.market})}catch(e){}}render();$('status').className='status success';$('status').textContent='✅ 已读取全网站：'+records.length+' 篇内容、'+Object.keys(groups).length+' 个版块、'+libs.length+' 个内容库'}catch(e){$('status').textContent='❌ '+e.message}}function groupName(id){return groups[id]?.title||id||'未指定'}function render(){let q=($('search').value||'').toLowerCase(),fg=$('filterGroup').value;let a=records.filter(x=>(!fg||x.groupId===fg)&&(!q||JSON.stringify(x).toLowerCase().includes(q)));$('list').innerHTML=a.map((x)=>'<div class="row"><b>'+esc(x.title||x.id)+'</b><div class="muted">版块：'+esc(groupName(x.groupId)||x.groupName||'未指定')+' · '+esc(x.status||'draft')+' · '+esc(x.__file)+'</div><button class="btn g" onclick="edit('+records.indexOf(x)+')">✏️ 编辑</button><button class="btn b" onclick="edit('+records.indexOf(x)+')">↔️ 换版块</button><button class="btn ok" onclick="quickPublish('+records.indexOf(x)+')">🚀 更新发布</button><button class="btn danger" onclick="quickDelete('+records.indexOf(x)+')">🗑️ 删除</button></div>').join('')||'<div class="tip">没有找到已发布内容。</div>'}function edit(i){current=JSON.parse(JSON.stringify(records[i]));$('aid').value=current.id||'';$('title').value=current.title||'';$('date').value=current.date||'';$('kind').value=current.kind||'';$('group').value=current.groupId||Object.keys(groups)[0]||'';$('state').value=current.status||'published';$('note').value=current.note||'';$('body').value=current.content||'';updatePreview();$('editStatus').className='status success';$('editStatus').textContent='正在编辑：'+(current.title||current.id)+' · 原内容库：'+current.__file;scrollTo({top:document.body.scrollHeight*.35,behavior:'smooth'})}function build(){let gid=$('group').value,g=groups[gid]||{};return {...current,id:$('aid').value,title:$('title').value,date:$('date').value,kind:$('kind').value,groupId:gid,groupName:g.title||gid,status:$('state').value,note:$('note').value,content:$('body').value}}function jsonText(a){return JSON.stringify(a,null,2)}async function put(path,text,sha,msg){let o={message:'洪盛收藏资讯网：'+msg,content:b64(text),branch:$('branch').value||'main'};if(sha)o.sha=sha;let r=await api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});return r}async function deletePath(path,sha,msg){return api(base()+'/contents/'+path,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛收藏资讯网：'+msg,sha,branch:$('branch').value||'main'})})}function fileOf(x){return x.__file}async function saveUpdate(){if(!current)return alert('请先选择已发布内容');let n=build(),old=current;if(n.groupId===old.groupId){let arr=records.filter(x=>x.__file===old.__file).map(x=>x.id===old.id?n:x);await put(old.__file,jsonText(arr),old.__sha,'编辑并更新内容');current=n}else{await transfer(old,n)}await loadAll();$('editStatus').textContent='✅ 已保存并更新网站'}async function changeGroup(){if(!current)return alert('请先选择内容');let n=build();if(n.groupId===current.groupId)return alert('请选择不同版块');await transfer(current,n);await loadAll();edit(records.findIndex(x=>x.id===n.id&&x.groupId===n.groupId))}async function transfer(old,n){let targetFile=targetForGroup(n.groupId);if(!targetFile)return alert('目标版块没有可用内容库，请先为该版块建立内容库');let srcArr=records.filter(x=>x.__file===old.__file).map(x=>x.id===old.id?null:x).filter(Boolean);await put(old.__file,jsonText(srcArr),old.__sha,'内容转移：从'+groupName(old.groupId)+'移出');let tf=await get(targetFile),ta=JSON.parse(dec(tf.content));ta.push({...n,__file:undefined,__sha:undefined,__market:undefined});await put(targetFile,jsonText(ta),tf.sha,'内容转移：写入'+groupName(n.groupId))}function targetForGroup(gid){let g=groups[gid]||{};let it=(g.items||[])[0];if(it){let c=libs.find(x=>x.name===it.id+'.json');if(c)return (c.market?'data/market/':'data/content/')+c.name}let c=libs.find(x=>x.name===gid+'.json');return c?(c.market?'data/market/':'data/content/')+c.name:''}async function quickPublish(i){current=records[i];$('state').value='published';edit(i);await saveUpdate()}async function publish(){if(!current)return alert('请先选择内容');$('state').value='published';await saveUpdate()}async function unpublish(){if(!current)return alert('请先选择内容');$('state').value='draft';await saveUpdate()}async function quickDelete(i){if(!confirm('确定删除这篇已发布内容？'))return;let x=records[i],arr=records.filter(a=>a.__file===x.__file&&a.id!==x.id);await put(x.__file,jsonText(arr),x.__sha,'删除已发布内容');await loadAll()}async function removeArticle(){if(!current)return alert('请先选择内容');if(!confirm('确定删除当前内容？'))return;await quickDelete(records.findIndex(x=>x.id===current.id&&x.__file===current.__file));current=null}async function uploadPhotos(){if(!current)return alert('请先选择要添加照片的内容');let fs=[...$('photos').files];if(!fs.length)return alert('请选择照片');let out=[];for(let f of fs){if(f.size>5*1024*1024)return alert('单张照片不能超过5MB');let now=new Date(),p='static/uploads/'+now.getFullYear()+'/'+String(now.getMonth()+1).padStart(2,'0')+'/img_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+f.name.substring(f.name.lastIndexOf('.'));let data=await f.arrayBuffer(),a=new Uint8Array(data),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));await api(base()+'/contents/'+p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛收藏资讯网：上传内容照片',content:btoa(o),branch:$('branch').value||'main'})});out.push({id:p.split('/').pop().split('.')[0],url:'https://yang79403-wq.github.io/'+p,name:f.name})}$('gallery').innerHTML=out.map(x=>'<div class="pic"><img src="'+x.url+'"><b>'+esc(x.name)+'</b><div class="muted">'+x.id+'</div><button class="btn g" onclick="selectPhoto('+JSON.stringify(x.id)+','+JSON.stringify(x.url)+')">选择这张照片</button></div>').join('');$('editStatus').textContent='🖼️ 照片上传成功，请选择照片并插入正文位置'}function selectPhoto(id,url){selected={id,url};$('editStatus').textContent='🖼️ 已选择：'+id+'，现在把正文光标放到具体位置，再点“插入当前光标位置”'}function insertPhoto(pos){if(!selected)return alert('请先选择照片');let ta=$('body'),s=ta.selectionStart||0,e=ta.selectionEnd||0,m='\n\n【图片:'+selected.id+']\n'+selected.url+'\n【/图片】\n\n';if(pos==='before')ta.value=m+ta.value;else if(pos==='after')ta.value+=m;else ta.value=ta.value.slice(0,s)+m+ta.value.slice(e);updatePreview()}function updatePreview(){let c=esc($('body').value||'').replace(/【图片:([^\]]+)\]\n([^\n]+)\n【\/图片】/g,(m,id,url)=>'<figure><img src="'+esc(url)+'" alt="'+esc(id)+'" style="max-width:100%"><figcaption>收藏图片</figcaption></figure>').replace(/\n/g,'<br>');$('preview').innerHTML='<div class="muted">版块：'+esc(groupName($('group').value))+'</div><h2>'+esc($('title').value||'文章标题')+'</h2>'+c}$('body').addEventListener('input',updatePreview);$('title').addEventListener('input',updatePreview)</script></body></html>
