<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛收藏资讯网｜全网站内容读取修复版</title><style>body{margin:0;background:#f5eee5;color:#332722;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{background:linear-gradient(135deg,#350604,#75170f);color:#f6d985;padding:20px}.wrap{width:min(1100px,94vw);margin:auto}.card{background:#fffdf9;border:1px solid #dfcdae;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;font-weight:800;margin:6px 0}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8c8b5;border-radius:8px;font:inherit}textarea{min-height:130px}.btn{border:0;border-radius:8px;padding:10px 14px;margin:4px;font-weight:800}.red{background:#68100a;color:white}.gold{background:#d6b35b;color:#32130d}.status{padding:12px;background:#f8efe4;border-radius:8px}.ok{background:#e8f5e9;color:#245d2b}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab{padding:9px 13px;white-space:nowrap;border:1px solid #dfcdae;border-radius:8px;background:#fff9f0;font-weight:800}.tab.on{background:#68100a;color:white}.panel{display:none}.panel.on{display:block}.row{border:1px solid #eadfce;background:#fffaf3;border-radius:9px;padding:10px;margin:8px 0}.danger{background:#a62a20;color:#fff}.muted{color:#766a61;font-size:12px}.raw{white-space:pre-wrap;background:#24110e;color:#f5dfad;padding:12px;border-radius:8px;max-height:360px;overflow:auto;font:12px/1.6 monospace}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛收藏资讯网 · 全网站内容管理</h1><div>修复版：自动解析多层 content，真实读取网站配置</div></div></header><main class="wrap"><section class="card"><h2>🔐 连接</h2><div class="grid"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password"></div></div><button class="btn red" onclick="loadSite()">🔄 一键读取整个网站</button><a class="btn gold" href="../">🌐 网站首页</a><div id="status" class="status">等待读取。</div></section><nav class="tabs"><button class="tab on" onclick="tab('home',this)">🏠 首页</button><button class="tab" onclick="tab('groups',this)">🗂️ 版块</button><button class="tab" onclick="tab('services',this)">⭐ 服务</button><button class="tab" onclick="tab('lists',this)">📚 列表</button><button class="tab" onclick="tab('images',this)">🖼️ 图片</button><button class="tab" onclick="tab('qr',this)">📱 二维码</button><button class="tab" onclick="tab('raw',this)">🔎 实际读取</button></nav><section id="home" class="panel on"><div class="card"><h2>🏠 首页</h2><div class="grid"><div><label>网站名称</label><input id="siteName"></div><div><label>首页标题</label><input id="heroTitle"></div><div style="grid-column:1/-1"><label>首页介绍</label><textarea id="heroText"></textarea></div><div style="grid-column:1/-1"><label>顶部公告</label><textarea id="topNotice"></textarea></div></div><button class="btn gold" onclick="saveHome()">保存首页</button></div><div class="card"><h2>📜 公益性网站声明</h2><label>声明标题</label><input id="pwTitle"><label>声明内容</label><textarea id="pwText"></textarea><div class="status">这里直接读取 <b>publicWelfareNotice</b>，包括你截图中的“本网站为公益性网站”相关内容。</div><button class="btn gold" onclick="savePW()">保存公益声明</button></div></section><section id="groups" class="panel"><div class="card"><h2>🗂️ 全部版块</h2><div id="groupsList"></div></div><div class="card"><h3>➕ 新增版块</h3><input id="newGid" placeholder="英文/数字/下划线 ID"><input id="newGtitle" placeholder="标题"><textarea id="newGsub" placeholder="说明"></textarea><button class="btn red" onclick="addGroup()">新增版块</button></div></section><section id="services" class="panel"><div class="card"><h2>⭐ 服务内容</h2><div id="servicesList"></div></div></section><section id="lists" class="panel"><div class="card"><h2>📚 全部列表</h2><div id="listsView"></div></div></section><section id="images" class="panel"><div class="card"><h2>🖼️ 首页图片</h2><div id="imagesView"></div></div></section><section id="qr" class="panel"><div class="card"><h2>📱 客服二维码</h2><label>二维码说明</label><input id="qrLabel"><label>二维码内容</label><input id="qrData"><label>二维码图片路径</label><input id="qrPath"><button class="btn gold" onclick="saveQR()">保存二维码</button></div></section><section id="raw" class="panel"><div class="card"><h2>🔎 实际读取结果</h2><div id="raw" class="raw">尚未读取</div></div></section></main><script>const $=x=>document.getElementById(x);let cfg=null,sha=null;const enc=new TextEncoder(),b64=s=>{let a=enc.encode(s),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));function unwrap(x){for(let i=0;i<6&&x&&typeof x==='object'&&typeof x.content==='string';i++){try{x=JSON.parse(x.content)}catch{break}}return x}function apiBase(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}async function api(path,opt={}){let t=$('token').value.trim();if(!t)throw Error('请填写 GitHub Token');let r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28'}}),d=await r.json();if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}async function loadSite(){try{let f=await api(apiBase()+'/contents/data/site-config.json?ref='+encodeURIComponent($('branch').value||'main'));sha=f.sha;let decoded=dec(f.content);cfg=unwrap(JSON.parse(decoded));if(!cfg||!cfg.siteName)throw Error('解析后不是网站配置');render();$('raw').textContent=JSON.stringify(cfg,null,2);$('status').className='status ok';$('status').textContent='✅ 真实读取成功：公益声明、首页、版块、服务、列表、图片、二维码均已解析。'}catch(e){$('status').className='status';$('status').textContent='❌ '+e.message}}function render(){let t=cfg.theme||{},p=cfg.publicWelfareNotice||{},q=cfg.consult||{};$('siteName').value=cfg.siteName||'';$('heroTitle').value=cfg.heroTitle||'';$('heroText').value=cfg.heroText||'';$('topNotice').value=cfg.topNotice||'';$('pwTitle').value=p.title||'';$('pwText').value=p.text||'';$('qrLabel').value=q.qrLabel||'';$('qrData').value=q.qrData||'';$('qrPath').value=q.qr||'';renderGroups();renderServices();renderLists();renderImages()}function renderGroups(){$('groupsList').innerHTML=Object.entries(cfg.groups||{}).map(([id,g])=>'<div class="row"><b>'+esc(g.title||id)+'</b><div class="muted">'+esc(g.subtitle||'')+'</div><button class="btn gold" onclick="editGroup('+JSON.stringify(id)+')">修改</button><button class="btn danger" onclick="delGroup('+JSON.stringify(id)+')">删除</button>'+(g.items||[]).map((x,i)=>'<div class="row">'+esc(x.name)+' <button class="btn gold" onclick="editItem('+JSON.stringify(id)+','+i+')">修改</button><button class="btn danger" onclick="delItem('+JSON.stringify(id)+','+i+')">删除</button></div>').join('')+'<button class="btn red" onclick="addItem('+JSON.stringify(id)+')">➕ 新增内容</button></div>').join('')||'暂无版块'}function renderServices(){$('servicesList').innerHTML=(cfg.serviceSections||[]).map((s,i)=>'<div class="row"><b>'+esc(s.title||s.id)+'</b><div class="muted">'+esc(s.subtitle||'')+'</div>'+(s.items||[]).map((x,j)=>'<div class="row">'+esc(x)+' <button class="btn gold" onclick="editServiceItem('+i+','+j+')">修改</button><button class="btn danger" onclick="delServiceItem('+i+','+j+')">删除</button></div>').join('')+'<button class="btn red" onclick="addServiceItem('+i+')">新增服务内容</button></div>').join('')}function renderLists(){let d=[['collectionScope','收藏范围'],['dailyContent','日常交流内容'],['serviceRange','服务范围'],['security','安全说明']];$('listsView').innerHTML=d.map(([k,t])=>'<div class="row"><b>'+t+'</b>'+(cfg[k]||[]).map((x,i)=>'<div class="row">'+esc(x)+' <button class="btn gold" onclick="editList('+JSON.stringify(k)+','+i+')">修改</button><button class="btn danger" onclick="delList('+JSON.stringify(k)+','+i+')">删除</button></div>').join('')+'<button class="btn red" onclick="addList('+JSON.stringify(k)+')">新增</button></div>').join('')}function renderImages(){$('imagesView').innerHTML=(cfg.homepageImages||[]).map((x,i)=>'<div class="row"><b>'+esc(x.title||'首页图片')+'</b><div class="muted">'+esc(x.url||'')+' · '+(x.enabled===false?'隐藏':'显示')+' · 顺序 '+(x.order??i)+'</div><button class="btn gold" onclick="editImage('+i+')">修改</button><button class="btn danger" onclick="delImage('+i+')">删除</button></div>').join('')||'暂无首页图片'}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function saveConfig(msg){let body={message:'洪盛收藏资讯网：'+msg,content:b64(JSON.stringify({content:JSON.stringify(cfg,null,2)},null,2)),branch:$('branch').value||'main',sha};let r=await api(apiBase()+'/contents/data/site-config.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});sha=r.content?.sha||sha;$('status').textContent='✅ 已保存 GitHub：'+msg+'。网站将自动同步。'}async function saveHome(){cfg.siteName=$('siteName').value;cfg.heroTitle=$('heroTitle').value;cfg.heroText=$('heroText').value;cfg.topNotice=$('topNotice').value;await saveConfig('首页')}async function savePW(){cfg.publicWelfareNotice={title:$('pwTitle').value,text:$('pwText').value};await saveConfig('公益性网站声明')}async function saveQR(){cfg.consult=cfg.consult||{};cfg.consult.qrLabel=$('qrLabel').value;cfg.consult.qrData=$('qrData').value;cfg.consult.qr=$('qrPath').value;await saveConfig('客服二维码')}async function editGroup(id){let g=cfg.groups[id],t=prompt('版块标题',g.title);if(t===null)return;g.title=t;g.subtitle=prompt('版块说明',g.subtitle||'')??g.subtitle;await saveConfig('修改版块');render()}async function delGroup(id){if(!confirm('删除版块？'))return;delete cfg.groups[id];cfg.nav=(cfg.nav||[]).filter(x=>x.id!==id);await saveConfig('删除版块');render()}async function addGroup(){let id=$('newGid').value.trim(),t=$('newGtitle').value.trim();if(!id||!t)return alert('请填写 ID 和标题');cfg.groups=cfg.groups||{};cfg.groups[id]={title:t,subtitle:$('newGsub').value,enabled:true,items:[]};cfg.nav=cfg.nav||[];cfg.nav.push({id,name:t,enabled:true});await saveConfig('新增版块');render()}async function editItem(g,i){let x=cfg.groups[g].items[i],n=prompt('内容名称',x.name);if(n===null)return;x.name=n;x.id=prompt('内容 ID',x.id)||x.id;await saveConfig('修改版块内容');render()}async function delItem(g,i){if(!confirm('删除内容？'))return;cfg.groups[g].items.splice(i,1);await saveConfig('删除版块内容');render()}async function addItem(g){let n=prompt('内容名称');if(!n)return;cfg.groups[g].items.push({id:'item_'+Date.now(),name:n,enabled:true});await saveConfig('新增版块内容');render()}async function editServiceItem(i,j){let x=prompt('服务内容',cfg.serviceSections[i].items[j]);if(x===null)return;cfg.serviceSections[i].items[j]=x;await saveConfig('修改服务内容');render()}async function delServiceItem(i,j){cfg.serviceSections[i].items.splice(j,1);await saveConfig('删除服务内容');render()}async function addServiceItem(i){let x=prompt('新增服务内容');if(!x)return;cfg.serviceSections[i].items.push(x);await saveConfig('新增服务内容');render()}async function editList(k,i){let x=prompt('修改内容',cfg[k][i]);if(x===null)return;cfg[k][i]=x;await saveConfig('修改列表');render()}async function delList(k,i){if(!confirm('删除？'))return;cfg[k].splice(i,1);await saveConfig('删除列表');render()}async function addList(k){let x=prompt('新增内容');if(!x)return;cfg[k]=cfg[k]||[];cfg[k].push(x);await saveConfig('新增列表');render()}async function editImage(i){let x=cfg.homepageImages[i];x.title=prompt('图片标题',x.title)||x.title;x.description=prompt('图片说明',x.description||'')??x.description;x.order=Number(prompt('顺序',x.order??i));await saveConfig('修改首页图片');render()}async function delImage(i){if(!confirm('删除首页图片记录？'))return;cfg.homepageImages.splice(i,1);await saveConfig('删除首页图片');render()}function tab(id,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(id).classList.add('on')}</script></body></html>
