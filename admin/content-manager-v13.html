<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛收藏资讯网｜全站内容管理 V13</title><style>body{margin:0;background:#f5eee5;color:#332722;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.h{background:linear-gradient(135deg,#350604,#75170f);color:#f6d985;padding:18px}.w{width:min(1280px,94vw);margin:auto}.c{background:#fffdf9;border:1px solid #dfcdae;border-radius:12px;padding:14px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{font-weight:800;display:block;margin:5px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:9px;border:1px solid #d8c8b5;border-radius:8px;font:inherit}textarea{min-height:90px}.b{border:0;border-radius:8px;padding:9px 12px;margin:3px;font-weight:800;cursor:pointer}.r{background:#68100a;color:#fff}.gold{background:#d6b35b;color:#32130d}.green{background:#2f6b3b;color:#fff}.gray{background:#756a63;color:#fff}.danger{background:#a62a20;color:#fff}.blue{background:#315b82;color:#fff}.st{padding:10px;background:#f8efe4;border-radius:8px}.ok{background:#e8f5e9;color:#245d2b}.tabs{display:flex;gap:6px;overflow:auto;margin:12px 0}.tab{padding:8px 12px;border:1px solid #d6c3a9;border-radius:999px;background:#fff;white-space:nowrap;font-weight:800}.on{background:#68100a;color:#fff}.row{border:1px solid #eadfce;background:#fffaf3;border-radius:9px;padding:10px;margin:7px 0}.mut{font-size:12px;color:#766}.tag{display:inline-block;padding:2px 7px;border-radius:20px;background:#eadbc3;font-size:11px}.pub{background:#e5f3e8;color:#276035}.draft{background:#eee9e3;color:#6d6259}.raw{white-space:pre-wrap;background:#24110e;color:#f5dfad;padding:12px;border-radius:8px;max-height:500px;overflow:auto;font:12px/1.5 monospace}.pics{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}.pic{border:1px solid #decfb9;padding:7px;border-radius:8px}.pic img{width:100%;height:110px;object-fit:contain;background:#eee}@media(max-width:700px){.g{grid-template-columns:1fr}.wide{grid-column:auto}}</style><body><header class="h"><div class="w"><h1>洪盛收藏资讯网 · 全站内容管理 V13</h1><div>全站真实读取｜所有内容编辑｜删除｜发布｜下架｜转移｜首页配置｜图片上传</div></div></header><main class="w"><section class="c"><h2>🔐 GitHub连接</h2><div class="g"><div><label>用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><button class="b r" onclick="loadAll()">🔄 一键读取整个网站</button><a class="b gold" href="../" target="_blank">🌐 网站</a><div id="status" class="st">尚未读取</div></section><nav class="tabs"><button class="tab on" onclick="tab('articles',this)">📰 内容</button><button class="tab" onclick="tab('config',this)">🏠 首页/版块</button><button class="tab" onclick="tab('images',this)">🖼️ 图片</button><button class="tab" onclick="tab('raw',this)">🔎 真实读取</button></nav><section id="articles"><section class="c"><h2>📰 全网站文章</h2><div class="g"><div><label>内容库</label><select id="lib" onchange="loadLib()"></select></div><div><label>筛选</label><select id="filter" onchange="renderList()"><option value="all">全部</option><option value="published">已发布</option><option value="draft">下架/草稿</option></select></div></div><div class="st">同时读取 <b>data/content/*.json</b> 与 <b>data/market/*.json</b>。已发布内容可直接编辑、发布、下架、删除、转移。</div><div id="list"></div></section><section class="c"><h2>✍️ 编辑器</h2><div class="g"><div><label>ID</label><input id="id"></div><div><label>标题</label><input id="title"></div><div><label>日期</label><input id="date" type="date"></div><div><label>分类</label><input id="kind"></div><div><label>状态</label><select id="state"><option value="published">已发布</option><option value="draft">草稿/下架</option><option value="hidden">隐藏</option></select></div><div><label>所属版块</label><select id="group"></select></div><div class="wide"><label>摘要</label><textarea id="note"></textarea></div><div class="wide"><label>正文</label><textarea id="body" style="min-height:300px"></textarea></div><div class="wide"><label>图片路径，一行一张</label><textarea id="imgs"></textarea></div><div><label>转移到内容库</label><select id="targetLib"></select></div></div><button class="b green" onclick="saveArticle('published')">💾 保存并发布</button><button class="b gold" onclick="saveArticle('draft')">📝 保存草稿</button><button class="b blue" onclick="moveArticle()">↔️ 转移并保存</button><button class="b danger" onclick="deleteArticle()">🗑️ 删除</button><button class="b gray" onclick="newArticle()">➕ 新增</button></section></section><section id="config" style="display:none"><section class="c"><h2>🏠 首页文字</h2><div class="g"><div><label>网站名称</label><input id="siteName"></div><div><label>首页标题</label><input id="heroTitle"></div><div class="wide"><label>首页介绍</label><textarea id="heroText"></textarea></div><div class="wide"><label>顶部公告</label><textarea id="topNotice"></textarea></div></div><button class="b gold" onclick="saveConfigFields()">💾 保存首页</button></section><section class="c"><h2>📜 公益性声明</h2><input id="pwTitle"><textarea id="pwText"></textarea><button class="b gold" onclick="saveConfigFields()">保存声明</button></section><section class="c"><h2>🗂️ 版块标题</h2><div id="groups"></div><button class="b gold" onclick="saveConfigFields()">保存版块</button></section><section class="c"><h2>🧰 全部网站配置</h2><textarea id="configJson" style="min-height:520px;font-family:monospace"></textarea><button class="b r" onclick="saveConfigJson()">保存整个网站配置</button></section></section><section id="images" style="display:none"><section class="c"><h2>🖼️ 图片上传</h2><input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple><button class="b gold" onclick="uploadImages()">⬆️ 上传图片</button><div class="st">上传后可复制图片路径到文章。</div></section><section class="c"><div id="gallery" class="pics"></div></section></section><section id="raw" style="display:none"><section class="c"><pre id="rawbox" class="raw">尚未读取</pre></section></section></main><script>const $=id=>document.getElementById(id);let cfg={},cfgSha='',libs=[],items=[],source='',fileSha='',sel=-1,all=[];const enc=new TextEncoder(),b64=s=>{let a=enc.encode(s),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0))),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),unwrap=x=>{for(let i=0;i<10&&x&&typeof x.content==='string';i++){try{x=JSON.parse(x.content)}catch{break}}return x};function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}async function api(p,o={}){let t=$('token').value.trim();if(!t)throw Error('请填写 GitHub Token');let r=await fetch('https://api.github.com'+p,{...o,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28',...(o.headers||{})}}),d=await r.json();if(!r.ok)throw Error((d.message||'GitHub请求失败')+'（'+r.status+'）');return d}async function get(p){return api(base()+'/contents/'+p+'?ref='+encodeURIComponent($('branch').value||'main'))}async function put(p,text,sha,msg){let z={message:'洪盛收藏资讯网：'+msg,content:b64(text),branch:$('branch').value||'main'};if(sha)z.sha=sha;let r=await api(base()+'/contents/'+p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(z)});return r.content?.sha||''}async function putB64(p,data,sha,msg){let z={message:'洪盛收藏资讯网：'+msg,content:data,branch:$('branch').value||'main'};if(sha)z.sha=sha;let r=await api(base()+'/contents/'+p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(z)});return r.content?.sha||''}function tab(id,b){['articles','config','images','raw'].forEach(x=>$(x).style.display='none');$(id).style.display='block';document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));b.classList.add('on')}function msg(s,ok=false){$('status').className='st '+(ok?'ok':'');$('status').textContent=s}async function loadAll(){try{msg('⏳ 正在读取整个网站……');let f=await get('data/site-config.json');cfg=unwrap(JSON.parse(dec(f.content)));cfgSha=f.sha;let [a,m]=await Promise.all([api(base()+'/contents/data/content?ref=main'),api(base()+'/contents/data/market?ref=main')]);libs=[...(a||[]),...(m||[])].filter(x=>x.type==='file'&&x.name.endsWith('.json')).map(x=>({name:x.name,path:x.path}));$('lib').innerHTML=libs.map((x,i)=>'<option value="'+i+'">'+esc(x.path)+'</option>').join('');$('targetLib').innerHTML=libs.map((x,i)=>'<option value="'+i+'">'+esc(x.path)+'</option>').join('');$('group').innerHTML=Object.entries(cfg.groups||{}).map(([id,g])=>'<option value="'+esc(id)+'">'+esc(g.title||id)+'</option>').join('');$('siteName').value=cfg.siteName||'';$('heroTitle').value=cfg.heroTitle||'';$('heroText').value=cfg.heroText||'';$('topNotice').value=cfg.topNotice||'';$('pwTitle').value=cfg.publicWelfareNotice?.title||'';$('pwText').value=cfg.publicWelfareNotice?.text||'';$('configJson').value=JSON.stringify(cfg,null,2);await loadAllRecords();await loadLib();msg('✅ 真实读取完成：'+libs.length+'个内容库，'+all.length+'条内容。',true);$('rawbox').textContent=JSON.stringify({libraries:libs,records:all.map(x=>({id:x.id,title:x.title,status:x.status,path:x.__path}))},null,2)}catch(e){msg('❌ '+e.message)}}async function loadAllRecords(){all=[];for(const l of libs){try{let f=await get(l.path),a=JSON.parse(dec(f.content));if(Array.isArray(a))a.forEach((x,i)=>all.push({...x,__path:l.path,__index:i}))}catch{}}}async function loadLib(){let l=libs[Number($('lib').value)];if(!l)return;let f=await get(l.path);source=l.path;fileSha=f.sha;items=JSON.parse(dec(f.content));if(!Array.isArray(items))items=[];sel=-1;renderList();clearEditor(false)}function renderList(){let q=$('filter').value,arr=items.filter(x=>q==='all'||(q==='published'?(x.status||'published')==='published':(x.status||'published')!=='published'));$('list').innerHTML=arr.map(x=>{let i=items.indexOf(x);return '<div class="row"><b>'+esc(x.title||x.id||'未命名')+'</b> <span class="tag '+(((x.status||'published')==='published')?'pub':'draft')+'">'+(((x.status||'published')==='published')?'已发布':'下架/草稿')+'</span><div class="mut">'+esc(source)+' · '+esc(x.date||'')+' · '+esc(x.groupName||x.groupId||'未指定')+'</div><button class="b gold" onclick="edit('+i+')">✏️ 编辑</button><button class="b green" onclick="quick('+i+',\'published\')">🚀 发布</button><button class="b gray" onclick="quick('+i+',\'draft\')">⏸️ 下架</button><button class="b blue" onclick="edit('+i+')">↔️ 转移</button><button class="b danger" onclick="del('+i+')">🗑️ 删除</button></div>'}).join('')||'<div class="st">当前内容库暂无内容</div>'}function edit(i){sel=i;let x=items[i];$('id').value=x.id||'';$('title').value=x.title||'';$('date').value=x.date||'';$('kind').value=x.kind||'';$('state').value=x.status||'published';$('group').value=x.groupId||$('group').value;$('note').value=x.note||'';$('body').value=x.content||'';$('imgs').value=(x.images||[]).join('\n');window.scrollTo({top:0,behavior:'smooth'})}function clearEditor(reset=true){if(reset)sel=-1;['id','title','date','kind','note','body','imgs'].forEach(x=>$(x).value='');$('state').value='published'}function makeArticle(){let g=cfg.groups?.[$('group').value]||{};return {id:$('id').value.trim()||'article_'+Date.now(),title:$('title').value.trim(),date:$('date').value||new Date().toISOString().slice(0,10),kind:$('kind').value,note:$('note').value,content:$('body').value,status:$('state').value,groupId:$('group').value,groupName:g.title||$('group').value,images:$('imgs').value.split(/\n+/).map(x=>x.trim()).filter(Boolean)}}async function saveArticle(status){let x=makeArticle();x.status=status;if(!x.title)return alert('请填写标题');if(sel<0){items.push(x);sel=items.length-1}else items[sel]={...items[sel],...x};fileSha=await put(source,JSON.stringify(items,null,2),fileSha,'内容编辑/发布');await loadAllRecords();renderList();edit(sel);msg('✅ 已保存并发布到真实网站：'+source,true)}async function quick(i,s){edit(i);await saveArticle(s)}async function del(i){if(!confirm('确定永久删除？'))return;items.splice(i,1);fileSha=await put(source,JSON.stringify(items,null,2),fileSha,'删除网站内容');sel=-1;await loadAllRecords();renderList();clearEditor();msg('✅ 内容已删除并同步网站。',true)}function deleteArticle(){if(sel<0)return alert('请先选择内容');del(sel)}async function moveArticle(){if(sel<0)return alert('请先选择内容');let ti=Number($('targetLib').value),target=libs[ti]?.path;if(!target||target===source)return alert('请选择不同的目标内容库');let tf=await get(target),ta=JSON.parse(dec(tf.content));if(!Array.isArray(ta))ta=[];let x={...items[sel],groupId:$('group').value,groupName:cfg.groups?.[$('group').value]?.title||$('group').value};items.splice(sel,1);fileSha=await put(source,JSON.stringify(items,null,2),fileSha,'转移内容并删除原内容');ta.push(x);await put(target,JSON.stringify(ta,null,2),tf.sha,'转移内容并写入目标内容库');await loadAllRecords();msg('✅ 已转移：'+source+' → '+target,true);clearEditor()}function newArticle(){clearEditor();window.scrollTo({top:0,behavior:'smooth'})}async function saveConfigFields(){cfg.siteName=$('siteName').value;cfg.heroTitle=$('heroTitle').value;cfg.heroText=$('heroText').value;cfg.topNotice=$('topNotice').value;cfg.publicWelfareNotice={title:$('pwTitle').value,text:$('pwText').value};cfgSha=await put('data/site-config.json',JSON.stringify({content:JSON.stringify(cfg,null,2)},null,2),cfgSha,'更新首页与公益声明');$('configJson').value=JSON.stringify(cfg,null,2);msg('✅ 首页与公益声明已保存。',true);renderGroups()}function renderGroups(){$('groups').innerHTML=Object.entries(cfg.groups||{}).map(([id,g])=>'<div class="row"><b>'+esc(id)+' · '+esc(g.title||'')+'</b><div class="mut">'+esc(g.subtitle||'')+'</div></div>').join('')}async function saveConfigJson(){try{cfg=JSON.parse($('configJson').value);cfgSha=await put('data/site-config.json',JSON.stringify({content:JSON.stringify(cfg,null,2)},null,2),cfgSha,'更新全部网站配置');$('siteName').value=cfg.siteName||'';$('heroTitle').value=cfg.heroTitle||'';$('heroText').value=cfg.heroText||'';$('topNotice').value=cfg.topNotice||'';msg('✅ 整个网站配置已保存。',true);renderGroups()}catch(e){msg('❌ JSON错误：'+e.message)}}async function uploadImages(){let fs=[...$('files').files];if(!fs.length)return alert('请选择图片');for(const f of fs){if(f.size>5*1024*1024)return alert('单张图片超过5MB');let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});let ext=f.name.includes('.')?f.name.slice(f.name.lastIndexOf('.')):'.jpg';let p='static/uploads/'+new Date().toISOString().slice(0,7).replace('-','/')+'/img_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+ext;await putB64(p,data,null,'上传网站图片')}msg('✅ 图片上传成功。',true)}async function gallery(){let d=[];async function walk(p){let a;try{a=await api(base()+'/contents/'+p+'?ref=main')}catch{return}for(const x of a||[]){if(x.type==='file'&&/\.(png|jpe?g|webp|gif)$/i.test(x.name))d.push(x);else if(x.type==='dir')await walk(x.path)}}await walk('static/uploads');$('gallery').innerHTML=d.map(x=>'<div class="pic"><img src="/'+x.path+'"><div class="mut">'+esc(x.path)+'</div></div>').join('')||'暂无图片'}gallery()</script></body></html>
