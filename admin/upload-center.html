<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏上传中心</title><style>:root{--r:#741912;--g:#b88a3b;--bg:#f7f1e8;--card:#fffdf8;--line:#e3d8cc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{background:linear-gradient(135deg,#741912,#30100c);color:#fff;padding:22px 0}.wrap{width:min(1120px,94vw);margin:auto}.head h1{margin:0;color:#f4d47b}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px;margin:15px 0;box-shadow:0 5px 18px #0000000b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{font-weight:800;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}textarea{min-height:130px}.btn{border:0;border-radius:9px;padding:10px 14px;color:#fff;font-weight:800;cursor:pointer}.red{background:var(--r)}.gold{background:var(--g);color:#30130f}.gray{background:#6d625a}.cat{border:1px solid var(--line);background:#faf7f2;border-radius:9px;padding:10px;text-align:left;cursor:pointer}.cat.on{background:var(--r);color:#fff}.status{padding:10px;background:#f5eee5;border-radius:9px;margin-top:10px}.hide{display:none}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.item{border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}.item img{width:100%;height:190px;object-fit:cover;border-radius:8px;margin-top:8px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.hint{font-size:13px;color:#756b62}@media(max-width:700px){.grid,.items,.form{grid-template-columns:1fr}.wrap{width:92vw}.item img{height:220px}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛集藏上传中心</h1><div>全站资料管理：发布 · 图片 · 修改 · 上下架 · 删除 · 自动归类</div></div></header><main class="wrap"><section class="card"><h2>⚙️ 连接设置</h2><div class="form"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><button class="btn red" id="saveCfg">保存设置</button><div id="cfgStatus" class="status">Token 仅保存在本机浏览器。</div></section><section class="card"><h2 id="formTitle">📤 新增资料</h2><p class="hint">版块来自网站修改设计工具的统一配置。修改网站版块后，上传中心会自动同步。</p><div id="groups"></div><div class="status">当前版块：<b id="selectedName">读取中…</b></div><div class="form" style="margin-top:12px"><div class="wide"><label>发布版块</label><select id="category"></select></div><div><label>日期</label><input id="date" type="date"></div><div><label>内容类型</label><select id="kind"><option>文章 / 资料</option><option>鉴赏</option><option>行情价格</option><option>历史研究</option><option>公告 / 说明</option></select></div><div class="wide"><label>标题</label><input id="title"></div><div id="priceBox" class="wide hide"><label>参考价格（仅行情版块）</label><input id="price"></div><div class="wide"><label>摘要（可选）</label><input id="note"></div><div class="wide"><label>正文</label><textarea id="content"></textarea></div><div class="wide"><label>图片</label><input id="images" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple><div class="hint">最多6张、单张5MB。</div></div></div><div class="actions"><button class="btn gold" id="publish">📤 发布到网站</button><button class="btn gray hide" id="cancel">取消修改</button></div><div id="pubStatus" class="status">等待操作</div></section><section class="card"><h2>📋 全部资料</h2><div class="form"><input id="search" placeholder="搜索标题、正文、价格"><select id="filter"><option value="all">全部版块</option></select><input id="filterDate" type="date"></div><button class="btn red" id="refresh" style="margin-top:9px">🔄 刷新资料</button><div id="loadStatus" class="status">尚未读取</div><div id="items" class="items" style="margin-top:10px"></div></section></main><script>const $=id=>document.getElementById(id),TODAY=new Date().toISOString().slice(0,10);$('date').value=TODAY;let GROUPS={},LABEL={},PRICE=new Set,PATH={},all=[],editing=null;const cfgKey='hsjc_cfg';let cfg=JSON.parse(localStorage.getItem(cfgKey)||'{}');for(const k of ['owner','repo','branch','token'])if(cfg[k])$(k).value=cfg[k];$('saveCfg').onclick=()=>{cfg={owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()};localStorage.setItem(cfgKey,JSON.stringify(cfg));$('cfgStatus').textContent='✅ 设置已保存';init()};function need(){if(!$('token').value.trim())throw Error('请先填写 GitHub Token')}function base(){return '/repos/'+$('owner').value.trim()+'/'+$('repo').value.trim()}async function api(path,opt={}){need();const r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json','Authorization':'Bearer '+$('token').value.trim(),'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}function b64(buf){let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)}function text64(s){return b64(new TextEncoder().encode(s))}async function getFile(path){try{return await api(base()+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value.trim()||'main'))}catch(e){if(String(e.message).includes('Not Found'))return null;throw e}}async function putText(path,text,msg,sha){const body={message:msg,content:text64(text),branch:$('branch').value.trim()||'main'};if(sha)body.sha=sha;return api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}async function putImage(path,file){return api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛集藏：上传图片',content:b64(await file.arrayBuffer()),branch:$('branch').value.trim()||'main'})})}async function loadConfig(){const f=await getFile('data/site-config.json');if(!f)throw Error('找不到 data/site-config.json');return JSON.parse(atob((f.content||'').replace(/\s/g,'')))}function pathFor(id){if(id.startsWith('market_'))return 'data/market/'+id.slice(7)+'.json';if(id.startsWith('fujian_'))return 'data/market/'+id+'.json';return 'data/content/'+id+'.json'}async function readData(cat){const path=pathFor(cat),f=await getFile(path);let arr=[];if(f){const raw=atob((f.content||'').replace(/\s/g,''));try{arr=JSON.parse(decodeURIComponent(escape(raw)))}catch{arr=[]}}return{path,sha:f&&f.sha,arr:Array.isArray(arr)?arr:[]}}async function saveData(d,msg){await putText(d.path,JSON.stringify(d.arr,null,2),msg,d.sha)}function setupGroups(c){GROUPS={};LABEL={};PRICE=new Set;PATH={};for(const [gid,g] of Object.entries(c.groups||{})){GROUPS[g.title]=[];(g.items||[]).filter(x=>x.enabled).forEach(x=>{GROUPS[g.title].push([x.id,x.name]);LABEL[x.id]=x.name;if(x.id.startsWith('market_'))PRICE.add(x.id);PATH[x.id]=pathFor(x.id)})}let h='',cats='';for(const [g,items] of Object.entries(GROUPS)){h+='<h3>'+esc(g)+'</h3><div class="grid">';items.forEach(([k,n])=>{h+='<button class="cat" data-cat="'+esc(k)+'">'+esc(n)+'</button>';cats+='<option value="'+esc(k)+'">'+esc(n)+'</option>'});h+='</div>'}$('groups').innerHTML=h;$('category').innerHTML=cats;$('filter').innerHTML='<option value="all">全部版块</option>'+cats;document.querySelectorAll('.cat').forEach(b=>b.onclick=()=>selectCat(b.dataset.cat));$('category').onchange=e=>selectCat(e.target.value);const first=Object.keys(LABEL)[0];if(first)selectCat(first)}function selectCat(k){$('category').value=k;$('selectedName').textContent=LABEL[k]||k;$('priceBox').classList.toggle('hide',!PRICE.has(k));document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('on',b.dataset.cat===k))}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function uploadImages(id,files){const out=[];for(let i=0;i<files.length;i++){const f=files[i];if(f.size>5*1024*1024)throw Error('图片 '+f.name+' 超过5MB');const safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_').slice(-70);const name=id+'-'+Date.now()+'-'+i+'-'+safe;await putImage('static/uploads/'+name,f);out.push('/static/uploads/'+name)}return out}async function loadAll(){try{all=[];for(const cat of Object.keys(LABEL)){const d=await readData(cat);d.arr.forEach((r,i)=>all.push({cat,i,r}))}render();$('loadStatus').textContent='✅ 已读取 '+all.length+' 条资料'}catch(e){$('loadStatus').textContent='❌ 读取失败：'+e.message}}function render(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value,fd=$('filterDate').value,a=all.filter(x=>(f==='all'||x.cat===f)&&(!fd||x.r.date===fd)&&(!q||[x.r.title,x.r.content,x.r.note,x.r.price].join(' ').toLowerCase().includes(q)));$('items').innerHTML=a.map(x=>{const idx=all.indexOf(x),r=x.r,img=Array.isArray(r.images)&&r.images[0]?r.images[0]:'';return '<article class="item"><b>'+esc(LABEL[x.cat])+' · '+esc(r.title)+'</b>'+(img?'<img src="'+esc(img)+'">':'<div class="status">暂无图片</div>')+(r.price?'<p><b>参考价格：</b>'+esc(r.price)+'</p>':'')+'<p>'+esc(r.content||r.note)+'</p><small>'+esc(r.date||'')+' · '+(r.status==='hidden'?'已下架':'已上架')+'</small><div class="actions"><button class="btn gold" onclick="editItem('+idx+')">✏️ 修改</button><button class="btn gray" onclick="toggleItem('+idx+')">👁 '+(r.status==='hidden'?'上架':'下架')+'</button><button class="btn red" onclick="deleteItem('+idx+')">🗑 删除</button></div></article>'}).join('')||'<div class="status">暂无资料</div>'}window.editItem=i=>{const x=all[i];editing=x;selectCat(x.cat);$('date').value=x.r.date||TODAY;$('kind').value=x.r.kind||'文章 / 资料';$('title').value=x.r.title||'';$('price').value=x.r.price||'';$('note').value=x.r.note||'';$('content').value=x.r.content||'';$('images').value='';$('formTitle').textContent='✏️ 修改资料';$('publish').textContent='💾 保存修改';$('cancel').classList.remove('hide');scrollTo({top:0,behavior:'smooth'})};$('cancel').onclick=()=>{editing=null;$('formTitle').textContent='📤 新增资料';$('publish').textContent='📤 发布到网站';$('cancel').classList.add('hide');$('title').value='';$('price').value='';$('note').value='';$('content').value='';$('images').value='';$('date').value=TODAY};$('publish').onclick=async()=>{try{need();const cat=$('category').value,title=$('title').value.trim();if(!title)throw Error('请填写标题');const files=Array.from($('images').files||[]);if(files.length>6)throw Error('最多上传6张图片');const id=editing?editing.r.id:Date.now().toString(36);$('pubStatus').textContent=files.length?'⏳ 正在上传图片……':'⏳ 正在发布……';let images=editing&&Array.isArray(editing.r.images)?editing.r.images:[];if(files.length)images=await uploadImages(id,files);const d=await readData(cat),r={id,title,content:$('content').value.trim(),note:$('note').value.trim(),price:PRICE.has(cat)?$('price').value.trim():'',kind:$('kind').value,date:$('date').value||TODAY,images,status:editing?editing.r.status:'published'};if(editing&&editing.cat===cat)d.arr[editing.i]=r;else{if(editing){const old=await readData(editing.cat);old.arr.splice(editing.i,1);await saveData(old,'洪盛集藏：移动资料版块')}d.arr.unshift(r)}await saveData(d,editing?'洪盛集藏：修改资料':'洪盛集藏：发布资料');$('pubStatus').textContent='✅ 发布成功：'+LABEL[cat]+(images.length?'，图片已上传':'');$('cancel').click();await loadAll()}catch(e){$('pubStatus').textContent='❌ 发布失败：'+e.message}};window.toggleItem=async i=>{try{const x=all[i],d=await readData(x.cat);d.arr[x.i].status=d.arr[x.i].status==='hidden'?'published':'hidden';await saveData(d,'洪盛集藏：上下架');await loadAll()}catch(e){alert('操作失败：'+e.message)}};window.deleteItem=async i=>{if(!confirm('确定删除这条资料？资料记录会删除，已上传图片文件不会自动删除。'))return;try{const x=all[i],d=await readData(x.cat);d.arr.splice(x.i,1);await saveData(d,'洪盛集藏：删除资料');await loadAll()}catch(e){alert('删除失败：'+e.message)}};['search','filter','filterDate'].forEach(id=>$(id).addEventListener('input',render));$('refresh').onclick=loadAll;async function init(){try{const c=await loadConfig();setupGroups(c);await loadAll()}catch(e){$('loadStatus').textContent='❌ 初始化失败：'+e.message}}init();</script></body></html>
