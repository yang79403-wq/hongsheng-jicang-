<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>洪盛集藏 · 全能管理中心</title>
<style>
:root{--red:#741912;--gold:#b88a3b;--bg:#f5efe7;--card:#fffdf9;--line:#e2d6c8;--text:#2d241e;--muted:#746a61}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",Arial,sans-serif}
.header{background:linear-gradient(135deg,#741912,#2e0e0a);color:#fff;padding:22px 0}.wrap{width:min(1250px,94vw);margin:auto}.brand{display:flex;justify-content:space-between;align-items:center;gap:16px}.brand h1{margin:0;color:#f4d47b;font-family:"Songti SC","STSong","Noto Serif CJK SC",serif}.brand p{margin:6px 0 0;color:#eadfd1}.site{color:#fff;text-decoration:none;border:1px solid #d6b66e;padding:9px 13px;border-radius:9px}
.nav{display:flex;gap:8px;overflow:auto;padding:14px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff8ef;color:var(--text);border-radius:10px;padding:10px 15px;font-weight:800;cursor:pointer}.tab.on{background:var(--red);color:#fff;border-color:var(--red)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:15px;box-shadow:0 5px 18px #0000000b;overflow:hidden}.intro{padding:16px;border-bottom:1px solid var(--line)}.intro h2{margin:0 0 5px;color:var(--red)}.intro p{margin:0;color:var(--muted);font-size:14px}.frame{width:100%;height:calc(100vh - 250px);min-height:650px;border:0;background:#fff}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}.quick a{background:#fffdf9;border:1px solid var(--line);border-radius:12px;padding:13px;text-decoration:none;color:var(--text);font-weight:800}.quick b{display:block;color:var(--red);margin-bottom:4px}.quick span{font-size:12px;color:var(--muted);font-weight:400}
@media(max-width:700px){.brand{align-items:flex-start}.brand h1{font-size:21px}.site{font-size:12px}.quick{grid-template-columns:1fr 1fr}.frame{height:calc(100vh - 300px);min-height:600px}}
</style>
</head>
<body>
<header class="header"><div class="wrap brand"><div><h1>洪盛集藏 · 全能管理中心</h1><p>AI 网站设计 + 人工设计 + 全站资料上传，统一管理</p></div><a class="site" href="../" target="_blank">🌐 查看网站</a></div></header>
<main class="wrap">
<div class="quick">
<a href="../" target="_blank"><b>🌐 网站前台</b><span>查看实际网站效果</span></a>
<a href="upload-center-v2.html" target="_blank"><b>📤 资料上传</b><span>发布、修改、删除、归类</span></a>
<a href="site-editor-ai-v2.html" target="_blank"><b>🤖 AI 设计师 V2.0</b><span>一句话生成设计方案</span></a>
<a href="site-editor.html" target="_blank"><b>🎨 人工设计</b><span>精细调整网站配置</span></a>
</div>
<nav class="nav"><button class="tab on" data-src="upload-center-v2.html" data-title="📤 全站资料管理">📤 资料管理</button><button class="tab" data-src="site-editor-ai-v2.html" data-title="🤖 AI 网站设计师 V2.0">🤖 AI 设计</button><button class="tab" data-src="site-editor.html" data-title="🎨 人工网站设计">🎨 人工设计</button></nav>
<section class="panel"><div class="intro"><h2 id="title">📤 全站资料管理</h2><p id="desc">图片、文字、行情资料发布后自动归类到网站对应版块。</p></div><iframe id="frame" class="frame" src="upload-center-v2.html" title="洪盛集藏管理工具"></iframe></section>
</main>
<script>
const desc={"upload-center-v2.html":"图片、文字、行情资料发布后自动归类到网站对应版块。","site-editor-ai-v2.html":"一句话描述目标，AI 生成方案；确认后再应用或发布。","site-editor.html":"人工精细修改网站名称、版块、字体、颜色、排序和显示状态。"};
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');const s=t.dataset.src;document.getElementById('frame').src=s;document.getElementById('title').textContent=t.dataset.title;document.getElementById('desc').textContent=desc[s]||'';});
</script>
</body>
</html>
