<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏 AI 网站设计师 V2.1</title><style>:root{--r:#6d1712;--g:#b99550;--bg:#f7f1e8;--card:#fffdf9;--line:#dfd0b8;--ink:#2b2521;--muted:#756b61}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1120px,94vw);margin:auto}.head{background:linear-gradient(135deg,#3d0906,#701811,#430a07);color:#fff;padding:26px 0}.head h1{margin:0;color:#f3d88f;font-family:"Noto Serif SC","Songti SC",serif}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:16px 0;box-shadow:0 10px 30px #3a1f1208}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:800;margin-bottom:5px}input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#fff;font:inherit}textarea{min-height:120px}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.red{background:var(--r);color:#fff}.gold{background:var(--g);color:#35100c}.gray{background:#6b625a;color:#fff}.status{padding:11px;border-radius:10px;background:#f4ead9;margin-top:10px;white-space:pre-wrap}.preview{padding:22px;border:1px solid var(--line);border-radius:20px;background:#fff;margin-top:12px}.lock{display:grid;gap:8px}.lock label{font-weight:600}.lock input{width:auto}.pill{display:inline-block;padding:5px 9px;background:#f2e4c9;border-radius:99px;margin:3px;font-size:12px}@media(max-width:700px){.form{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛集藏 · AI 网站设计师 V2.1</h1><p>专门适配新版首页：深红金色、钱币收藏视觉、响应式布局。先分析，后确认，再发布。</p></div></header><main class="wrap"><section class="card"><h2>🤖 一句话设计</h2><textarea id="prompt" placeholder="例如：保持所有内容和版块不变，把首页做得更专业、更醒目，标题层级清楚，手机端更舒服。"></textarea><p><button class="btn gray" onclick="example()">示例</button> <button class="btn red" onclick="analyze()">✨ 分析并生成方案</button></p><div id="status" class="status">等待设计要求</div></section><section class="card"><h2>🧠 新版网站诊断</h2><div id="diag" class="status">正在读取统一网站配置……</div></section><section class="card"><h2>🎨 设计预览</h2><div id="preview" class="preview">尚未生成方案</div><p><button class="btn gold" onclick="apply()">应用到当前方案</button> <button class="btn red" onclick="publish()">🚀 确认并发布</button></p><div id="pub" class="status">尚未发布</div></section><section class="card"><h2>🛡️ 安全锁</h2><div class="lock"><label><input id="keepData" type="checkbox" checked> 资料、图片、详情不改</label><label><input id="keepGroups" type="checkbox" checked> 版块不改，只允许视觉优化</label><label><input id="keepContent" type="checkbox" checked> 首页文字不改</label><label><input id="keepResponsive" type="checkbox" checked> 保持手机 / 电脑自适应</label></div><div class="status">默认只修改 theme。不会删除已有资料，也不会重新创建版块。</div></section><section class="card"><h2>🔐 发布连接</h2><div class="form"><div><label>用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" autocomplete="off"></div></div><p><button class="btn gray" onclick="save()">保存本机设置</button></p></section></main><script>const $=x=>document.getElementById(x);let cfg=null,file=null,plan=null;const KEY='hsjc_ai_v21';const DEF={primary:'#6d1712',accent:'#b99550',titleColor:'#741912',bodyColor:'#2b2521',titleFont:'Noto Serif SC, Songti SC, STSong, serif',bodyFont:'Noto Sans SC, -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, Arial, sans-serif',titleWeight:900,cardRadius:20};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function save(){localStorage.setItem(KEY,JSON.stringify({owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()}));$('status').textContent='✅ 本机设置已保存'}function load(){try{let x=JSON.parse(localStorage.getItem(KEY)||'{}');for(let k of ['owner','repo','branch','token'])if(x[k])$(k).value=x[k]}catch{}}function need(){if(!$('token').value.trim())throw Error('请先填写 GitHub Token')}function base(){return '/repos/'+$('owner').value.trim()+'/'+$('repo').value.trim()}async function api(path,opt={}){need();let r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json','Authorization':'Bearer '+$('token').value.trim(),'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}}),t=await r.text(),d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}function dec(s){let b=atob((s||'').replace(/\s/g,''));return new TextDecoder('utf-8').decode(Uint8Array.from(b,c=>c.charCodeAt(0)))}function enc(s){let b=new TextEncoder().encode(s),x='';for(let i=0;i<b.length;i+=32768)x+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(x)}async function get(){let r=await api(base()+'/contents/data/site-config.json?ref='+encodeURIComponent($('branch').value.trim()||'main'));return{sha:r.sha,text:dec(r.content)}}async function init(){try{file=await get();cfg=JSON.parse(file.text);let groups=Object.keys(cfg.groups||{}).length,items=Object.values(cfg.groups||{}).reduce((n,g)=>n+(g.items||[]).length,0);$('diag').innerHTML='网站：<b>'+esc(cfg.siteName||'洪盛集藏')+'</b>\n一级版块：<b>'+groups+'</b>　资料分类：<b>'+items+'</b>\n<span class="pill">🥈 银元 · 机制币已统一</span><span class="pill">资料保护</span><span class="pill">手机适配</span>';$('status').textContent='✅ 已读取新版统一配置'}catch(e){$('diag').textContent='⚠️ 读取失败：'+e.message}}function example(){$('prompt').value='保持现在所有首页文字、版块、资料和图片不变，只优化成专业中国钱币收藏网站：深红金色、标题醒目、层级清晰、卡片精致、手机端简洁。'}function analyze(){let p=$('prompt').value.trim();if(!p)return alert('请先输入设计要求');if(!cfg)cfg={theme:{...DEF}};let t={...DEF,...(cfg.theme||{})},n=[];if(/深红|红金|中国|传统|古典|博物馆|钱币/.test(p)){t.primary='#6d1712';t.accent='#b99550';t.titleColor='#741912';t.titleFont='Noto Serif SC, Songti SC, STSong, serif';t.titleWeight=900;n.push('采用新版网站深红 + 古金视觉规范')}if(/醒目|突出|层级|标题/.test(p)){t.titleWeight=900;n.push('强化标题层级与重点信息')}if(/简洁|清爽|手机|移动/.test(p)){t.cardRadius=16;n.push('优化移动端阅读节奏')}if(/圆润/.test(p))t.cardRadius=20;if(/黑金/.test(p)){t.primary='#241c18';t.accent='#c8a15a';t.titleColor='#3b2a1e';n.push('切换黑金收藏风')}if($('keepData').checked)n.push('资料、图片、详情锁定');if($('keepGroups').checked)n.push('版块结构锁定');if($('keepContent').checked)n.push('首页文字锁定');if($('keepResponsive').checked)n.push('响应式布局保留');plan={theme:t};$('preview').innerHTML='<h2 style="color:'+t.titleColor+';font-family:'+t.titleFont+';font-weight:'+t.titleWeight+'">洪盛集藏</h2><p>钱币收藏资料与交流平台</p><div style="background:'+t.primary+';color:#fff;padding:12px;border-radius:10px">最新价格行情</div><div style="margin-top:10px;padding:14px;border:1px solid '+t.accent+';border-radius:'+t.cardRadius+'px"><b style="color:'+t.titleColor+'">🥈 银元 · 机制币</b><p>收藏交流 · 鉴赏参考</p></div>';$('status').textContent='✨ 已生成安全设计方案\n'+n.map(x=>'• '+x).join('\n')}function apply(){if(!plan)return alert('请先生成方案');cfg.theme=plan.theme;$('status').textContent='✅ 已应用到当前方案，尚未发布'}async function publish(){try{if(!plan)throw Error('请先生成方案');if(!file)file=await get();let out=JSON.parse(file.text);out.theme=plan.theme;let body={message:'洪盛集藏：AI 网站设计师 V2.1 同步新版网站',content:enc(JSON.stringify(out,null,2)),branch:$('branch').value.trim()||'main',sha:file.sha};await api(base()+'/contents/data/site-config.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});file=await get();$('pub').textContent='✅ 已发布新版网站设计配置。资料与栏目未修改。';}catch(e){$('pub').textContent='❌ 发布失败：'+e.message}}load();init();</script></body></html>
