<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>洪盛收藏资讯网｜全站管理 V5</title>
<style>
:root{--red:#68100a;--gold:#d6b35b;--bg:#f5eee5;--card:#fffdf9;--line:#dfcdae;--ink:#302721;--muted:#756a61;--green:#2f6b3b;--danger:#a62a20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{background:linear-gradient(135deg,#350604,#75170f);color:#f6d985;padding:22px}.wrap{width:min(1200px,94vw);margin:auto}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 2px 8px #00000008}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:800;margin:7px 0 5px}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8c8b5;border-radius:8px;font:inherit;background:#fff}textarea{min-height:110px}.btn{border:0;border-radius:8px;padding:9px 13px;margin:4px;font-weight:800;cursor:pointer}.red{background:var(--red);color:#fff}.gold{background:var(--gold);color:#32130d}.gray{background:#756a63;color:#fff}.green{background:var(--green);color:#fff}.danger{background:var(--danger);color:#fff}.status{padding:11px;background:#f8efe4;border-radius:8px;margin-top:10px}.ok{background:#e8f5e9;color:#245d2b}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab{white-space:nowrap;padding:10px 14px;border:1px solid var(--line);background:#fff9f0;border-radius:9px;font-weight:800;cursor:pointer}.tab.on{background:var(--red);color:#fff}.panel{display:none}.panel.on{display:block}.row{border:1px solid #eadfce;background:#fffaf3;border-radius:10px;padding:11px;margin:8px 0}.rowtop{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{font-size:12px;color:var(--muted)}.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:#ead9bc}.off{opacity:.55}.article{border:1px solid #decfb9;background:#fff;padding:13px;border-radius:10px;margin:9px 0}.small{font-size:12px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee1c9;margin:2px}.preview{max-width:320px;padding:12px;border:1px solid var(--gold);border-radius:10px;background:#fff}.dangerText{color:var(--danger)}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.rowtop{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body>
<header class="head"><div class="wrap"><h1>洪盛收藏资讯网 · 全站管理 V5</h1><div>真实读取网站 → 版块/标题 → 内容库 → 发布/修改/删除 → GitHub → 网站同步</div></div></header>
<main class="wrap">
<section class="card"><h2>🔐 GitHub 连接</h2><div class="grid"><div><label>用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><button class="btn red" onclick="loadAll()">🔄 一键读取整个网站</button><button class="btn gray" onclick="saveSettings()">保存连接设置</button><a class="btn gold" href="../">打开网站</a><div id="status" class="status">尚未读取。</div></section>
<nav class="tabs"><button class="tab on" onclick="tab('home',this)">🏠 首页</button><button class="tab" onclick="tab('groups',this)">🗂️ 版块管理</button><button class="tab" onclick="tab('articles',this)">📰 内容发布</button><button class="tab" onclick="tab('services',this)">⭐ 服务内容</button><button class="tab" onclick="tab('lists',this)">📚 其他内容</button><button class="tab" onclick="tab('diagnose',this)">🔎 实际读取</button></nav>
<section id="home" class="panel on">
<div class="card"><h2>🏠 首页文字</h2><div class="grid"><div><label>网站名称</label><input id="siteName"></div><div><label>首页标题</label><input id="heroTitle"></div><div class="wide"><label>首页介绍</label><textarea id="heroText"></textarea></div><div class="wide"><label>顶部公告</label><textarea id="topNotice"></textarea></div></div><button class="btn gold" onclick="saveHome()">保存首页</button></div>
<div class="card"><h2>📜 公益性网站声明</h2><label>标题</label><input id="pwTitle"><label>内容</label><textarea id="pwText"></textarea><button class="btn gold" onclick="savePW()">保存公益声明</button></div>
</section>
<section id="groups" class="panel">
<div class="card"><h2>🗂️ 网站版块管理</h2><div class="status">这里修改的是网站真正使用的 <b>nav + groups</b>。修改版块标题会同时同步导航标题。支持新增、修改、删除、启用/停用、排序。</div><div id="groupList"></div></div>
<div class="card"><h3>➕ 新增网站版块</h3><div class="grid"><div><label>版块 ID</label><input id="gId" placeholder="例如 research"></div><div><label>版块标题</label><input id="gTitle" placeholder="例如 钱币历史研究"></div><div class="wide"><label>版块说明</label><textarea id="gSub"></textarea></div></div><button class="btn red" onclick="addGroup()">新增版块并加入网站导航</button></div>
</section>
<section id="articles" class="panel">
<div class="card"><h2>📰 网站内容发布 / 修改 / 删除</h2><div class="grid"><div><label>内容库</label><select id="contentFile" onchange="loadArticlesInFile()"></select></div><div><label>状态筛选</label><select id="filter" onchange="renderArticles()"><option value="all">全部</option><option value="published">已发布</option><option value="draft">草稿</option></select></div></div><div id="articleList"></div></div>
<div class="card"><h2>✍️ 内容编辑器</h2><input type="hidden" id="editIndex" value="-1"><div class="grid"><div><label>内容 ID</label><input id="aId"></div><div><label>文章标题</label><input id="aTitle"></div><div><label>发布日期</label><input id="aDate" type="date"></div><div><label>分类 / 类型</label><input id="aKind"></div><div><label>状态</label><select id="aStatus"><option value="published">published · 已发布</option><option value="draft">draft · 草稿</option></select></div><div><label>目标版块</label><select id="aGroup"></select></div><div class="wide"><label>摘要 / 说明</label><textarea id="aNote"></textarea></div><div class="wide"><label>正文</label><textarea id="aContent" style="min-height:260px"></textarea></div><div class="wide"><label>图片路径（一行一条）</label><textarea id="aImages"></textarea></div></div><button class="btn red" onclick="saveArticleEditor()">💾 保存 / 发布内容</button><button class="btn gray" onclick="newArticle()">清空并新增</button></div>
</section>
<section id="services" class="panel"><div class="card"><h2>⭐ 服务内容</h2><div id="serviceList"></div></div></section>
<section id="lists" class="panel"><div class="card"><h2>📚 收藏范围 / 日常交流 / 服务范围 / 安全说明</h2><div class="grid"><div><label>收藏范围</label><textarea id="scope"></textarea></div><div><label>日常交流内容</label><textarea id="daily"></textarea></div><div><label>服务范围</label><textarea id="range"></textarea></div><div><label>安全说明</label><textarea id="security"></textarea></div></div><button class="btn gold" onclick="saveLists()">保存其他网站内容</button></div></section>
<section id="diagnose" class="panel"><div class="card"><h2>🔎 实际读取结果</h2><div id="diag" class="status">尚未读取</div><pre id="raw" style="white-space:pre-wrap;background:#24110e;color:#f5dfad;padding:12px;border-radius:8px;max-height:500px;overflow:auto"></pre></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let cfg=null,cfgSha=null,files=[],articles=[],articleSha=null;
const enc=new TextEncoder();
const b64=s=>{let a=enc.encode(s),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)};
const dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function unwrap(x){for(let i=0;i<10&&x&&typeof x==='object'&&typeof x.content==='string';i++){try{x=JSON.parse(x.content)}catch{break}}return x}
function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}
async function api(path,opt={}){let t=$('token').value.trim();if(!t)throw Error('请填写 GitHub Token');let r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});let txt=await r.text(),d={};try{d=JSON.parse(txt)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}
async function getFile(path){return api(base()+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value.trim()||'main'))}
async function putFile(path,text,sha,msg){let body={message:'洪盛收藏资讯网：'+msg,content:b64(text),branch:$('branch').value.trim()||'main'};if(sha)body.sha=sha;let r=await api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.content?.sha}
function saveSettings(){localStorage.setItem('hsjc_v5',JSON.stringify({owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()}))}
try{let s=JSON.parse(localStorage.getItem('hsjc_v5')||'{}');['owner','repo','branch','token'].forEach(k=>{if(s[k])$(k).value=s[k]})}catch{}
async function loadAll(){try{saveSettings();let f=await getFile('data/site-config.json');cfgSha=f.sha;cfg=unwrap(JSON.parse(dec(f.content)));if(!cfg||!cfg.groups)throw Error('网站配置解析失败');let d=await api(base()+'/contents/data/content?ref='+encodeURIComponent($('branch').value.trim()||'main'));files=(Array.isArray(d)?d:[]).filter(x=>x.type==='file'&&x.name.endsWith('.json'));fillFiles();renderCfg();await loadArticlesInFile();$('raw').textContent=JSON.stringify({groups:cfg.groups,nav:cfg.nav,contentLibraries:files.map(x=>x.name)},null,2);$('diag').className='status ok';$('diag').textContent='✅ 已真实读取网站配置 + '+files.length+' 个内容库；版块标题、版块内容、文章标题均可编辑。';$('status').className='status ok';$('status').textContent='✅ 全站读取完成';}catch(e){$('status').className='status';$('status').textContent='❌ '+e.message}}
function fillFiles(){let s=$('contentFile');s.innerHTML=files.map(f=>'<option value="'+esc(f.name)+'">'+esc(f.name.replace(/\.json$/,''))+'</option>').join('')||'<option value="">暂无内容库</option>'}
async function loadArticlesInFile(){if(!files.length)return;let f=files.find(x=>x.name===$('contentFile').value);if(!f)return;let full=await getFile('data/content/'+f.name);articleSha=full.sha;let raw=JSON.parse(dec(full.content));articles=unwrap(raw);if(!Array.isArray(articles))articles=[];renderArticles();newArticle();renderGroupSelect()}
function renderArticles(){let filter=$('filter').value;let list=articles.map((x,i)=>({x,i})).filter(o=>filter==='all'||(o.x.status||'draft')===filter);$('articleList').innerHTML=list.length?list.map(o=>{let x=o.x;return '<div class="article '+((x.status||'draft')==='draft'?'off':'')+'"><div class="rowtop"><div><b>'+esc(x.title||'(无标题)')+'</b><div class="muted">ID：'+esc(x.id||'')+' · '+esc(x.date||'')+' · '+esc(x.kind||'')+'</div></div><span class="badge">'+esc(x.status||'draft')+'</span></div><div class="muted">'+esc(x.note||'')+'</div><button class="btn gold" onclick="editArticle('+o.i+')">✏️ 编辑完整内容</button><button class="btn '+((x.status||'draft')==='published'?'gray':'green')+'" onclick="toggleArticle('+o.i+')">'+((x.status||'draft')==='published'?'下架':'发布')+'</button><button class="btn danger" onclick="deleteArticle('+o.i+')">🗑️ 删除</button></div>'}).join(''):'<div class="status">当前内容库没有内容。</div>'}
function renderGroupSelect(selected){let s=$('aGroup');s.innerHTML=Object.entries(cfg.groups||{}).map(([id,g])=>'<option value="'+esc(id)+'">'+esc(g.title||id)+'</option>').join('');if(selected)s.value=selected}
function findGroupForItem(id){for(let [gid,g] of Object.entries(cfg.groups||{})){if((g.items||[]).some(x=>x.id===id))return gid}return ''}
function editArticle(i){let x=articles[i];$('editIndex').value=i;$('aId').value=x.id||'';$('aTitle').value=x.title||'';$('aDate').value=x.date||'';$('aKind').value=x.kind||'';$('aStatus').value=x.status||'draft';$('aNote').value=x.note||'';$('aContent').value=x.content||'';$('aImages').value=Array.isArray(x.images)?x.images.join('\n'):'';renderGroupSelect(findGroupForItem(x.id));tab('articles',document.querySelector('.tab:nth-child(3)'));window.scrollTo({top:document.body.scrollHeight/3,behavior:'smooth'})}
function newArticle(){ $('editIndex').value='-1';$('aId').value='';$('aTitle').value='';$('aDate').value=new Date().toISOString().slice(0,10);$('aKind').value='';$('aStatus').value='published';$('aNote').value='';$('aContent').value='';$('aImages').value='';renderGroupSelect() }
async function saveArticleEditor(){let id=$('aId').value.trim(),title=$('aTitle').value.trim();if(!id||!title)return alert('内容 ID 和文章标题不能为空');let idx=Number($('editIndex').value);if(idx<0&&articles.some(x=>x.id===id))return alert('当前内容库已有相同 ID，请修改 ID');if(idx>=0&&articles.some((x,i)=>i!==idx&&x.id===id))return alert('内容 ID 已重复');let x={id,title,date:$('aDate').value||new Date().toISOString().slice(0,10),kind:$('aKind').value.trim(),note:$('aNote').value,content:$('aContent').value,images:$('aImages').value.split('\n').map(v=>v.trim()).filter(Boolean),status:$('aStatus').value};if(idx<0){articles.unshift(x)}else{articles[idx]=x}await saveArticles(idx<0?'新增并发布内容 '+id:'修改内容 '+id);syncGroupItem(x);renderArticles();newArticle()}
function syncGroupItem(x){let gid=$('aGroup').value;if(!gid||!cfg.groups[gid])return;let g=cfg.groups[gid];g.items=g.items||[];let oldG=findGroupForItem(x.id);if(oldG&&oldG!==gid){cfg.groups[oldG].items=cfg.groups[oldG].items.filter(z=>z.id!==x.id)}let item=g.items.find(z=>z.id===x.id);if(!item){g.items.push({id:x.id,name:x.title,enabled:x.status==='published'})}else{item.name=x.title;item.enabled=x.status==='published'}saveCfg('同步文章到版块')}
async function saveArticles(msg){let name=$('contentFile').value;if(!name)return;articleSha=await putFile('data/content/'+name,JSON.stringify(articles,null,2),articleSha,msg);$('status').className='status ok';$('status').textContent='✅ '+msg+'：内容库已保存，网站将自动同步。'}
async function toggleArticle(i){let x=articles[i];x.status=(x.status||'draft')==='published'?'draft':'published';await saveArticles((x.status==='published'?'发布':'下架')+'内容 '+x.id);let gid=findGroupForItem(x.id);if(gid){let item=cfg.groups[gid].items.find(z=>z.id===x.id);if(item)item.enabled=x.status==='published';await saveCfg('同步版块状态')}renderArticles()}
async function deleteArticle(i){let x=articles[i];if(!confirm('确定删除文章“'+x.title+'”？\n\n会从当前内容库删除，并同时从所属版块移除。'))return;articles.splice(i,1);for(let g of Object.values(cfg.groups||{})){g.items=(g.items||[]).filter(z=>z.id!==x.id)}await saveArticles('删除内容 '+x.id);await saveCfg('同步删除内容版块项');renderArticles();newArticle()}
function renderCfg(){let p=cfg.publicWelfareNotice||{};$('siteName').value=cfg.siteName||'';$('heroTitle').value=cfg.heroTitle||'';$('heroText').value=cfg.heroText||'';$('topNotice').value=cfg.topNotice||'';$('pwTitle').value=p.title||'';$('pwText').value=p.text||'';$('scope').value=(cfg.collectionScope||[]).join('\n');$('daily').value=(cfg.dailyContent||[]).join('\n');$('range').value=(cfg.serviceRange||[]).join('\n');$('security').value=(cfg.security||[]).join('\n');renderGroups();renderServices()}
function renderGroups(){let nav=cfg.nav||[];let ids=Object.keys(cfg.groups||{});$('groupList').innerHTML=ids.map((id,pos)=>{let g=cfg.groups[id]||{},n=nav.find(x=>x.id===id)||{};return '<div class="row"><div class="rowtop"><div><b style="font-size:17px">'+esc(g.title||id)+'</b><div class="muted">ID：'+esc(id)+' · 导航：'+esc(n.name||g.title||'')+'</div><div class="muted">'+esc(g.subtitle||'')+'</div></div><span class="badge">'+(g.enabled===false?'已停用':'正常')+'</span></div><div><button class="btn gold" onclick="editGroup('+JSON.stringify(id)+')">✏️ 修改标题/说明</button><button class="btn gray" onclick="toggleGroup('+JSON.stringify(id)+')">'+(g.enabled===false?'启用':'停用')+'</button><button class="btn gold" onclick="moveGroup('+JSON.stringify(id)+',-1)">↑ 上移</button><button class="btn gold" onclick="moveGroup('+JSON.stringify(id)+',1)">↓ 下移</button><button class="btn danger" onclick="deleteGroup('+JSON.stringify(id)+')">🗑️ 删除版块</button></div><div><b>版块内容：</b> ${(g.items||[]).map((x,i)=>'<span class="pill">'+esc(x.name||x.id)+' <button style="border:0;background:none;cursor:pointer" onclick="editGroupItem('+JSON.stringify(id)+','+i+')">✏️</button></span>').join('')||'<span class="muted">暂无内容</span>'}</div><button class="btn red" onclick="addGroupItem('+JSON.stringify(id)+')">➕ 新增版块标题/内容项</button></div>'}).join('')||'<div class="status">暂无版块</div>'}
async function editGroup(id){let g=cfg.groups[id],n=(cfg.nav||[]).find(x=>x.id===id);let title=prompt('修改版块标题',g.title||id);if(title===null)return;let sub=prompt('修改版块说明',g.subtitle||'');if(sub===null)return;title=title.trim();if(!title)return alert('标题不能为空');g.title=title;g.subtitle=sub;(cfg.nav||[]).filter(x=>x.id===id).forEach(x=>x.name=title);await saveCfg('修改版块标题：'+title);renderGroups()}
async function editGroupItem(gid,i){let x=cfg.groups[gid].items[i];let name=prompt('修改版块内标题',x.name||x.id);if(name===null)return;let id=prompt('修改内容 ID',x.id);if(id===null)return;if(!/^[A-Za-z0-9_-]+$/.test(id.trim()))return alert('ID 只能使用英文、数字、下划线、短横线');let old=x.id;x.id=id.trim();x.name=name.trim()||x.name;await saveCfg('修改版块内容标题');if(old!==x.id){for(let a of articles)if(a.id===old)a.id=x.id}renderGroups()}
async function addGroupItem(gid){let id=prompt('内容 ID（必须对应 data/content/*.json 中的内容 ID）');if(!id)return;let name=prompt('版块显示标题');if(!name)return;let g=cfg.groups[gid];g.items=g.items||[];if(g.items.some(x=>x.id===id))return alert('该 ID 已存在');g.items.push({id,name,enabled:true});await saveCfg('新增版块内容项');renderGroups()}
async function toggleGroup(id){cfg.groups[id].enabled=cfg.groups[id].enabled===false;let n=(cfg.nav||[]).find(x=>x.id===id);if(n)n.enabled=cfg.groups[id].enabled;await saveCfg((cfg.groups[id].enabled?'启用':'停用')+'版块');renderGroups()}
async function moveGroup(id,dir){let a=cfg.nav||[];let i=a.findIndex(x=>x.id===id);let j=i+dir;if(i<0||j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];await saveCfg('调整版块顺序');renderGroups()}
async function deleteGroup(id){if(!confirm('确定删除版块“'+(cfg.groups[id].title||id)+'”？\n\n会删除网站导航和版块配置，但不会删除 data/content 中的文章文件。'))return;delete cfg.groups[id];cfg.nav=(cfg.nav||[]).filter(x=>x.id!==id);await saveCfg('删除版块');renderGroups()}
async function addGroup(){let id=$('gId').value.trim(),title=$('gTitle').value.trim();if(!/^[A-Za-z0-9_-]+$/.test(id)||!title)return alert('请输入合法版块 ID 和标题');if(cfg.groups[id])return alert('版块 ID 已存在');cfg.groups[id]={title,subtitle:$('gSub').value.trim(),enabled:true,items:[]};cfg.nav=cfg.nav||[];cfg.nav.push({id,name:title,enabled:true});await saveCfg('新增版块：'+title);$('gId').value='';$('gTitle').value='';$('gSub').value='';renderGroups()}
function renderServices(){let a=cfg.serviceSections||[];$('serviceList').innerHTML=a.map((s,i)=>'<div class="row"><b>'+esc(s.title||s.id)+'</b><div class="muted">'+esc(s.subtitle||'')+'</div>'+(s.items||[]).map((x,j)=>'<div class="row">'+esc(x)+' <button class="btn gold" onclick="editService('+i+','+j+')">修改</button><button class="btn danger" onclick="delService('+i+','+j+')">删除</button></div>').join('')+'<button class="btn red" onclick="addService('+i+')">新增服务内容</button></div>').join('')}
async function editService(i,j){let x=prompt('修改服务内容',cfg.serviceSections[i].items[j]);if(x===null)return;cfg.serviceSections[i].items[j]=x;await saveCfg('修改服务内容');renderServices()}
async function delService(i,j){if(!confirm('删除该服务内容？'))return;cfg.serviceSections[i].items.splice(j,1);await saveCfg('删除服务内容');renderServices()}
async function addService(i){let x=prompt('新增服务内容');if(!x)return;cfg.serviceSections[i].items.push(x);await saveCfg('新增服务内容');renderServices()}
async function saveHome(){cfg.siteName=$('siteName').value;cfg.heroTitle=$('heroTitle').value;cfg.heroText=$('heroText').value;cfg.topNotice=$('topNotice').value;await saveCfg('修改首页内容')}
async function savePW(){cfg.publicWelfareNotice={title:$('pwTitle').value,text:$('pwText').value};await saveCfg('修改公益声明')}
async function saveLists(){cfg.collectionScope=$('scope').value.split('\n').map(x=>x.trim()).filter(Boolean);cfg.dailyContent=$('daily').value.split('\n').map(x=>x.trim()).filter(Boolean);cfg.serviceRange=$('range').value.split('\n').map(x=>x.trim()).filter(Boolean);cfg.security=$('security').value.split('\n').map(x=>x.trim()).filter(Boolean);await saveCfg('修改其他网站内容')}
async function saveCfg(msg){cfgSha=await putFile('data/site-config.json',JSON.stringify({content:JSON.stringify(cfg,null,2)},null,2),cfgSha,msg);$('status').className='status ok';$('status').textContent='✅ '+msg+'：网站配置已保存到 GitHub，Pages 将自动同步。'}
function tab(id,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(id).classList.add('on')}
</script>
</body></html>
