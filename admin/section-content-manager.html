<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>洪盛收藏资讯网｜各版块内容管理</title><style>:root{--r:#68100a;--g:#d6b35b;--bg:#f4eee6;--card:#fffdf9;--line:#dfcdae;--ink:#302721;--muted:#756a61}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{background:linear-gradient(135deg,#360705,#74170f);color:#f6d985;padding:22px}.wrap{max-width:1150px;margin:auto;padding:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:800;margin:8px 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid #d9c9b7;border-radius:8px;font:inherit}textarea{min-height:100px}.btn{border:0;border-radius:8px;padding:9px 13px;font-weight:800;margin:4px;cursor:pointer}.red{background:var(--r);color:#fff}.gold{background:var(--g);color:#32130d}.gray{background:#756a63;color:#fff}.danger{background:#a62a20;color:#fff}.status{padding:11px;background:#f7efe5;border-radius:9px;margin-top:10px}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:#fff9f0;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer}.tab.on{background:var(--r);color:#fff}.panel{display:none}.panel.on{display:block}.item{padding:13px;border:1px solid #eadfce;border-radius:10px;margin:9px 0;background:#fffaf3}.item.off{opacity:.55}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.muted{font-size:12px;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.row{align-items:flex-start;flex-wrap:wrap}}</style></head><body><header class="head"><div class="wrap"><b style="font-size:25px">洪盛收藏资讯网 · 各版块内容管理</b><div>新增 · 修改 · 删除 · 上下架 · 排序 · 统一同步网站</div></div></header><main class="wrap"><section class="card"><h2>🔐 连接网站</h2><div class="grid"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><button class="btn red" id="load">一键读取所有版块内容</button><button class="btn gray" id="settings">保存连接设置</button><a class="btn gold" href="site-content-editor-v3.html">返回全站管理</a><div class="status" id="status">尚未读取。</div></section><section class="card"><h2>🗂️ 选择版块</h2><select id="groupSelect"><option>请先读取网站</option></select></section><section class="card"><h2 id="groupTitle">版块内容</h2><div id="groupInfo" class="muted"></div><div id="items"></div><hr><h3>➕ 新增本版块内容</h3><div class="grid"><div><label>内容 ID</label><input id="newId" placeholder="例如 research_01"></div><div><label>内容标题</label><input id="newName" placeholder="例如：银元版别研究"></div></div><button class="btn red" id="add">新增内容</button></section><section class="card"><h2>📚 其他结构化内容</h2><div class="grid"><div><label>收藏范围</label><textarea id="scope"></textarea></div><div><label>日常交流内容</label><textarea id="daily"></textarea></div><div><label>服务范围</label><textarea id="range"></textarea></div><div><label>安全说明</label><textarea id="security"></textarea></div></div><button class="btn gold" id="saveOther">保存结构化内容</button></section></main><script>const $=id=>document.getElementById(id),K='hsjc_section_manager';let cfg=null,sha=null;const b64=s=>{let a=new TextEncoder().encode(s),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0))),E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));try{let x=JSON.parse(localStorage.getItem(K)||'{}');['owner','repo','branch','token'].forEach(k=>{if(x[k])$(k).value=x[k]})}catch{}function settings(){localStorage.setItem(K,JSON.stringify({owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()}))}function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}async function api(path,opt={}){let t=$('token').value.trim();if(!t)throw Error('请填写 GitHub Token');let r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}}),txt=await r.text(),d={};try{d=JSON.parse(txt)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}async function get(){return api(base()+'/contents/data/site-config.json?ref='+encodeURIComponent($('branch').value.trim()||'main'))}async function put(msg){let r=await api(base()+'/contents/data/site-config.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛收藏资讯网：'+msg,content:b64(JSON.stringify(cfg,null,2)),branch:$('branch').value.trim()||'main',sha})});sha=r.content?.sha||sha;$('status').textContent='✅ '+msg+'，已发布 GitHub，网站将自动同步'}function split(id){return $(id).value.split('\n').map(x=>x.trim()).filter(Boolean)}function syncOther(){$('scope').value=(cfg.collectionScope||[]).join('\n');$('daily').value=(cfg.dailyContent||[]).join('\n');$('range').value=(cfg.serviceRange||[]).join('\n');$('security').value=(cfg.security||[]).join('\n')}function renderGroups(){let s=$('groupSelect'),old=s.value;s.innerHTML='';for(let [id,g] of Object.entries(cfg.groups||{})){let o=document.createElement('option');o.value=id;o.textContent=(g.enabled===false?'⏸️ ':'')+(g.title||id);s.appendChild(o)}if(old&&cfg.groups[old])s.value=old;renderItems()}function renderItems(){let id=$('groupSelect').value,g=cfg.groups?.[id];if(!g){$('groupTitle').textContent='版块内容';$('items').innerHTML='';return}$('groupTitle').textContent=(g.title||id)+' · 内容管理';$('groupInfo').textContent='版块 ID：'+id+'｜'+(g.subtitle||'');let a=g.items||[];$('items').innerHTML=a.length?a.map((x,i)=>'<div class="item '+(x.enabled===false?'off':'')+'"><div class="row"><div><b>'+E(x.name)+'</b><div class="muted">ID：'+E(x.id)+'</div></div><div><button class="btn gold" onclick="edit('+i+')">✏️ 修改</button><button class="btn gray" onclick="toggle('+i+')">'+(x.enabled===false?'上架':'下架')+'</button><button class="btn danger" onclick="removeItem('+i+')">🗑️ 删除</button></div></div></div>').join(''):'<div class="status">本版块暂无内容，可在下面新增。</div>'}window.edit=async i=>{let g=cfg.groups[$('groupSelect').value],x=g.items[i],n=prompt('修改内容标题：',x.name);if(n===null)return;let id=prompt('修改内容 ID：',x.id);if(id===null)return;if(!/^[A-Za-z0-9_\-]+$/.test(id.trim()))return alert('ID 只能使用英文、数字、下划线或短横线。');if(g.items.some((z,j)=>j!==i&&z.id===id.trim()))return alert('该 ID 已存在。');x.name=n.trim()||x.name;x.id=id.trim();await put('修改版块内容 '+x.id);renderItems()};window.toggle=async i=>{let g=cfg.groups[$('groupSelect').value],x=g.items[i];x.enabled=x.enabled===false;await put((x.enabled?'上架':'下架')+'版块内容 '+x.id);renderItems()};window.removeItem=async i=>{let gid=$('groupSelect').value,g=cfg.groups[gid],x=g.items[i];if(!confirm('确定删除“'+x.name+'”？\n\n这会从网站版块配置中删除该条目，但不会删除其他资料文件。'))return;g.items.splice(i,1);await put('删除版块内容 '+x.id);renderItems()};$('add').onclick=async()=>{let gid=$('groupSelect').value,g=cfg.groups[gid],id=$('newId').value.trim(),name=$('newName').value.trim();if(!g||!id||!name)return alert('请填写内容 ID 和标题。');if(!/^[A-Za-z0-9_\-]+$/.test(id))return alert('ID 只能使用英文、数字、下划线或短横线。');if((g.items||[]).some(x=>x.id===id))return alert('该 ID 已存在。');g.items=g.items||[];g.items.push({id,name,enabled:true});await put('新增版块内容 '+id);$('newId').value='';$('newName').value='';renderItems()};$('groupSelect').onchange=renderItems;$('saveOther').onclick=async()=>{cfg.collectionScope=split('scope');cfg.dailyContent=split('daily');cfg.serviceRange=split('range');cfg.security=split('security');await put('修改全站结构化内容')};$('settings').onclick=settings;$('load').onclick=async()=>{try{settings();let f=await get();sha=f.sha;let raw=JSON.parse(dec(f.content));cfg=typeof raw.content==='string'?JSON.parse(raw.content):raw;renderGroups();syncOther();$('status').textContent='✅ 已读取 '+Object.keys(cfg.groups||{}).length+' 个版块，共 '+Object.values(cfg.groups||{}).reduce((n,g)=>n+(g.items||[]).length,0)+' 条版块内容'}catch(e){$('status').textContent='❌ '+e.message}};</script></body></html>
