<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛收藏资讯网｜全站管理 V4</title><style>body{margin:0;background:#f5eee5;color:#332722;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{background:linear-gradient(135deg,#350604,#75170f);color:#f6d985;padding:20px}.wrap{width:min(1180px,94vw);margin:auto}.card{background:#fffdf9;border:1px solid #dfcdae;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:800;margin:6px 0}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8c8b5;border-radius:8px;font:inherit}textarea{min-height:120px}.btn{border:0;border-radius:8px;padding:9px 13px;margin:4px;font-weight:800;cursor:pointer}.red{background:#68100a;color:#fff}.gold{background:#d6b35b;color:#32130d}.gray{background:#756a63;color:#fff}.danger{background:#a62a20;color:#fff}.green{background:#2f6b3b;color:#fff}.status{padding:11px;background:#f8efe4;border-radius:8px;margin-top:10px}.ok{background:#e8f5e9;color:#245d2b}.tabs{display:flex;gap:7px;overflow:auto;margin:14px 0}.tab{white-space:nowrap;padding:9px 13px;border:1px solid #dfcdae;background:#fff9f0;border-radius:8px;font-weight:800}.tab.on{background:#68100a;color:#fff}.panel{display:none}.panel.on{display:block}.row{border:1px solid #eadfce;background:#fffaf3;border-radius:9px;padding:10px;margin:8px 0}.rowtop{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{font-size:12px;color:#766a61}.article{border:1px solid #decfb9;border-radius:10px;padding:12px;margin:9px 0;background:#fff}.article.off{opacity:.6}.badge{font-size:11px;padding:3px 7px;border-radius:99px;background:#ead9bc}.dangerText{color:#a62a20}.raw{white-space:pre-wrap;background:#24110e;color:#f5dfad;padding:12px;border-radius:8px;max-height:360px;overflow:auto;font:12px/1.6 monospace}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.rowtop{align-items:flex-start;flex-direction:column}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛收藏资讯网 · 全站管理 V4</h1><div>首页 · 公益声明 · 版块 · <b>内容发布 / 修改 / 删除 / 上下架</b> · 服务 · 列表 · 图片</div></div></header><main class="wrap"><section class="card"><h2>🔐 连接 GitHub</h2><div class="grid"><div><label>用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><button class="btn red" onclick="loadAll()">🔄 一键读取全部网站内容</button><a class="btn gold" href="../">🌐 打开网站</a><div id="status" class="status">尚未读取。</div></section><nav class="tabs"><button class="tab on" onclick="tab('home',this)">🏠 首页</button><button class="tab" onclick="tab('articles',this)">📰 内容发布管理</button><button class="tab" onclick="tab('groups',this)">🗂️ 版块</button><button class="tab" onclick="tab('services',this)">⭐ 服务</button><button class="tab" onclick="tab('lists',this)">📚 列表</button><button class="tab" onclick="tab('images',this)">🖼️ 图片</button><button class="tab" onclick="tab('raw',this)">🔎 诊断</button></nav><section id="home" class="panel on"><div class="card"><h2>🏠 首页文字</h2><div class="grid"><div><label>网站名称</label><input id="siteName"></div><div><label>首页标题</label><input id="heroTitle"></div><div class="wide"><label>首页介绍</label><textarea id="heroText"></textarea></div><div class="wide"><label>顶部公告</label><textarea id="topNotice"></textarea></div></div><button class="btn gold" onclick="saveHome()">保存首页</button></div><div class="card"><h2>📜 公益性网站声明</h2><label>声明标题</label><input id="pwTitle"><label>声明内容</label><textarea id="pwText"></textarea><button class="btn gold" onclick="savePW()">保存公益声明</button></div></section><section id="articles" class="panel"><div class="card"><h2>📰 网站内容发布管理</h2><div class="grid"><div><label>选择内容库</label><select id="contentFile" onchange="loadArticlesInFile()"><option>请先读取</option></select></div><div><label>状态筛选</label><select id="statusFilter" onchange="renderArticles()"><option value="all">全部</option><option value="published">已发布</option><option value="draft">草稿</option></select></div></div><div class="status">这里管理的是 <b>data/content/*.json</b> 中真正发布到网站的文章内容，不是只有版块名称。支持：<b>新增、修改、删除、发布、下架</b>。</div><div id="articlesList"></div></div><div class="card"><h3>➕ 发布新内容</h3><div class="grid"><div><label>内容 ID</label><input id="aId" placeholder="例如 tongqian-002"></div><div><label>标题</label><input id="aTitle"></div><div><label>日期</label><input id="aDate" type="date"></div><div><label>分类 / 类型</label><input id="aKind" placeholder="历史研究 / 收藏知识 / 品相鉴赏"></div><div class="wide"><label>摘要 / 说明</label><textarea id="aNote"></textarea></div><div class="wide"><label>正文内容</label><textarea id="aContent" style="min-height:220px"></textarea></div><div class="wide"><label>图片路径，一行一条</label><textarea id="aImages"></textarea></div></div><button class="btn red" onclick="addArticle()">🚀 发布新内容</button></div></section><section id="groups" class="panel"><div class="card"><h2>🗂️ 版块</h2><div id="groupsList"></div></div></section><section id="services" class="panel"><div class="card"><h2>⭐ 服务内容</h2><div id="servicesList"></div></div></section><section id="lists" class="panel"><div class="card"><h2>📚 结构化列表</h2><div id="listsView"></div></div></section><section id="images" class="panel"><div class="card"><h2>🖼️ 首页图片</h2><div id="imagesView"></div></section><section id="raw" class="panel"><div class="card"><h2>🔎 实际读取诊断</h2><div id="raw" class="raw">尚未读取</div></div></section></main><script>const $=id=>document.getElementById(id);let cfg=null,cfgSha=null,files=[],articles=[],articleSha=null;const enc=new TextEncoder(),b64=s=>{let a=enc.encode(s),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function unwrap(x){for(let i=0;i<8&&x&&typeof x==='object'&&typeof x.content==='string';i++){try{x=JSON.parse(x.content)}catch{break}}return x}function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}async function api(path,opt={}){let t=$('token').value.trim();if(!t)throw Error('请填写 GitHub Token');let r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}}),txt=await r.text(),d={};try{d=JSON.parse(txt)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}async function getFile(path){return api(base()+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value||'main'))}async function putFile(path,text,sha,msg){let r=await api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛收藏资讯网：'+msg,content:b64(text),branch:$('branch').value||'main',sha})});return r.content?.sha}async function loadAll(){try{let f=await getFile('data/site-config.json');cfgSha=f.sha;cfg=unwrap(JSON.parse(dec(f.content)));let d=await api(base()+'/contents/data/content?ref='+encodeURIComponent($('branch').value||'main'));files=(Array.isArray(d)?d:[]).filter(x=>x.type==='file'&&x.name.endsWith('.json'));fillFiles();renderCfg();await loadArticlesInFile();$('raw').textContent=JSON.stringify({siteConfig:cfg,contentFiles:files.map(x=>x.name)},null,2);$('status').className='status ok';$('status').textContent='✅ 全部读取成功：网站配置 + '+files.length+' 个内容库文件。现在可以直接发布、修改、删除、上下架网站内容。'}catch(e){$('status').className='status';$('status').textContent='❌ '+e.message}}function fillFiles(){let s=$('contentFile');s.innerHTML=files.map(f=>'<option value="'+esc(f.name)+'">'+esc(f.name.replace('.json',''))+'</option>').join('')||'<option>暂无内容库</option>'}async function loadArticlesInFile(){if(!files.length)return;let name=$('contentFile').value;let f=files.find(x=>x.name===name);if(!f)return;let full=await getFile('data/content/'+name);articleSha=full.sha;let x=JSON.parse(dec(full.content));articles=unwrap(x);if(!Array.isArray(articles))articles=[];renderArticles()}function renderArticles(){let filter=$('statusFilter').value;let a=articles.filter(x=>filter==='all'||(x.status||'draft')===filter);$('articlesList').innerHTML=a.length?a.map((x,i)=>'<div class="article '+((x.status||'draft')==='draft'?'off':'')+'"><div class="rowtop"><div><b>'+esc(x.title||'(无标题)')+'</b><div class="muted">ID：'+esc(x.id||'')+' · '+esc(x.date||'')+' · '+esc(x.kind||'')+'</div></div><span class="badge">'+esc(x.status||'draft')+'</span></div><div class="muted">'+esc(x.note||'')+'</div><div><button class="btn gold" onclick="editArticle('+i+')">✏️ 修改</button><button class="btn '+((x.status||'draft')==='published'?'gray':'green')+'" onclick="toggleArticle('+i+')">'+((x.status||'draft')==='published'?'下架':'发布')+'</button><button class="btn danger" onclick="deleteArticle('+i+')">🗑️ 删除</button></div></div>').join(''):'<div class="status">当前内容库没有符合条件的内容。</div>'}async function saveArticles(msg){let name=$('contentFile').value;let f=files.find(x=>x.name===name);if(!f)return;let wrapper={content:JSON.stringify(articles,null,2),encoding:'utf-8'};articleSha=await putFile('data/content/'+name,JSON.stringify(wrapper,null,2),articleSha,msg);$('status').className='status ok';$('status').textContent='✅ '+msg+'：已保存到 GitHub，网站将自动同步。'}function clearArticleForm(){$('aId').value='';$('aTitle').value='';$('aDate').value=new Date().toISOString().slice(0,10);$('aKind').value='';$('aNote').value='';$('aContent').value='';$('aImages').value=''}async function addArticle(){let id=$('aId').value.trim(),title=$('aTitle').value.trim();if(!id||!title)return alert('请填写内容 ID 和标题');if(articles.some(x=>x.id===id))return alert('该内容 ID 已存在');let x={id,title,date:$('aDate').value||new Date().toISOString().slice(0,10),kind:$('aKind').value.trim(),note:$('aNote').value,content:$('aContent').value,images:$('aImages').value.split('\n').map(x=>x.trim()).filter(Boolean),status:'published'};articles.unshift(x);await saveArticles('发布新内容 '+id);clearArticleForm();renderArticles()}function articleAtFiltered(i){let filter=$('statusFilter').value;return articles.filter(x=>filter==='all'||(x.status||'draft')===filter)[i]}async function editArticle(i){let x=articleAtFiltered(i);if(!x)return;let title=prompt('标题',x.title||'');if(title===null)return;let date=prompt('日期',x.date||'');if(date===null)return;let kind=prompt('分类/类型',x.kind||'');if(kind===null)return;let note=prompt('摘要/说明',x.note||'');if(note===null)return;let content=prompt('正文内容',x.content||'');if(content===null)return;let imgs=prompt('图片路径，使用 | 分隔',Array.isArray(x.images)?x.images.join('|'):'');if(imgs===null)return;x.title=title;x.date=date;x.kind=kind;x.note=note;x.content=content;x.images=imgs.split('|').map(v=>v.trim()).filter(Boolean);await saveArticles('修改内容 '+x.id);renderArticles()}async function toggleArticle(i){let x=articleAtFiltered(i);if(!x)return;x.status=(x.status||'draft')==='published'?'draft':'published';await saveArticles((x.status==='published'?'发布':'下架')+'内容 '+x.id);renderArticles()}async function deleteArticle(i){let x=articleAtFiltered(i);if(!x)return;if(!confirm('确定删除“'+x.title+'”？\n\n此操作会从当前内容库 JSON 中删除该内容。'))return;let n=articles.indexOf(x);if(n>=0)articles.splice(n,1);await saveArticles('删除内容 '+x.id);renderArticles()}function renderCfg(){let p=cfg.publicWelfareNotice||{};$('siteName').value=cfg.siteName||'';$('heroTitle').value=cfg.heroTitle||'';$('heroText').value=cfg.heroText||'';$('topNotice').value=cfg.topNotice||'';$('pwTitle').value=p.title||'';$('pwText').value=p.text||'';renderGroups();renderServices();renderLists();renderImages()}async function saveCfg(msg){cfgSha=await putFile('data/site-config.json',JSON.stringify({content:JSON.stringify(cfg,null,2)},null,2),cfgSha,msg);$('status').textContent='✅ '+msg+' 已保存。'}async function saveHome(){cfg.siteName=$('siteName').value;cfg.heroTitle=$('heroTitle').value;cfg.heroText=$('heroText').value;cfg.topNotice=$('topNotice').value;await saveCfg('修改首页')}async function savePW(){cfg.publicWelfareNotice={title:$('pwTitle').value,text:$('pwText').value};await saveCfg('修改公益声明')}function renderGroups(){$('groupsList').innerHTML=Object.entries(cfg.groups||{}).map(([id,g])=>'<div class="row"><div><b>'+esc(g.title||id)+'</b><div class="muted">'+esc(g.subtitle||'')+'</div></div><span>'+((g.items||[]).length)+' 条内容</span></div>').join('')}function renderServices(){$('servicesList').innerHTML=(cfg.serviceSections||[]).map(s=>'<div class="row"><b>'+esc(s.title||s.id)+'</b><div class="muted">'+esc(s.subtitle||'')+'</div><div>'+((s.items||[]).map(esc).join('、'))+'</div></div>').join('')}function renderLists(){let d=[['collectionScope','收藏范围'],['dailyContent','日常交流'],['serviceRange','服务范围'],['security','安全说明']];$('listsView').innerHTML=d.map(([k,t])=>'<div class="row"><b>'+t+'</b><div class="muted">'+(cfg[k]||[]).map(esc).join('、')+'</div></div>').join('')}function renderImages(){$('imagesView').innerHTML=(cfg.homepageImages||[]).map(x=>'<div class="row"><b>'+esc(x.title||'首页图片')+'</b><div class="muted">'+esc(x.url||'')+' · '+(x.enabled===false?'隐藏':'显示')+'</div></div>').join('')||'暂无首页图片'}function tab(id,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));b.classList.add('on');$(id).classList.add('on')}</script></body></html>
