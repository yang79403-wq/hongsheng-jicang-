<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>洪盛收藏资讯网｜全网站版块管理</title><style>:root{--r:#67100a;--g:#d6b35b;--bg:#f5eee5;--card:#fffdf9;--line:#dfcdae;--ink:#332722;--muted:#766a61}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif}.head{background:linear-gradient(135deg,#380806,#73160f);color:#fff;padding:22px 0}.wrap{width:min(1180px,94vw);margin:auto}.brand{font:900 28px "Noto Serif SC","Songti SC",serif;color:#f4d98b}.sub{font-size:12px;color:#eadac5;margin-top:5px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:800;cursor:pointer}.red{background:var(--r);color:#fff}.gold{background:var(--g);color:#34140e}.gray{background:#756a63;color:#fff}.danger{background:#a52b20;color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:block;font-weight:800;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #d9c9b7;border-radius:8px;font:inherit;box-sizing:border-box}textarea{min-height:130px}.wide{grid-column:1/-1}.status{padding:11px;border-radius:9px;background:#f7efe5;margin-top:10px;font-size:13px}.groups{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.group{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px}.group h3{margin:0;color:var(--r);font:900 20px "Noto Serif SC",serif}.items{margin-top:10px;display:grid;gap:7px}.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px;border:1px solid #eadfce;border-radius:8px;background:#fffaf3}.item span{font-weight:700}.mini{padding:6px 8px;border-radius:7px;border:0;font-size:12px;font-weight:800;cursor:pointer}.off{opacity:.45}.note{font-size:12px;color:var(--muted)}@media(max-width:700px){.grid,.groups{grid-template-columns:1fr}.wide{grid-column:auto}.brand{font-size:23px}}</style></head><body><header class="head"><div class="wrap"><div class="brand">洪盛收藏资讯网 · 全网站版块管理</div><div class="sub">版块新增 · 修改 · 删除 · 显示隐藏 · 内容分类管理　｜　安全模式：删除版块不会删除原有资料</div></div></header><main class="wrap"><section class="card"><h2>🔐 连接 GitHub</h2><div class="grid"><div><label>用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><div class="bar"><button class="btn red" id="connect">连接并读取网站</button><button class="btn gray" id="reload">重新读取</button><a class="btn gold" href="upload-center-v2.html">← 返回发布工具</a></div><div id="status" class="status">Token 只保存在本机浏览器。</div></section><section class="card"><h2>🗂️ 当前全网站版块</h2><div class="note">可以修改一级版块和子版块。删除采用“停用”方式，不直接删除资料文件，避免误删。</div><div id="groups" class="groups">请先连接 GitHub。</div></section><section class="card"><h2>➕ 新增一级版块</h2><div class="grid"><div><label>版块 ID（英文/数字/下划线）</label><input id="gid" placeholder="例如: special"></div><div><label>版块名称</label><input id="gname" placeholder="例如：专题研究"></div><div class="wide"><label>版块说明</label><textarea id="gsub" placeholder="版块简介、学习研究方向"></textarea></div></div><button class="btn red" id="addGroup">新增版块</button></section><section class="card"><h2>➕ 新增子版块</h2><div class="grid"><div><label>所属一级版块</label><select id="parent"></select></div><div><label>子版块 ID</label><input id="iid" placeholder="例如: special_history"></div><div class="wide"><label>子版块名称</label><input id="iname" placeholder="例如：钱币专题历史研究"></div></div><button class="btn red" id="addItem">新增子版块</button></section><section class="card"><h2>🏠 首页基础内容管理</h2><div class="grid"><div><label>网站名称</label><input id="siteName"></div><div><label>首页主标题</label><input id="heroTitle"></div><div class="wide"><label>首页介绍</label><textarea id="heroText"></textarea></div><div class="wide"><label>顶部公告</label><textarea id="notice"></textarea></div></div><button class="btn gold" id="saveHome">保存首页基础配置</button><div class="status">说明：这里只修改 site-config.json 的首页配置，不直接改动现有 index.html 海报结构，因此不会破坏当前正常首页。</div></section></main><script>'use strict';const $=id=>document.getElementById(id),KEY='hsjc_site_manager';let cfg=null,sha=null;try{let x=JSON.parse(localStorage.getItem(KEY)||'{}');['owner','repo','branch','token'].forEach(k=>{if(x[k])$(k).value=x[k]})}catch{}const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const b64=t=>{let a=new TextEncoder().encode(t),s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(s)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));function saveLocal(){localStorage.setItem(KEY,JSON.stringify({owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()}))}function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}async function api(path,opt={}){let t=$('token').value.trim();if(!t)throw Error('请填写 GitHub Token');let r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}}),txt=await r.text(),d={};try{d=JSON.parse(txt)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}async function getFile(path){let r=await api(base()+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value.trim()||'main'));return r}async function write(text,msg){let body={message:msg,content:b64(text),branch:$('branch').value.trim()||'main',sha};let r=await api(base()+'/contents/data/site-config.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});sha=r.content?.sha||sha}function syncHome(){if(!cfg)return;$('siteName').value=cfg.siteName||'';$('heroTitle').value=cfg.heroTitle||'';$('heroText').value=cfg.heroText||'';$('notice').value=cfg.topNotice||''}function render(){let gs=cfg.groups||{};let html='';$('parent').innerHTML='';for(let [id,g] of Object.entries(gs)){let opt=document.createElement('option');opt.value=id;opt.textContent=g.title||id;$('parent').appendChild(opt);html+='<div class="group"><div style="display:flex;justify-content:space-between;gap:8px"><h3>'+esc(g.title||id)+'</h3><button class="mini gold" onclick="editGroup(\''+esc(id)+'\')">✏️ 修改</button></div><div class="note">ID: '+esc(id)+'<br>'+esc(g.subtitle||'')+'</div><div class="items">';for(let it of(g.items||[])){html+='<div class="item '+(it.enabled===false?'off':'')+'"><span>'+esc(it.name)+' <small>('+esc(it.id)+')</small></span><span><button class="mini gray" onclick="toggleItem(\''+esc(id)+'\',\''+esc(it.id)+'\')">'+(it.enabled===false?'显示':'隐藏')+'</button> <button class="mini gold" onclick="editItem(\''+esc(id)+'\',\''+esc(it.id)+'\')">修改</button> <button class="mini danger" onclick="removeItem(\''+esc(id)+'\',\''+esc(it.id)+'\')">删除</button></span></div>'}html+='</div><div style="margin-top:9px"><button class="mini danger" onclick="removeGroup(\''+esc(id)+'\')">🗑 停用一级版块</button></div></div>'}$('groups').innerHTML=html||'<div class="status">暂无版块。</div>'}async function load(){try{saveLocal();let f=await getFile('data/site-config.json');sha=f.sha;cfg=JSON.parse(dec(f.content));render();syncHome();$('status').textContent='✅ 已读取 '+Object.keys(cfg.groups||{}).length+' 个一级版块。'}catch(e){$('status').textContent='❌ '+e.message}}function safeId(s){return /^[a-zA-Z0-9_]+$/.test(s)}window.editGroup=async id=>{let g=cfg.groups[id],n=prompt('修改版块名称：',g.title||id);if(n===null)return;let sub=prompt('修改版块说明：',g.subtitle||'');if(sub===null)return;g.title=n.trim()||g.title;g.subtitle=sub;await commit('修改一级版块 '+id)};window.removeGroup=async id=>{if(!confirm('确定停用一级版块“'+(cfg.groups[id].title||id)+'”？\n\n资料不会删除，只会从网站配置中隐藏。'))return;cfg.groups[id].enabled=false;for(let x of(cfg.nav||[]))if(x.id===id)x.enabled=false;await commit('停用一级版块 '+id)};window.editItem=async(gid,id)=>{let it=(cfg.groups[gid].items||[]).find(x=>x.id===id);let n=prompt('修改子版块名称：',it.name);if(n===null)return;it.name=n.trim()||it.name;await commit('修改子版块 '+id)};window.toggleItem=async(gid,id)=>{let it=(cfg.groups[gid].items||[]).find(x=>x.id===id);it.enabled=it.enabled===false;await commit((it.enabled?'显示':'隐藏')+'子版块 '+id)};window.removeItem=async(gid,id)=>{if(!confirm('确定删除/停用这个子版块？\n\n资料文件不会删除。'))return;let it=(cfg.groups[gid].items||[]).find(x=>x.id===id);if(it)it.enabled=false;await commit('停用子版块 '+id)};async function commit(msg){try{await write(JSON.stringify(cfg,null,2), '洪盛收藏资讯网：'+msg);render();syncHome();$('status').textContent='✅ 已保存：'+msg}catch(e){$('status').textContent='❌ 保存失败：'+e.message}}$('connect').onclick=load;$('reload').onclick=load;$('addGroup').onclick=async()=>{let id=$('gid').value.trim(),name=$('gname').value.trim();if(!safeId(id)||!name)return alert('请填写正确的版块 ID 和名称。');if(cfg.groups[id])return alert('该 ID 已存在。');cfg.groups[id]={title:name,subtitle:$('gsub').value.trim(),items:[]};cfg.nav=cfg.nav||[];cfg.nav.push({id,name,enabled:true});await commit('新增一级版块 '+id);$('gid').value='';$('gname').value='';$('gsub').value=''};$('addItem').onclick=async()=>{let gid=$('parent').value,id=$('iid').value.trim(),name=$('iname').value.trim();if(!gid||!safeId(id)||!name)return alert('请填写所属版块、正确 ID 和名称。');if(Object.values(cfg.groups).some(g=>(g.items||[]).some(x=>x.id===id)))return alert('该子版块 ID 已存在。');cfg.groups[gid].items=cfg.groups[gid].items||[];cfg.groups[gid].items.push({id,name,enabled:true});await commit('新增子版块 '+id);$('iid').value='';$('iname').value=''};$('saveHome').onclick=async()=>{cfg.siteName=$('siteName').value.trim();cfg.heroTitle=$('heroTitle').value.trim();cfg.heroText=$('heroText').value.trim();cfg.topNotice=$('notice').value.trim();await commit('修改首页基础配置')};</script></body></html>
