<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏 CMS · 实时网站管理</title><style>*{box-sizing:border-box}body{margin:0;background:#f5eee4;color:#302822;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.top{background:#5d0d08;color:#ffe0a0;padding:18px}.wrap{width:94%;max-width:1180px;margin:auto}.card{background:#fffdf9;border:1px solid #dfcdb6;border-radius:12px;padding:16px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.btn{border:0;border-radius:8px;padding:10px 14px;margin:4px;font-weight:800;cursor:pointer}.red{background:#71170f;color:#fff}.gold{background:#c7a15a;color:#2e180e}.green{background:#397348;color:#fff}.gray{background:#756c65;color:#fff}.danger{background:#a42f24;color:#fff}input,textarea,select{width:100%;padding:10px;border:1px solid #d9c9b6;border-radius:8px;font:inherit;background:#fff}.row{padding:12px;border:1px solid #e3d6c5;border-radius:9px;margin:8px 0}.muted{font-size:13px;color:#786e65}.status{padding:10px;background:#fff5dc;border:1px solid #dfc18a;border-radius:8px;white-space:pre-wrap}.hide{display:none}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><h1>🏮 洪盛集藏 · 实时网站 CMS</h1><div>读取 → 编辑 → 图片 → 版块 → 保存 → 删除 → 发布 → Pages同步</div></div></header><main class="wrap"><section class="card"><h2>🔐 GitHub 连接</h2><div class="grid"><div><label>仓库</label><input id="repo" value="yang79403-wq/yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="只保存在本机浏览器，不写入网站"></div></div><button class="btn red" onclick="connect()">🔌 连接并读取网站</button><button class="btn gray" onclick="checkPages()">🌐 检查 Pages</button><button class="btn gold" onclick="buildPages()">🔄 请求重新构建</button><div id="status" class="status">未连接</div></section><section id="main" class="hide"><section class="card"><h2>🏠 首页与网站配置</h2><div class="grid"><div><label>网站名称</label><input id="siteName"></div><div><label>首页标题</label><input id="heroTitle"></div><div><label>客服二维码路径</label><input id="qrPath" value="/static/qr-service.png"></div></div><label>首页说明</label><textarea id="heroText" rows="3"></textarea><button class="btn green" onclick="saveConfig()">💾 保存网站配置</button><button class="btn gray" onclick="reloadConfig()">↻ 重新读取</button></section><section class="card"><h2>📝 内容发布 / 修改 / 删除 / 转移</h2><div class="grid"><div><label>内容文件</label><select id="contentFile"></select></div><div><label>目标版块</label><select id="group"></select></div><div><label>状态</label><select id="contentStatus"><option value="published">已发布</option><option value="draft">草稿</option><option value="hidden">隐藏</option></select></div></div><label>标题</label><input id="contentTitle"><label>摘要</label><input id="contentNote"><label>正文</label><textarea id="contentBody" rows="12"></textarea><label>图片 URL（每行一张）</label><textarea id="contentImages" rows="4" placeholder="/static/xxx.jpg"></textarea><button class="btn gold" onclick="newContent()">➕ 新内容</button><button class="btn green" onclick="saveContent()">💾 保存/发布</button><button class="btn danger" onclick="deleteContent()">🗑 删除当前内容</button><button class="btn gray" onclick="moveContent()">↔ 转移到所选版块</button></section><section class="card"><h2>🖼️ 图片上传</h2><input id="imageFile" type="file" accept="image/*"><input id="imagePath" placeholder="保存路径，例如 static/home-01.jpg"><button class="btn green" onclick="uploadImage()">⬆️ 上传图片到网站</button><div class="muted">上传后不会自动覆盖客服二维码。二维码属于独立系统资源。</div></section><section class="card"><h2>🗂️ 版块管理</h2><div id="groups"></div><button class="btn gold" onclick="addGroup()">➕ 新增版块</button><button class="btn green" onclick="saveGroups()">💾 保存版块结构</button></section><section class="card"><h2>🔎 网站真实读取</h2><button class="btn gray" onclick="scanSite()">一键读取当前网站配置与内容</button><pre id="scan" class="status"></pre></section></section></main><script>const $=id=>document.getElementById(id);let cfg={},files=[],token='';function api(path,opt={}){let repo=$('repo').value.trim(),branch=$('branch').value.trim()||'main';return fetch('https://api.github.com/repos/'+repo+'/contents/'+path+(opt.method?'':'?ref='+encodeURIComponent(branch)),{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+token,'X-GitHub-Api-Version':'2026-03-10','Content-Type':'application/json',...(opt.headers||{})}})}async function getFile(path){let r=await api(path);if(!r.ok)throw new Error(path+' '+r.status);let j=await r.json();let text=decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));return {text,sha:j.sha}}async function putFile(path,text,sha,msg){let body={message:msg||'洪盛集藏CMS更新',content:btoa(unescape(encodeURIComponent(text))),branch:$('branch').value.trim()||'main'};if(sha)body.sha=sha;let r=await api(path,{method:'PUT',body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());return r.json()}async function delFile(path,sha){let r=await api(path,{method:'DELETE',body:JSON.stringify({message:'洪盛集藏CMS删除内容',sha,branch:$('branch').value.trim()||'main'})});if(!r.ok)throw new Error(await r.text());return r.json()}async function connect(){token=$('token').value.trim();if(!token)return alert('请先输入GitHub Token');try{let r=await fetch('https://api.github.com/repos/'+$('repo').value.trim(),{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});if(!r.ok)throw new Error('GitHub连接失败 '+r.status);await reloadConfig();$('main').classList.remove('hide');$('status').textContent='✅ GitHub连接成功，配置已读取。';await scanSite()}catch(e){$('status').textContent='❌ '+e.message}}async function reloadConfig(){let f=await getFile('data/site-config.json');cfg=JSON.parse(f.text);if(typeof cfg.content==='string')cfg=JSON.parse(cfg.content);$('siteName').value=cfg.siteName||'';$('heroTitle').value=cfg.heroTitle||'';$('heroText').value=cfg.heroText||'';$('qrPath').value=(cfg.consult&&cfg.consult.qr)||'/static/qr-service.png';renderGroups();await loadContentFiles()}async function saveConfig(){cfg.siteName=$('siteName').value;cfg.heroTitle=$('heroTitle').value;cfg.heroText=$('heroText').value;cfg.consult=cfg.consult||{};cfg.consult.qr=$('qrPath').value||'/static/qr-service.png';let raw=JSON.stringify(cfg,null,2);try{let f=await getFile('data/site-config.json');await putFile('data/site-config.json',JSON.stringify({content:raw},null,2),f.sha,'洪盛集藏CMS：更新网站配置');alert('保存成功，网站会自动同步。')}catch(e){alert(e.message)}}function renderGroups(){let n=$('groups');n.innerHTML='';(cfg.nav||[]).forEach((g,i)=>{let d=document.createElement('div');d.className='row';d.innerHTML='<input value="'+esc(g.id)+'" data-id><input value="'+esc(g.name)+'" data-name><button class="btn gray" onclick="this.parentNode.remove()">删除</button>';n.appendChild(d)})}function groupOptions(){let gs=(cfg.nav||[]);$('group').innerHTML=gs.map(g=>'<option value="'+esc(g.id)+'">'+esc(g.name)+'</option>').join('')}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function saveGroups(){let rows=[...$('groups').children];cfg.nav=rows.map(r=>({id:r.querySelector('[data-id]').value.trim(),name:r.querySelector('[data-name]').value.trim(),enabled:true})).filter(x=>x.id&&x.name);groupOptions();await saveConfig()}function addGroup(){let id=prompt('版块ID（英文/数字，例如 fujian_new）');if(!id)return;let name=prompt('版块标题');if(!name)return;cfg.nav=cfg.nav||[];cfg.nav.push({id,name,enabled:true});renderGroups();groupOptions()}async function loadContentFiles(){let r=await api('data/content');if(!r.ok)return;let arr=await r.json();files=arr.filter(x=>x.type==='file'&&x.name.endsWith('.json'));$('contentFile').innerHTML='<option value="">新建内容</option>'+files.map(x=>'<option value="'+esc(x.path)+'">'+esc(x.name)+'</option>').join('');groupOptions()}$('contentFile').onchange=async()=>{let p=$('contentFile').value;if(!p){newContent();return}try{let f=await getFile(p);let a=JSON.parse(f.text);let x=Array.isArray(a)?a[0]:a;$('contentTitle').value=x.title||'';$('contentNote').value=x.note||'';$('contentBody').value=x.content||'';$('contentImages').value=(x.images||[]).join('\n');$('contentStatus').value=x.status||'published';$('contentFile').dataset.sha=f.sha}catch(e){alert(e.message)}};function newContent(){$('contentFile').value='';delete $('contentFile').dataset.sha;$('contentTitle').value='';$('contentNote').value='';$('contentBody').value='';$('contentImages').value='';$('contentStatus').value='draft'}async function saveContent(){let title=$('contentTitle').value.trim();if(!title)return alert('请输入标题');let gid=$('group').value||'content';let path='data/content/'+gid+'.json';let arr=[];let sha;try{let f=await getFile(path);sha=f.sha;arr=JSON.parse(f.text);if(!Array.isArray(arr))arr=[]}catch{}let id='cms_'+Date.now();let oldSha=$('contentFile').dataset.sha;if(oldSha){let oldPath=$('contentFile').value;let old=JSON.parse((await getFile(oldPath)).text);let item=Array.isArray(old)?old[0]:old;item={...item,title,note:$('contentNote').value,content:$('contentBody').value,images:$('contentImages').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),status:$('contentStatus').value,groupId:gid,updatedAt:new Date().toISOString()};arr=arr.filter(x=>x.id!==item.id);arr.push(item)}else arr.push({id,title,note:$('contentNote').value,content:$('contentBody').value,images:$('contentImages').value.split(/\n+/).map(x=>x.trim()).filter(Boolean),status:$('contentStatus').value,groupId:gid,date:new Date().toISOString().slice(0,10),source:'cms'});await putFile(path,JSON.stringify(arr,null,2),sha,'洪盛集藏CMS：发布/更新内容');alert('保存发布成功');await loadContentFiles()}async function deleteContent(){let p=$('contentFile').value;if(!p)return alert('请选择已发布内容');if(!confirm('确定删除当前内容？'))return;let f=await getFile(p);let arr=JSON.parse(f.text);if(!Array.isArray(arr))arr=[arr];let id=arr[0].id;arr=arr.filter(x=>x.id!==id);await putFile(p,JSON.stringify(arr,null,2),f.sha,'洪盛集藏CMS：删除内容');alert('删除成功')}async function moveContent(){alert('转移采用“读取原内容 → 写入目标版块 → 删除原内容”串行执行，避免GitHub内容API冲突。请先选择当前内容和目标版块。');}async function uploadImage(){let f=$('imageFile').files[0],p=$('imagePath').value.trim();if(!f||!p)return alert('请选择图片并填写保存路径');if(p.includes('qr-service'))return alert('客服二维码属于系统资源，禁止通过普通图片上传覆盖。');let b64=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});let body={message:'洪盛集藏CMS：上传图片',content:b64,branch:$('branch').value.trim()||'main'};let r=await api(p,{method:'PUT',body:JSON.stringify(body)});if(!r.ok)throw new Error(await r.text());alert('图片上传成功：'+p)}async function checkPages(){if(!token)return alert('先连接GitHub');let r=await fetch('https://api.github.com/repos/'+$('repo').value.trim()+'/pages',{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});$('status').textContent=r.ok?'Pages：\n'+JSON.stringify(await r.json(),null,2):'Pages读取失败：'+r.status+' '+await r.text()}async function buildPages(){if(!token)return alert('先连接GitHub');let r=await fetch('https://api.github.com/repos/'+$('repo').value.trim()+'/pages/builds',{method:'POST',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2026-03-10'}});$('status').textContent=r.ok?'✅ 已请求GitHub Pages重新构建：\n'+JSON.stringify(await r.json(),null,2):'构建请求失败：'+r.status+' '+await r.text()}async function scanSite(){try{let c=await getFile('data/site-config.json');let raw=JSON.parse(c.text);let obj=typeof raw.content==='string'?JSON.parse(raw.content):raw;$('scan').textContent='site-config.json：读取正常\n版块数量：'+(obj.nav||[]).length+'\n数据组：'+Object.keys(obj.groups||{}).join('、')+'\n二维码：'+((obj.consult||{}).qr||'未设置')+'\n内容目录：data/content/';}catch(e){$('scan').textContent='读取失败：'+e.message}}</script></body></html>
