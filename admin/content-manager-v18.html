<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛收藏资讯网｜内容发布 V18</title><style>body{margin:0;background:#f6efe6;color:#302721;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.w{width:min(1150px,94vw);margin:auto}.h{background:#550b07;color:#f6d985;padding:18px}.c{background:#fffdf9;border:1px solid #dfcdae;border-radius:12px;padding:14px;margin:12px 0}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8c8b5;border-radius:8px;font:inherit}textarea{min-height:100px}.b{border:0;border-radius:8px;padding:9px 13px;margin:3px;font-weight:800;cursor:pointer}.r{background:#68100a;color:#fff}.y{background:#d6b35b;color:#32130d}.ok{background:#2f6b3b;color:#fff}.blue{background:#315b82;color:#fff}.gray{background:#756a63;color:#fff}.del{background:#a62a20;color:#fff}.s{padding:10px;background:#f8efe4;border-radius:8px}.tip{padding:10px;background:#fff5dd;border:1px solid #dfc18a;border-radius:8px}.row{padding:10px;border:1px solid #eadfce;background:#fffaf3;border-radius:8px;margin:7px 0}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.pic{padding:7px;border:1px solid #dfcdae;border-radius:8px}.pic img{width:100%;height:125px;object-fit:contain;background:#eee6db}.preview{background:white;border:1px solid #ddd1c0;border-radius:8px;padding:16px;line-height:1.8}.preview img{max-width:100%;display:block;margin:12px auto}@media(max-width:700px){.g{grid-template-columns:1fr}.wide{grid-column:auto}}</style><header class="h"><div class="w"><h1>洪盛收藏资讯网 · 内容发布 V18</h1><div>新建发布｜已发布编辑｜换版块｜删除｜图片上传｜正文精确插图</div></div></header><main class="w"><section class="c"><h2>🔐 连接</h2><div class="g"><input id="o" value="yang79403-wq" placeholder="GitHub用户名"><input id="r" value="yang79403-wq.github.io" placeholder="仓库"><input id="br" value="main" placeholder="分支"><input id="tk" type="password" placeholder="GitHub Token"></div><button class="b r" onclick="load()">🔄 读取全网站</button><div id="msg" class="s">尚未读取</div></section><section class="c"><h2>🗂️ 版块与内容库</h2><div class="g"><div><label>当前版块</label><select id="grp" onchange="loadLib()"></select></div><div><label>当前内容库</label><select id="lib" onchange="loadLib()"></select></div><div><label>目标版块</label><select id="tgrp" onchange="mapTarget()"></select></div><div><label>目标内容库</label><select id="tlib"></select></div></div><div id="list"></div></section><section class="c"><h2>✍️ 新建 / 编辑 / 发布</h2><div class="g"><input id="id" placeholder="文章ID，新建可留空"><input id="title" placeholder="标题"><input id="date" type="date"><input id="kind" placeholder="分类"><select id="state"><option value="published">立即发布</option><option value="draft">保存草稿</option><option value="hidden">隐藏</option></select><div></div><div class="wide"><textarea id="note" placeholder="摘要"></textarea></div><div class="wide"><textarea id="body" style="min-height:330px" placeholder="正文。把光标放在照片应该出现的位置"></textarea></div></div><button class="b ok" onclick="create()">➕ 新建并发布</button><button class="b y" onclick="save()">💾 保存修改并更新</button><button class="b blue" onclick="move()">↔️ 转移到目标版块</button><button class="b r" onclick="republish()">🚀 重新发布</button><button class="b gray" onclick="draft()">⏸️ 下架</button><button class="b del" onclick="remove()">🗑️ 删除</button><button class="b gray" onclick="blank()">🆕 新建空白</button><div id="edit" class="s">当前为新建模式</div></section><section class="c"><h2>🖼️ 图片上传与正文具体位置</h2><div class="tip">新文章和已发布文章都可以使用。先上传照片，选择照片，再把正文光标放到具体位置，点击“当前光标位置”，最后保存/发布。</div><input id="pics" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple><button class="b y" onclick="upload()">⬆️ 上传照片</button><div id="gallery" class="gallery"></div><button class="b y" onclick="ins('before')">正文开头</button><button class="b r" onclick="ins('cursor')">当前光标位置</button><button class="b y" onclick="ins('after')">正文末尾</button></section><section class="c"><h2>👁️ 预览</h2><div id="pre" class="preview">暂无</div></section></main><script>const $=x=>document.getElementById(x);let groups={},libs=[],arr=[],sha='',path='',idx=-1,pic='';const E=new TextEncoder(),b64=s=>{let a=E.encode(s),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s),c=>c.charCodeAt(0))),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function base(){return '/repos/'+encodeURIComponent($('o').value)+'/'+encodeURIComponent($('r').value)}async function api(p,opt={}){let t=$('tk').value.trim();if(!t)throw Error('请填写Token');let z=await fetch('https://api.github.com'+p,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28'}}),d=await z.json();if(!z.ok)throw Error(d.message||z.status);return d}async function get(p){return api(base()+'/contents/'+p+'?ref='+$('br').value)}async function put(p,text,s,msg){let o={message:'洪盛收藏资讯网：'+msg,content:b64(text),branch:$('br').value};if(s)o.sha=s;return api(base()+'/contents/'+p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)})}async function load(){try{let f=await get('data/site-config.json'),s=JSON.parse(dec(f.content));if(typeof s.content==='string')s=JSON.parse(s.content);groups=s.groups||{};let c=await api(base()+'/contents/data/content?ref='+$('br').value),m=[];try{m=await api(base()+'/contents/data/market?ref='+$('br').value)}catch{};libs=c.filter(x=>x.type==='file'&&x.name.endsWith('.json')).map(x=>({v:'content/'+x.name,n:'data/content/'+x.name})).concat((Array.isArray(m)?m:[]).filter(x=>x.type==='file'&&x.name.endsWith('.json')).map(x=>({v:'market/'+x.name,n:'data/market/'+x.name})));let h=Object.entries(groups).map(([id,g])=>'<option value="'+esc(id)+'">'+esc(g.title||id)+'</option>').join('');$('grp').innerHTML=h;$('tgrp').innerHTML=h;$('lib').innerHTML=libs.map(x=>'<option value="'+x.v+'">'+x.n+'</option>').join('');$('tlib').innerHTML=$('lib').innerHTML;await loadLib();$('msg').className='s';$('msg').textContent='✅ 全站读取完成：'+Object.keys(groups).length+'版块 / '+libs.length+'内容库'}catch(e){$('msg').textContent='❌ '+e.message}}function map(g){let x=groups[g]||{},it=(x.items||[])[0];let z=it&&libs.find(a=>a.v.endsWith('/'+it.id+'.json'));return z?.v||libs.find(a=>a.v.endsWith('/'+g+'.json'))?.v||''}function mapTarget(){let v=map($('tgrp').value);if(v)$('tlib').value=v}async function loadLib(){path='data/'+$('lib').value;let f=await get(path);sha=f.sha;try{arr=JSON.parse(dec(f.content));if(!Array.isArray(arr))arr=[]}catch{arr=[]}render()}function render(){$('list').innerHTML=arr.map((x,i)=>'<div class="row"><b>'+esc(x.title||x.id)+'</b> <small>'+esc(x.status||'draft')+'</small><br><button class="b y" onclick="edit('+i+')">✏️ 编辑</button><button class="b blue" onclick="edit('+i+');alert(\'选择目标版块后点转移\')">↔️ 换版块</button><button class="b ok" onclick="edit('+i+');republish()">🚀 发布</button><button class="b del" onclick="delAt('+i+')">🗑️ 删除</button></div>').join('')||'<div class="tip">当前版块暂无内容，直接新建即可。</div>'}function edit(i){idx=i;let x=arr[i];$('id').value=x.id||'';$('title').value=x.title||'';$('date').value=x.date||'';$('kind').value=x.kind||'';$('state').value=x.status||'published';$('note').value=x.note||'';$('body').value=x.content||'';$('tgrp').value=x.groupId||$('grp').value;mapTarget();$('edit').textContent='正在编辑：'+(x.title||x.id);pre()}function blank(){idx=-1;['id','title','date','kind','note','body'].forEach(x=>$(x).value='');$('state').value='published';$('tgrp').value=$('grp').value;mapTarget();$('edit').textContent='➕ 新建模式';pre()}function obj(){let g=groups[$('tgrp').value]||{};return {id:$('id').value.trim()||'article_'+Date.now(),title:$('title').value.trim(),date:$('date').value||new Date().toISOString().slice(0,10),kind:$('kind').value,note:$('note').value,content:$('body').value,status:$('state').value,groupId:$('tgrp').value,groupName:g.title||$('tgrp').value}}async function create(){let o=obj();if(!o.title)return alert('请输入标题');let p='data/'+$('tlib').value,f=await get(p),a=JSON.parse(dec(f.content));if(!Array.isArray(a))a=[];if(a.some(x=>x.id===o.id))o.id+='_'+Date.now();a.push(o);await put(p,JSON.stringify(a,null,2),f.sha,'新建并发布内容');await load();alert('✅ 新内容已发布')}async function save(){if(idx<0)return create();let o=obj();o.id=arr[idx].id;arr[idx]={...arr[idx],...o};if($('tlib').value!==$('lib').value)return move();await put(path,JSON.stringify(arr,null,2),sha,'编辑并更新内容');await load()}async function move(){if(idx<0)return alert('请先选择已发布内容');let o=obj(),old=arr[idx],dest='data/'+$('tlib').value;if(dest===path)return save();let df=await get(dest),da=JSON.parse(dec(df.content));if(da.some(x=>x.id===old.id))return alert('目标版块已有相同ID');da.push({...o,id:old.id});arr.splice(idx,1);await put(dest,JSON.stringify(da,null,2),df.sha,'接收转移内容');await put(path,JSON.stringify(arr,null,2),sha,'移出转移内容');await load();alert('✅ 已转移到：'+o.groupName)}async function republish(){if(idx<0)return save();arr[idx]={...arr[idx],...obj(),id:arr[idx].id,status:'published'};await put(path,JSON.stringify(arr,null,2),sha,'重新发布内容');await load()}async function draft(){if(idx<0)return;arr[idx].status='draft';await put(path,JSON.stringify(arr,null,2),sha,'内容下架');await load()}async function remove(){if(idx<0)return;if(!confirm('确定删除？'))return;await delAt(idx);blank()}async function delAt(i){if(!confirm('确定删除？'))return;arr.splice(i,1);await put(path,JSON.stringify(arr,null,2),sha,'删除内容');await load()}async function upload(){let fs=[...$('pics').files];if(!fs.length)return alert('请选择照片');let out=[];for(let f of fs){if(f.size>8*1024*1024)return alert('单张图片不能超过8MB');let a=new Uint8Array(await f.arrayBuffer()),s='';for(let i=0;i<a.length;i+=32768)s+=String.fromCharCode(...a.subarray(i,i+32768));let d=new Date(),p='static/uploads/'+d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/img_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+f.name.substring(f.name.lastIndexOf('.'));await api(base()+'/contents/'+p,{method:'PUT',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+$('tk').value,'X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'},body:JSON.stringify({message:'上传文章照片',content:btoa(s),branch:$('br').value})});out.push('https://yang79403-wq.github.io/'+p)}$('gallery').innerHTML=out.map(u=>'<div class="pic"><img src="'+u+'"><button class="b y" onclick="pick('+JSON.stringify(u)+')">选择此照片</button></div>').join('');$('msg').textContent='✅ 照片上传成功，请选择照片后插入'}function pick(u){pic=u;$('msg').textContent='🖼️ 已选择照片，请把正文光标放到具体位置'}function ins(pos){if(!pic)return alert('先上传并选择照片');let t=$('body'),s=t.selectionStart||0,e=t.selectionEnd||0,m='\n\n【图片:'+pic.split('/').pop()+'】\n'+pic+'\n【/图片】\n\n';if(pos==='before')t.value=m+t.value;else if(pos==='after')t.value+=m;else t.value=t.value.slice(0,s)+m+t.value.slice(e);pre()}function pre(){let c=esc($('body').value||'').replace(/【图片:[^\]]+】\n([^\n]+)\n【\/图片】/g,(m,u)=>'<img src="'+esc(u)+'">').replace(/\n/g,'<br>');$('pre').innerHTML='<h2>'+esc($('title').value||'文章标题')+'</h2>'+c}$('body').addEventListener('input',pre);$('title').addEventListener('input',pre)</script>
