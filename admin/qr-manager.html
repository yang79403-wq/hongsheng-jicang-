<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛收藏资讯网｜客服二维码管理</title><style>body{margin:0;background:#f4eee6;color:#332821;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.box{background:#fffdf9;border:1px solid #dcc8a9;border-radius:14px;padding:20px;margin:14px 0}h1{background:#5c0c08;color:#f6d985;margin:0;padding:22px}.btn{border:0;border-radius:9px;padding:12px 18px;margin:6px 4px;font-weight:800;background:#d6b35b;color:#32130d}.red{background:#68100a;color:#fff}input{width:100%;padding:11px;box-sizing:border-box;border:1px solid #d9c9b7;border-radius:8px;margin:5px 0 12px;font:inherit}.preview{text-align:center;padding:15px;border:1px dashed #b99355;border-radius:10px}.preview img{max-width:260px;max-height:260px}.status{padding:12px;background:#f7efe5;border-radius:9px;margin-top:10px}</style><body><h1>📱 洪盛收藏资讯网 · 客服二维码管理</h1><main class="wrap"><div class="box"><p>这里专门修复客服二维码上传。首次上传也可以直接创建，不要求服务器中事先存在二维码文件。</p><label>GitHub Token</label><input id="token" type="password" placeholder="Contents 读写权限"><label>二维码说明</label><input id="label" value="📱 扫一扫联系客服"><label>二维码内容（备用二维码）</label><input id="data" value="tel:13799875350"><input id="file" type="file" accept="image/png,image/jpeg,image/webp"><button class="btn red" id="upload">上传真实客服二维码并发布</button><button class="btn" id="save">仅保存二维码内容</button><div class="preview"><div>当前二维码预览</div><img id="preview"><b>扫一扫联系客服</b></div><div class="status" id="status">等待操作</div></div></main><script>const $=id=>document.getElementById(id),owner='yang79403-wq',repo='yang79403-wq.github.io',branch='main',cfgPath='data/site-config.json',qrPath='static/qr-service.png';let cfg=null,cfgSha=null;const enc=new TextEncoder(),b64=s=>{let a=enc.encode(s),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\\s/g,'')),c=>c.charCodeAt(0)));async function api(path,opt={}){let t=$('token').value.trim();if(!t)throw Error('请先填写 GitHub Token');let r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}}),txt=await r.text(),d={};try{d=JSON.parse(txt)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}async function readCfg(){let r=await api('/repos/'+owner+'/'+repo+'/contents/'+cfgPath+'?ref='+branch);cfgSha=r.sha;let outer=JSON.parse(dec(r.content));cfg=typeof outer.content==='string'?JSON.parse(outer.content):outer}async function saveCfg(){let outer=JSON.stringify({content:JSON.stringify(cfg,null,2)});let r=await api('/repos/'+owner+'/'+repo+'/contents/'+cfgPath,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛收藏资讯网：保存客服二维码配置',content:b64(outer),branch:branch,sha:cfgSha})});cfgSha=r.content.sha}function showQR(){let d=encodeURIComponent($('data').value||'tel:13799875350');$('preview').src='https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=8&data='+d+'&t='+Date.now()}$('data').oninput=showQR;showQR();$('save').onclick=async()=>{try{await readCfg();cfg.consult=cfg.consult||{};cfg.consult.qrLabel=$('label').value.trim()||'📱 扫一扫联系客服';cfg.consult.qrData=$('data').value.trim()||'tel:'+cfg.phone;await saveCfg();$('status').textContent='✅ 二维码内容已保存并发布'}catch(e){$('status').textContent='❌ '+e.message}};$('upload').onclick=async()=>{try{let f=$('file').files[0];if(!f)return alert('请选择真实客服二维码图片');if(f.size>5*1024*1024)return alert('二维码图片不能超过5MB');let data=await new Promise((res,rej)=>{let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)}),raw=data.split(',')[1];await readCfg();let old=null;try{old=await api('/repos/'+owner+'/'+repo+'/contents/'+qrPath+'?ref='+branch)}catch(e){old=null}let body={message:'洪盛收藏资讯网：上传真实客服二维码',content:raw,branch:branch};if(old?.sha)body.sha=old.sha;await api('/repos/'+owner+'/'+repo+'/contents/'+qrPath,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});cfg.consult=cfg.consult||{};cfg.consult.qr='/static/qr-service.png';cfg.consult.qrLabel=$('label').value.trim()||'📱 扫一扫联系客服';cfg.consult.qrData=$('data').value.trim()||'tel:'+cfg.phone;await saveCfg();$('status').textContent='✅ 真实客服二维码已经上传到 static/qr-service.png，并已同步网站';$('preview').src='/static/qr-service.png?t='+Date.now()}catch(e){$('status').textContent='❌ 上传失败：'+e.message}};</script></body></html>
