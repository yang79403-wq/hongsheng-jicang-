<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏 AI 网站设计工具</title><style>:root{--r:#741912;--g:#c49a4b;--bg:#f7f1e8;--card:#fffdf8;--line:#e2d7c8;--ink:#2c241f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{width:min(1100px,94vw);margin:auto}.head{background:linear-gradient(135deg,#741912,#2d0d09);color:#fff;padding:28px 0}.head h1{margin:0;color:#f4d98e}.head p{margin:8px 0 0;color:#eadfd1}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 6px 20px #0000000b}h2{margin:0 0 12px;color:#5a2119}.hint{font-size:13px;color:#766c63}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:800;margin-bottom:6px}input,textarea,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;font:inherit}textarea{min-height:110px;resize:vertical}.btn{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.red{background:var(--r);color:#fff}.gold{background:var(--g);color:#30130f}.gray{background:#6b625a;color:#fff}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{padding:11px;border-radius:10px;background:#f4eee5;margin-top:10px}.ai{border:2px solid #c49a4b;background:linear-gradient(180deg,#fffaf0,#fff)}.chips{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.chip{border:1px solid #d7bd86;background:#fff8e9;border-radius:999px;padding:7px 11px;cursor:pointer}.preview{margin-top:14px;padding:20px;border-radius:16px;border:1px solid var(--line);background:#fff}.preview h3{margin:0 0 8px;font-size:28px}.preview .bar{height:7px;border-radius:7px;background:var(--g);width:120px;margin-bottom:14px}.section{padding:16px;border-radius:14px;margin-top:12px;border:1px solid var(--line)}.section h4{margin:0 0 8px}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav span{padding:7px 10px;border-radius:8px;background:#f5ede2}.backup{font-size:12px;color:#776f67}@media(max-width:700px){.form{grid-template-columns:1fr}.wide{grid-column:auto}.head h1{font-size:24px}.preview h3{font-size:22px}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛集藏 · AI 网站设计工具</h1><p>一句话描述你想要的网站效果，AI 自动生成设计方案；确认后再发布。</p></div></header><main class="wrap"><section class="card"><h2>🤖 一句话 AI 自动设计</h2><p class="hint">例如：“把首页做成专业中国钱币收藏博物馆风格，深红金色，标题庄重，手机端简洁，保留现有栏目。”</p><textarea id="prompt" placeholder="告诉我你想怎么改网站……"></textarea><div class="chips"><button class="chip" onclick="use('专业中国钱币收藏博物馆风格，深红金色，宋体标题，金色强调，庄重简洁，手机电脑自适应，保留现有栏目。')">博物馆专业风</button><button class="chip" onclick="use('做成高端钱币收藏鉴赏网站，深红黑金，标题更有收藏感，卡片精致，图片突出，手机端清爽。')">高端收藏风</button><button class="chip" onclick="use('保持现在栏目不变，只优化字体、标题颜色、卡片间距和手机显示，让网站更专业。')">只优化视觉</button></div><div class="row"><button class="btn red" onclick="aiDesign()">✨ AI 自动生成设计方案</button><button class="btn gray" onclick="resetAI()">恢复当前方案</button></div><div id="aiStatus" class="status">等待你的设计要求</div></section><section class="card"><h2>🎨 AI 设计结果</h2><div id="result" class="hint">输入一句话后，AI 会在这里给出可预览、可应用的设计方案。</div><div id="preview" class="preview" style="display:none"></div><div class="row" style="margin-top:12px"><button class="btn gold" onclick="applyAI()">应用到编辑器</button><button class="btn red" onclick="publish()">🚀 应用并发布到网站</button></div><div id="pub" class="status">尚未发布</div></section><section class="card"><h2>🛠 手动微调</h2><div class="form"><div><label>主色</label><input id="primary" type="color"></div><div><label>强调色</label><input id="accent" type="color"></div><div><label>标题颜色</label><input id="titleColor" type="color"></div><div><label>正文颜色</label><input id="bodyColor" type="color"></div><div><label>标题字体</label><select id="titleFont"><option value="Songti SC, STSong, Noto Serif SC, serif">宋体 / 思源宋体</option><option value="Noto Serif SC, Songti SC, STSong, serif">Noto Serif SC</option><option value="PingFang SC, Microsoft YaHei, sans-serif">苹方 / 微软雅黑</option></select></div><div><label>正文字体</label><select id="bodyFont"><option value="-apple-system,BlinkMacSystemFont,PingFang SC,Noto Sans SC,Microsoft YaHei,Arial,sans-serif">系统中文字体</option><option value="PingFang SC,Microsoft YaHei,sans-serif">苹方 / 微软雅黑</option><option value="Noto Sans SC,Microsoft YaHei,sans-serif">Noto Sans SC</option></select></div><div><label>标题粗细</label><select id="titleWeight"><option value="700">700</option><option value="800">800</option><option value="900">900</option></select></div><div><label>卡片圆角</label><select id="radius"><option value="10">10px</option><option value="14">14px</option><option value="16">16px</option><option value="20">20px</option></select></div></div></section><section class="card"><h2>🔐 发布连接</h2><div class="form"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="仅保存在本机浏览器"></div></div><div class="row" style="margin-top:10px"><button class="btn gray" onclick="saveLocal()">保存连接设置</button><button class="btn gold" onclick="loadConfig()">读取当前网站配置</button></div><div class="backup">发布前会先读取 data/site-config.json。只更新网站设计配置，不删除资料、图片和文章。</div></section></main><script>const $=id=>document.getElementById(id);let cfg=null,file=null,aiCfg=null;function defaults(){return {siteName:'洪盛集藏',topNotice:'洪盛集藏 · 公益钱币收藏资料平台　|　学习 · 交流 · 研究　|　不收取任何费用',heroTitle:'钱币收藏资料与交流平台',heroText:'收藏交流 · 鉴赏参考 · 品相分析 · 市场行情 · 钱币文化研究。所有资料仅供学习、交流、研究参考。',phone:'13799875350',theme:{primary:'#741912',accent:'#c49a4b',titleColor:'#741912',bodyColor:'#2b2723',titleFont:'Songti SC, STSong, Noto Serif SC, serif',bodyFont:'-apple-system,BlinkMacSystemFont,PingFang SC,Noto Sans SC,Microsoft YaHei,Arial,sans-serif',titleWeight:900,cardRadius:16}}}function use(x){$('prompt').value=x}function saveLocal(){localStorage.setItem('hsjc_ai_editor',JSON.stringify({owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()}));$('aiStatus').textContent='✅ 连接设置已保存'}function loadLocal(){try{const x=JSON.parse(localStorage.getItem('hsjc_ai_editor')||'{}');for(const k of ['owner','repo','branch','token'])if(x[k])$(k).value=x[k]}catch{}}function base(){return '/repos/'+$('owner').value.trim()+'/'+$('repo').value.trim()}function need(){if(!$('token').value.trim())throw Error('请先填写 GitHub Token')}async function api(path,opt={}){need();const r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json','Authorization':'Bearer '+$('token').value.trim(),'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}function decode(b64){const raw=atob((b64||'').replace(/\s/g,''));const a=Uint8Array.from(raw,c=>c.charCodeAt(0));return new TextDecoder().decode(a)}function enc(s){const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=32768)x+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(x)}async function getFile(){const r=await api(base()+'/contents/data/site-config.json?ref='+encodeURIComponent($('branch').value.trim()||'main'));return{sha:r.sha,text:decode(r.content)}}async function put(text,sha){return api(base()+'/contents/data/site-config.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛集藏：AI 网站设计优化',content:enc(text),branch:$('branch').value.trim()||'main',sha})})}async function loadConfig(){try{file=await getFile();cfg=JSON.parse(file.text);syncUI();$('aiStatus').textContent='✅ 已读取当前网站配置'}catch(e){cfg=defaults();syncUI();$('aiStatus').textContent='⚠️ 读取失败，已使用默认配置：'+e.message}}function syncUI(){const t=cfg.theme||defaults().theme;for(const k of ['primary','accent','titleColor','bodyColor','titleFont','bodyFont','titleWeight'])$(k).value=t[k]??defaults().theme[k];$('radius').value=t.cardRadius||16;renderPreview(cfg)}function aiDesign(){const p=$('prompt').value.trim();if(!p)return alert('请先用一句话描述你想要的设计');if(!cfg)cfg=defaults();const s=p.toLowerCase();const t={...(cfg.theme||defaults().theme)};if(/红|中国风|中式|传统|古典/.test(p)){t.primary='#741912';t.accent='#c49a4b';t.titleColor='#741912';t.bodyColor='#2b2723';t.titleFont='Songti SC, STSong, Noto Serif SC, serif';t.titleWeight=900}if(/黑金|高端|奢华/.test(p)){t.primary='#241c18';t.accent='#c8a15a';t.titleColor='#3b2a1e';t.bodyColor='#292522';t.titleFont='Noto Serif SC, Songti SC, STSong, serif';t.titleWeight=900}if(/简洁|清爽|极简|现代/.test(p)){t.primary='#7a2a20';t.accent='#b99355';t.titleWeight=700;t.cardRadius=12}if(/圆润|柔和/.test(p))t.cardRadius=18;if(/手机|移动|电脑|自适应|响应式/.test(p)){}if(/蓝|科技/.test(p)){t.primary='#183b56';t.accent='#b48b45';t.titleColor='#17344a'}if(/绿|自然/.test(p)){t.primary='#285443';t.accent='#b18a46';t.titleColor='#244c3d'}if(/字体|宋体|书卷|文献/.test(p)){t.titleFont='Songti SC, STSong, Noto Serif SC, serif';t.titleWeight=900}if(/无衬线|微软雅黑|现代字体/.test(p)){t.titleFont='PingFang SC, Microsoft YaHei, sans-serif';t.titleWeight=800}if(/大标题|醒目/.test(p))t.titleWeight=900;cfg.theme=t;aiCfg=JSON.parse(JSON.stringify(cfg));syncUI();$('aiStatus').textContent='✨ 已根据你的描述生成设计方案。请预览后应用或发布。'}function renderPreview(c){const t=c.theme||defaults().theme;const v=$('preview');v.style.display='block';v.style.background='#fff';v.style.borderColor=t.accent;v.style.borderRadius=(t.cardRadius||16)+'px';v.style.color=t.bodyColor;v.style.fontFamily=t.bodyFont;v.innerHTML='<h3 style="color:'+t.titleColor+';font-family:'+t.titleFont+';font-weight:'+t.titleWeight+'">'+(c.siteName||'洪盛集藏')+'</h3><div class="bar" style="background:'+t.accent+'"></div><div class="nav"><span style="background:'+t.primary+';color:#fff">最新价格行情</span><span>收藏交流 · 鉴赏参考</span><span>福建钱币</span><span>免费咨询</span></div><div class="section" style="border-color:'+t.accent+'"><h4 style="color:'+t.titleColor+'">🥈 银元 · 机制币</h4><p>收藏交流 · 鉴赏参考 · 市场行情 · 钱币文化研究</p></div><div class="section"><h4 style="color:'+t.titleColor+'">💴 纸币</h4><p>资料图片、正文与详情页保持原有内容。</p></div>'}$('primary').addEventListener('input',syncManual);$('accent').addEventListener('input',syncManual);$('titleColor').addEventListener('input',syncManual);$('bodyColor').addEventListener('input',syncManual);$('titleFont').addEventListener('change',syncManual);$('bodyFont').addEventListener('change',syncManual);$('titleWeight').addEventListener('change',syncManual);$('radius').addEventListener('change',syncManual);function syncManual(){if(!cfg)cfg=defaults();cfg.theme={...cfg.theme,primary:$('primary').value,accent:$('accent').value,titleColor:$('titleColor').value,bodyColor:$('bodyColor').value,titleFont:$('titleFont').value,bodyFont:$('bodyFont').value,titleWeight:Number($('titleWeight').value),cardRadius:Number($('radius').value)};renderPreview(cfg)}function applyAI(){if(!aiCfg&&cfg)aiCfg=cfg;if(!aiCfg)return alert('请先生成 AI 设计方案');cfg=JSON.parse(JSON.stringify(aiCfg));syncUI();$('aiStatus').textContent='✅ AI 设计已应用到当前编辑器，尚未写入网站。'}async function publish(){try{need();if(!cfg)cfg=defaults();syncManual();if(!file)file=await getFile();await put(JSON.stringify(cfg,null,2),file.sha);file=await getFile();$('pub').textContent='✅ 已发布 AI 网站设计。GitHub Pages 会自动更新。'}catch(e){$('pub').textContent='❌ 发布失败：'+e.message}}function resetAI(){if(!cfg)return;syncUI();aiCfg=null;$('aiStatus').textContent='已恢复当前网站配置'}loadLocal();loadConfig();</script></body></html>
