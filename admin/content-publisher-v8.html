<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛收藏资讯网｜内容管理 V9</title><style>body{margin:0;background:#f5eee5;color:#332722;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{background:linear-gradient(135deg,#350604,#75170f);color:#f6d985;padding:20px}.wrap{width:min(1200px,94vw);margin:auto}.card{background:#fffdf9;border:1px solid #dfcdae;border-radius:12px;padding:15px;margin:13px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8c8b5;border-radius:8px;font:inherit}textarea{min-height:110px}.btn{border:0;border-radius:8px;padding:9px 13px;margin:4px;font-weight:800;cursor:pointer}.red{background:#68100a;color:#fff}.gold{background:#d6b35b;color:#32130d}.gray{background:#756a63;color:#fff}.green{background:#2f6b3b;color:#fff}.danger{background:#a62a20;color:#fff}.blue{background:#315b82;color:#fff}.status{padding:10px;background:#f8efe4;border-radius:8px;margin-top:8px}.ok{background:#e8f5e9;color:#245d2b}.tip{background:#fff5dd;border:1px solid #dfc18a;padding:10px;border-radius:8px;margin:8px 0}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.img{border:1px solid #dfcdae;border-radius:8px;padding:8px}.img img{width:100%;height:150px;object-fit:contain;background:#f3eee8}.preview{background:#fff;border:1px solid #ddd1c0;border-radius:9px;padding:18px;line-height:1.8}.preview img{max-width:100%;height:auto;display:block;margin:14px auto}.muted{font-size:12px;color:#756a61}.row{border:1px solid #eadfce;background:#fffaf3;border-radius:9px;padding:10px;margin:8px 0}.toolbar{display:flex;flex-wrap:wrap;gap:4px}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.gallery{grid-template-columns:1fr 1fr}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛收藏资讯网 · 内容管理 V9</h1><div>发布｜转移版块｜重新编辑｜删除｜图片插入到具体正文位置</div></div></header><main class="wrap"><section class="card"><h2>🔐 GitHub</h2><div class="grid"><div><label>用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>Token</label><input id="token" type="password"></div></div><button class="btn red" onclick="load()">🔄 读取整个内容系统</button><div id="status" class="status">尚未读取</div></section><section class="card"><h2>📝 内容编辑器</h2><div class="grid"><div><label>发布版块</label><select id="group"></select></div><div><label>内容库</label><select id="lib"></select></div><div><label>文章 ID</label><input id="id"></div><div><label>标题</label><input id="title"></div><div><label>日期</label><input id="date" type="date"></div><div><label>分类</label><input id="kind"></div><div><label>状态</label><select id="articleStatus"><option value="draft">草稿</option><option value="published">已发布</option></select></div><div class="wide"><label>摘要</label><textarea id="note"></textarea></div><div class="wide"><label>正文</label><textarea id="body" style="min-height:300px" placeholder="将光标放到具体位置，再选择图片插入"></textarea></div></div><div class="toolbar"><button class="btn green" onclick="saveArticle()">💾 保存修改</button><button class="btn red" onclick="saveAsNew()">➕ 另存为新内容</button><button class="btn blue" onclick="moveCurrent()">↔️ 转移到所选版块</button><button class="btn gold" onclick="publishCurrent()">🚀 发布</button><button class="btn gray" onclick="draftCurrent()">⏸️ 下架</button><button class="btn danger" onclick="deleteCurrent()">🗑️ 删除</button><button class="btn gray" onclick="newArticle()">🆕 清空新建</button></div></section><section class="card"><h2>🖼️ 图片上传与具体位置</h2><input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple><button class="btn gold" onclick="uploadAll()">⬆️ 上传图片</button><div id="gallery" class="gallery"></div><div class="tip">① 上传图片 → ② 点击“选择此图片” → ③ 把光标放在正文指定位置 → ④ 点击“插入当前光标位置”。图片会和正文一起保存。</div><div class="toolbar"><button class="btn gold" onclick="insertMarker('before')">插入正文开头</button><button class="btn red" onclick="insertMarker('cursor')">插入当前光标位置</button><button class="btn gold" onclick="insertMarker('after')">插入正文末尾</button></div></section><section class="card"><h2>👁️ 实际发布预览</h2><div id="preview" class="preview">尚未编辑</div></section><section class="card"><h2>📚 内容库文章</h2><div class="tip">选择文章后可：重新编辑、改变所属版块、添加/调整图片、发布、下架或删除。</div><div id="articles"></div></section></main><script>const $=id=>document.getElementById(id);let groups={},items=[],sha=null,selectedImage=null;const enc=new TextEncoder(),b64=s=>{let a=enc.encode(s),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}async function api(path,opt={}){let t=$('token').value.trim();if(!t)throw Error('请填写 GitHub Token');let r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28'}}),d=await r.json();if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}async function get(path){return api(base()+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value||'main'))}async function put(path,text,oldSha,msg){let o={message:'洪盛收藏资讯网：'+msg,content:b64(text),branch:$('branch').value||'main'};if(oldSha)o.sha=oldSha;return api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)})}function unwrap(x){for(let i=0;i<6&&x&&typeof x==='object'&&typeof x.content==='string';i++){try{x=JSON.parse(x.content)}catch{break}}return x}async function load(){try{let sf=await get('data/site-config.json'),sc=unwrap(JSON.parse(dec(sf.content)));groups=sc.groups||{};$('group').innerHTML=Object.entries(groups).filter(([id,g])=>g.enabled!==false).map(([id,g])=>'<option value="'+esc(id)+'">'+esc(g.title||id)+'</option>').join('');let d=await api(base()+'/contents/data/content?ref='+($('branch').value||'main'));let fs=d.filter(x=>x.type==='file'&&x.name.endsWith('.json'));$('lib').innerHTML=fs.map(x=>'<option value="'+esc(x.name)+'">'+esc(x.name)+'</option>').join('');await loadArticles();$('status').className='status ok';$('status').textContent='✅ 已读取版块 '+Object.keys(groups).length+' 个，内容库 '+fs.length+' 个'}catch(e){$('status').textContent='❌ '+e.message}}async function loadArticles(){let f=await get('data/content/'+$('lib').value);sha=f.sha;items=JSON.parse(dec(f.content));renderArticles()}function renderArticles(){$('articles').innerHTML=items.map((x,i)=>'<div class="row"><b>'+esc(x.title||x.id)+'</b><div class="muted">版块：'+esc(x.groupName||x.groupId||'未指定')+' · '+esc(x.date||'')+' · '+esc(x.status||'draft')+'</div><div class="toolbar"><button class="btn gold" onclick="edit('+i+')">✏️ 重新编辑</button><button class="btn blue" onclick="selectForMove('+i+')">↔️ 转移</button><button class="btn green" onclick="publish('+i+')">🚀 发布</button><button class="btn gray" onclick="draft('+i+')">⏸️ 下架</button><button class="btn danger" onclick="del('+i+')">🗑️ 删除</button></div></div>').join('')||'暂无文章'}function edit(i){let x=items[i];$('id').value=x.id||'';$('title').value=x.title||'';$('date').value=x.date||'';$('kind').value=x.kind||'';$('articleStatus').value=x.status||'draft';$('note').value=x.note||'';$('body').value=x.content||'';if(x.groupId&&groups[x.groupId])$('group').value=x.groupId;updatePreview();scrollTo({top:0,behavior:'smooth'})}function newArticle(){['id','title','date','kind','note','body'].forEach(x=>$(x).value='');$('articleStatus').value='draft';updatePreview()}async function saveArticle(){let gid=$('group').value;if(!gid)return alert('请选择版块');let g=groups[gid]||{},id=$('id').value.trim();if(!id)return alert('请选择已有文章或填写文章 ID');let i=items.findIndex(x=>x.id===id);if(i<0)return alert('未找到该文章，请使用“另存为新内容”');items[i]={...items[i],id,title:$('title').value,date:$('date').value||new Date().toISOString().slice(0,10),kind:$('kind').value,note:$('note').value,content:$('body').value,status:$('articleStatus').value,groupId:gid,groupName:g.title||gid,contentFile:$('lib').value};await persist('重新编辑并保存')}async function saveAsNew(){let gid=$('group').value;if(!gid)return alert('请选择版块');let g=groups[gid]||{},id=$('id').value.trim()||'article_'+Date.now();if(items.some(x=>x.id===id))id+='_'+Date.now();items.push({id,title:$('title').value,date:$('date').value||new Date().toISOString().slice(0,10),kind:$('kind').value,note:$('note').value,content:$('body').value,status:$('articleStatus').value,groupId:gid,groupName:g.title||gid,contentFile:$('lib').value});$('id').value=id;await persist('新增内容')}let movingIndex=-1;function selectForMove(i){movingIndex=i;edit(i);alert('已选择“'+(items[i].title||items[i].id)+'”，现在选择上方“发布版块”，再点击“↔️ 转移到所选版块”')}async function moveCurrent(){let id=$('id').value.trim(),i=items.findIndex(x=>x.id===id);if(i<0&&movingIndex<0)return alert('请先选择文章');i=i>=0?i:movingIndex;let gid=$('group').value;if(!gid)return alert('请选择目标版块');let g=groups[gid]||{};items[i].groupId=gid;items[i].groupName=g.title||gid;await persist('内容转移到：'+(g.title||gid));movingIndex=-1}async function publishCurrent(){let id=$('id').value.trim(),i=items.findIndex(x=>x.id===id);if(i<0)return alert('请先选择文章');items[i].status='published';await persist('发布内容')}async function draftCurrent(){let id=$('id').value.trim(),i=items.findIndex(x=>x.id===id);if(i<0)return alert('请先选择文章');items[i].status='draft';await persist('内容下架')}async function deleteCurrent(){let id=$('id').value.trim(),i=items.findIndex(x=>x.id===id);if(i<0)return alert('请先选择文章');if(!confirm('确定永久删除这篇内容？'))return;items.splice(i,1);newArticle();await persist('删除内容')}async function publish(i){items[i].status='published';edit(i);await persist('发布内容')}async function draft(i){items[i].status='draft';edit(i);await persist('内容下架')}async function del(i){if(!confirm('确定永久删除？'))return;items.splice(i,1);await persist('删除内容')}async function persist(msg){let r=await put('data/content/'+$('lib').value,JSON.stringify(items,null,2),sha,msg);sha=r.content?.sha||sha;renderArticles();$('status').className='status ok';$('status').textContent='✅ '+msg+' 已完成'}async function uploadAll(){let fs=[...$('files').files];if(!fs.length)return alert('请选择图片');if(fs.some(f=>f.size>5*1024*1024))return alert('单张图片不能超过5MB');let out=[];for(let f of fs){let now=new Date(),path='static/uploads/'+now.getFullYear()+'/'+String(now.getMonth()+1).padStart(2,'0')+'/img_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+f.name.substring(f.name.lastIndexOf('.'));let bytes=new Uint8Array(await f.arrayBuffer()),o='';for(let i=0;i<bytes.length;i+=32768)o+=String.fromCharCode(...bytes.subarray(i,i+32768));await api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛收藏资讯网：上传内容图片',content:btoa(o),branch:$('branch').value||'main'})});out.push({id:path.split('/').pop().split('.')[0],url:'https://yang79403-wq.github.io/'+path,name:f.name})}$('gallery').innerHTML=out.map(x=>'<div class="img"><img src="'+x.url+'"><b>'+esc(x.name)+'</b><div class="muted">'+x.id+'</div><button class="btn gold" onclick="selectImg('+JSON.stringify(x.id)+','+JSON.stringify(x.url)+')">选择此图片</button></div>').join('');$('status').textContent='🖼️ 图片上传成功，请选择图片'}function selectImg(id,url){selectedImage={id,url};$('status').textContent='🖼️ 已选择图片，请把光标放到正文具体位置后点击“插入当前光标位置”'}function insertMarker(pos){if(!selectedImage)return alert('请先选择图片');let marker='\n\n【图片:'+selectedImage.id+']\n'+selectedImage.url+'\n【/图片】\n\n',ta=$('body'),s=ta.selectionStart||0,e=ta.selectionEnd||0;if(pos==='before')ta.value=marker+ta.value;else if(pos==='after')ta.value+=marker;else ta.value=ta.value.slice(0,s)+marker+ta.value.slice(e);updatePreview()}function updatePreview(){let c=esc($('body').value||'').replace(/【图片:([^\]]+)\]\n([^\n]+)\n【\/图片】/g,(m,id,url)=>'<figure><img src="'+esc(url)+'" alt="'+esc(id)+'"><figcaption>收藏图片</figcaption></figure>').replace(/\n/g,'<br>');$('preview').innerHTML='<div class="muted">发布版块：'+esc(groups[$('group').value]?.title||'未选择')+'</div><h2>'+esc($('title').value||'文章标题')+'</h2>'+c}$('lib').addEventListener('change',loadArticles);$('body').addEventListener('input',updatePreview);$('title').addEventListener('input',updatePreview);</script></body></html>
