<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛收藏资讯网｜内容发布 V8</title><style>body{margin:0;background:#f5eee5;color:#332722;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{background:linear-gradient(135deg,#350604,#75170f);color:#f6d985;padding:20px}.wrap{width:min(1180px,94vw);margin:auto}.card{background:#fffdf9;border:1px solid #dfcdae;border-radius:12px;padding:15px;margin:13px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}input,textarea,select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #d8c8b5;border-radius:8px;font:inherit}textarea{min-height:110px}.btn{border:0;border-radius:8px;padding:9px 13px;margin:4px;font-weight:800;cursor:pointer}.red{background:#68100a;color:#fff}.gold{background:#d6b35b;color:#32130d}.gray{background:#756a63;color:#fff}.green{background:#2f6b3b;color:#fff}.danger{background:#a62a20;color:#fff}.status{padding:10px;background:#f8efe4;border-radius:8px;margin-top:8px}.ok{background:#e8f5e9;color:#245d2b}.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.img{border:1px solid #dfcdae;border-radius:8px;padding:8px}.img img{width:100%;height:150px;object-fit:contain;background:#f3eee8}.muted{font-size:12px;color:#756a61}.preview{background:#fff;border:1px solid #ddd1c0;border-radius:9px;padding:18px;line-height:1.8}.preview img{max-width:100%;height:auto;display:block;margin:14px auto}.pos{display:flex;gap:6px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.gallery{grid-template-columns:1fr 1fr}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛收藏资讯网 · 内容发布 V8</h1><div>图片上传 → 插入正文指定位置 → 预览 → 发布</div></div></header><main class="wrap"><section class="card"><h2>🔐 GitHub</h2><div class="grid"><div><label>用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><button class="btn red" onclick="load()">🔄 读取内容库</button><div id="status" class="status">尚未读取</div></section><section class="card"><h2>✍️ 内容编辑</h2><div class="grid"><div><label>内容库</label><select id="lib"></select></div><div><label>文章 ID</label><input id="id"></div><div><label>标题</label><input id="title"></div><div><label>日期</label><input id="date" type="date"></div><div><label>分类</label><input id="kind"></div><div><label>状态</label><select id="status"><option value="draft">草稿</option><option value="published">发布</option></select></div><div class="wide"><label>摘要</label><textarea id="note"></textarea></div><div class="wide"><label>正文</label><textarea id="body" style="min-height:260px" placeholder="正文中可使用【图片:图片ID】作为图片插入位置"></textarea></div></div><button class="btn gray" onclick="insertAtEnd()">➕ 在正文末尾插入所选图片</button><button class="btn green" onclick="saveArticle()">💾 保存 / 发布</button><button class="btn red" onclick="newArticle()">🆕 新建文章</button></section><section class="card"><h2>🖼️ 图片上传与正文插入</h2><input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple onchange="previewFiles()"><div class="status">上传后会进入 <b>static/uploads/年/月/</b>。每张图片都会生成唯一 ID。你可以选择图片后，把它插入正文的任意位置。</div><div id="upList"></div><div id="gallery" class="gallery"></div></section><section class="card"><h2>📍 图片具体位置</h2><div class="pos"><button class="btn gold" onclick="insertMarker('before')">图片插入到正文开头</button><button class="btn gold" onclick="insertMarker('cursor')">图片插入到当前光标位置</button><button class="btn gold" onclick="insertMarker('after')">图片插入到正文末尾</button></div><p class="muted">正文中会写入图片标记，例如：<code>【图片:img_20260821_001】</code>。发布后前台按标记位置渲染图片，不再把所有图片固定堆在文章底部。</p></section><section class="card"><h2>👁️ 发布前预览</h2><div id="preview" class="preview">填写标题和正文后预览</div></section><section class="card"><h2>🗂️ 已有文章</h2><div id="articles"></div></section></main><script>const $=id=>document.getElementById(id);let files=[],sha=null,items=[],selectedImage=null;const enc=new TextEncoder(),b64=s=>{let a=enc.encode(s),o='';for(let i=0;i<a.length;i+=32768)o+=String.fromCharCode(...a.subarray(i,i+32768));return btoa(o)},dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));function base(){return '/repos/'+encodeURIComponent($('owner').value.trim())+'/'+encodeURIComponent($('repo').value.trim())}async function api(path,opt={}){let t=$('token').value.trim();if(!t)throw Error('请填写 GitHub Token');let r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+t,'X-GitHub-Api-Version':'2022-11-28'}}),d=await r.json();if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}async function get(path){return api(base()+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value||'main'))}async function put(path,text,oldSha,msg){let body={message:'洪盛收藏资讯网：'+msg,content:b64(text),branch:$('branch').value||'main'};if(oldSha)body.sha=oldSha;return api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}async function load(){try{let d=await api(base()+'/contents/data/content?ref='+($('branch').value||'main'));files=d.filter(x=>x.type==='file'&&x.name.endsWith('.json'));$('lib').innerHTML=files.map(x=>'<option value="'+x.name+'">'+x.name+'</option>').join('');await loadArticles();$('status').className='status ok';$('status').textContent='✅ 内容库读取成功：'+files.length+' 个';}catch(e){$('status').textContent='❌ '+e.message}}async function loadArticles(){if(!$('lib').value)return;let f=await get('data/content/'+$('lib').value);sha=f.sha;items=JSON.parse(dec(f.content));renderArticles()}function renderArticles(){$('articles').innerHTML=items.map((x,i)=>'<div class="card"><b>'+esc(x.title||x.id)+'</b><div class="muted">'+esc(x.date||'')+' · '+esc(x.status||'draft')+'</div><button class="btn gold" onclick="edit('+i+')">修改</button><button class="btn green" onclick="publish('+i+')">发布</button><button class="btn gray" onclick="draft('+i+')">下架</button><button class="btn danger" onclick="del('+i+')">删除</button></div>').join('')||'暂无文章'}function edit(i){let x=items[i];$('id').value=x.id||'';$('title').value=x.title||'';$('date').value=x.date||'';$('kind').value=x.kind||'';$('status').value=x.status||'draft';$('note').value=x.note||'';$('body').value=x.content||'';updatePreview()}function newArticle(){['id','title','date','kind','note','body'].forEach(x=>$(x).value='');$('status').value='draft';updatePreview()}async function saveArticle(){let id=$('id').value.trim()||'article_'+Date.now();let obj={id,title:$('title').value,date:$('date').value||new Date().toISOString().slice(0,10),kind:$('kind').value,note:$('note').value,content:$('body').value,status:$('status').value};let i=items.findIndex(x=>x.id===id);if(i>=0)items[i]=obj;else items.push(obj);let r=await put('data/content/'+$('lib').value,JSON.stringify(items,null,2),sha,'发布/修改文章');sha=r.content?.sha||sha;renderArticles();$('status').className='status ok';$('status').textContent='✅ 内容已保存到真实内容库，并设置为 '+obj.status;updatePreview()}async function publish(i){items[i].status='published';await persist('发布文章')}async function draft(i){items[i].status='draft';await persist('文章下架')}async function del(i){if(!confirm('确定删除这篇内容？'))return;items.splice(i,1);await persist('删除文章')}async function persist(msg){let r=await put('data/content/'+$('lib').value,JSON.stringify(items,null,2),sha,msg);sha=r.content?.sha||sha;renderArticles();$('status').className='status ok';$('status').textContent='✅ '+msg+' 已完成'}function previewFiles(){$('upList').innerHTML=[...$('files').files].map((f,i)=>'<div class="row">'+esc(f.name)+' · '+Math.round(f.size/1024)+'KB</div>').join('')}async function uploadFile(file){let now=new Date(),path='static/uploads/'+now.getFullYear()+'/'+String(now.getMonth()+1).padStart(2,'0')+'/img_'+Date.now()+'_'+Math.random().toString(36).slice(2,7)+file.name.substring(file.name.lastIndexOf('.'));let data=await file.arrayBuffer();let bytes=new Uint8Array(data),o='';for(let i=0;i<bytes.length;i+=32768)o+=String.fromCharCode(...bytes.subarray(i,i+32768));let r=await api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'洪盛收藏资讯网：上传文章图片',content:btoa(o),branch:$('branch').value||'main'})});return {path,url:'https://yang79403-wq.github.io/'+path,id:path.split('/').pop().split('.')[0],name:file.name}}async function uploadAll(){let fs=[...$('files').files];if(!fs.length)return alert('请选择图片');if(fs.some(f=>f.size>5*1024*1024))return alert('单张图片不能超过5MB');$('status').textContent='正在上传图片…';let out=[];for(let f of fs)out.push(await uploadFile(f));$('gallery').innerHTML=out.map(x=>'<div class="img"><img src="'+x.url+'"><b>'+esc(x.name)+'</b><div class="muted">ID: '+x.id+'</div><button class="btn gold" onclick="selectImg('+JSON.stringify(x.id)+','+JSON.stringify(x.url)+')">选择并插入</button></div>').join('');$('status').className='status ok';$('status').textContent='✅ 图片上传完成，点击“选择并插入”即可决定插入位置'}function selectImg(id,url){selectedImage={id,url};alert('已选择图片：'+id+'\n现在点击“插入到当前光标位置”即可')}function insertMarker(pos){if(!selectedImage)return alert('请先选择上传后的图片');let marker='\n\n【图片:'+selectedImage.id+']\n'+selectedImage.url+'\n【/图片】\n\n',ta=$('body'),start=ta.selectionStart||0,end=ta.selectionEnd||0;if(pos==='before')ta.value=marker+ta.value;else if(pos==='after')ta.value=ta.value+marker;else ta.value=ta.value.slice(0,start)+marker+ta.value.slice(end);updatePreview()}function insertAtEnd(){insertMarker('after')}function updatePreview(){let c=esc($('body').value||'').replace(/【图片:([^\]]+)\]\n([^\n]+)\n【\/图片】/g,(m,id,url)=>'<figure><img src="'+esc(url)+'" alt="'+esc(id)+'"><figcaption>收藏图片</figcaption></figure>').replace(/\n/g,'<br>');$('preview').innerHTML='<h2>'+esc($('title').value||'文章标题')+'</h2>'+c}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}$('lib').addEventListener('change',loadArticles);$('files').addEventListener('change',previewFiles);$('files').addEventListener('change',()=>{if($('files').files.length)uploadAll()});$('body').addEventListener('input',updatePreview);$('title').addEventListener('input',updatePreview);</script></body></html>
