<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏网站修改设计工具</title><style>:root{--r:#741912;--g:#b88a3b;--bg:#f7f1e8;--card:#fffdf8;--line:#e2d7c8;--ink:#2c241f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{background:linear-gradient(135deg,#741912,#2d0d09);color:#fff;padding:24px 0}.wrap{width:min(1120px,94vw);margin:auto}.head h1{margin:0;color:#f4d98e}.head p{margin:6px 0 0;color:#eadfd1}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 6px 20px #0000000b}h2,h3{margin-top:0;color:#5a2119}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{display:block;font-weight:800;margin:0 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}textarea{min-height:90px}.btn{border:0;border-radius:9px;padding:9px 13px;color:#fff;font-weight:800;cursor:pointer}.red{background:var(--r)}.gold{background:var(--g);color:#30130f}.gray{background:#6b625a}.danger{color:#8c1d15;background:#fff1ee;border:1px solid #ecc8c2}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0;background:#fff}.disabled{opacity:.5}.hint{font-size:13px;color:#766c63}.status{margin-top:10px;padding:10px;border-radius:9px;background:#f4eee5}.themePreview{padding:18px;border-radius:14px;border:1px solid var(--line);background:#fff;margin-top:12px}.previewTitle{font-size:25px;margin:0 0 6px}.previewSub{margin:0}.subitem{display:grid;grid-template-columns:1fr 100px auto;gap:8px;align-items:center}.actions{display:flex;gap:5px;flex-wrap:wrap}@media(max-width:700px){.form{grid-template-columns:1fr}.wide{grid-column:auto}.subitem{grid-template-columns:1fr}.subitem .actions{grid-column:1}.wrap{width:92vw}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛集藏网站修改设计工具</h1><p>网站版块、导航、标题、颜色、字体与显示状态统一管理。保存后同步网站配置。</p></div></header><main class="wrap"><section class="card"><h2>⚙️ 连接设置</h2><div class="form"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><div class="row" style="margin-top:10px"><button class="btn red" onclick="saveCfg()">保存设置</button><button class="btn gold" onclick="loadConfig()">读取当前网站</button></div><div id="status" class="status">Token 只保存在本机浏览器。</div></section><section class="card"><h2>🎨 网页视觉设计</h2><div class="form"><div><label>网页主色</label><input id="primary" type="color"></div><div><label>金色强调色</label><input id="accent" type="color"></div><div><label>一级标题颜色</label><input id="titleColor" type="color"></div><div><label>正文颜色</label><input id="bodyColor" type="color"></div><div><label>标题字体</label><select id="titleFont"><option value="Songti SC, STSong, Noto Serif SC, serif">宋体 / 思源宋体</option><option value="Noto Serif SC, Songti SC, STSong, serif">Noto Serif SC</option><option value="PingFang SC, Microsoft YaHei, sans-serif">苹方 / 微软雅黑</option></select></div><div><label>正文字体</label><select id="bodyFont"><option value="-apple-system, BlinkMacSystemFont, PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif">系统中文字体</option><option value="PingFang SC, Microsoft YaHei, sans-serif">苹方 / 微软雅黑</option><option value="Noto Sans SC, Microsoft YaHei, sans-serif">Noto Sans SC</option></select></div><div><label>标题粗细</label><select id="titleWeight"><option value="700">700</option><option value="800">800</option><option value="900">900</option></select></div><div><label>卡片圆角</label><select id="cardRadius"><option value="10">10px</option><option value="12">12px</option><option value="15">15px</option><option value="18">18px</option><option value="20">20px</option></select></div></div><div class="themePreview"><div id="pvTitle" class="previewTitle">洪盛集藏 · 银元 · 机制币</div><p id="pvSub" class="previewSub">收藏交流 · 鉴赏参考 · 市场行情 · 钱币文化研究</p></div></section><section class="card"><h2>🏷️ 首页基础内容</h2><div class="form"><div><label>网站名称</label><input id="siteName"></div><div><label>顶部提示</label><input id="topNotice"></div><div><label>首页主标题</label><input id="heroTitle"></div><div><label>联系电话 / 微信</label><input id="phone"></div><div class="wide"><label>首页介绍</label><textarea id="heroText"></textarea></div></div></section><section class="card"><h2>🧭 首页导航</h2><div id="navList"></div></section><section class="card"><h2>🗂 网站版块管理</h2><p class="hint">可修改名称、显示/隐藏、上下移动、删除。删除版块不会删除已有资料。</p><div id="groups"></div><button class="btn gold" onclick="addGroup()">＋ 新增一级版块</button></section><section class="card"><h2>➕ 新增资料分类</h2><div class="form"><div><label>所属一级版块</label><select id="newGroup"></select></div><div><label>分类 ID</label><input id="newId" placeholder="例如 commemorative"></div><div><label>显示名称</label><input id="newName" placeholder="例如：纪念币"></div><div><label>资料类型</label><select id="newType"><option value="content">普通资料 / 鉴赏</option><option value="market">价格行情</option><option value="fujian">福建钱币</option></select></div></div><button class="btn red" style="margin-top:10px" onclick="addItem()">＋ 添加分类</button></section><section class="card"><h2>💾 保存并发布</h2><p class="hint">只修改网站配置，不会删除已有文章、图片或行情资料。</p><button class="btn red" onclick="publish()">🚀 保存并发布到网站</button><div id="pub" class="status">等待操作</div></section></main><script>const $=id=>document.getElementById(id);let cfg=null,cfgFile=null;function saveCfg(){localStorage.setItem('hsjc_editor_cfg',JSON.stringify({owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()}));$('status').textContent='✅ 设置已保存'}function getCfg(){return JSON.parse(localStorage.getItem('hsjc_editor_cfg')||'{}')}function need(){if(!$('token').value.trim())throw Error('请先填写 GitHub Token')}function base(){return '/repos/'+$('owner').value.trim()+'/'+$('repo').value.trim()}async function api(path,opt={}){need();const r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json','Authorization':'Bearer '+$('token').value.trim(),'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}function enc(s){const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=32768)x+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(x)}async function getFile(path){const r=await api(base()+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value.trim()||'main'));const raw=atob((r.content||'').replace(/\s/g,''));return{sha:r.sha,text:new TextDecoder().decode(Uint8Array.from(raw,c=>c.charCodeAt(0)))}}async function putFile(path,text,sha,msg){const body={message:msg,content:enc(text),branch:$('branch').value.trim()||'main',sha};return api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}function defaults(){return {siteName:'洪盛集藏',topNotice:'洪盛集藏 · 公益钱币收藏资料平台　|　学习 · 交流 · 研究　|　不收取任何费用',heroTitle:'钱币收藏资料与交流平台',heroText:'收藏交流 · 鉴赏参考 · 品相分析 · 市场行情 · 钱币文化研究。所有资料仅供学习、交流、研究参考。',phone:'13799875350',theme:{primary:'#741912',accent:'#c49a4b',titleColor:'#741912',bodyColor:'#2b2723',titleFont:'Songti SC, STSong, Noto Serif SC, serif',bodyFont:'-apple-system, BlinkMacSystemFont, PingFang SC, Noto Sans SC, Microsoft YaHei, Arial, sans-serif',titleWeight:900,cardRadius:15},nav:[{id:'market',name:'最新价格行情',enabled:true},{id:'services',name:'收藏交流 · 鉴赏参考',enabled:true},{id:'fujian',name:'福建钱币',enabled:true},{id:'consult',name:'免费咨询',enabled:true}],groups:{market:{title:'最新价格行情',subtitle:'按钱币类别归类展示；有价格的资料显示参考价格。',items:[{id:'market_yinyuan_jizhibi',name:'🥈 银元 · 机制币行情',enabled:true},{id:'market_tongqian',name:'🪙 铜钱行情',enabled:true},{id:'market_tongyuan',name:'🪙 铜元行情',enabled:true},{id:'market_zhibi',name:'💴 纸币行情',enabled:true}]},content:{title:'收藏交流 · 鉴赏参考',subtitle:'发布到哪个版块，就自动归类到对应栏目；点击资料可查看完整详情。',items:[{id:'yinyuan_jizhibi',name:'🥈 银元 · 机制币',enabled:true},{id:'tongqian',name:'🪙 铜钱鉴赏',enabled:true},{id:'tongyuan',name:'🪙 铜元鉴赏',enabled:true},{id:'zhibi',name:'💴 纸币鉴赏',enabled:true},{id:'appreciation',name:'🔎 鉴赏参考',enabled:true},{id:'knowledge',name:'📚 收藏知识',enabled:true},{id:'history',name:'📖 钱币历史',enabled:true},{id:'culture',name:'🏛 收藏文化',enabled:true},{id:'experience',name:'💡 收藏经验',enabled:true}]},fujian:{title:'福建钱币',subtitle:'集中整理福建地区钱币资料、研究内容与收藏信息。',items:[{id:'fujian_tongqian',name:'福建铜钱',enabled:true},{id:'fujian_tongyuan',name:'福建铜币',enabled:true},{id:'fujian_yinyuan',name:'福建银元',enabled:true},{id:'fujian_zhibi',name:'福建纸币',enabled:true}]}},consult:{enabled:true,title:'免费鉴定 · 免费估价 · 立即咨询',text:'📍 福建省内周边｜厦门｜泉州｜漳州｜福州｜成都\n🚗 当天可预约上门面对面分析交流'}}}function fill(){if(!cfg)cfg=defaults();$('siteName').value=cfg.siteName||'';$('topNotice').value=cfg.topNotice||'';$('heroTitle').value=cfg.heroTitle||'';$('heroText').value=cfg.heroText||'';$('phone').value=cfg.phone||'';const t=cfg.theme||{};for(const k of ['primary','accent','titleColor','bodyColor','titleFont','bodyFont','titleWeight','cardRadius'])if($(k))$(k).value=t[k]??defaults().theme[k];renderNav();renderGroups();renderNewGroup();preview()}function preview(){const t=cfg.theme||{};$('pvTitle').style.color=$('titleColor').value;$('pvTitle').style.fontFamily=$('titleFont').value;$('pvTitle').style.fontWeight=$('titleWeight').value;$('pvSub').style.color=$('bodyColor').value;$('pvSub').style.fontFamily=$('bodyFont').value;$('themePreview').style.borderRadius=$('cardRadius').value+'px'}for(const id of ['primary','accent','titleColor','bodyColor','titleFont','bodyFont','titleWeight','cardRadius'])$(id).addEventListener('input',preview);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function renderNav(){let h='';(cfg.nav||[]).forEach((n,i)=>h+='<div class="item"><div class="subitem"><input value="'+esc(n.name)+'" onchange="cfg.nav['+i+'].name=this.value"><select onchange="cfg.nav['+i+'].enabled=this.value===\'true\';renderNav()"><option value="true" '+(n.enabled?'selected':'')+'>显示</option><option value="false" '+(!n.enabled?'selected':'')+'>隐藏</option></select><div class="actions"><button class="btn gray" onclick="moveNav('+i+',-1)">↑</button><button class="btn gray" onclick="moveNav('+i+',1)">↓</button><button class="btn danger" onclick="cfg.nav.splice('+i+',1);renderNav()">删除</button></div></div></div>');$('navList').innerHTML=h||'<div class="hint">暂无导航</div>'}function moveNav(i,d){const a=cfg.nav,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];renderNav()}function renderGroups(){let h='';for(const gid in cfg.groups){const g=cfg.groups[gid];h+='<div class="item"><div class="row"><input style="flex:1;font-weight:800" value="'+esc(g.title)+'" onchange="cfg.groups[\''+gid+'\'].title=this.value"><button class="btn gray" onclick="moveGroup(\''+gid+'\',-1)">↑</button><button class="btn gray" onclick="moveGroup(\''+gid+'\',1)">↓</button><button class="btn danger" onclick="deleteGroup(\''+gid+'\')">删除版块</button></div><input style="margin-top:8px" value="'+esc(g.subtitle||'')+'" onchange="cfg.groups[\''+gid+'\'].subtitle=this.value">';(g.items||[]).forEach((x,i)=>{h+='<div class="item"><div class="subitem"><input value="'+esc(x.name)+'" onchange="cfg.groups[\''+gid+'\'].items['+i+'].name=this.value"><select onchange="cfg.groups[\''+gid+'\'].items['+i+'].enabled=this.value===\'true\';renderGroups()"><option value="true" '+(x.enabled?'selected':'')+'>显示</option><option value="false" '+(!x.enabled?'selected':'')+'>隐藏</option></select><div class="actions"><button class="btn gray" onclick="moveItem(\''+gid+'\','+i+',-1)">↑</button><button class="btn gray" onclick="moveItem(\''+gid+'\','+i+',1)">↓</button><button class="btn danger" onclick="deleteItemIn(\''+gid+'\','+i+')">删除</button></div></div></div>'});h+='</div>'}$('groups').innerHTML=h||'<div class="hint">暂无版块</div>'}function orderKeys(){return Object.keys(cfg.groups)}function moveGroup(id,d){const keys=orderKeys(),i=keys.indexOf(id),j=i+d;if(j<0||j>=keys.length)return;const out={};keys.forEach((k,n)=>out[keys[j===n?i:n===i?j:n]]=cfg.groups[k]);cfg.groups=out;renderGroups();renderNewGroup()}function moveItem(g,i,d){const a=cfg.groups[g].items,j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];renderGroups()}function renderNewGroup(){$('newGroup').innerHTML=Object.keys(cfg.groups).map(k=>'<option value="'+k+'">'+esc(cfg.groups[k].title)+'</option>').join('')}function addGroup(){let id=prompt('一级版块 ID（英文）');if(!id)return;if(cfg.groups[id])return alert('ID 已存在');let name=prompt('一级版块名称');if(!name)return;cfg.groups[id]={title:name,subtitle:'',items:[]};cfg.nav.push({id,name,enabled:true});renderGroups();renderNav();renderNewGroup()}function deleteGroup(id){if(!confirm('确定删除这个版块？已有资料不会删除，只会停止显示分类。'))return;delete cfg.groups[id];cfg.nav=cfg.nav.filter(x=>x.id!==id);renderGroups();renderNav();renderNewGroup()}function deleteItemIn(g,i){if(!confirm('确定删除这个分类？已有资料不会被删除。'))return;cfg.groups[g].items.splice(i,1);renderGroups()}function addItem(){const g=$('newGroup').value,id0=$('newId').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'_'),name=$('newName').value.trim(),type=$('newType').value;if(!id0||!name)return alert('请填写分类 ID 和名称');if(Object.values(cfg.groups).some(x=>x.items.some(i=>i.id===id0)))return alert('这个 ID 已存在');let id=id0;if(type==='market'&&!id.startsWith('market_'))id='market_'+id;if(type==='fujian'&&!id.startsWith('fujian_'))id='fujian_'+id;cfg.groups[g].items.push({id,name,enabled:true});$('newId').value='';$('newName').value='';renderGroups()}function collect(){cfg.siteName=$('siteName').value.trim();cfg.topNotice=$('topNotice').value;cfg.heroTitle=$('heroTitle').value.trim();cfg.heroText=$('heroText').value.trim();cfg.phone=$('phone').value.trim();cfg.theme={primary:$('primary').value,accent:$('accent').value,titleColor:$('titleColor').value,bodyColor:$('bodyColor').value,titleFont:$('titleFont').value,bodyFont:$('bodyFont').value,titleWeight:Number($('titleWeight').value),cardRadius:Number($('cardRadius').value)};return cfg}async function loadConfig(){try{cfgFile=await getFile('data/site-config.json');cfg=JSON.parse(cfgFile.text);fill();$('status').textContent='✅ 已读取当前网站设置'}catch(e){cfg=defaults();fill();$('status').textContent='⚠️ 读取失败，已载入默认设置：'+e.message}}async function publish(){try{need();collect();if(!cfg.siteName)throw Error('网站名称不能为空');const f=cfgFile||await getFile('data/site-config.json');await putFile('data/site-config.json',JSON.stringify(cfg,null,2),f.sha,'洪盛集藏：网站设计与视觉配置更新');cfgFile=await getFile('data/site-config.json');$('pub').textContent='✅ 已保存：网站、栏目和视觉配置已同步。'}catch(e){$('pub').textContent='❌ 保存失败：'+e.message}}const old=getCfg();for(const k of ['owner','repo','branch','token'])if(old[k])$(k).value=old[k];loadConfig();</script></body></html>
