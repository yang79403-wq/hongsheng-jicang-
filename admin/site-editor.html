<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏网站修改设计工具</title><style>:root{--r:#741912;--g:#b88a3b;--bg:#f7f1e8;--card:#fffdf8;--line:#e2d7c8;--ink:#2c241f}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.head{background:linear-gradient(135deg,#741912,#2d0d09);color:#fff;padding:24px 0}.wrap{width:min(1100px,94vw);margin:auto}.head h1{margin:0;color:#f4d98e}.head p{margin:6px 0 0;color:#eadfd1}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 6px 20px #0000000b}h2,h3{margin-top:0;color:#5a2119}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{display:block;font-weight:800;margin:0 0 5px}input,textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff}textarea{min-height:90px}.btn{border:0;border-radius:9px;padding:10px 14px;color:#fff;font-weight:800;cursor:pointer}.red{background:var(--r)}.gold{background:var(--g);color:#30130f}.gray{background:#6b625a}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.item{border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0;background:#fff}.item.disabled{opacity:.5}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#f2e8d7;font-size:12px}.hint{font-size:13px;color:#766c63}.status{margin-top:10px;padding:10px;border-radius:9px;background:#f4eee5}.subitem{display:grid;grid-template-columns:28px 1fr 90px auto;gap:8px;align-items:center}.drag{cursor:grab;font-size:20px}.danger{color:#8c1d15;background:#fff1ee;border:1px solid #ecc8c2}@media(max-width:700px){.form{grid-template-columns:1fr}.wide{grid-column:auto}.subitem{grid-template-columns:28px 1fr}.subitem .actions{grid-column:2}.actions{display:flex;gap:6px}}</style></head><body><header class="head"><div class="wrap"><h1>洪盛集藏网站修改设计工具</h1><p>不用改代码，直接修改网站版块、名称、显示状态和首页文字。</p></div></header><main class="wrap"><section class="card"><h2>⚙️ 连接设置</h2><div class="form"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="Contents 读写权限"></div></div><div class="row" style="margin-top:10px"><button class="btn red" onclick="saveCfg()">保存设置</button><button class="btn gold" onclick="loadConfig()">读取网站设置</button></div><div id="status" class="status">Token 只保存在本机浏览器。</div></section><section class="card"><h2>🎨 首页基础设计</h2><div class="form"><div><label>网站名称</label><input id="siteName"></div><div><label>顶部提示</label><input id="topNotice"></div><div><label>首页主标题</label><input id="heroTitle"></div><div><label>联系电话 / 微信</label><input id="phone"></div><div class="wide"><label>首页介绍</label><textarea id="heroText"></textarea></div></div></section><section class="card"><h2>🧭 首页导航</h2><div id="navList"></div></section><section class="card"><h2>🗂 网站版块管理</h2><div class="hint">可以新增版块、修改名称、隐藏版块、删除版块。隐藏比删除更安全，删除只删除网站分类，不会自动删除已有资料。</div><div id="groups"></div><button class="btn gold" style="margin-top:12px" onclick="addGroup()">＋ 新增一级版块</button></section><section class="card"><h2>➕ 新增资料版块</h2><div class="form"><div><label>所属一级版块</label><select id="newGroup"></select></div><div><label>版块 ID（英文）</label><input id="newId" placeholder="例如: commemorative"></div><div><label>显示名称</label><input id="newName" placeholder="例如：纪念币"></div><div><label>资料类型</label><select id="newType"><option value="content">普通资料 / 鉴赏</option><option value="market">价格行情</option><option value="fujian">福建钱币</option></select></div></div><button class="btn red" style="margin-top:10px" onclick="addItem()">＋ 添加版块</button></section><section class="card"><h2>💾 保存网站设计</h2><p class="hint">保存后网站会自动读取新的版块配置。已有文章、图片和价格资料不会被删除。</p><button class="btn red" onclick="publish()">🚀 保存并发布到网站</button><div id="pub" class="status">等待操作</div></section></main><script>const $=id=>document.getElementById(id);let cfg=null;function saveCfg(){localStorage.setItem('hsjc_editor_cfg',JSON.stringify({owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()}));$('status').textContent='✅ 设置已保存'}function getCfg(){return JSON.parse(localStorage.getItem('hsjc_editor_cfg')||'{}')}function need(){if(!$('token').value.trim())throw Error('请先填写 GitHub Token')}function base(){return '/repos/'+$('owner').value.trim()+'/'+$('repo').value.trim()}async function api(path,opt={}){need();const r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json','Authorization':'Bearer '+$('token').value.trim(),'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});const t=await r.text();let d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error((d.message||'GitHub 请求失败')+'（'+r.status+'）');return d}function enc(s){let b=new TextEncoder().encode(s),x='';for(let i=0;i<b.length;i+=32768)x+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(x)}async function getFile(path){const r=await api(base()+'/contents/'+path+'?ref='+encodeURIComponent($('branch').value.trim()||'main'));const raw=atob((r.content||'').replace(/\s/g,''));return{sha:r.sha,text:new TextDecoder().decode(Uint8Array.from(raw,c=>c.charCodeAt(0)))}}async function putFile(path,text,sha,msg){const body={message:msg,content:enc(text),branch:$('branch').value.trim()||'main',sha};return api(base()+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}function defaults(){return {siteName:'洪盛集藏',topNotice:'洪盛集藏 · 公益钱币收藏资料平台　|　学习 · 交流 · 研究　|　不收取任何费用',heroTitle:'钱币收藏资料与交流平台',heroText:'收藏交流 · 鉴赏参考 · 品相分析 · 市场行情 · 钱币文化研究。所有资料仅供学习、交流、研究参考。',phone:'13799875350',nav:[{id:'market',name:'最新价格行情',enabled:true},{id:'services',name:'收藏交流 · 鉴赏参考',enabled:true},{id:'fujian',name:'福建钱币',enabled:true},{id:'consult',name:'免费咨询',enabled:true}],groups:{market:{title:'最新价格行情',subtitle:'银元 · 机制币合并展示；有资料的栏目自动显示。',items:[{id:'market_yinyuan_jizhibi',name:'🥈 银元 · 机制币行情',enabled:true},{id:'market_tongqian',name:'🪙 铜钱行情',enabled:true},{id:'market_tongyuan',name:'🪙 铜元行情',enabled:true},{id:'market_zhibi',name:'💴 纸币行情',enabled:true}]},content:{title:'收藏交流 · 鉴赏参考',subtitle:'发布后自动进入对应资料栏目，点击卡片可查看完整详情。',items:[{id:'yinyuan_jizhibi',name:'🥈 银元 · 机制币',enabled:true},{id:'tongqian',name:'🪙 铜钱鉴赏',enabled:true},{id:'tongyuan',name:'🪙 铜元鉴赏',enabled:true},{id:'zhibi',name:'💴 纸币鉴赏',enabled:true},{id:'appreciation',name:'🔎 鉴赏参考',enabled:true},{id:'knowledge',name:'📚 收藏知识',enabled:true},{id:'history',name:'📖 钱币历史',enabled:true},{id:'culture',name:'🏛 收藏文化',enabled:true},{id:'experience',name:'💡 收藏经验',enabled:true}]},fujian:{title:'福建钱币',subtitle:'集中整理福建地区钱币资料、研究内容与收藏信息。',items:[{id:'fujian_tongqian',name:'福建铜钱',enabled:true},{id:'fujian_tongyuan',name:'福建铜币',enabled:true},{id:'fujian_yinyuan',name:'福建银元',enabled:true},{id:'fujian_zhibi',name:'福建纸币',enabled:true}]}},consult:{enabled:true,title:'免费鉴定 · 免费估价 · 立即咨询',text:'📍 福建省内周边｜厦门｜泉州｜漳州｜福州｜成都\n🚗 当天可预约上门面对面分析交流'}}}function fill(){if(!cfg)cfg=defaults();$('siteName').value=cfg.siteName||'';$('topNotice').value=cfg.topNotice||'';$('heroTitle').value=cfg.heroTitle||'';$('heroText').value=cfg.heroText||'';$('phone').value=cfg.phone||'';renderNav();renderGroups();renderNewGroup()}function renderNav(){let h='';(cfg.nav||[]).forEach((n,i)=>h+='<div class="item '+(!n.enabled?'disabled':'')+'"><div class="subitem"><span class="drag">☰</span><input value="'+esc(n.name)+'" onchange="cfg.nav['+i+'].name=this.value"><select onchange="cfg.nav['+i+'].enabled=this.value===\'true\';renderNav()"><option value="true" '+(n.enabled?'selected':'')+'>显示</option><option value="false" '+(!n.enabled?'selected':'')+'>隐藏</option></select><button class="btn danger" onclick="cfg.nav.splice('+i+',1);renderNav()">删除</button></div></div>');$('navList').innerHTML=h||'<div class="hint">暂无导航</div>'}function renderGroups(){let h='';for(const gid in cfg.groups){const g=cfg.groups[gid];h+='<div class="item"><div class="row"><input style="flex:1;font-weight:800" value="'+esc(g.title)+'" onchange="cfg.groups[\''+gid+'\'].title=this.value"><button class="btn danger" onclick="deleteGroup(\''+gid+'\')">删除一级版块</button></div><input style="margin-top:8px" value="'+esc(g.subtitle||'')+'" onchange="cfg.groups[\''+gid+'\'].subtitle=this.value"><div style="margin-top:8px">';(g.items||[]).forEach((x,i)=>{h+='<div class="item '+(!x.enabled?'disabled':'')+'"><div class="subitem"><span class="drag">⋮⋮</span><input value="'+esc(x.name)+'" onchange="cfg.groups[\''+gid+'\'].items['+i+'].name=this.value"><select onchange="cfg.groups[\''+gid+'\'].items['+i+'].enabled=this.value===\'true\';renderGroups()"><option value="true" '+(x.enabled?'selected':'')+'>显示</option><option value="false" '+(!x.enabled?'selected':'')+'>隐藏</option></select><button class="btn danger" onclick="deleteItemIn(\''+gid+'\','+i+')">删除</button></div></div>'});h+='</div></div>'}$('groups').innerHTML=h||'<div class="hint">暂无一级版块</div>'}function renderNewGroup(){$('newGroup').innerHTML=Object.keys(cfg.groups).map(k=>'<option value="'+k+'">'+esc(cfg.groups[k].title)+'</option>').join('')}function addGroup(){let id=prompt('请输入一级版块 ID（英文，例如 special）');if(!id)return;if(cfg.groups[id])return alert('这个 ID 已存在');let name=prompt('请输入一级版块名称');if(!name)return;cfg.groups[id]={title:name,subtitle:'',items:[]};cfg.nav.push({id,name,enabled:true});renderGroups();renderNav();renderNewGroup()}function deleteGroup(id){if(!confirm('确定删除这个一级版块？已有资料不会删除，但网站将不再显示这个栏目。'))return;delete cfg.groups[id];cfg.nav=cfg.nav.filter(x=>x.id!==id);renderGroups();renderNav();renderNewGroup()}function deleteItemIn(g,i){if(!confirm('确定删除这个网站分类？已有资料不会被删除。'))return;cfg.groups[g].items.splice(i,1);renderGroups()}function addItem(){const g=$('newGroup').value,id=$('newId').value.trim().toLowerCase().replace(/[^a-z0-9_]/g,'_'),name=$('newName').value.trim(),type=$('newType').value;if(!id||!name)return alert('请填写 ID 和名称');if(Object.values(cfg.groups).some(x=>x.items.some(i=>i.id===id)))return alert('这个 ID 已存在');let actual=id;if(type==='market'&&!actual.startsWith('market_'))actual='market_'+actual;if(type==='fujian'&&!actual.startsWith('fujian_'))actual='fujian_'+actual;cfg.groups[g].items.push({id:actual,name,enabled:true});$('newId').value='';$('newName').value='';renderGroups()}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function collect(){cfg.siteName=$('siteName').value.trim();cfg.topNotice=$('topNotice').value;cfg.heroTitle=$('heroTitle').value.trim();cfg.heroText=$('heroText').value.trim();cfg.phone=$('phone').value.trim();return cfg}async function loadConfig(){try{const f=await getFile('data/site-config.json');cfg=JSON.parse(f.text);window.cfgFile=f;fill();$('status').textContent='✅ 已读取当前网站设置'}catch(e){cfg=defaults();fill();$('status').textContent='⚠️ 未读取到配置，已载入默认设置：'+e.message}}async function publish(){try{need();collect();if(!cfg.siteName)throw Error('网站名称不能为空');const f=window.cfgFile||await getFile('data/site-config.json');await putFile('data/site-config.json',JSON.stringify(cfg,null,2),f.sha,'洪盛集藏：网站设计配置更新');$('pub').textContent='✅ 网站设计已保存，GitHub Pages 更新后生效。';window.cfgFile=await getFile('data/site-config.json')}catch(e){$('pub').textContent='❌ 保存失败：'+e.message}}const old=getCfg();for(const k of ['owner','repo','branch','token'])if(old[k])$(k).value=old[k];loadConfig();</script></body></html>
