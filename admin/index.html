<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏上传中心</title><style>body{margin:0;background:#f7f1e8;color:#2d241e;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1080px;margin:auto;padding:16px}.head{background:#7b1e16;color:#fff;padding:18px}.card{background:#fff;border-radius:14px;padding:16px;margin:14px 0;box-shadow:0 3px 14px #0001}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cat,button{font:inherit;border:0;border-radius:9px;padding:10px;cursor:pointer}.cat{background:#faf7f2;border:1px solid #e3d8cc;text-align:left}.cat.on{background:#7b1e16;color:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;padding:10px;border:1px solid #e3d8cc;border-radius:9px;box-sizing:border-box;font:inherit}textarea{min-height:150px}.red{background:#7b1e16;color:#fff}.gold{background:#b88a3b;color:#fff}.gray{background:#6d625a;color:#fff}.status{padding:10px;background:#f5eee5;border-radius:9px;margin-top:9px}.hide{display:none}.items{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border:1px solid #e3d8cc;border-radius:10px;padding:10px}.item img{max-width:100%;height:160px;object-fit:cover;border-radius:8px}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}@media(max-width:650px){.grid,.items,.form{grid-template-columns:1fr 1fr}}@media(max-width:430px){.grid,.items,.form{grid-template-columns:1fr}}</style></head><body><div class="head"><div class="wrap"><h1>洪盛集藏上传中心</h1><div>选择网站版块 → 编辑 → 发布 → 修改 / 上下架 / 删除</div></div></div><main class="wrap"><section class="card"><h2>⚙️ 连接设置</h2><div class="form"><div><label>GitHub 用户名</label><input id="o" value="yang79403-wq"></div><div><label>仓库</label><input id="r" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="b" value="main"></div><div><label>GitHub Token</label><input id="t" type="password" placeholder="Contents: Read and write"></div></div><button class="red" id="save">保存设置</button><div id="conn" class="status">未连接</div></section><section class="card"><h2 id="et">📤 发布内容</h2><div id="groups"></div><div class="status">当前发布版块：<b id="sel">未选择</b></div><div class="form" style="margin-top:10px"><div class="wide"><label>网站发布版块</label><select id="cat"></select></div><div><label>日期</label><input id="date" type="date"></div><div><label>内容类型</label><select id="kind"><option>文章 / 资料</option><option>鉴赏</option><option>行情价格</option><option>历史研究</option><option>公告 / 说明</option></select></div><div class="wide"><label>标题</label><input id="title"></div><div id="pw" class="wide hide"><label>参考价格（可选）</label><input id="price"></div><div class="wide"><label>摘要（可选）</label><input id="note"></div><div class="wide"><label>正文</label><textarea id="content"></textarea></div><div class="wide"><label>图片（可选）</label><input id="files" type="file" accept="image/*" multiple></div></div><div class="actions"><button class="gold" id="pub">📤 发布到网站</button><button class="gray hide" id="cancel">取消修改</button></div><div id="st" class="status">等待操作</div></section><section class="card"><h2>📋 全部资料</h2><div class="form"><input id="q" placeholder="搜索标题、正文、价格"><select id="filter"><option value="all">全部版块</option></select><input id="fd" type="date"></div><button class="red" id="refresh" style="margin-top:9px">🔄 刷新资料</button><div id="manage" class="status">尚未读取</div><div id="items" class="items"></div></section></main><script>const $=x=>document.getElementById(x),today=new Date().toISOString().slice(0,10);$('date').value=today;const G={'收藏交流 · 鉴赏参考':[['yinyuan','🥈 银元'],['jizhibi','🪙 机制币'],['tongqian','🪙 铜钱'],['tongyuan','🪙 铜元'],['zhibi','💴 纸币'],['appreciation','🔎 鉴赏参考'],['knowledge','📚 收藏知识'],['history','📖 钱币历史'],['culture','🏛 收藏文化'],['experience','💡 收藏经验']],'最新价格行情':[['market_yinyuan','🥈 银元行情'],['market_jizhibi','🪙 机制币行情'],['market_tongqian','🪙 铜钱行情'],['market_tongyuan','🪙 铜元行情'],['market_zhibi','💴 纸币行情']],'福建钱币':[['fujian','🏛 福建钱币'],['fujian_tongqian','福建铜钱'],['fujian_tongyuan','福建铜元'],['fujian_yinyuan','福建银元'],['fujian_zhibi','福建纸币']],'其他内容':[['consult','☎️ 免费鉴定 / 免费估价'],['contact','💬 咨询交流']]};const C={},M=new Set();let gh='';for(const g in G){gh+='<h3>'+g+'</h3><div class="grid">';for(const [k,n] of G[g]){C[k]=n;if(k.startsWith('market_'))M.add(k);gh+='<button class="cat" data-c="'+k+'">'+n+'</button>'}gh+='</div>'}$('groups').innerHTML=gh;const cats=Object.keys(C);cats.forEach(k=>{$('cat').innerHTML+='<option value="'+k+'">'+C[k]+'</option>';$('filter').innerHTML+='<option value="'+k+'">'+C[k]+'</option>'});function sel(k){$('cat').value=k;$('sel').textContent=C[k];document.querySelectorAll('.cat').forEach(x=>x.classList.toggle('on',x.dataset.c===k));$('pw').classList.toggle('hide',!M.has(k))}document.querySelectorAll('.cat').forEach(x=>x.onclick=()=>sel(x.dataset.c));$('cat').onchange=e=>sel(e.target.value);sel('yinyuan');let cfg=JSON.parse(localStorage.getItem('hsjc')||'{}');['o','r','b','t'].forEach(k=>{if(cfg[k])$(k).value=cfg[k]});$('save').onclick=()=>{cfg={o:$('o').value.trim(),r:$('r').value.trim(),b:$('b').value.trim()||'main',t:$('t').value.trim()};localStorage.setItem('hsjc',JSON.stringify(cfg));$('conn').textContent='设置已保存'};function need(){if(!$('t').value.trim())throw Error('请填写 GitHub Token')}async function api(path,opt={}){need();const z=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json','Authorization':'Bearer '+$('t').value.trim(),'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});const tx=await z.text();let d={};try{d=JSON.parse(tx)}catch{}if(!z.ok)throw Error((d.message||'请求失败')+'（'+z.status+'）');return d}function enc(s){const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=32768)x+=String.fromCharCode(...b.subarray(i,i+32768));return btoa(x)}function dec(s){const x=atob(s.replace(/\n/g,''));return new TextDecoder().decode(Uint8Array.from(x,c=>c.charCodeAt(0)))}async function gf(p){try{return await api('/repos/'+$('o').value+'/'+$('r').value+'/contents/'+p+'?ref='+encodeURIComponent($('b').value))}catch(e){if(String(e.message).includes('Not Found'))return null;throw e}}async function put(p,text,msg,sha){const x={message:msg,content:enc(text),branch:$('b').value};if(sha)x.sha=sha;return api('/repos/'+$('o').value+'/'+$('r').value+'/contents/'+p,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)})}async function getD(c){const p='data/market/'+c+'.json',f=await gf(p);return{p,sha:f&&f.sha,a:f?JSON.parse(dec(f.content)):[]}}async function saveD(d,msg){await put(d.p,JSON.stringify(d.a,null,2),msg,d.sha)}let all=[],edit=null;function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}async function load(){try{all=[];for(const c of cats){const d=await getD(c);d.a.forEach((r,i)=>all.push({c,i,r}))}render();$('manage').textContent='已读取 '+all.length+' 条资料'}catch(e){$('manage').textContent='读取失败：'+e.message}}function render(){const q=$('q').value.toLowerCase(),f=$('filter').value,fd=$('fd').value;const a=all.filter(x=>(f==='all'||x.c===f)&&(!fd||x.r.date===fd)&&(!q||[x.r.title,x.r.content,x.r.price,x.r.note].join(' ').toLowerCase().includes(q)));$('items').innerHTML=a.map(x=>{const i=all.indexOf(x),r=x.r;return '<article class="item"><b>'+esc(C[x.c])+' · '+esc(r.title)+'</b>'+(r.images&&r.images[0]?'<img src="'+esc(r.images[0])+'">':'')+(r.price?'<p><b>参考价格：</b>'+esc(r.price)+'</p>':'')+'<p>'+esc(r.content||r.note)+'</p><small>'+esc(r.date)+' · '+(r.status==='hidden'?'已下架':'已上架')+'</small><div class="actions"><button class="gold" onclick="editIt('+i+')">✏️ 修改</button><button class="gray" onclick="toggleIt('+i+')">👁 '+(r.status==='hidden'?'上架':'下架')+'</button><button class="red" onclick="delIt('+i+')">🗑 删除</button></div></article>'}).join('')||'<div class="status">暂无资料</div>'}window.editIt=i=>{const x=all[i];edit=x;sel(x.c);$('date').value=x.r.date||today;$('kind').value=x.r.kind||'文章 / 资料';$('title').value=x.r.title||'';$('price').value=x.r.price||'';$('note').value=x.r.note||'';$('content').value=x.r.content||'';$('et').textContent='✏️ 修改资料';$('pub').textContent='💾 保存修改';$('cancel').classList.remove('hide');scrollTo({top:0,behavior:'smooth'})};$('cancel').onclick=()=>{edit=null;$('et').textContent='📤 发布内容';$('pub').textContent='📤 发布到网站';$('cancel').classList.add('hide');$('title').value='';$('price').value='';$('note').value='';$('content').value='';$('date').value=today};$('pub').onclick=async()=>{try{need();const c=$('cat').value;if(!$('title').value.trim())throw Error('请填写标题');const d=await getD(c),r={id:edit?edit.r.id:Date.now().toString(36),title:$('title').value.trim(),content:$('content').value.trim(),note:$('note').value.trim(),price:M.has(c)?$('price').value.trim():'',kind:$('kind').value,date:$('date').value||today,images:edit&&edit.r.images?edit.r.images:[],status:edit?edit.r.status:'published'};if(edit&&edit.c===c)d.a[edit.i]=r;else{if(edit){const old=await getD(edit.c);old.a.splice(edit.i,1);await saveD(old,'洪盛集藏：移动资料版块')}d.a.unshift(r)}await saveD(d,edit?'洪盛集藏：修改资料':'洪盛集藏：发布资料');$('st').textContent='✅ 操作成功：'+C[c];$('cancel').click();load()}catch(e){$('st').textContent='❌ 操作失败：'+e.message}};window.toggleIt=async i=>{try{const x=all[i],d=await getD(x.c);d.a[x.i].status=d.a[x.i].status==='hidden'?'published':'hidden';await saveD(d,'洪盛集藏：上下架');load()}catch(e){alert(e.message)}};window.delIt=async i=>{if(!confirm('确定删除？'))return;try{const x=all[i],d=await getD(x.c);d.a.splice(x.i,1);await saveD(d,'洪盛集藏：删除资料');load()}catch(e){alert(e.message)}};$('refresh').onclick=load;$('q').oninput=render;$('filter').onchange=render;$('fd').onchange=render;load();</script></body></html>
