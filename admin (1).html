<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏上传中心</title><style>
body{margin:0;background:#f6f1e8;color:#2b2119;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:760px;margin:auto;padding:20px}header{background:#7b1e16;color:white;padding:25px}section{background:white;margin:18px 0;padding:20px;border-radius:14px;box-shadow:0 4px 18px #0001}label{display:block;font-weight:700;margin:12px 0 6px}input,select,textarea,button{width:100%;padding:12px;border-radius:9px;border:1px solid #d5c9bd;font-size:16px;box-sizing:border-box}button{margin-top:14px;background:#8b2117;color:white;border:0;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.status{margin-top:12px;padding:12px;background:#f2ece5;border-radius:9px;white-space:pre-wrap}.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview img{width:100px;height:100px;object-fit:cover;border-radius:8px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><main><h1>洪盛集藏上传中心</h1><div>图片、价格、资料统一上传</div></main></header><main>
<section><h2>① 一次设置</h2><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"><label>仓库</label><input id="repo" value="yang79403-wq.github.io"><label>分支</label><input id="branch" value="main"><label>GitHub Token</label><input id="token" type="password" placeholder="首次使用时填写"><button id="save">保存本机设置</button><div class="status" id="conn">尚未设置</div></section>
<section><h2>② 上传行情</h2><div class="grid"><div><label>分类</label><select id="cat"><option value="yinyuan">银元</option><option value="jizhibi">机制币</option><option value="tongqian">铜钱</option><option value="tongyuan">铜元</option><option value="zhibi">纸币</option><option value="fujian">福建钱币</option></select></div><div><label>日期</label><input id="date" type="date"></div></div><label>标题</label><input id="title" placeholder="例如：袁大头三年行情"><label>价格</label><input id="price" placeholder="例如：980-1200元"><label>说明</label><textarea id="note" placeholder="品种、版别、品相、行情说明"></textarea><label>图片</label><input id="files" type="file" accept="image/*" multiple><div class="preview" id="preview"></div><button id="publish">发布到洪盛集藏网站</button><div class="status" id="status">等待上传</div></section>
<section><h2>以后使用</h2><p>打开本页面 → 选分类 → 填价格 → 选择图片 → 点击“发布”。以后不再需要 GitHub Desktop。</p></section>
</main><script>
const $=x=>document.getElementById(x),today=new Date().toISOString().slice(0,10);$("date").value=today;
let s=JSON.parse(localStorage.getItem("hsjc")||"{}");for(const k of ["owner","repo","branch","token"])if(s[k])$(k).value=s[k];
$("save").onclick=()=>{s={owner:$("owner").value,repo:$("repo").value,branch:$("branch").value,token:$("token").value};localStorage.setItem("hsjc",JSON.stringify(s));$("conn").textContent="已保存到本机浏览器";};
$("files").onchange=()=>{$("preview").innerHTML="";[...$("files").files].forEach(f=>{let i=document.createElement("img");i.src=URL.createObjectURL(f);$("preview").appendChild(i)})};
function b64(f){return new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result.split(",")[1]);r.onerror=no;r.readAsDataURL(f)})}
async function api(path,opt={}){let r=await fetch("https://api.github.com"+path,{...opt,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+$("token").value.trim(),"X-GitHub-Api-Version":"2022-11-28",...(opt.headers||{})}});let t=await r.text(),d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error(d.message||r.status);return d}
async function sha(path){try{return(await api(`/repos/${$("owner").value}/${$("repo").value}/contents/${path}?ref=${$("branch").value}`)).sha}catch(e){if(String(e.message).includes("Not Found"))return null;throw e}}
async function put(path,content,msg){let x={message:msg,content,branch:$("branch").value},q=await sha(path);if(q)x.sha=q;return api(`/repos/${$("owner").value}/${$("repo").value}/contents/${path}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(x)})}
$("publish").onclick=async()=>{try{if(!$("token").value)throw Error("请先填写 GitHub Token");if(!$("title").value)throw Error("请填写标题");if(!$("files").files.length)throw Error("请选择图片");$("status").textContent="正在上传……";let cat=$("cat").value,date=$("date").value||today,imgs=[];for(let i=0;i<$("files").files.length;i++){let f=$("files").files[i],ext=(f.name.split(".").pop()||"jpg").replace(/[^a-zA-Z0-9]/g,"");let path=`static/uploads/${cat}/${date}-${Date.now()}-${i}.${ext}`;await put(path,await b64(f),`上传${cat}图片`);imgs.push("/"+path)}let dp=`data/market/${cat}.json`,old=await sha(dp),arr=[];if(old){let d=await api(`/repos/${$("owner").value}/${$("repo").value}/contents/${dp}?ref=${$("branch").value}`);arr=JSON.parse(decodeURIComponent(escape(atob(d.content.replace(/\n/g,"")))))}arr.unshift({title:$("title").value,price:$("price").value,note:$("note").value,date,images:imgs});await put(dp,btoa(unescape(encodeURIComponent(JSON.stringify(arr,null,2)))),"新增行情资料");$("status").textContent="发布成功！\n图片已上传，价格数据已保存。"}catch(e){$("status").textContent="发布失败：\n"+e.message}}
</script></body></html>
