<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏上传中心 V2.0</title><style>body{margin:0;background:#f6f1e8;color:#2b2119;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1050px;margin:auto;padding:20px}header{background:#7b1e16;color:#fff;padding:25px 0}.wrap{max-width:1050px;margin:auto;padding:0 20px}section{background:#fff;margin:18px 0;padding:20px;border-radius:14px;box-shadow:0 4px 18px #0001}label{display:block;font-weight:700;margin:12px 0 6px}input,select,textarea,button{width:100%;padding:11px;border-radius:9px;border:1px solid #d5c9bd;font-size:15px;box-sizing:border-box}button{margin-top:10px;background:#8b2117;color:#fff;border:0;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.status{margin-top:12px;padding:12px;background:#f2ece5;border-radius:9px;white-space:pre-wrap}.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview img,.item img{width:110px;height:110px;object-fit:cover;border-radius:8px}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.item{border:1px solid #e1d8cf;border-radius:12px;padding:14px;background:#fff}.item-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eee;font-size:12px}.on{background:#e4f4e6;color:#246b2c}.off{background:#eee;color:#777}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.actions button{margin:0;font-size:13px}.danger{background:#a52a1e}.secondary{background:#6d625a}.notice{padding:12px;background:#fff7e8;border-radius:9px;margin-top:12px}.hidden{display:none!important}@media(max-width:700px){.grid,.tools,.items{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}.wrap,main{padding-left:12px;padding-right:12px}}</style></head><body><header><div class="wrap"><h1>洪盛集藏上传中心</h1><div>图片、价格、资料统一管理 · V2.0</div></div></header><main>
<section><h2>⚙️ 一次设置</h2><div class="grid"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="首次使用时填写"></div></div><button id="save">保存本机设置</button><div class="status" id="conn">尚未设置</div></section>
<section><h2>📤 新增资料</h2><div class="grid"><div><label>分类</label><select id="cat"><option value="yinyuan">银元</option><option value="jizhibi">机制币</option><option value="tongqian">铜钱</option><option value="tongyuan">铜元</option><option value="zhibi">纸币</option><option value="fujian">福建钱币</option></select></div><div><label>日期</label><input id="date" type="date"></div></div><label>标题</label><input id="title" placeholder="例如：袁大头三年行情"><label>价格</label><input id="price" placeholder="例如：980-1200元"><label>说明</label><textarea id="note" placeholder="品种、版别、品相、行情说明"></textarea><label>图片</label><input id="files" type="file" accept="image/*" multiple><div class="preview" id="preview"></div><button id="publish">发布到洪盛集藏网站</button><div class="status" id="status">等待上传</div></section>
<section><h2>📋 全部资料</h2><div class="tools"><input id="search" placeholder="🔍 搜索标题、价格、说明"><select id="filterCat"><option value="all">全部分类</option><option value="yinyuan">银元</option><option value="jizhibi">机制币</option><option value="tongqian">铜钱</option><option value="tongyuan">铜元</option><option value="zhibi">纸币</option><option value="fujian">福建钱币</option></select><input id="filterDate" type="date"></div><button id="load">🔄 刷新资料</button><div class="status" id="manageStatus">点击“刷新资料”读取网站资料。</div><div class="items" id="items"></div></section>
<section id="editBox" class="hidden"><h2>✏️ 修改资料</h2><input type="hidden" id="editIndex"><input type="hidden" id="editCat"><label>分类</label><input id="editCatName" disabled><label>标题</label><input id="editTitle"><label>价格</label><input id="editPrice"><label>说明</label><textarea id="editNote"></textarea><label>日期</label><input id="editDate" type="date"><button id="saveEdit">保存修改</button><button class="secondary" id="cancelEdit">取消</button><div class="status" id="editStatus"></div></section>
<section><h2>🧭 管理说明</h2><p>新增资料 → 发布；全部资料 → 搜索、按日期筛选、修改、删除、上架/下架。</p><div class="notice">删除会同时删除资料记录和对应图片。下架只隐藏前台显示，资料不会删除。</div></section>
</main><script>
const $=id=>document.getElementById(id),today=new Date().toISOString().slice(0,10),names={yinyuan:'银元',jizhibi:'机制币',tongqian:'铜钱',tongyuan:'铜元',zhibi:'纸币',fujian:'福建钱币'},cats=Object.keys(names);$("date").value=today;let s=JSON.parse(localStorage.getItem('hsjc')||'{}');for(const k of ['owner','repo','branch','token'])if(s[k])$(k).value=s[k];
$("save").onclick=()=>{s={owner:$('owner').value,repo:$('repo').value,branch:$('branch').value,token:$('token').value};localStorage.setItem('hsjc',JSON.stringify(s));$('conn').textContent='已保存到本机浏览器。';};
$('files').onchange=()=>{$('preview').innerHTML='';[...$('files').files].forEach(f=>{let i=document.createElement('img');i.src=URL.createObjectURL(f);$('preview').appendChild(i)})};
function need(){if(!$('token').value.trim())throw Error('请先填写 GitHub Token');if(!$('owner').value||!$('repo').value)throw Error('请填写 GitHub 用户名和仓库');}
async function api(path,opt={}){need();let r=await fetch('https://api.github.com'+path,{...opt,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+$('token').value.trim(),'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}}),t=await r.text(),d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error(d.message||r.status);return d}
async function getFile(path){try{return await api(`/repos/${$('owner').value}/${$('repo').value}/contents/${path}?ref=${$('branch').value}`)}catch(e){if(String(e.message).includes('Not Found'))return null;throw e}}
async function put(path,content,msg,oldSha){let x={message:msg,content:btoa(unescape(encodeURIComponent(content))),branch:$('branch').value};if(oldSha)x.sha=oldSha;return api(`/repos/${$('owner').value}/${$('repo').value}/contents/${path}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)})}
async function delFile(path,sha,msg){return api(`/repos/${$('owner').value}/${$('repo').value}/contents/${path}`,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,sha,branch:$('branch').value})})}
function decodeContent(x){return decodeURIComponent(escape(atob(x.replace(/\n/g,''))))}
async function readData(cat){let p=`data/market/${cat}.json`,f=await getFile(p);if(!f)return{path:p,sha:null,arr:[]};return{path:p,sha:f.sha,arr:JSON.parse(decodeContent(f.content))}}
async function writeData(cat,arr,sha,msg){let d=JSON.stringify(arr,null,2);return put(`data/market/${cat}.json`,d,msg,sha)}
function imageUrl(p){return p||''}
async function publish(){try{need();if(!$('title').value.trim())throw Error('请填写标题');if(!$('files').files.length)throw Error('请选择图片');$('status').textContent='正在上传……';let cat=$('cat').value,date=$('date').value||today,imgs=[];for(let i=0;i<$('files').files.length;i++){let f=$('files').files[i],ext=(f.name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'');let path=`static/uploads/${cat}/${date}-${Date.now()}-${i}.${ext}`,raw=await new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(f)});await put(path,decodeURIComponent(escape(atob(raw))),`上传${names[cat]}图片`);imgs.push('/'+path)}let d=await readData(cat);d.arr.unshift({title:$('title').value.trim(),price:$('price').value.trim(),note:$('note').value.trim(),date,images:imgs,status:'published'});await writeData(cat,d.arr,d.sha,'新增行情资料');$('status').textContent='发布成功！\n图片已上传，价格数据已保存。';$('title').value='';$('price').value='';$('note').value='';$('files').value='';$('preview').innerHTML='';await loadAll()}catch(e){$('status').textContent='发布失败：\n'+e.message}}
$('publish').onclick=publish;
let all=[];
async function loadAll(){try{$('manageStatus').textContent='正在读取资料……';all=[];for(const cat of cats){let d=await readData(cat);d.arr.forEach((r,i)=>all.push({cat,index:i,data:r,sha:d.sha}))}render();$('manageStatus').textContent=`已读取 ${all.length} 条资料。`;}catch(e){$('manageStatus').textContent='读取失败：'+e.message}}
function render(){let q=$('search').value.trim().toLowerCase(),fc=$('filterCat').value,fd=$('filterDate').value,box=$('items');let list=all.filter(x=>(fc==='all'||x.cat===fc)&&(!fd||x.data.date===fd)&&(!q||[x.data.title,x.data.price,x.data.note].join(' ').toLowerCase().includes(q)));if(!list.length){box.innerHTML='<div class="notice">没有找到符合条件的资料。</div>';return}box.innerHTML=list.map((x,n)=>{let r=x.data,pub=r.status!=='hidden',imgs=Array.isArray(r.images)?r.images:[];return `<article class="item"><div class="item-head"><strong>${esc(names[x.cat])} · ${esc(r.title||'未命名')}</strong><span class="badge ${pub?'on':'off'}">${pub?'已上架':'已下架'}</span></div><div class="preview">${imgs.map(u=>`<img src="${esc(u)}" loading="lazy">`).join('')}</div><p><strong>价格：</strong>${esc(r.price||'暂无')}</p><p>${esc(r.note||'')}</p><small>${esc(r.date||'')}</small><div class="actions"><button onclick="editItem(${all.indexOf(x)})">✏️ 修改</button><button class="secondary" onclick="toggleItem(${all.indexOf(x)})">👁 ${pub?'下架':'上架'}</button><button class="danger" onclick="deleteItem(${all.indexOf(x)})">🗑 删除</button></div></article>`}).join('')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function saveCatData(cat,arr,oldSha){let d=await readData(cat);return writeData(cat,arr,d.sha,'更新行情资料')}
window.editItem=i=>{let x=all[i],r=x.data;$('editIndex').value=i;$('editCat').value=x.cat;$('editCatName').value=names[x.cat];$('editTitle').value=r.title||'';$('editPrice').value=r.price||'';$('editNote').value=r.note||'';$('editDate').value=r.date||today;$('editBox').classList.remove('hidden');window.scrollTo({top:$('editBox').offsetTop-10,behavior:'smooth'})};
$('cancelEdit').onclick=()=>{$('editBox').classList.add('hidden')};
$('saveEdit').onclick=async()=>{try{let i=Number($('editIndex').value),x=all[i],d=await readData(x.cat);d.arr[x.index]={...d.arr[x.index],title:$('editTitle').value.trim(),price:$('editPrice').value.trim(),note:$('editNote').value.trim(),date:$('editDate').value||today};await writeData(x.cat,d.arr,d.sha,'修改行情资料');$('editStatus').textContent='修改成功。';$('editBox').classList.add('hidden');await loadAll()}catch(e){$('editStatus').textContent='修改失败：'+e.message}};
window.toggleItem=async i=>{if(!confirm('确定切换这条资料的上架/下架状态吗？'))return;try{let x=all[i],d=await readData(x.cat),r=d.arr[x.index];r.status=r.status==='hidden'?'published':'hidden';await writeData(x.cat,d.arr,d.sha,r.status==='hidden'?'资料下架':'资料上架');await loadAll()}catch(e){alert('操作失败：'+e.message)}};
window.deleteItem=async i=>{if(!confirm('确定删除这条资料吗？删除后网站前台将不再显示，并尝试删除对应图片。'))return;try{let x=all[i],d=await readData(x.cat),r=d.arr[x.index];for(const u of (Array.isArray(r.images)?r.images:[])){let path=u.replace(/^\//,'');let f=await getFile(path);if(f)await delFile(path,f.sha,'删除行情图片')}d.arr.splice(x.index,1);await writeData(x.cat,d.arr,d.sha,'删除行情资料');await loadAll()}catch(e){alert('删除失败：'+e.message)}};
$('load').onclick=loadAll;['search','filterCat','filterDate'].forEach(id=>$(id).addEventListener('input',render));
</script></body></html>
