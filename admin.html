<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>洪盛集藏上传中心 V3.0</title><style>body{margin:0;background:#f6f1e8;color:#2b2119;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}header{background:#7b1e16;color:#fff;padding:22px 0;position:sticky;top:0;z-index:5}.wrap{max-width:1100px;margin:auto;padding:0 16px}main{padding:18px 0}section{background:#fff;margin:16px 0;padding:18px;border-radius:14px;box-shadow:0 4px 18px #0001}h1,h2,h3{margin:0 0 10px}.sub{opacity:.85}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap;width:auto;padding:9px 14px}label{display:block;font-weight:700;margin:10px 0 5px}input,select,textarea,button{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d5c9bd;border-radius:9px;font-size:15px}textarea{min-height:110px;resize:vertical}button{background:#8b2117;color:#fff;border:0;font-weight:700;cursor:pointer;margin-top:8px}.secondary{background:#6d625a}.danger{background:#a52a1e}.gold{background:#a87820}.status{margin-top:10px;padding:11px;background:#f2ece5;border-radius:9px;white-space:pre-wrap}.notice{padding:12px;background:#fff7e8;border-radius:9px;margin-top:10px}.items{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:15px}.item{border:1px solid #e1d8cf;border-radius:12px;padding:13px}.itemhead{display:flex;justify-content:space-between;gap:8px}.badge{padding:4px 8px;border-radius:99px;font-size:12px}.on{background:#e4f4e6;color:#246b2c}.off{background:#eee;color:#777}.pics{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.pics img{width:105px;height:105px;object-fit:cover;border-radius:8px}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.actions button{font-size:13px}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:15px;background:#f7f1e9;border-radius:10px}.stat b{font-size:24px;display:block}.preview{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.preview img{width:100px;height:100px;object-fit:cover;border-radius:8px}@media(max-width:700px){.grid,.tools,.items,.stats{grid-template-columns:1fr}.actions{grid-template-columns:1fr 1fr}}
</style></head><body><header><div class="wrap"><h1>洪盛集藏上传中心 V3.0</h1><div class="sub">全网站资料统一上传、搜索、修改、删除、上架 / 下架</div></div></header><main class="wrap">
<section><h2>📊 管理概览</h2><div class="stats"><div class="stat"><span>全部资料</span><b id="statAll">0</b></div><div class="stat"><span>已上架</span><b id="statOn">0</b></div><div class="stat"><span>已下架</span><b id="statOff">0</b></div><div class="stat"><span>有图片</span><b id="statImg">0</b></div></div></section>
<section><h2>⚙️ 一次设置</h2><div class="grid"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="首次使用填写"></div></div><button id="save">保存本机设置</button><div id="conn" class="status">尚未连接</div></section>
<section><h2>📤 新增资料</h2><div class="tabs" id="catTabs"></div><div class="grid"><div><label>网站版块</label><select id="cat"></select></div><div><label>日期</label><input id="date" type="date"></div></div><label>标题</label><input id="title" placeholder="例如：袁大头三年 / 福建铜元版别研究"><label>价格</label><input id="price" placeholder="例如：980-1200元；无价格可填写“暂无”"><label>内容 / 说明</label><textarea id="note" placeholder="品种、版别、品相、历史、研究资料、行情说明等"></textarea><label>图片（可多选）</label><input id="files" type="file" accept="image/*" multiple><div id="preview" class="preview"></div><button id="publish">📤 发布到洪盛集藏网站</button><div id="status" class="status">等待发布</div></section>
<section><h2>📋 全部资料</h2><div class="tools"><input id="search" placeholder="🔍 搜索标题、价格、内容"><select id="filterCat"><option value="all">全部版块</option></select><input id="filterDate" type="date"></div><div class="tabs" id="quickTabs"></div><button id="load">🔄 刷新资料</button><div id="manageStatus" class="status">点击刷新资料。</div><div id="items" class="items"></div></section>
<section id="editBox" class="hidden"><h2>✏️ 修改资料</h2><input type="hidden" id="editIndex"><label>版块</label><input id="editCatName" disabled><label>标题</label><input id="editTitle"><label>价格</label><input id="editPrice"><label>内容 / 说明</label><textarea id="editNote"></textarea><label>日期</label><input id="editDate" type="date"><button id="saveEdit">保存修改</button><button class="secondary" id="cancelEdit">取消</button><div id="editStatus" class="status"></div></section>
<section><h2>🧭 使用规则</h2><p>所有网站栏目统一从本上传中心维护。新增资料后选择对应版块即可归档。</p><p><b>修改：</b>修改标题、价格、说明、日期。</p><p><b>下架：</b>前台隐藏，资料仍保留。</p><p><b>删除：</b>删除资料记录，并尝试删除对应图片。</p><div class="notice">建议价格资料写清“品种 + 版别 + 品相 + 价格区间”，研究资料写清出处或说明。所有内容仅供学习、研究、交流及收藏参考。</div></section>
</main><script>
const $=id=>document.getElementById(id),today=new Date().toISOString().slice(0,10);const C={yinyuan:'银元',jizhibi:'机制币',tongqian:'铜钱',tongyuan:'铜元',zhibi:'纸币',fujian:'福建钱币',fujian_tongqian:'福建铜钱',fujian_tongyuan:'福建铜元',fujian_yinyuan:'福建银元',fujian_zhibi:'福建纸币',appreciation:'鉴赏参考',knowledge:'收藏知识',history:'钱币历史',culture:'收藏文化',experience:'收藏经验',consult:'免费鉴定 / 免费估价'};const cats=Object.keys(C);$('date').value=today;let cfg=JSON.parse(localStorage.getItem('hsjc')||'{}');for(const k of ['owner','repo','branch','token'])if(cfg[k])$(k).value=cfg[k];
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function initCats(){for(const [k,v] of Object.entries(C)){let o=document.createElement('option');o.value=k;o.textContent=v;$('cat').appendChild(o);let f=o.cloneNode(true);$('filterCat').appendChild(f);let b=document.createElement('button');b.textContent=v;b.onclick=()=>{$('cat').value=k;loadAll(k)};$('catTabs').appendChild(b)}for(const k of ['all',...cats]){let b=document.createElement('button');b.textContent=k==='all'?'全部':C[k];b.onclick=()=>{if(k!=='all')$('filterCat').value=k;else $('filterCat').value='all';render()};$('quickTabs').appendChild(b)}}initCats();
$('save').onclick=()=>{cfg={owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()};localStorage.setItem('hsjc',JSON.stringify(cfg));$('conn').textContent='设置已保存到本机浏览器。'};
function need(){if(!$('token').value.trim())throw Error('请先填写 GitHub Token');if(!$('owner').value||!$('repo').value)throw Error('请填写用户名和仓库')}async function api(path,opt={}){need();let r=await fetch('https://api.github.com'+path,{...opt,headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+$('token').value.trim(),'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}}),t=await r.text(),d={};try{d=JSON.parse(t)}catch{}if(!r.ok)throw Error(d.message||r.status);return d}async function getFile(path){try{return await api(`/repos/${$('owner').value}/${$('repo').value}/contents/${path}?ref=${$('branch').value}`)}catch(e){if(String(e.message).includes('Not Found'))return null;throw e}}async function put(path,content,msg,sha){let x={message:msg,content:btoa(unescape(encodeURIComponent(content))),branch:$('branch').value};if(sha)x.sha=sha;return api(`/repos/${$('owner').value}/${$('repo').value}/contents/${path}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(x)})}async function delFile(path,sha,msg){return api(`/repos/${$('owner').value}/${$('repo').value}/contents/${path}`,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,sha,branch:$('branch').value})})}function decode(x){return decodeURIComponent(escape(atob(x.replace(/\n/g,''))))}
async function readData(cat){let path=`data/market/${cat}.json`,f=await getFile(path);return f?{path,sha:f.sha,arr:JSON.parse(decode(f.content))}:{path,sha:null,arr:[]}}async function writeData(cat,arr,sha,msg){return put(`data/market/${cat}.json`,JSON.stringify(arr,null,2),msg,sha)}
$('files').onchange=()=>{$('preview').innerHTML='';[...$('files').files].forEach(f=>{let i=document.createElement('img');i.src=URL.createObjectURL(f);$('preview').appendChild(i)})};
async function uploadImage(file,path){let raw=await new Promise((ok,no)=>{let r=new FileReader;r.onload=()=>ok(r.result.split(',')[1]);r.onerror=no;r.readAsDataURL(file)});return put(path,decode(raw),'上传图片')}
async function publish(){try{need();let cat=$('cat').value,date=$('date').value||today,title=$('title').value.trim();if(!title)throw Error('请填写标题');let files=[...$('files').files],imgs=[];$('status').textContent='正在发布……';for(let i=0;i<files.length;i++){let ext=(files[i].name.split('.').pop()||'jpg').replace(/[^a-zA-Z0-9]/g,'');let path=`static/uploads/${cat}/${date}-${Date.now()}-${i}.${ext}`;await uploadImage(files[i],path);imgs.push('/'+path)}let d=await readData(cat);d.arr.unshift({title,price:$('price').value.trim(),note:$('note').value.trim(),date,images:imgs,status:'published'});await writeData(cat,d.arr,d.sha,'新增网站资料');$('status').textContent='发布成功！\n图片、价格、资料已保存。';$('title').value='';$('price').value='';$('note').value='';$('files').value='';$('preview').innerHTML='';await loadAll()}catch(e){$('status').textContent='发布失败：\n'+e.message}}
$('publish').onclick=publish;let all=[];
async function loadAll(forceCat=null){try{$('manageStatus').textContent='正在读取资料……';all=[];let use=forceCat?[forceCat]:cats;for(const cat of use){let d=await readData(cat);d.arr.forEach((r,i)=>all.push({cat,index:i,data:r,sha:d.sha}))}render();stats();$('manageStatus').textContent=`已读取 ${all.length} 条资料。`}catch(e){$('manageStatus').textContent='读取失败：'+e.message}}
function stats(){let on=all.filter(x=>x.data.status!=='hidden').length,off=all.length-on,img=all.filter(x=>Array.isArray(x.data.images)&&x.data.images.length).length;$('statAll').textContent=all.length;$('statOn').textContent=on;$('statOff').textContent=off;$('statImg').textContent=img}
function render(){let q=$('search').value.trim().toLowerCase(),fc=$('filterCat').value,fd=$('filterDate').value,list=all.filter(x=>(fc==='all'||x.cat===fc)&&(!fd||x.data.date===fd)&&(!q||[x.data.title,x.data.price,x.data.note].join(' ').toLowerCase().includes(q)));if(!list.length){$('items').innerHTML='<div class="notice">没有找到符合条件的资料。</div>';return}$('items').innerHTML=list.map(x=>{let r=x.data,pub=r.status!=='hidden',imgs=Array.isArray(r.images)?r.images:[];return `<article class="item"><div class="itemhead"><strong>${esc(C[x.cat])} · ${esc(r.title||'未命名')}</strong><span class="badge ${pub?'on':'off'}">${pub?'已上架':'已下架'}</span></div><div class="pics">${imgs.map(u=>`<img src="${esc(u)}" loading="lazy">`).join('')}</div><p><b>价格：</b>${esc(r.price||'暂无')}</p><p>${esc(r.note||'')}</p><small>${esc(r.date||'')}</small><div class="actions"><button onclick="editItem(${all.indexOf(x)})">✏️ 修改</button><button class="secondary" onclick="toggleItem(${all.indexOf(x)})">👁 ${pub?'下架':'上架'}</button><button class="danger" onclick="deleteItem(${all.indexOf(x)})">🗑 删除</button></div></article>`}).join('')}
window.editItem=i=>{let x=all[i],r=x.data;$('editIndex').value=i;$('editCatName').value=C[x.cat];$('editTitle').value=r.title||'';$('editPrice').value=r.price||'';$('editNote').value=r.note||'';$('editDate').value=r.date||today;$('editBox').classList.remove('hidden');scrollTo({top:$('editBox').offsetTop-10,behavior:'smooth'})};$('cancelEdit').onclick=()=>$('editBox').classList.add('hidden');
$('saveEdit').onclick=async()=>{try{let x=all[Number($('editIndex').value)],d=await readData(x.cat);d.arr[x.index]={...d.arr[x.index],title:$('editTitle').value.trim(),price:$('editPrice').value.trim(),note:$('editNote').value.trim(),date:$('editDate').value||today};await writeData(x.cat,d.arr,d.sha,'修改网站资料');$('editBox').classList.add('hidden');await loadAll()}catch(e){$('editStatus').textContent='修改失败：'+e.message}};
window.toggleItem=async i=>{if(!confirm('确定切换这条资料的上架 / 下架状态吗？'))return;try{let x=all[i],d=await readData(x.cat);d.arr[x.index].status=d.arr[x.index].status==='hidden'?'published':'hidden';await writeData(x.cat,d.arr,d.sha,'切换资料上下架状态');await loadAll()}catch(e){alert('操作失败：'+e.message)}};
window.deleteItem=async i=>{if(!confirm('确定删除？资料记录和对应图片都会删除。'))return;try{let x=all[i],d=await readData(x.cat),r=d.arr[x.index];for(const u of (Array.isArray(r.images)?r.images:[])){let p=u.replace(/^\//,'');let f=await getFile(p);if(f)await delFile(p,f.sha,'删除资料图片')}d.arr.splice(x.index,1);await writeData(x.cat,d.arr,d.sha,'删除网站资料');await loadAll()}catch(e){alert('删除失败：'+e.message)}};
$('load').onclick=()=>loadAll();['search','filterCat','filterDate'].forEach(id=>$(id).addEventListener('input',render));loadAll();
</script></body></html>
