<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1e16"><title>洪盛集藏上传中心</title><style>:root{--r:#7b1e16;--g:#b88a3b;--c:#f7f1e8;--l:#e3d8cc;--t:#2d241e}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:auto;padding:18px}header{background:linear-gradient(135deg,#7b1e16,#9a2b1f);color:#fff}.card{background:#fff;border-radius:16px;padding:18px;margin:16px 0;box-shadow:0 5px 20px #0001}h1,h2{margin:0 0 8px}.muted{color:#777}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.group{margin:16px 0 8px;font-weight:800}.cat{background:#faf7f2;color:#4a382b;border:1px solid var(--l);text-align:left;min-height:54px;border-radius:10px;padding:10px;cursor:pointer}.cat.active{background:var(--r);color:#fff}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.wide{grid-column:1/-1}label{display:block;font-weight:700;margin-bottom:6px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:11px;border:1px solid var(--l);border-radius:10px;background:#fff}textarea{min-height:180px;resize:vertical}button{border:0;border-radius:10px;padding:11px 14px;background:var(--r);color:#fff;font-weight:700;cursor:pointer}.gold{background:var(--g)}.gray{background:#6d625a}.danger{background:#a52a1e}.status{background:#f5eee5;border-radius:10px;padding:11px;margin-top:10px;white-space:pre-wrap}.preview,.pics{display:flex;flex-wrap:wrap;gap:8px;margin-top:9px}.preview img,.pics img{width:96px;height:96px;object-fit:cover;border-radius:9px;border:1px solid var(--l)}.tools{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}.items{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.item{border:1px solid var(--l);border-radius:12px;padding:12px}.item img{width:100%;height:180px;object-fit:cover;border-radius:9px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.hide{display:none}.editing{border:2px solid var(--g)}@media(max-width:800px){.grid,.items{grid-template-columns:1fr 1fr}.form,.tools{grid-template-columns:1fr}}@media(max-width:520px){.grid,.items{grid-template-columns:1fr}}</style></head><body><header><div class="wrap"><h1>洪盛集藏上传中心</h1><div>全站资料统一管理：选择网站版块 → 编辑 → 发布 → 修改 / 上下架 / 删除</div></div></header><main class="wrap"><section class="card"><h2>⚙️ 连接设置</h2><div class="form"><div><label>GitHub 用户名</label><input id="owner" value="yang79403-wq"></div><div><label>仓库</label><input id="repo" value="yang79403-wq.github.io"></div><div><label>分支</label><input id="branch" value="main"></div><div><label>GitHub Token</label><input id="token" type="password" placeholder="Contents: Read and write"></div></div><button id="save">保存设置</button><div id="conn" class="status">未连接</div></section><section class="card"><h2 id="editorTitle">📤 发布内容</h2><p class="muted">必须选择网站发布版块。行情版块显示价格字段，其他版块不显示价格字段。</p><div class="group">① 收藏交流 · 鉴赏参考</div><div class="grid" id="g1"></div><div class="group">② 最新价格行情</div><div class="grid" id="g2"></div><div class="group">③ 福建钱币</div><div class="grid" id="g3"></div><div class="group">④ 其他内容</div><div class="grid" id="g4"></div><div class="status">当前发布版块：<b id="selected">未选择</b></div><div class="form" style="margin-top:14px"><div class="wide"><label>网站发布版块</label><select id="cat"></select></div><div><label>发布日期</label><input id="date" type="date"></div><div><label>内容类型</label><select id="kind"><option value="article">文章 / 资料</option><option value="appreciation">鉴赏</option><option value="market">行情价格</option><option value="history">历史研究</option><option value="notice">公告 / 说明</option></select></div><div class="wide"><label>内容标题</label><input id="title" placeholder="例如：福建银元版别研究"></div><div id="priceWrap" class="hide"><label>参考价格（可选）</label><input id="price" placeholder="例如：980-1200元 / 面议"></div><div><label>内容摘要（可选）</label><input id="note" placeholder="列表页简短说明"></div><div class="wide"><label>正文内容</label><textarea id="content" placeholder="输入完整文字资料、研究内容、鉴赏说明或行情说明……"></textarea></div><div class="wide"><label>图片（可选，可多选）</label><input id="files" type="file" accept="image/*" multiple><div id="preview" class="preview"></div></div></div><div class="actions"><button id="publish" class="gold">📤 发布到网站</button><button id="cancelEdit" class="gray hide">取消修改</button></div><div id="status" class="status">等待发布</div></section><section class="card"><h2>📋 全部资料</h2><div class="tools"><input id="search" placeholder="🔍 搜索标题、正文、价格"><select id="filter"><option value="all">全部版块</option></select><input id="fdate" type="date"></div><button id="refresh" style="margin-top:10px">🔄 刷新资料</button><div id="manage" class="status">尚未读取</div><div id="items" class="items"></div></section></main><script>const $=id=>document.getElementById(id),today=new Date().toISOString().slice(0,10);const GROUPS={g1:[['yinyuan','🥈 银元'],['jizhibi','🪙 机制币'],['tongqian','🪙 铜钱'],['tongyuan','🪙 铜元'],['zhibi','💴 纸币'],['appreciation','🔎 鉴赏参考'],['knowledge','📚 收藏知识'],['history','📖 钱币历史'],['culture','🏛 收藏文化'],['experience','💡 收藏经验']],g2:[['market_yinyuan','🥈 银元行情'],['market_jizhibi','🪙 机制币行情'],['market_tongqian','🪙 铜钱行情'],['market_tongyuan','🪙 铜元行情'],['market_zhibi','💴 纸币行情']],g3:[['fujian','🏛 福建钱币'],['fujian_tongqian','福建铜钱'],['fujian_tongyuan','福建铜元'],['fujian_yinyuan','福建银元'],['fujian_zhibi','福建纸币']],g4:[['consult','☎️ 免费鉴定 / 免费估价'],['contact','💬 咨询交流']]};const C={};Object.values(GROUPS).flat().forEach(x=>C[x[0]]=x[1]);const marketCats=new Set(['market_yinyuan','market_jizhibi','market_tongqian','market_tongyuan','market_zhibi']);let cfg=JSON.parse(localStorage.getItem('hsjc')||'{}');for(const k of ['owner','repo','branch','token'])if(cfg[k])$(k).value=cfg[k];$('date').value=today;const cats=Object.keys(C);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function addGroup(id,arr){arr.forEach(([k,n])=>{const b=document.createElement('button');b.className='cat';b.dataset.cat=k;b.textContent=n;b.onclick=()=>selectCat(k);$(id).appendChild(b)})}Object.entries(GROUPS).forEach(([id,arr])=>addGroup(id,arr));cats.forEach(k=>{let o=document.createElement('option');o.value=k;o.textContent=C[k];$('cat').appendChild(o);let f=o.cloneNode(true);$('filter').appendChild(f)});function selectCat(k){$('cat').value=k;document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.cat===k));$('selected').textContent=C[k];$('priceWrap').classList.toggle('hide',!marketCats.has(k));$('kind').value=marketCats.has(k)?'market':$('kind').value}selectCat('yinyuan');$('cat').onchange=e=>selectCat(e.target.value);$('save').onclick=()=>{cfg={owner:$('owner').value.trim(),repo:$('repo').value.trim(),branch:$('branch').value.trim()||'main',token:$('token').value.trim()};localStorage.setItem('hsjc',JSON.stringify(cfg));$('conn').textContent='设置已保存。'};function need(){if(!$('owner').value||!$('repo').value)throw Error('请填写仓库信息');if(!$('token').value.trim())throw Error('请填写 GitHub Token')}async function api(path,opt={}){need();const r=await fetch('https://api.github.com'+path,{...opt,headers:{Accept:'application/vnd.github+json','Authorization':'Bearer '+$('token').value.trim(),'X-GitHub-Api-Version':'2022-11-28',...(opt.headers||{})}});const text=await r.text();let d={};try{d=JSON.parse(text)}catch{}if(!r.ok)throw Error((d.message||('HTTP '+r.status))+'（'+r.status+'）');return d}async function get(path){try{return await api(`/repos/${$('owner').value}/${$('repo').value}/contents/${path}?ref=${encodeURIComponent($('branch').value)}`)}catch(e){if(String(e.message).includes('Not Found'))return null;throw e}}function decodeBase64(s){const bin=atob(s.replace(/\n/g,''));const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return new TextDecoder().decode(bytes)}function encodeText(s){const bytes=new TextEncoder().encode(s);let bin='';for(let i=0;i<bytes.length;i+=0x8000)bin+=String.fromCharCode(...bytes.subarray(i,i+0x8000));return btoa(bin)}function fileBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file)})}async function putText(path,text,msg,sha){const body={message:msg,content:encodeText(text),branch:$('branch').value};if(sha)body.sha=sha;return api(`/repos/${$('owner').value}/${$('repo').value}/contents/${path}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}async function putBinary(path,b64,msg,sha){const body={message:msg,content:b64,branch:$('branch').value};if(sha)body.sha=sha;return api(`/repos/${$('owner').value}/${$('repo').value}/contents/${path}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}async function loadData(cat){const path=`data/market/${cat}.json`;const f=await get(path);return{path,sha:f?.sha||null,arr:f?JSON.parse(decodeBase64(f.content)):[]}}async function saveData(cat,arr,sha,msg){return putText(`data/market/${cat}.json`,JSON.stringify(arr,null,2),msg,sha)}let editState=null;function resetForm(){editState=null;$('editorTitle').textContent='📤 发布内容';$('publish').textContent='📤 发布到网站';$('cancelEdit').classList.add('hide');$('title').value='';$('price').value='';$('note').value='';$('content').value='';$('files').value='';$('preview').innerHTML='';$('date').value=today}async function publish(){try{need();const cat=$('cat').value,title=$('title').value.trim(),content=$('content').value.trim(),price=marketCats.has(cat)?$('price').value.trim():'';if(!cat)throw Error('请先选择网站发布版块');if(!title)throw Error('请填写标题');if(!content&&!price&&!$('files').files.length)throw Error('请至少填写正文、价格或图片');$('status').textContent=editState?'正在保存修改，请勿重复点击……':'正在发布，请勿重复点击……';let images=editState?.r?.images?[...editState.r.images]:[];const files=[...$('files').files],date=$('date').value||today;for(let i=0;i<files.length;i++){const ext=(files[i].name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';const path=`static/uploads/${cat}/${date}-${Date.now()}-${i}.${ext}`;await putBinary(path,await fileBase64(files[i]),'洪盛集藏：上传图片');images.push('/'+path)}const d=await loadData(cat);const record={id:editState?.r?.id||Date.now().toString(36),title,price,content,note:$('note').value.trim(),kind:$('kind').value,date,images,status:editState?.r?.status||'published'};if(editState&&editState.cat===cat)d.arr[editState.index]=record;else{if(editState){const old=await loadData(editState.cat);old.arr.splice(editState.index,1);await saveData(editState.cat,old.arr,old.sha,'洪盛集藏：修改资料并移动版块')}d.arr.unshift(record)}await saveData(cat,d.arr,d.sha,editState?'洪盛集藏：修改资料':'洪盛集藏：发布内容');$('status').textContent=(editState?'✅ 修改并发布成功：':'✅ 发布成功：')+C[cat];resetForm();await loadAll()}catch(e){$('status').textContent='❌ 操作失败：'+e.message}}$('publish').onclick=publish;$('cancelEdit').onclick=()=>resetForm();$('files').onchange=()=>{$('preview').innerHTML='';[...$('files').files].forEach(f=>{const i=document.createElement('img');i.src=URL.createObjectURL(f);$('preview').appendChild(i)})};let all=[];async function loadAll(){try{$('manage').textContent='正在读取……';all=[];for(const cat of cats){const d=await loadData(cat);d.arr.forEach((r,index)=>all.push({cat,index,r}))}render();$('manage').textContent='已读取 '+all.length+' 条资料。'}catch(e){$('manage').textContent='读取失败：'+e.message}}function render(){const q=$('search').value.trim().toLowerCase(),fc=$('filter').value,fd=$('fdate').value,list=all.filter(x=>(fc==='all'||x.cat===fc)&&(!fd||x.r.date===fd)&&(!q||[x.r.title,x.r.price,x.r.content,x.r.note].join(' ').toLowerCase().includes(q)));$('items').innerHTML=list.length?list.map(x=>{const r=x.r,on=r.status!=='hidden',im=r.images?.[0],i=all.indexOf(x);return `<article class="item"><b>${esc(C[x.cat])} · ${esc(r.title||'未命名')}</b>${im?`<img src="${esc(im)}" alt="">`:''}<p>${r.price?`<b>参考价格：</b>${esc(r.price)}`:''}</p><div class="muted">${esc(r.date||'')}</div><p>${esc(r.content||r.note||'')}</p><div class="actions"><button onclick="editItem(${i})">✏️ 修改</button><button onclick="toggle(${i})">👁 ${on?'下架':'上架'}</button><button class="gray" onclick="del(${i})">🗑 删除</button></div></article>`}).join(''):'<div class="status">暂无符合条件的资料。</div>'}window.editItem=async i=>{try{const x=all[i];editState={cat:x.cat,index:x.index,r:x.r};selectCat(x.cat);$('date').value=x.r.date||today;$('kind').value=x.r.kind||'article';$('title').value=x.r.title||'';$('price').value=x.r.price||'';$('note').value=x.r.note||'';$('content').value=x.r.content||'';$('files').value='';$('preview').innerHTML=(x.r.images||[]).map(u=>`<img src="${esc(u)}" alt="">`).join('');$('editorTitle').textContent='✏️ 修改资料';$('publish').textContent='💾 保存修改并发布到网站';$('cancelEdit').classList.remove('hide');window.scrollTo({top:0,behavior:'smooth'});$('status').textContent='正在修改：'+C[x.cat]+' · '+x.r.title}catch(e){alert('载入修改失败：'+e.message)}};window.toggle=async i=>{try{const x=all[i],d=await loadData(x.cat);d.arr[x.index].status=d.arr[x.index].status==='hidden'?'published':'hidden';await saveData(x.cat,d.arr,d.sha,'洪盛集藏：切换上下架');await loadAll()}catch(e){alert('操作失败：'+e.message)}};window.del=async i=>{if(!confirm('确定删除这条资料记录吗？'))return;try{const x=all[i],d=await loadData(x.cat);d.arr.splice(x.index,1);await saveData(x.cat,d.arr,d.sha,'洪盛集藏：删除资料记录');await loadAll()}catch(e){alert('删除失败：'+e.message)}};$('refresh').onclick=loadAll;$('search').oninput=render;$('filter').onchange=render;$('fdate').onchange=render;</script></body></html>
