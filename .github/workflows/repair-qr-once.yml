name: Repair original QR image

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-qr-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Convert original QR to a real JPEG asset
        run: |
          python3 - <<'PY'
          from PIL import Image
          src='static/qr-service.png'
          out='static/qr-service-original.jpg'
          im=Image.open(src)
          print('Detected format:', im.format, 'size:', im.size)
          if im.mode not in ('RGB','L'):
              im=im.convert('RGB')
          im.save(out, format='JPEG', quality=100, subsampling=0)
          PY
      - name: Point the website to the repaired original QR
        run: |
          python3 - <<'PY'
          import json
          p='data/site-config.json'
          outer=json.load(open(p,encoding='utf-8'))
          c=json.loads(outer['content']) if isinstance(outer.get('content'),str) else outer
          c.setdefault('consult',{})['qr']='/static/qr-service-original.jpg'
          outer['content']=json.dumps(c,ensure_ascii=False,indent=2)
          with open(p,'w',encoding='utf-8') as f:
              json.dump(outer,f,ensure_ascii=False,indent=2)
              f.write('\n')
          PY
      - name: Commit repaired QR and remove one-time workflow
        run: |
          rm -f .github/workflows/repair-qr-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static/qr-service-original.jpg data/site-config.json .github/workflows/repair-qr-once.yml
          git commit -m '恢复原始客服二维码显示资源' || exit 0
          git push
