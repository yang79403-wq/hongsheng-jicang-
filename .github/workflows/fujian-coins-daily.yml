name: 洪盛集藏每日自动资料采集发布

on:
  schedule:
    - cron: '10 0 * * *'
    - cron: '10 8 * * *'
    - cron: '10 13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hongsheng-auto-update
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Collect and organize public Fujian coin sources
        run: python app/baofuju_collector.py

      - name: Commit updated data
        run: |
          git config user.name 'Hongsheng Jicang Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No new data to publish.'
          else
            git commit -m '自动更新福建钱币公开资料与索引'
            git push
          fi
