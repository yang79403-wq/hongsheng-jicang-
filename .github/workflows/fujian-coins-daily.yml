name: 福建钱币资料每日整理

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests beautifulsoup4
      - name: Build public-source indexes
        run: python app/baofuju_collector.py
      - name: Commit updates
        run: |
          git config user.name 'Hongsheng Jicang Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          git diff --cached --quiet || git commit -m '自动更新福建钱币公开资料索引'
          git push
