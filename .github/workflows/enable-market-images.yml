name: 接入洪盛集藏上传数据展示

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-market-display:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 接入上传中心数据展示
        shell: python
        run: |
          from pathlib import Path

          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- HONGSHENG-MARKET-V2 -->'

          if marker not in text:
              anchor = '<div class="notice">没有真实、可核验的成交或求购数据时显示“暂无”。行情仅供收藏爱好者学习、交流、研究参考。</div>'
              block = '''<!-- HONGSHENG-MARKET-V2 -->
          <div id="uploadMarket" class="panel" style="margin-top:18px">
          <div class="panelHead"><strong>🖼 最新人工上传行情</strong><span>银元 · 纸币</span></div>
          <div id="uploadMarketList" class="cards" style="padding:16px;grid-template-columns:repeat(2,1fr)"><div class="empty">正在读取上传资料……</div></div>
          </div>'''
              if anchor not in text:
                  raise SystemExit('未找到行情参考区域，停止修改，避免破坏首页。')
              text = text.replace(anchor, block + '\n' + anchor, 1)

              script = r'''<script id="hongsheng-market-v2">
          (() => {
            const cats = [
              ['yinyuan','🥈 银元'],
              ['zhibi','📄 纸币']
            ];
            const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
            async function getCat(cat){
              try {
                const r = await fetch(`data/market/${cat}.json?ts=${Date.now()}`, {cache:'no-store'});
                if(!r.ok) return [];
                const d = await r.json();
                return Array.isArray(d) ? d : (Array.isArray(d.records) ? d.records : []);
              } catch(e){ return []; }
            }
            async function renderUploaded(){
              const box = document.getElementById('uploadMarketList');
              if(!box) return;
              const groups = await Promise.all(cats.map(async ([cat,label]) => [label, await getCat(cat)]));
              const records = [];
              groups.forEach(([label,arr]) => arr.slice(0,12).forEach(x => records.push({...x,_label:label})));
              records.sort((a,b) => String(b.date||'').localeCompare(String(a.date||'')));
              if(!records.length){
                box.innerHTML = '<div class="empty" style="grid-column:1/-1">暂无人工上传行情。上传中心发布后会自动显示在这里。</div>';
                return;
              }
              box.innerHTML = records.slice(0,12).map(x => {
                const img = Array.isArray(x.images) && x.images.length ? x.images[0] : '';
                return `<article class="card" style="padding:14px;overflow:hidden">
                  ${img ? `<img src="${esc(img)}" alt="${esc(x.title||'钱币图片')}" loading="lazy" style="width:100%;height:190px;object-fit:cover;border-radius:11px;background:#eee">` : ''}
                  <div style="padding-top:10px">
                    <div style="font-size:12px;color:var(--muted)">${esc(x._label)}　${esc(x.date||'')}</div>
                    <h3 style="margin:4px 0">${esc(x.title||'未命名资料')}</h3>
                    <p><strong>参考价格：${esc(x.price||'暂无')}</strong></p>
                    ${x.note ? `<p>${esc(x.note)}</p>` : ''}
                  </div>
                </article>`;
              }).join('');
            }
            renderUploaded();
          })();
          </script>'''
              text = text.replace('</body>', script + '\n</body>', 1)
              p.write_text(text, encoding='utf-8')
          else:
              print('上传行情展示已经接入，跳过。')

      - name: Commit and push
        run: |
          git config user.name "洪盛集藏自动发布"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "没有需要提交的修改"
          else
            git commit -m "自动显示上传中心的银元和纸币图片价格"
            git push
          fi
