name: Deploy Hongsheng Jicang to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare root site
        run: |
          rm -rf _site
          mkdir -p _site
          # 复制静态资源
          if [ -d "static" ]; then cp -r static/. _site/; fi
          if [ -d "data" ]; then cp -r data _site/data; fi
          # 复制网站根目录页面，确保首页、版块、详情页全部进入 Pages artifact
          for f in fujian-coin.html section.html detail.html admin.html; do
            if [ -f "$f" ]; then cp "$f" "_site/$f"; fi
          done
          # 管理后台
          if [ -d "admin" ]; then cp -r admin _site/admin; fi
          # 正式网站入口最后复制，避免其他静态入口覆盖新版首页
          if [ -f "index.html" ]; then cp index.html _site/index.html; fi
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
