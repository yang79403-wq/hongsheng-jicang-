<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5a0b07"><title>洪盛收藏资讯网｜资料详情</title><style>:root{--red:#5a0b07;--red2:#75160f;--gold:#c9a45c;--gold2:#f0d58a;--paper:#fffaf0;--ink:#3b2a24;--muted:#806e60;--line:#e3cfa7}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#4d0806,#650f09 26%,#4b0806);color:#fff4dc;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.top{padding:10px;text-align:center;color:var(--gold2);font-size:12px;border-bottom:1px solid #d6b35c55;background:#3c0504}.head{padding:30px 0;border-bottom:1px solid #d6b35c66}.wrap{width:min(900px,92vw);margin:auto}.head h1{margin:0;text-align:center;color:#f5d88b;font:900 34px "Songti SC",STSong,serif;letter-spacing:4px}.box{background:linear-gradient(145deg,#73170f,#450705);border:1px solid #d7b45a66;margin:24px 0;padding:24px}.meta{color:#f0d58a;font-size:12px}.title{color:#ffe4a0;font:900 30px/1.45 "Songti SC",STSong,serif}.price{color:#f5d88b;font-size:20px;font-weight:900}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.gallery img{width:100%;max-height:520px;object-fit:contain;background:#fffaf0;border-radius:4px;padding:4px}.content{white-space:pre-wrap;font-size:16px;color:#ead7ba}.btn{display:inline-block;background:#75160f;border:1px solid #d7b45a;color:#ffe7a5;text-decoration:none;padding:9px 16px;border-radius:4px;font-weight:800}@media(max-width:600px){.gallery{grid-template-columns:1fr}.title{font-size:25px}}</style></head><body><div class="top">🏮 洪盛收藏资讯网 · 收藏交流 · 鉴赏参考 · 市场行情 · 钱币文化研究</div><header class="head"><div class="wrap"><h1>洪盛收藏资讯网</h1></div></header><main class="wrap"><div class="box" id="detail">正在读取资料……</div></main><script>const P={yinyuan_jizhibi:'data/content/yinyuan_jizhibi.json',tongqian:'data/content/tongqian.json',tongyuan:'data/content/tongyuan.json',zhibi:'data/content/zhibi.json',appreciation:'data/content/appreciation.json',knowledge:'data/content/knowledge.json',history:'data/content/history.json',culture:'data/content/culture.json',experience:'data/content/experience.json',market_yinyuan_jizhibi:'data/market/yinyuan_jizhibi.json',market_tongqian:'data/market/tongqian.json',market_tongyuan:'data/market/tongyuan.json',market_zhibi:'data/market/zhibi.json',fujian_tongqian:'data/market/fujian_tongqian.json',fujian_tongyuan:'data/market/fujian_tongyuan.json',fujian_yinyuan:'data/market/fujian_yinyuan.json',fujian_zhibi:'data/market/fujian_zhibi.json'};const L={yinyuan_jizhibi:'🥈 银元 · 机制币',tongqian:'🪙 铜钱鉴赏',tongyuan:'🪙 铜元鉴赏',zhibi:'💴 纸币鉴赏',appreciation:'🔎 鉴赏参考',knowledge:'📚 收藏知识',history:'📖 钱币历史',culture:'🏛 收藏文化',experience:'💡 收藏经验',market_yinyuan_jizhibi:'🥈 银元 · 机制币行情',market_tongqian:'🪙 铜钱行情',market_tongyuan:'🪙 铜元行情',market_zhibi:'💴 纸币行情',fujian_tongqian:'福建铜钱',fujian_tongyuan:'福建铜币',fujian_yinyuan:'福建银元',fujian_zhibi:'福建纸币'};const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function go(){const q=new URLSearchParams(location.search),cat=q.get('cat'),id=q.get('id'),box=document.getElementById('detail');if(!P[cat]||!id){box.innerHTML='<h2>资料不存在</h2><a class="btn" href="./">返回网站</a>';return}try{const a=await (await fetch(P[cat]+'?t='+Date.now(),{cache:'no-store'})).json(),x=a.find(v=>String(v.id)===String(id));if(!x||x.status==='hidden')throw Error();const imgs=Array.isArray(x.images)?x.images:[];document.title=(x.title||'资料详情')+'｜洪盛收藏资讯网';box.innerHTML='<div class="meta">'+E(L[cat]||cat)+'　｜　'+E(x.date||'')+'</div><h2 class="title">'+E(x.title||'未命名资料')+'</h2>'+(x.price?'<div class="price">参考价格：'+E(x.price)+'</div>':'')+(x.note?'<p><b>摘要：</b>'+E(x.note)+'</p>':'')+(imgs.length?'<div class="gallery">'+imgs.map(i=>'<img src="'+E(i)+'" loading="lazy">').join('')+'</div>':'')+'<div class="content">'+E(x.content||'暂无详细文字资料。')+'</div><p><a class="btn" href="./">← 返回洪盛收藏资讯网</a></p>'}catch(e){box.innerHTML='<h2>资料暂时无法打开</h2><p>可能已经下架或资料正在更新。</p><a class="btn" href="./">返回网站</a>'}}go();</script></body></html>
