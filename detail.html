<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7b1710"><title>洪盛集藏｜资料详情</title><style>:root{--r:#7b1710;--g:#c99b42;--bg:#fbf5e9;--paper:#fffdf8;--line:#e7d7b7;--muted:#756b62}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#29231f;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;line-height:1.8}.wrap{width:min(900px,92%);margin:auto}.top{background:#19120f;color:#f4d47b;text-align:center;padding:8px;font-size:13px}.head{background:linear-gradient(135deg,#7b1710,#24100d);color:#fff;padding:28px 0}.head h1{margin:0;color:#f8dc88}.box{background:var(--paper);border:1px solid var(--line);border-radius:16px;margin:24px 0;padding:22px;box-shadow:0 10px 30px #42201214}.meta{color:var(--muted);font-size:13px}.title{color:var(--r);font-size:30px;line-height:1.4}.price{color:var(--r);font-size:20px;font-weight:900}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}.gallery img{width:100%;max-height:520px;object-fit:contain;background:#f3eee5;border-radius:12px}.content{white-space:pre-wrap;font-size:16px}.btn{display:inline-block;background:var(--r);color:#fff;text-decoration:none;padding:9px 16px;border-radius:10px;font-weight:800}@media(max-width:600px){.gallery{grid-template-columns:1fr}.title{font-size:25px}}</style></head><body><div class="top">洪盛集藏 · 收藏交流 · 鉴赏参考 · 市场行情 · 钱币文化研究</div><header class="head"><div class="wrap"><h1>洪盛集藏资讯网</h1></div></header><main class="wrap"><div class="box" id="detail">正在读取资料……</div></main><script>const P={yinyuan_jizhibi:'data/content/yinyuan_jizhibi.json',tongqian:'data/content/tongqian.json',tongyuan:'data/content/tongyuan.json',zhibi:'data/content/zhibi.json',appreciation:'data/content/appreciation.json',knowledge:'data/content/knowledge.json',history:'data/content/history.json',culture:'data/content/culture.json',experience:'data/content/experience.json',market_yinyuan_jizhibi:'data/market/yinyuan_jizhibi.json',market_tongqian:'data/market/tongqian.json',market_tongyuan:'data/market/tongyuan.json',market_zhibi:'data/market/zhibi.json',fujian_tongqian:'data/market/fujian_tongqian.json',fujian_tongyuan:'data/market/fujian_tongyuan.json',fujian_yinyuan:'data/market/fujian_yinyuan.json',fujian_zhibi:'data/market/fujian_zhibi.json'};const L={yinyuan_jizhibi:'🥈 银元 · 机制币',tongqian:'🪙 铜钱鉴赏',tongyuan:'🪙 铜元鉴赏',zhibi:'💴 纸币鉴赏',appreciation:'🔎 鉴赏参考',knowledge:'📚 收藏知识',history:'📖 钱币历史',culture:'🏛 收藏文化',experience:'💡 收藏经验',market_yinyuan_jizhibi:'🥈 银元 · 机制币行情',market_tongqian:'🪙 铜钱行情',market_tongyuan:'🪙 铜元行情',market_zhibi:'💴 纸币行情',fujian_tongqian:'福建铜钱',fujian_tongyuan:'福建铜币',fujian_yinyuan:'福建银元',fujian_zhibi:'福建纸币'};const E=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));async function go(){const q=new URLSearchParams(location.search),cat=q.get('cat'),id=q.get('id'),box=document.getElementById('detail');if(!P[cat]||!id){box.innerHTML='<h2>资料不存在</h2><a class="btn" href="./">返回网站</a>';return}try{const a=await (await fetch(P[cat]+'?t='+Date.now(),{cache:'no-store'})).json(),x=a.find(v=>String(v.id)===String(id));if(!x||x.status==='hidden')throw Error();const imgs=Array.isArray(x.images)?x.images:[];document.title=(x.title||'资料详情')+'｜洪盛集藏';box.innerHTML='<div class="meta">'+E(L[cat]||cat)+'　｜　'+E(x.date||'')+'</div><h2 class="title">'+E(x.title||'未命名资料')+'</h2>'+(x.price?'<div class="price">参考价格：'+E(x.price)+'</div>':'')+(x.note?'<p><b>摘要：</b>'+E(x.note)+'</p>':'')+(imgs.length?'<div class="gallery">'+imgs.map(i=>'<img src="'+E(i)+'" loading="lazy">').join('')+'</div>':'')+'<div class="content">'+E(x.content||'暂无详细文字资料。')+'</div><p><a class="btn" href="./">← 返回洪盛集藏</a></p>'}catch(e){box.innerHTML='<h2>资料暂时无法打开</h2><p>可能已经下架或资料正在更新。</p><a class="btn" href="./">返回洪盛集藏</a>'}}go();</script></body></html>
